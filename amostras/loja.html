header{ background:#fff; padding:18px 16px 14px; border-bottom:1px solid var(--linha); }
.hin{ max-width:1100px; margin:0 auto; }
.topo-linha{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
.marca{ display:flex; align-items:center; gap:10px; }
.marcas{ display:flex; gap:10px; }
.marcas button{ width:46px; height:46px; border-radius:50%; border:2px solid var(--linha); background:#fff; padding:0; cursor:pointer; display:grid; place-items:center; transition:border-color .15s, box-shadow .15s; }
/* os símbolos do banco são brancos (feitos para fundo escuro): viram máscara e ganham a cor da marca */
.marcas .lg{ display:block; width:64%; height:40%; background:#9aa0a6; -webkit-mask:var(--img) center/contain no-repeat; mask:var(--img) center/contain no-repeat; transition:background .15s; }
.marcas [data-m="oly"] .lg{ --img:url(../logo-oly-simbolo.png); width:80%; }
.marcas [data-m="ua"] .lg{ --img:url(../logo-ua-simbolo.png); height:50%; }
.marcas button.on{ border-color:var(--preto); box-shadow:0 0 0 3px var(--ambar); }
.marcas [data-m="oly"].on .lg{ background:#2c39e2; }
.marcas [data-m="ua"].on .lg{ background:#111; }
.marcas button:not(.on):hover .lg{ background:#6b7280; }
@media (min-width:700px){ .marcas button{ width:52px; height:52px; } }
.marca .selo{ width:40px; height:40px; border-radius:11px; display:grid; place-items:center; background:linear-gradient(140deg,#ffd35a 0%,#ffbe0b 45%,#d99a00 85%); color:#1a1407; font:700 14px "Space Grotesk","Plus Jakarta Sans",sans-serif; box-shadow:0 4px 12px rgba(217,154,0,.3),inset 0 1px 0 rgba(255,255,255,.5); }
.marca .store{ font:600 13px "Space Grotesk","Plus Jakarta Sans",sans-serif; letter-spacing:.42em; color:var(--ambar-tinta); }
header h1{ margin:8px 0 0; font-size:21px; line-height:1.3; font-weight:800; letter-spacing:-.01em; }
@media (min-width:700px){ header h1{ font-size:26px; } }

.filtros{ position:sticky; top:0; z-index:20; background:rgba(242,239,231,.92); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); padding:10px 12px; }
.fin{ max-width:1100px; margin:0 auto; display:flex; flex-direction:column; gap:8px; }
.chips{ display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
.chips::-webkit-scrollbar{ display:none; }
.chips button{ flex:none; display:inline-flex; align-items:center; gap:6px; height:36px; padding:0 14px; border-radius:999px; border:1px solid var(--linha); background:#fff; color:var(--tinta-2); font:700 13px "Plus Jakarta Sans",sans-serif; cursor:pointer; }
.chips button.on{ background:var(--preto); border-color:var(--preto); color:var(--ambar); }
.chips button small{ font-weight:600; opacity:.7; }
.chips button svg{ flex:none; }
.chips .curto{ display:none; }
@media (max-width:900px){ .chips .longo{ display:none; } .chips .curto{ display:inline; } .chips button{ padding:0 12px; gap:5px; } }
.busca{ position:relative; }
.busca svg{ position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--tinta-2); pointer-events:none; }
.busca input{ width:100%; height:40px; border-radius:12px; border:1px solid var(--linha); background:#fff; padding:0 12px 0 38px; font:500 16px "Plus Jakarta Sans",sans-serif; color:var(--tinta); outline:none; }
.busca input:focus{ border-color:var(--tinta); }

main{ max-width:1100px; margin:0 auto; padding:4px 12px 120px; }
.aviso-sel{ background:#fff; border-radius:14px; padding:12px 14px; margin:6px 0 12px; font-size:14px; line-height:1.45; display:flex; gap:10px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
.aviso-sel a{ color:var(--verde); font-weight:800; text-decoration:none; white-space:nowrap; }
.grade{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
@media (min-width:700px){ .grade{ grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; } }
@media (min-width:1000px){ .grade{ grid-template-columns:repeat(4,minmax(0,1fr)); } }
.card{ background:#fff; border-radius:16px; overflow:hidden; display:flex; flex-direction:column; border:2px solid transparent; transition:border-color .15s; }
.card.on{ border-color:var(--verde); }
.foto{ position:relative; aspect-ratio:1; background:#fff; display:flex; align-items:center; justify-content:center; cursor:zoom-in; border:0; padding:0; width:100%; }
.foto img{ width:100%; height:100%; object-fit:contain; }
.foto .sem{ color:#cbd5e1; }
.ult{ position:absolute; left:8px; top:8px; font-size:10.5px; font-weight:800; letter-spacing:.03em; text-transform:uppercase; border-radius:999px; padding:3px 8px; background:#fef3c7; color:#92400e; }
.info{ padding:8px 10px 10px; display:flex; flex-direction:column; gap:3px; flex:1; }
.info b{ font-size:13.5px; line-height:1.25; }
.info small{ font-size:11.5px; color:var(--tinta-2); line-height:1.3; }
.tam{ align-self:flex-start; font-size:11.5px; font-weight:800; border-radius:7px; padding:2px 8px; background:#e0f2fe; color:#075985; margin-top:2px; }
.tam.fem{ background:#fce7f3; color:#9d174d; }
.tam.uni{ background:#f1f5f9; color:#334155; }
.preco{ font-size:16px; font-weight:800; margin-top:4px; }
.quero{ margin:0 10px 10px; border:1.5px solid var(--tinta); color:var(--tinta); background:#fff; border-radius:12px; padding:10px; font:inherit; font-weight:800; font-size:14px; cursor:pointer; }
.card.on .quero{ background:var(--verde); border-color:var(--verde); color:#fff; }

.barra{ position:fixed; left:0; right:0; bottom:0; z-index:30; background:#fff; border-top:1px solid var(--linha); padding:10px 14px calc(10px + env(safe-area-inset-bottom)); box-shadow:0 -6px 20px rgba(0,0,0,.08); transform:translateY(110%); transition:transform .2s ease; }
.barra.show{ transform:none; }
.bin{ max-width:1100px; margin:0 auto; display:flex; align-items:center; gap:12px; justify-content:space-between; }
.barra .conta{ font-size:14px; color:var(--tinta-2); line-height:1.3; }
.barra .conta b{ color:var(--tinta); }
.wa{ display:inline-flex; align-items:center; gap:8px; border:0; background:var(--wa); color:#fff; font:inherit; font-weight:800; font-size:15px; border-radius:14px; padding:12px 16px; cursor:pointer; box-shadow:0 6px 18px rgba(37,211,102,.35); white-space:nowrap; text-decoration:none; }
.wa:active{ background:var(--wa-d); }

.ver{ position:fixed; inset:0; background:rgba(15,23,42,.94); z-index:50; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:16px; }
.ver[hidden]{ display:none; }
.ver img{ max-width:100%; max-height:70vh; background:#fff; border-radius:14px; object-fit:contain; }
.ver .fechar{ position:absolute; top:10px; right:12px; width:44px; height:44px; color:#fff; font-size:30px; background:none; border:0; cursor:pointer; }
.ver .nome{ color:#fff; margin-top:12px; font-size:15px; font-weight:700; text-align:center; }
.ver .det{ color:#cbd5e1; margin-top:3px; font-size:13px; text-align:center; }

.vazio{ background:#fff; border-radius:16px; padding:28px 18px; text-align:center; color:var(--tinta-2); font-size:14.5px; line-height:1.5; margin-top:8px; }
.vazio b{ display:block; color:var(--tinta); font-size:16px; margin-bottom:4px; }
.carregando{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
.carregando div{ aspect-ratio:.72; border-radius:16px; background:linear-gradient(90deg,#e8ecf1 25%,#f4f6f9 50%,#e8ecf1 75%); background-size:200% 100%; animation:brilho 1.2s infinite; }
@keyframes brilho{ to{ background-position:-200% 0; } }
</style>
</head>
<body>
<header><div class="hin">
  <div class="topo-linha">
    <div class="marca"><span class="selo">CMS</span><span class="store">STORE</span></div>
    <div class="marcas" id="marcas" role="tablist" aria-label="Marca">
      <button type="button" data-m="oly" role="tab" class="on" aria-label="Olympikus" title="Olympikus"><span class="lg"></span></button>
      <button type="button" data-m="ua" role="tab" aria-label="Under Armour" title="Under Armour"><span class="lg"></span></button>
    </div>
  </div>
  <h1>Olá, veja o que temos disponível em nosso catálogo.</h1>
</div></header>

<div class="filtros" id="filtros" hidden><div class="fin">
  <div class="chips" id="chips"></div>
  <div class="busca">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="search" autocomplete="off" placeholder="Buscar modelo ou cor" aria-label="Buscar modelo ou cor">
  </div>
</div></div>

<main id="main"><div class="carregando"><div></div><div></div><div></div><div></div></div></main>

<div class="barra" id="barra"><div class="bin">
  <span class="conta" id="conta"></span>
  <a class="wa" id="wa" href="#" target="_blank" rel="noopener">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.04 2a9.9 9.9 0 0 0-8.5 15l-1.4 5 5.1-1.3A9.9 9.9 0 1 0 12.04 2zm0 18.1a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3a8.2 8.2 0 1 1 6.9 3.8zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.4.1-.6.3-.2.2-.8.8-.8 2s.8 2.3.9 2.5c.1.2 1.6 2.5 4 3.5 1.5.6 2.1.7 2.8.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.1-1.2l-.5-.3z"/></svg>
    Chamar no WhatsApp
  </a>
</div></div>

<div class="ver" id="ver" hidden><button type="button" class="fechar" aria-label="Fechar">×</button><img alt=""><div class="nome"></div><div class="det"></div></div>

<script>
(() => {
  const WORKER_URL = 'https://repasse-worker-cms.marcosrep-cms.workers.dev';
  const RAW = 'https://raw.githubusercontent.com/cms-representacoes/apps-oly/main/Catalogo/';
  const P = new URLSearchParams(location.search);
  // WhatsApp de quem atende (só números, com DDI) e o nome, vindos no link do admin
  const ZAP = (P.get('w') || '').replace(/\D/g, '');
  const ATENDE = (P.get('n') || '').trim();
  const SEL = (P.get('sel') || '').split(',').map(s => s.trim()).filter(Boolean);   // link de produtos escolhidos
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase();
  const brl = v => (v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  const curto = id => String(id || '').slice(0, 8);

  // tamanho do card: masculino 40, feminino 35, acessório U, confecção M
  const TAM = { '40': ['Masculino 40', ''], '35': ['Feminino 35', 'fem'], 'U': ['Tamanho U', 'uni'], 'M': ['Tamanho M', 'uni'] };
  const tamRot = t => (TAM[t] || [t ? 'Tamanho ' + t : '', 'uni']);
  // filtros: tênis pelo tamanho (40 masculino, 35 feminino); acessório (U);
  // confecção (M) pelo gênero cadastrado, e a unissex entra nas duas
  function grupos(x) {
    if (x.tamanho === '40') return ['tmasc'];
    if (x.tamanho === '35') return ['tfem'];
    if (x.tamanho === 'U') return ['acc'];
    if (x.tamanho === 'M') {
      const g = String(x.genero || '').toLowerCase();
      return g.startsWith('fem') ? ['cfem'] : g.startsWith('masc') ? ['cmasc'] : ['cmasc', 'cfem'];
    }
    return ['outros'];
  }
  // silhuetas e ícones dos filtros
  const ICO = {
    masc: '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><circle cx="12" cy="4.2" r="2.6"/><path d="M8.6 8h6.8c1.2 0 2.1 1 2.1 2.2V15c0 .7-.5 1.2-1.2 1.2h-.8V21c0 .8-.6 1.4-1.4 1.4h-4.2c-.8 0-1.4-.6-1.4-1.4v-4.8h-.8c-.7 0-1.2-.5-1.2-1.2v-4.8C6.5 9 7.4 8 8.6 8z"/></svg>',
    fem: '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><circle cx="12" cy="4.2" r="2.6"/><path d="M9.3 8h5.4c.9 0 1.6.6 1.9 1.4l2.3 7.2c.2.6-.2 1.2-.9 1.2h-2.4V21c0 .8-.6 1.4-1.4 1.4h-.4c-.8 0-1.4-.6-1.4-1.4v-3.2h-.4V21c0 .8-.6 1.4-1.4 1.4h-.4c-.8 0-1.4-.6-1.4-1.4v-3.2H6c-.7 0-1.1-.6-.9-1.2l2.3-7.2C7.7 8.6 8.4 8 9.3 8z"/></svg>',
    acc: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1 12.5c0 .8-.7 1.5-1.5 1.5h-9c-.8 0-1.5-.7-1.5-1.5z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg>'
  };
  const GRUPOS = [
    // [chave, nome no computador, ícone, nome curto no celular e tablet]
    ['', 'Todos', '', 'Todos'],
    ['tmasc', 'Tênis masculino', ICO.masc, 'Tênis M'],
    ['tfem', 'Tênis feminino', ICO.fem, 'Tênis F'],
    ['acc', 'Acessórios', ICO.acc, 'Acessórios'],
    ['cmasc', 'Confecção masculina', ICO.masc, 'Conf. M'],
    ['cfem', 'Confecção feminina', ICO.fem, 'Conf. F']
  ];

  // foto: a gravada na amostra ou a do banco pelo artigo e cor
  const nomeFoto = x => x.foto || `${String(x.artigo || '').toUpperCase()}_${String(x.cor || '').toUpperCase().replace(/[\/\-\s.]+/g, '_')}.jpg`;
  function foto(x, grande) {
    const f = nomeFoto(x);
    if (/^https?:/.test(f)) return { src: f, erro: `this.replaceWith(Object.assign(document.createElement('span'),{className:'sem',textContent:'Sem foto'}))` };
    const g = '../Catalogo/' + f;
    return {
      src: grande ? g : '../Catalogo/mini/' + f,
      erro: `if(!this.dataset.g){this.dataset.g=1;this.src='${esc(g)}'}else if(!this.dataset.r){this.dataset.r=1;this.src='${esc(RAW + f)}'}else{this.replaceWith(Object.assign(document.createElement('span'),{className:'sem',textContent:'Sem foto'}))}`
    };
  }

  // marca pelo artigo: Under Armour tem 7 dígitos; Olympikus tem 8 dígitos ou começa com letras
  const marcaDe = x => /^\d{7}$/.test(String(x.artigo || '').trim()) ? 'ua' : 'oly';
  let todos = [], itens = [], filtro = '', quer = new Set();
  let marca = (P.get('m') === 'ua') ? 'ua' : 'oly';
  function aplicarMarca() {
    // no link dos escolhidos aparecem os dois, sem separar marca
    itens = SEL.length ? todos : todos.filter(x => marcaDe(x) === marca);
    document.querySelectorAll('#marcas button').forEach(b => { const on = b.dataset.m === marca; b.classList.toggle('on', on); b.setAttribute('aria-selected', on); });
    filtro = ''; $('q').value = '';
    $('filtros').hidden = !!SEL.length || itens.length < 6;
    desenharChips(); desenhar();
  }

  function desenharChips() {
    const tem = new Set(itens.flatMap(grupos));
    const lista = GRUPOS.filter(([k]) => !k || tem.has(k));
    $('chips').innerHTML = lista.length > 2 ? lista.map(([k, r, ic, curto]) => {
      const n = k ? itens.filter(x => grupos(x).includes(k)).length : itens.length;
      return `<button type="button" data-g="${k}" class="${filtro === k ? 'on' : ''}" title="${r}">${ic}<span class="longo">${r}</span><span class="curto">${curto}</span><small>${n}</small></button>`;
    }).join('') : '';
    $('chips').hidden = lista.length <= 2;
  }

  function desenhar() {
    const t = norm($('q').value.trim());
    const vis = itens.filter(x => (!filtro || grupos(x).includes(filtro)) &&
      (!t || norm([x.descricao, x.cor, x.descricaoCor, x.artigo].join(' ')).includes(t)));
    let topo = '';
    if (SEL.length) {
      const faltam = SEL.length - itens.length;
      topo = `<div class="aviso-sel"><span><b>${itens.length} ${itens.length === 1 ? 'produto escolhido' : 'produtos escolhidos'}</b>${faltam > 0 ? ` · ${faltam} já não ${faltam === 1 ? 'está disponível' : 'estão disponíveis'}` : ''}</span><a href="${esc(linkLoja([]))}">Ver o catálogo todo</a></div>`;
    }
    if (!itens.length) { $('main').innerHTML = topo + `<div class="vazio"><b>${SEL.length ? 'Esses produtos já foram vendidos' : `Nada de ${marca === 'ua' ? 'Under Armour' : 'Olympikus'} disponível agora`}</b>Novas amostras entram toda semana. Volte em breve!</div>`; return; }
    if (!vis.length) { $('main').innerHTML = topo + `<div class="vazio"><b>Nada encontrado</b>Tente outra busca ou outro filtro.</div>`; return; }
    $('main').innerHTML = topo + `<div class="grade">${vis.map(x => {
      const i = itens.indexOf(x), f = foto(x), [rot, cls] = tamRot(x.tamanho), on = quer.has(x.id);
      return `<div class="card${on ? ' on' : ''}" data-id="${esc(x.id)}">
        <button type="button" class="foto" data-ver="${i}" aria-label="Ampliar a foto"><img loading="lazy" alt="${esc(x.descricao)}" src="${esc(f.src)}" onerror="${f.erro}"></button>
        <div class="info"><b>${esc(x.descricao || 'Produto')}</b>
          <small>${esc(x.descricaoCor || x.cor)}</small>
          ${rot ? `<span class="tam ${cls}">${esc(rot)}</span>` : ''}
          ${x.preco ? `<span class="preco">${brl(x.preco)}</span>` : ''}</div>
        <button type="button" class="quero">${on ? '✓ Quero' : 'Quero'}</button></div>`;
    }).join('')}</div>`;
  }

  // ── WhatsApp: abre a conversa com quem atende, com a lista e o link das fotos ──
  function linkLoja(ids) {
    const u = new URL(location.href.split('?')[0]);
    if (ZAP) u.searchParams.set('w', ZAP);
    if (ATENDE) u.searchParams.set('n', ATENDE);
    if (ids.length) u.searchParams.set('sel', ids.map(curto).join(','));
    return u.toString();
  }
  function mensagem() {
    const esc_ = todos.filter(x => quer.has(x.id));
    const linhas = esc_.map(x => `• ${x.descricao}${x.descricaoCor ? ' ' + x.descricaoCor : ''} · ${tamRot(x.tamanho)[0]}${x.preco ? ' · ' + brl(x.preco) : ''}`);
    return `Olá${ATENDE ? ', ' + ATENDE : ''}! Vi o catálogo da CMS Store e tenho interesse ${esc_.length === 1 ? 'neste produto' : 'nestes produtos'}:\n\n${linhas.join('\n')}\n\nFotos: ${linkLoja(esc_.map(x => x.id))}\n\n${esc_.length === 1 ? 'Ainda está disponível?' : 'Ainda estão disponíveis?'}`;
  }
  function contar() {
    const n = quer.size;
    $('barra').classList.toggle('show', n > 0);
    const valor = todos.filter(x => quer.has(x.id)).reduce((s, x) => s + (x.preco || 0), 0);
    $('conta').innerHTML = `<b>${n}</b> ${n === 1 ? 'escolhido' : 'escolhidos'}${valor ? `<br>${brl(valor)}` : ''}`;
    const base = ZAP ? `https://wa.me/${ZAP}` : 'https://wa.me/';
    $('wa').href = `${base}?text=${encodeURIComponent(n ? mensagem() : '')}`;
  }

  function abrirFoto(i) {
    const x = itens[i]; if (!x) return;
    const f = foto(x, true), img = $('ver').querySelector('img');
    img.onerror = () => { img.onerror = null; const n = nomeFoto(x); if (!/^https?:/.test(n)) img.src = RAW + n; };
    img.src = f.src;
    $('ver').querySelector('.nome').textContent = x.descricao || '';
    $('ver').querySelector('.det').textContent = [x.descricaoCor || x.cor, tamRot(x.tamanho)[0], x.preco ? brl(x.preco) : ''].filter(Boolean).join(' · ');
    $('ver').hidden = false;
  }

  document.addEventListener('click', e => {
    const c = e.target.closest('.card');
    if (e.target.closest('.quero') && c) {
      const id = c.dataset.id;
      quer.has(id) ? quer.delete(id) : quer.add(id);
      c.classList.toggle('on', quer.has(id)); c.querySelector('.quero').textContent = quer.has(id) ? '✓ Quero' : 'Quero';
      contar(); return;
    }
    const v = e.target.closest('[data-ver]'); if (v) return abrirFoto(+v.dataset.ver);
    if (e.target.closest('.ver .fechar') || e.target === $('ver')) $('ver').hidden = true;
    const mb = e.target.closest('[data-m]');
    if (mb && mb.dataset.m !== marca) { marca = mb.dataset.m; aplicarMarca(); window.scrollTo({ top: 0 }); return; }
    const g = e.target.closest('[data-g]');
    if (g) { filtro = g.dataset.g; desenharChips(); desenhar(); }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') $('ver').hidden = true; });
  $('q').addEventListener('input', desenhar);
  $('wa').addEventListener('click', e => { if (!quer.size) e.preventDefault(); });

  fetch(WORKER_URL, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'getAmostras' }) })
    .then(r => r.json())
    .then(d => {
      if (!Array.isArray(d)) throw new Error();
      todos = d.filter(x => (x.quantidade || 1) > 0)
               .sort((a, b) => (a.descricao || '').localeCompare(b.descricao || '') || String(a.cor).localeCompare(String(b.cor)));
      if (SEL.length) todos = todos.filter(x => SEL.includes(curto(x.id)));
      // abriu sem marca no link e a Olympikus está vazia: começa pela que tem
      if (!P.get('m') && !SEL.length && !todos.some(x => marcaDe(x) === marca) && todos.length) marca = marcaDe(todos[0]);
      $('marcas').hidden = !!SEL.length;
      aplicarMarca(); contar();
    })
    .catch(() => { $('main').innerHTML = `<div class="vazio"><b>Não consegui abrir agora</b>Confira a internet e tente de novo.<br><br><button type="button" class="quero" onclick="location.reload()">Tentar de novo</button></div>`; });
})();
</script>
</body>
</html>
