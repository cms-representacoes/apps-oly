  },
  movimento: a => agPeloAssistente({ tipo: a.tipo === 'saidas' ? 'saidas' : 'entradas', de: a.de, ate: a.ate, agrupar: a.agrupar || 'nenhum', cliente: a.cliente, produto: a.produto, cor: a.cor, vendedor: a.vendedor }),
  ficha: a => {
    const out = agPeloAssistente({ tipo: 'ficha', produto: a.produto, cliente: a.cliente });
    return out.res ? { texto: out.res.fichaTexto } : out;
  },
  catalogo: a => {
    const out = agPeloAssistente({ tipo: 'catalogo', cliente: a.cliente, formato: a.formato, imagens: a.imagens });
    return out.res ? { catalogo: out.res, texto: 'Os botões do catálogo apareceram para o vendedor; ele toca para gerar.' } : out;
  },
  boleto: a => agBoleto(a),
  baixar: a => {
    if (!AG.ultimaTabela) return { erro: 'Ainda não há tabela nesta conversa para baixar.' };
    const formato = a.formato === 'pdf' ? 'pdf' : 'xlsx';
    if (!AG.testando) baixar(null, AG.ultimaTabela, formato);
    return { texto: `O ${formato === 'pdf' ? 'PDF' : 'Excel'} da última tabela foi baixado no aparelho do vendedor.` };
  },
};
const ROTULO_FERRAMENTA = { consultar: 'Consultando a carteira', clientes_sem_pedido: 'Procurando quem não comprou', movimento: 'Olhando entradas e saídas',
  ficha: 'Abrindo a ficha', catalogo: 'Preparando o catálogo', baixar: 'Gerando o arquivo', boleto: 'Buscando os boletos no EBM (pode levar 1 minuto)' };

/* boleto → TESTE: 2ª via pelo robô do CMS Boletos rodando NESTE computador
   (C:\SCRIPTS AUTONOMOS\boletos_local.py). Fora daqui o serviço não existe e
   a ferramenta avisa. A trava por vendedor vale aqui: o código sai da base,
   só entre os clientes de quem pergunta. Quando houver VPS, só muda o endereço. */
const BOLETOS_URL = 'http://127.0.0.1:8765';
async function agBoleto(a) {
  const D = APP.dic, X = indices(), p = prepAtivo();
  const meus = p < 0 ? null : new Set(APP.L.filter(r => r[C.PREP] === p).map(r => r[C.CLI]));
  if (!a.cliente) return { erro: 'De qual cliente? Pergunte ao vendedor.' };
  const r = agFiltro(meus ? X.cli.filter(x => meus.has(x.i)) : X.cli, String(a.cliente), 'cliente', i => D.cli[i][1]);
  if (r.erro) return { erro: r.erro };
  const nomes = [...new Set([...r.set].map(i => D.cli[i][1]))];
  if (nomes.length > 1) return { erro: `"${a.cliente}" casou com ${nomes.length} clientes: ${nomes.slice(0, 8).join(', ')}. Pergunte qual é antes de buscar boleto.` };
  const codigos = [...new Set([...r.set].map(i => String(D.cli[i][0])))];
  let resp;
  try {
    const corta = new AbortController();
    const t = setTimeout(() => corta.abort(), 90000 * codigos.length);
    const f = await fetch(BOLETOS_URL + '/boletos', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ codigos, de: a.de, ate: a.ate }), signal: corta.signal });
    clearTimeout(t);
    resp = await f.json();
  } catch (e) {
    return { erro: 'A busca de boletos ainda é um teste e só funciona no computador do escritório, com o "Boletos para o agente" ligado. Diga isso ao vendedor.' };
  }
  if (!resp.ok) return { erro: resp.erro || 'O robô de boletos falhou.' };
  const rows = [], linhas = [], links = [];
  const sit = { atrasadas: 'Vencida', em_dia: 'Em dia', bloqueadas: 'Não emitida', impostos: 'Imposto' };
  for (const c of resp.clientes) {
    const partes = [];
    for (const k of Object.keys(sit)) {
      for (const it of c[k] || []) {
        rows.push([c.nome || c.codigo, c.codigo, it.nota || '', it.parcela || '', it.vencimento || '', it.valor || '', sit[k] + (it.motivo ? ` (${it.motivo})` : '')]);
        partes.push(`${sit[k]}: NF ${it.nota || '?'} parcela ${it.parcela || '?'}, vence ${it.vencimento || '?'}, R$ ${it.valor || '?'}` +
          (k === 'atrasadas' && it.dias ? `, ${it.dias} dias de atraso` : k === 'em_dia' && it.dias ? `, vence em ${it.dias} dias` : '') + (it.motivo ? `, motivo: ${it.motivo}` : ''));
      }
    }
    for (const nome of c.arquivos || []) links.push({ nome, url: `${BOLETOS_URL}/arquivo?nome=${encodeURIComponent(nome)}` });
    linhas.push(`${c.nome || ''} (código ${c.codigo}): ${c.status}${c.obs ? ' — ' + c.obs : ''}${(c.arquivos || []).length ? ` · ${c.arquivos.length} PDF pronto para baixar` : ''}` +
      (partes.length ? '\n  ' + partes.join('\n  ') : ''));
  }
  const res = { entendi: ['<b>Boletos no EBM</b>', esc(`vencimento de ${resp.de} a ${resp.ate}`)], cols: ['Cliente', 'Código', 'NF', 'Parcela', 'Vencimento', 'Valor (R$)', 'Situação'],
    num: [], data: [], rows, totais: null, resumo: '' };
  return { res, links, texto: `Boletos com vencimento de ${resp.de} a ${resp.ate}:\n${linhas.join('\n')}\n` +
    (links.length ? 'Os botões para baixar o PDF já apareceram para o vendedor.' : 'Nenhum PDF foi gerado.') + ' "Não emitida" = o sistema não libera a 2ª via (cartório ou banco correspondente): explique o motivo.' };
}

// Texto da IA com o básico de markdown: negrito, listas, quebras e tabelas.
function mdSimples(t) {
  // Espaços que não quebram linha (o gpt-oss usa muito) viram espaço comum.
  const linhas = String(t).replace(/[   ]/g, ' ').replace(/‑/g, '-').split('\n');
  const out = [];
  let lista = null, tabela = null;
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*([^*]+)\*/g, '$1<i>$2</i>');
  const fecha = () => {
    if (lista) { out.push(`<${lista.tag}>${lista.itens.map(i => `<li>${i}</li>`).join('')}</${lista.tag}>`); lista = null; }
    if (tabela) {
      const [cab, ...corpo] = tabela.filter(l => !/^\s*\|?\s*:?-{2,}/.test(l)).map(l => l.replace(/^\s*\||\|\s*$/g, '').split('|').map(c => inline(c.trim())));
      out.push(`<div class="tabela-wrap"><table><thead><tr>${(cab || []).map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>${corpo.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`);
      tabela = null;
    }
  };
  for (const l of linhas) {
    if (/^\s*\|.*\|\s*$/.test(l)) { if (lista) fecha(); (tabela = tabela || []).push(l); continue; }
    const ul = l.match(/^\s*[-•*]\s+(.*)$/), ol = l.match(/^\s*\d+[.)]\s+(.*)$/);
    if (ul || ol) {
      const tag = ul ? 'ul' : 'ol';
      if (tabela || (lista && lista.tag !== tag)) fecha();
      (lista = lista || { tag, itens: [] }).itens.push(inline((ul || ol)[1]));
      continue;
    }
    fecha();
    out.push(l.trim() ? `<p>${inline(l)}</p>` : '');
  }
  fecha();
  return out.join('');
}

// Lista cortada vem com aviso gritado: a IA, vendo só o começo, concluía
// que quem ficou de fora "não tinha pedido".
const LINHAS_IA = 60;
const paraIA = (nome, out) => `[resultado de ${nome}]\n` + (out.erro ? 'ERRO: ' + out.erro : out.res && !out.texto ? resumoDaTela(out.res, LINHAS_IA) +
  (out.res.rows.length > LINHAS_IA ? `\nATENÇÃO: esta lista tem ${out.res.rows.length} linhas e só as ${LINHAS_IA} primeiras aparecem acima. NÃO conclua que um nome está ausente: para saber de nomes específicos, consulte de novo filtrando por eles.` : '') : out.texto || 'feito');

// Tabelas que a IA usou ficam embaixo da resposta, fechadas, com Excel e PDF.
function agTabelaHtml(res, i) {
  return `<details class="ag-tab"><summary>${esc(textoPlano(res.entendi.join(' · ')))} <span>· ${fmt(res.rows.length)} linha(s)</span></summary>` +
    `${res.rows.length ? tabelaHtml(res, MOSTRAR) : '<div class="digitando">Nenhuma linha.</div>'}` +
    `<div class="acoes">${res.rows.length > MOSTRAR ? `<button class="btn-sec" data-ag="todas" data-i="${i}">Ver todas (${fmt(res.rows.length)})</button>` : ''}` +
    `<button class="btn-sec" data-ag="xlsx" data-i="${i}">Baixar Excel</button><button class="btn-sec" data-ag="pdf" data-i="${i}">Baixar PDF</button></div></details>`;
}

// O histórico vai inteiro, mas resultado antigo de ferramenta vai resumido:
// a IA precisa do que respondeu, não de cada linha de três perguntas atrás.
function agHistorico() {
  const idxRes = AG.msgs.map((m, i) => m.role === 'user' && m.content.startsWith('[resultado de') ? i : -1).filter(i => i >= 0);
  const recentes = new Set(idxRes.slice(-4));
  return AG.msgs.map((m, i) => idxRes.includes(i) && !recentes.has(i) ? { role: m.role, content: m.content.slice(0, 400) + '\n(…resumido)' } : m);
}

// Uma pergunta inteira: pede à IA, roda as ferramentas que ela pedir e
// devolve a resposta. Não mexe na tela (a bateria de testes usa o mesmo).
async function agRodar(texto, aoPasso) {
  const inicio = AG.msgs.length;
  AG.msgs.push({ role: 'user', content: texto });
  const tabelas = [], extras = [], usadas = [];
  const p = prepAtivo();
  const contexto = {
    vendedor: p >= 0 ? APP.dic.prep[p] : '', vendedores: APP.veTudo && p < 0 ? APP.dic.prep : [],
    linhas: APP.dic.faixa || [], movMes: APP.base.mov && APP.base.mov.mes, periodo: agPeriodo(),
  };
  const sistema = agSistema(contexto);
  try {
    for (let passo = 1; ; passo++) {
      // O gpt-oss às vezes trava e devolve "!!!!!!…": pede de novo e, na
      // terceira, vai de Llama (só na bateria com modelo fixo é que não troca).
      let r;
      for (let tenta = 0; tenta < 3; tenta++) {
        const modelo = AG.modelo || (tenta === 2 ? '@cf/meta/llama-3.3-70b-instruct-fp8-fast' : undefined);
        r = await chamarWorker('agenteDetalhada', { hoje: hojeIso(), contexto, sistema, modelo, mensagens: agHistorico() }, 60000);
        if (!r || !r.ok || r.acao === 'ferramenta' || !/(.)\1{15,}/.test(r.texto || '')) break;
      }
      if (!r || !r.ok) throw new Error(r?.erro || 'sem resposta');
      if (r.acao !== 'ferramenta' && /(.)\1{15,}/.test(r.texto || '')) throw new Error('a IA devolveu texto embaralhado');
      if (r.acao !== 'ferramenta') {
        AG.msgs.push({ role: 'assistant', content: JSON.stringify({ resposta: r.texto }) });
        return { texto: r.texto, tabelas, extras, usadas, modelo: r.modelo };
      }
      AG.msgs.push({ role: 'assistant', content: JSON.stringify({ ferramenta: r.nome, args: r.args }) });
      usadas.push({ nome: r.nome, args: r.args });
      const fn = FERRAMENTAS[r.nome];
      let out;
      if (passo > PASSOS_MAX) out = { erro: 'Limite de consultas desta pergunta atingido. Responda com o que já tem.' };
      else if (!fn) out = { erro: `Ferramenta "${r.nome}" não existe. Use: ${Object.keys(FERRAMENTAS).join(', ')}.` };
      else {
        if (aoPasso) aoPasso(r.nome, passo);
        if (r.nome === 'ficha') await APP.catPronto;
        try { out = await fn(r.args || {}); } catch (e) { out = { erro: 'A ferramenta falhou: ' + (e.message || e) }; }
      }
      if (out.res && out.res.rows) { tabelas.push(out.res); AG.ultimaTabela = out.res; }
      if (out.links && out.links.length) {
        extras.push(`<div class="acoes">${out.links.map(l => `<a class="sug" href="${esc(l.url)}" download="${esc(l.nome)}">Baixar ${esc(l.nome)}</a>`).join('')}</div>`);
      }
      if (out.catalogo) {
        const c = out.catalogo.catalogo;
        const link = (gerar, fotos) => DETALHADA_URL + '?' + new URLSearchParams({ cliente: c.cods.join(','), gerar, ...(fotos == null ? {} : { fotos: fotos ? '1' : '0' }) });
        const btn = (gerar, fotos, rot) => `<a class="sug" target="_blank" rel="noopener" href="${esc(link(gerar, fotos))}">${rot}</a>`;
        extras.push(`<div class="acoes">${c.formato !== 'xlsx' ? btn('pdf', null, 'Catálogo em PDF') : ''}${c.formato !== 'pdf' ? btn('xlsx', c.imagens !== false, `Catálogo em Excel${c.imagens === false ? ' sem imagens' : ' com imagens'}`) : ''}</div>`);
      }
      AG.msgs.push({ role: 'user', content: paraIA(r.nome, out) });
    }
  } catch (e) {
    AG.msgs.length = inicio;
    throw e;
  }
}

async function perguntarAgente(texto) {
  texto = texto.trim();
  if (!texto) return;
  addMsg('eu', esc(texto));
  const bolha = addMsg('ia', digitando());
  $('enviar').disabled = true;
  try {
    const { texto: resp, tabelas, extras } = await agRodar(texto, (nome, passo) => {
      bolha.innerHTML = digitando(`${ROTULO_FERRAMENTA[nome] || 'Consultando'}…`);
      rolar();
    });
    bolha.innerHTML = `<div class="ag-texto">${mdSimples(resp)}</div>` + extras.join('') + tabelas.map(agTabelaHtml).join('');
    bolha.addEventListener('click', ev => {
      const b = ev.target.closest('[data-ag]');
      if (!b) return;
      const res = tabelas[Number(b.dataset.i)];
      if (b.dataset.ag === 'todas') { b.closest('details').querySelector('.tabela-wrap').outerHTML = tabelaHtml(res, Infinity); b.remove(); }
      else baixar(b, res, b.dataset.ag);
    });
  } catch (e) {
    // Cota grátis diária da Cloudflare (10 mil "neurons"): zera às 0h UTC = 21h de Brasília.
    bolha.innerHTML = /4006|daily free allocation/i.test(e.message || '')
      ? '<span class="aviso">A cota grátis de IA de hoje acabou. Ela volta às 21h (horário de Brasília).</span>'
      : `<span class="aviso">Não consegui responder agora (${esc(e.message || e)}). Tente de novo em instantes.</span>`;
  } finally {
    $('enviar').disabled = false;
    rolar();
  }
}

/* ── bateria de testes do agente (?agente=1&bateria=1, só DEV) ──────────
   Perguntas fixas de vendedor; o gabarito sai das próprias ferramentas na
   hora do teste, então continua valendo quando a carteira muda. A conferência
   procura na resposta o número (ou nome, data, código) que a base dá. */
const BATERIA = AGENTE && new URLSearchParams(location.search).has('bateria');
const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const isoDe = d => `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}-${String(d.getUTCDate()).padStart(2, '0')}`;
// Mês relativo ao de hoje: 0 = este, -1 = passado, 1 = próximo.
function batMes(off) {
  const h = new Date(hojeIso() + 'T00:00:00Z');
  const ini = new Date(Date.UTC(h.getUTCFullYear(), h.getUTCMonth() + off, 1));
  const fim = new Date(Date.UTC(h.getUTCFullYear(), h.getUTCMonth() + off + 1, 0));
  return { de: isoDe(ini), ate: isoDe(fim), nome: MESES[ini.getUTCMonth()] };
}
const batAno = () => hojeIso().slice(0, 4);
const batSem = n => ({ de: `${batAno()}-${n === 1 ? '01-01' : '07-01'}`, ate: `${batAno()}-${n === 1 ? '06-30' : '12-31'}` });
const batDia = off => { const d = new Date(hojeIso() + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + off); return isoDe(d); };
// Valor de uma coluna: total (sem linha), linha pelo número ou pelo nome.
function batValor(res, medida, linha) {
  const j = medida ? res.cols.indexOf(medida) : res.num[res.num.length - 1];
  if (j < 0) return null;
  if (linha == null) return res.rows.reduce((s, r) => s + (Number(r[j]) || 0), 0);
  const row = typeof linha === 'number' ? res.rows[linha] : res.rows.find(r => norm(String(r[0])).includes(norm(linha)));
  return row ? Number(row[j]) || 0 : null;
}
const batCons = a => { const o = agConsultar(a); if (o.erro) throw new Error(o.erro); return o.res; };
const batNums = t => (String(t).match(/\d{1,3}(?:\.\d{3})+|\d+/g) || []).map(s => Number(s.replace(/\./g, '')));
const batTem = (t, v) => v != null && batNums(t).includes(Math.round(v));
const batNome = (t, nome) => norm(t).includes(norm(String(nome).split(/\s+/)[0]));
const batUsou = (r, nome) => r.usadas.some(u => u.nome === nome);
const NAO_VE = /(n[aã]o|nem) (enxergo|tenho|consigo|vejo|possuo|acesso)/i;
// Movimento sem agrupar só traz o total no resumo ("3.480 pares entraram…").
function batMov(r, a) {
  const o = FERRAMENTAS.movimento(a);
  if (!o.res) return { ok: /n[aã]o/i.test(r.texto), esp: 'sem registro do período' };
  const v = /^Nenhum/.test(o.res.resumo) ? 0 : batNums(o.res.resumo)[0];
  return { ok: v ? batTem(r.texto, v) : /nenhum|n[aã]o|\b0\b/i.test(r.texto), esp: `${fmt(v)} (de ${dataDe(diaDe(a.de))} a ${dataDe(diaDe(a.ate))})` };
}

const TESTES = [
  { v: 'JORGE', q: ['bom dia'], ok: r => ({ ok: !r.usadas.length, esp: 'cumprimentar sem consultar' }) },
  { v: 'JORGE', q: ['quanto o Degraus tem em carteira?'], ok: r => { const v = batValor(batCons({ filtros: { cliente: 'DEGRAUS' }, situacao: 'carteira' }), 'Carteira'); return { ok: batTem(r.texto, v), esp: fmt(v) }; } },
  { v: 'JORGE', q: ['quanto o degras tem em carterira?'], ok: r => { const v = batValor(batCons({ filtros: { cliente: 'DEGRAUS' }, situacao: 'carteira' }), 'Carteira'); return { ok: batTem(r.texto, v), esp: fmt(v) + ' (com erro de digitação)' }; } },
  { v: 'JORGE', q: ['quanto o Degraus faturou no mês passado?'], ok: r => { const m = batMes(-1), v = batValor(batCons({ filtros: { cliente: 'DEGRAUS' }, situacao: 'faturado', de: m.de, ate: m.ate }), 'Faturado'); return { ok: batTem(r.texto, v), esp: `${fmt(v)} (${m.nome})` }; } },
  { v: 'JORGE', q: ['qual o crescimento em pares do Degraus do 1º para o 2º semestre?'], ok: r => {
    const [a, b] = [1, 2].map(n => batCons({ filtros: { cliente: 'DEGRAUS' }, ...batSem(n) }));
    const ok = (batTem(r.texto, batValor(a, 'Faturado')) || batTem(r.texto, batValor(a, 'Total'))) && (batTem(r.texto, batValor(b, 'Faturado')) || batTem(r.texto, batValor(b, 'Total')));
    return { ok, esp: `1º sem ${fmt(batValor(a, 'Total'))} · 2º sem ${fmt(batValor(b, 'Total'))} (total; ou só o faturado)` };
  } },
  { v: 'JORGE', q: ['quanto o Degraus faturou no 1º semestre?', 'e no segundo?'], ok: r => { const b = batCons({ filtros: { cliente: 'DEGRAUS' }, ...batSem(2) }); return { ok: batTem(r.texto, batValor(b, 'Faturado')) || batTem(r.texto, batValor(b, 'Total')), esp: `2º sem: faturado ${fmt(batValor(b, 'Faturado'))} ou total ${fmt(batValor(b, 'Total'))}` }; } },
  { v: 'JORGE', q: ['quais são meus 5 maiores clientes em carteira?'], ok: r => { const t = batCons({ agrupar: ['cliente'], situacao: 'carteira', ordenar: 'carteira', limite: 5 }); return { ok: batTem(r.texto, t.rows[0][2]) && batNome(r.texto, t.rows[0][0]), esp: `1º: ${t.rows[0][0]} ${fmt(t.rows[0][2])}` }; } },
  { v: 'JORGE', q: ['quais são meus 5 maiores clientes em carteira?', 'desses, quem não pediu o swift 6?'], ok: r => {
    const t = batCons({ agrupar: ['cliente'], situacao: 'carteira', ordenar: 'carteira', limite: 5 });
    const out = FERRAMENTAS.clientes_sem_pedido({ produto: 'SWIFT 6', clientes: [...new Set(t.rows.map(x => x[0]))] });
    const faltam = (out.res ? out.res.resumo.split('\n') : []).filter(l => /NÃO PEDIU/.test(l) && !/JÁ PEDIU/.test(l)).map(l => l.split(' (')[0]);
    return faltam.length ? { ok: faltam.every(n => batNome(r.texto, n)), esp: 'não pediram: ' + faltam.join(', ') } : { ok: /todos|nenhum/i.test(r.texto), esp: 'todos já pediram' };
  } },
  { v: 'JORGE', q: ['quanto tenho de carteira para o próximo mês?'], ok: r => { const m = batMes(1), v = batValor(batCons({ situacao: 'carteira', de: m.de, ate: m.ate }), 'Carteira'); return { ok: batTem(r.texto, v), esp: `${fmt(v)} (${m.nome})` }; } },
  { v: 'JORGE', q: [`compara o meu faturado de ${batMes(-2).nome} com ${batMes(-1).nome}`], ok: r => { const [a, b] = [-2, -1].map(o => { const m = batMes(o); return batValor(batCons({ situacao: 'faturado', de: m.de, ate: m.ate }), 'Faturado'); }); return { ok: batTem(r.texto, a) && batTem(r.texto, b), esp: `${fmt(a)} e ${fmt(b)}` }; } },
  { v: 'JORGE', q: ['qual linha eu mais faturei este ano?'], ok: r => { const t = batCons({ situacao: 'faturado', agrupar: ['linha'], ordenar: 'faturado', de: batAno() + '-01-01', ate: hojeIso() }); return { ok: norm(r.texto).includes(norm(t.rows[0][0])), esp: `${t.rows[0][0]} (${fmt(t.rows[0][1])})` }; } },
  { v: 'JORGE', q: ['quais clientes compraram swift 6?'], ok: r => { const t = batCons({ filtros: { produto: 'SWIFT 6' }, agrupar: ['cliente'], ordenar: 'total' }); return { ok: batNome(r.texto, t.rows[0][0]), esp: `o maior: ${t.rows[0][0]} · ${fmt(t.rows.length)} cliente(s)` }; } },
  { v: 'JORGE', q: ['quantos pares de Under Armour eu tenho na carteira?'], ok: r => { const v = batValor(batCons({ filtros: { marca: 'UA' }, situacao: 'carteira' }), 'Carteira'); return { ok: batTem(r.texto, v), esp: fmt(v) }; } },
  { v: 'JORGE', q: ['quando é a próxima previsão de faturamento do Degraus?'], ok: r => {
    const t = batCons({ filtros: { cliente: 'DEGRAUS' }, situacao: 'carteira', agrupar: ['previsao'], ordenar: 'data' });
    const hoje = diaDe(hojeIso()), prox = t.rows.find(x => x[0] >= hoje) || t.rows[0];
    return prox ? { ok: r.texto.includes(dataDe(prox[0])), esp: dataDe(prox[0]) } : { ok: true, esp: 'sem carteira' };
  } },
  { v: 'JORGE', q: ['me fala do cliente sapequara'], ok: r => { const cods = APP.dic.cli.filter(c => norm(c[1]).includes('SAPEQUARA')).map(c => String(c[0])); return { ok: cods.some(c => r.texto.includes(c)), esp: 'código ' + cods.join(' ou ') }; } },
  { v: 'JORGE', q: ['qual a referência do venus 3?'], ok: r => { const f = (FERRAMENTAS.ficha({ produto: 'VENUS 3' }).texto || '').match(/\b\d{8}\b/); return { ok: !!f && r.texto.includes(f[0]), esp: f ? f[0] : '?' }; } },
  { v: 'JORGE', q: ['quanto custa o corre 4?'], ok: r => { const f = (FERRAMENTAS.ficha({ produto: 'CORRE 4' }).texto || '').match(/R\$\s*([\d.]+)/); return { ok: !!f && batTem(r.texto, Number(f[1].replace(/\./g, ''))), esp: f ? 'R$ ' + f[1] + ' (preço sugerido)' : '?' }; } },
  { v: 'JORGE', q: ['quanto o talentus tem de carteira?'], ok: r => ({ ok: /\?/.test(r.texto) || norm(r.texto).includes('SEMPRE NA MODA'), esp: 'perguntar qual Talentus, ou separar os dois' }) },
  { v: 'JORGE', q: ['qual a minha meta deste mês?'], ok: r => ({ ok: NAO_VE.test(r.texto), esp: 'dizer que não enxerga meta' }) },
  { v: 'JORGE', q: ['quanto entrou de pedido ontem?'], ok: r => batMov(r, { tipo: 'entradas', de: batDia(-1), ate: batDia(-1) }) },
  { v: 'JORGE', q: ['quanto saiu da minha carteira essa semana?'], ok: r => { const dow = (new Date(hojeIso() + 'T00:00:00Z').getUTCDay() + 6) % 7; return batMov(r, { tipo: 'saidas', de: batDia(-dow), ate: hojeIso() }); } },
  { v: 'JORGE', q: ['o que o Degraus tem para faturar no próximo mês, por produto?', 'baixa essa tabela em excel'], ok: r => ({ ok: batUsou(r, 'baixar'), esp: 'usar a ferramenta baixar' }) },
  { v: 'JORGE', q: ['manda o catálogo do degraus em pdf'], ok: r => ({ ok: batUsou(r, 'catalogo'), esp: 'usar a ferramenta catalogo' }) },
  { v: 'JORGE', q: ['quanto de corre 4 eu tenho em carteira, por cor?'], ok: r => { const t = batCons({ filtros: { produto: 'CORRE 4' }, situacao: 'carteira', agrupar: ['cor'], ordenar: 'carteira' }); return t.rows.length ? { ok: batTem(r.texto, t.rows[0][1]), esp: `maior cor: ${t.rows[0][0]} ${fmt(t.rows[0][1])}` } : { ok: /n[aã]o|nenhum|zero|\b0\b/i.test(r.texto), esp: 'sem carteira' }; } },
  { v: 'JORGE', q: ['quantas notas o Degraus recebeu no mês passado?'], ok: r => { const m = batMes(-1), t = batCons({ filtros: { cliente: 'DEGRAUS' }, situacao: 'faturado', de: m.de, ate: m.ate, agrupar: ['nf'] }); return { ok: batTem(r.texto, t.rows.length), esp: `${t.rows.length} nota(s)` }; } },
  { v: 'JORGE', q: ['obrigado!'], ok: r => ({ ok: !r.usadas.length, esp: 'agradecer sem consultar' }) },
  { v: '', q: ['qual vendedor tem mais carteira?'], ok: r => { const t = batCons({ situacao: 'carteira', agrupar: ['vendedor'], ordenar: 'carteira' }); return { ok: batNome(r.texto, t.rows[0][0]), esp: `${t.rows[0][0]} (${fmt(t.rows[0][1])})` }; } },
  { v: '', q: ['quanto o Jorge faturou este ano?'], ok: r => { const v = batValor(batCons({ filtros: { vendedor: 'JORGE' }, situacao: 'faturado', de: batAno() + '-01-01', ate: hojeIso() }), 'Faturado'); return { ok: batTem(r.texto, v), esp: fmt(v) }; } },
  { v: '', q: ['qual o crescimento em numero de pares entre o primeiro e segundo semestre, do cliente degraus?'], ok: r => {
    if (/\?/.test(r.texto) && !batNums(r.texto).some(n => n > 999)) return { ok: true, esp: 'perguntou qual Degraus (vale)' };
    const [a, b] = [1, 2].map(n => batValor(batCons({ filtros: { cliente: 'DEGRAUS' }, ...batSem(n) }), 'Total'));
    return { ok: batTem(r.texto, a) && batTem(r.texto, b), esp: `1º sem ${fmt(a)} · 2º sem ${fmt(b)}, ou perguntar qual Degraus` };
  } },
  { v: '', q: ['qual produto mais faturou no mês passado?'], ok: r => { const m = batMes(-1), t = batCons({ situacao: 'faturado', agrupar: ['produto'], ordenar: 'faturado', de: m.de, ate: m.ate }); return { ok: norm(r.texto).includes(norm(t.rows[0][0])) || r.texto.includes(t.rows[0][1]), esp: `${t.rows[0][0]} (${fmt(t.rows[0][2])})` }; } },
];

function montarBateria() {
  const box = addMsg('ia', `<div class="ag-texto"><p><b>Bateria de testes</b> · ${TESTES.length} perguntas. O gabarito sai da base agora; cada pergunta roda numa conversa nova.</p></div>
    <div class="acoes"><select id="batModelo"><option value="">Automático (gpt-oss, com reserva)</option><option value="@cf/openai/gpt-oss-120b">Só gpt-oss-120b</option><option value="@cf/meta/llama-3.3-70b-instruct-fp8-fast">Só Llama 3.3 70B</option></select>
    <button class="btn-sec" id="batRodar">Rodar bateria</button></div><div id="batSaida"></div>`);
  box.querySelector('#batRodar').addEventListener('click', ev => rodarBateria(ev.target, box.querySelector('#batModelo').value));
}

async function rodarBateria(botao, modelo) {
  const saida = $('batSaida'), sel = $('verComo');
  const antes = { msgs: AG.msgs, tab: AG.ultimaTabela, modelo: AG.modelo, ver: sel.value };
  botao.disabled = true; AG.modelo = modelo; AG.testando = true;
  const linhas = [], t0 = Date.now();
  const desenha = fim => {
    const certos = linhas.filter(l => l[3] === 'certo').length;
    saida.innerHTML = `<p class="ag-texto"><b>${certos} de ${linhas.length}</b> certas${fim ? '' : ` · rodando ${linhas.length + 1} de ${TESTES.length}…`} · ${Math.round((Date.now() - t0) / 1000)} s</p>` +
      `<div class="tabela-wrap"><table><thead><tr><th>#</th><th>Pergunta</th><th>Resultado</th><th>Esperado</th><th>Resposta</th><th>Ferramentas</th><th>s</th></tr></thead><tbody>` +
      linhas.map(l => `<tr class="bat-${l[3]}"><td>${l[0]}</td><td>${esc(l[1])}</td><td>${l[3] === 'certo' ? '✔' : l[3] === 'errado' ? '✘' : '⚠'}</td><td>${esc(l[4])}</td><td>${esc(l[5])}</td><td>${esc(l[6])}</td><td>${l[7]}</td></tr>`).join('') +
      `</tbody></table></div>` + (fim ? `<div class="acoes"><button class="btn-sec" id="batXlsx">Baixar Excel</button></div>` : '');
    rolar();
  };
  try {
    for (let i = 0; i < TESTES.length; i++) {
      const t = TESTES[i];
      desenha(false);
      AG.msgs = []; AG.ultimaTabela = null;
      const iv = t.v ? APP.dic.prep.findIndex(p => norm(p).includes(t.v)) : -1;
      sel.value = iv >= 0 ? String(iv) : '';
      const ti = Date.now();
      let r = { texto: '', usadas: [] }, situacao, esp = '', modeloUsado = '';
      try {
        for (const q of t.q) {
          const x = await agRodar(q);
          r = { texto: x.texto, usadas: [...r.usadas, ...x.usadas] };
          modeloUsado = x.modelo || '';
        }
        const c = t.ok(r);
        situacao = c.ok ? 'certo' : 'errado'; esp = c.esp;
      } catch (e) { situacao = 'falhou'; esp = 'erro: ' + (e.message || e); }
      linhas.push([i + 1, (t.v ? `[${t.v}] ` : '[todos] ') + t.q.join(' → '), modeloUsado.split('/').pop(), situacao, esp, r.texto,
        r.usadas.map(u => u.nome + ' ' + JSON.stringify(u.args)).join(' | '), Math.round((Date.now() - ti) / 1000)]);
    }
  } finally {
    Object.assign(AG, { msgs: antes.msgs, ultimaTabela: antes.tab, modelo: antes.modelo, testando: false });
    sel.value = antes.ver; botao.disabled = false;
  }
  desenha(true);
  const certos = linhas.filter(l => l[3] === 'certo').length;
  $('batXlsx').addEventListener('click', ev => baixar(ev.target, {
    entendi: [`<b>Bateria do agente</b>`, esc(`${certos} de ${linhas.length} certas · ${modelo || 'automático'} · ${Math.round((Date.now() - t0) / 1000)} s`)],
    cols: ['#', 'Pergunta', 'Modelo', 'Resultado', 'Esperado', 'Resposta', 'Ferramentas', 'Segundos'], num: [7], data: [], rows: linhas, totais: null,
  }, 'xlsx'));
}

async function iniciar() {
  if (AGENTE) {
    document.title = 'Nexo · CMS';
    $('titulo').textContent = 'Nexo';
  }
  APP.sessao = lerSessao();
  if (!APP.sessao) {
    $('conversa').innerHTML = '<div class="bloqueio"><h2>Entre pelo Portal</h2><p>O assistente usa o login do Portal do Vendedor.</p></div>';
    $('quem').textContent = 'Sem login';
    return;
  }
  if (SO_DEV && norm(APP.sessao.nome) !== 'MARCOS (DEV)') {
    $('conversa').innerHTML = '<div class="bloqueio"><h2>Em desenvolvimento</h2><p>O assistente ainda não foi liberado para a equipe.</p></div>';
    $('quem').textContent = APP.sessao.nome;
    return;
  }
  APP.veTudo = MANDA_EM_TUDO.includes(norm(APP.sessao.nome));
  // Sem a linha de status no topo, o carregando e os erros aparecem na conversa.
  const carregando = addMsg('ia', digitando('Carregando a base…'));
  const base = await carregarBase();
  carregando.closest('.msg').remove();
  if (!base) { addMsg('ia', '<span class="aviso">Não foi possível carregar a base. Tente abrir de novo em instantes.</span>'); return; }
  APP.base = base; APP.dic = base.dic; APP.L = base.l;
  APP.catPronto = carregarCatalogo().catch(() => {});

  if (APP.veTudo) {
    $('verComo').innerHTML = '<option value="">Todos os vendedores</option>' +
      APP.dic.prep.map((p, i) => `<option value="${i}">${esc(p)}</option>`).join('');
    $('verComoWrap').hidden = false;
    $('verComo').addEventListener('change', () => { APP.anteriores = []; APP.atual = null; APP.tela = ''; AG.msgs = []; AG.ultimaTabela = null; });
  } else {
    APP.prep = acharPreposto(APP.sessao.nome);
    if (APP.prep < 0) { addMsg('ia', `<span class="aviso">Não achei nenhuma linha de ${esc(APP.sessao.nome)} na base.</span>`); return; }
  }
  $('pergunta').disabled = false; $('enviar').disabled = false;
  $('pergunta').focus();
  if (BATERIA && APP.veTudo) montarBateria();
}

// Campo vazio mostra o microfone no lugar do enviar, como no WhatsApp.
const ajustaBotoes = () => $('form').classList.toggle('vazio', !!VOZ && !$('pergunta').value.trim());
$('form').addEventListener('submit', e => { e.preventDefault(); const t = $('pergunta'); const v = t.value; t.value = ''; t.style.height = ''; ajustaBotoes(); (AGENTE ? perguntarAgente : perguntar)(v); });
$('pergunta').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('form').requestSubmit(); } });
$('pergunta').addEventListener('input', e => { const t = e.target; t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 120) + 'px'; ajustaBotoes(); });

/* Falar em vez de digitar: reconhecimento de fala do próprio navegador
   (Chrome e Safari; o Firefox não tem). O texto cai no campo e quem
   envia é a pessoa, depois de conferir: nome de cliente às vezes sai torto. */
const VOZ = window.SpeechRecognition || window.webkitSpeechRecognition;
let ouvindo = null;
if (VOZ) {
  $('mic').hidden = false;
  $('mic').addEventListener('click', () => {
    if (ouvindo) { ouvindo.stop(); return; }
    const t = $('pergunta'), antes = t.value.trim();
    const rec = new VOZ();
    rec.lang = 'pt-BR'; rec.interimResults = true; rec.continuous = false;
    rec.onresult = ev => {
      const falado = [...ev.results].map(r => r[0].transcript).join('');
      t.value = (antes ? antes + ' ' : '') + falado;
      t.dispatchEvent(new Event('input'));
    };
    rec.onerror = ev => {
      if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') addMsg('ia', '<span class="aviso">Libere o microfone para esta página (no cadeado ao lado do endereço) e toque de novo.</span>');
      else if (ev.error !== 'no-speech' && ev.error !== 'aborted') addMsg('ia', `<span class="aviso">Não consegui ouvir (${esc(ev.error)}). Tente de novo.</span>`);
    };
    rec.onend = () => { ouvindo = null; $('mic').classList.remove('ouvindo'); ajustaBotoes(); if (t.value.trim()) t.focus(); };
    ouvindo = rec;
    $('mic').classList.add('ouvindo');
    rec.start();
  });
}
ajustaBotoes();
