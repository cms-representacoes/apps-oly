  <div class="tit">

      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 14-7-5 14-2-6-7-1z"/></svg>

  <div class="base-info" id="baseInfo"></div>

<script>
const WORKER_URL = 'https://repasse-worker-cms.marcosrep-cms.workers.dev/';
const SESSION_KEY = 'cms_portal_session_v1';
const MANDA_EM_TUDO = ['CMS', 'MARCOS (DEV)'];
// Em obra: só o DEV entra, mesmo com o endereço na mão. Para liberar à
// equipe, false aqui e tirar a classe dev-only do card no portal.
const SO_DEV = true;
// Mesma posição de campos da Detalhada (apps-oly-v2/detalhada, const C)
const C = { PREP: 0, CLI: 1, MARCA: 2, FAB: 3, FIL: 4, REF: 5, COR: 6, GCI: 7, NF: 8, OC: 9, PREV: 10, CART: 11, FAT: 12, DFAT: 13, FAIXA: 14 };
const MOSTRAR = 50;

const $ = id => document.getElementById(id);
const APP = { sessao: null, veTudo: false, base: null, dic: null, L: [], prep: -1, anteriores: [], atual: null };

/* ── utilidades ───────────────────────────────────────── */
const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().trim();
const fmt = n => Number(n || 0).toLocaleString('pt-BR');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const diaDe = iso => { const [y, m, d] = String(iso).split('-').map(Number); return Math.floor(Date.UTC(y, m - 1, d) / 86400000); };
const dataDe = dia => { const d = new Date(dia * 86400000); return `${String(d.getUTCDate()).padStart(2, '0')}/${String(d.getUTCMonth() + 1).padStart(2, '0')}/${d.getUTCFullYear()}`; };
const mesDe = dia => { const d = new Date(dia * 86400000); return `${String(d.getUTCMonth() + 1).padStart(2, '0')}/${d.getUTCFullYear()}`; };
const hojeIso = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const ehUA = m => /^UA/.test(String(m || ''));

async function chamarWorker(action, extra = {}, ms = 15000) {
  const corta = new AbortController();
  const t = setTimeout(() => corta.abort(), ms);
  try {
    const r = await fetch(WORKER_URL, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action, ...extra }), signal: corta.signal,
    });
    if (!r.ok) throw new Error(`worker respondeu ${r.status}`);
    return await r.json();
  } finally { clearTimeout(t); }
}

/* ── sessão e base ────────────────────────────────────── */
function lerSessao() {
  try {
    const s = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
    if (!s || !s.expiraEm || new Date(s.expiraEm).getTime() < Date.now()) return null;
    return s;
  } catch (_) { return null; }
}

// O nome do portal nem sempre é o da base ("CHRISTIAN LUCAS" x "CHRISTIAN").
function acharPreposto(nome) {
  const n = norm(nome), prep = APP.dic.prep.map(norm);
  let i = prep.indexOf(n);
  if (i < 0) i = prep.findIndex(p => p && (n.startsWith(p + ' ') || p.startsWith(n.split(' ')[0])));
  return i;
}

async function carregarBase() {
  // Igual à Detalhada: o worker às vezes devolve 503 ao montar a base; a
  // segunda tentativa costuma vir. A cópia do repositório é só reserva.
  for (let t = 1; t <= 2; t++) {
    try {
      const b = await chamarWorker('getDetalhada', {}, 45000);
      if (b && Array.isArray(b.l)) return b;
    } catch (_) {}
  }
  const r = await fetch('../data/detalhada.json', { cache: 'no-store' });
  return r.ok ? r.json() : null;
}

function prepAtivo() {
  if (!APP.veTudo) return APP.prep;
  const v = $('verComo').value;
  return v === '' ? -1 : Number(v);
}

/* ── casar o que a IA entendeu com a base ─────────────── */
// Código exato primeiro; depois a frase dentro do nome; por fim todas as
// palavras (cada uma igual a uma palavra do nome, ou começo dela com 3+ letras).
function casar(lista, termo) {
  const t = norm(termo);
  if (!t) return null;
  const exato = lista.filter(x => x.cod === t);
  if (exato.length) return exato.map(x => x.i);
  const frase = lista.filter(x => x.txt.includes(t));
  if (frase.length) return frase.map(x => x.i);
  const tokens = t.split(/[^A-Z0-9]+/).filter(Boolean);
  // Cada palavra digitada usa uma palavra diferente do nome: "TOK TOK" não
  // pode casar duas vezes com o mesmo "TOK" de "TOK DO PE".
  return lista.filter(x => {
    const livres = x.txt.split(/[^A-Z0-9]+/);
    return tokens.every(k => {
      const j = livres.findIndex(p => p === k || (k.length >= 3 && p.startsWith(k)));
      if (j < 0) return false;
      livres.splice(j, 1);
      return true;
    });
  }).map(x => x.i);
}

/* Erro de digitação: quando nada casa, procura o nome mais PARECIDO.
   Nota de 0 a 1 por palavra digitada contra a palavra mais próxima do nome
   ("ESPORT" x "SPORT" = 0,83), e a média delas. Volta agrupado por nome,
   porque o mesmo cliente aparece com vários códigos. */
// Letras trocadas de lugar ("RSUH") contam como um erro só.
function distancia(a, b) {
  if (a === b) return 0;
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) {
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
  }
  return d[a.length][b.length];
}
const parecenca = (a, b) => 1 - distancia(a, b) / Math.max(a.length, b.length, 1);
// Trocas de quem escreve pelo som: "KENTE" = "QUENTE", "ARMAZEN" = "ARMAZEM".
const pelaFala = s => s.replace(/QU/g, 'K').replace(/C(?=[AOU]|$)/g, 'K').replace(/SS/g, 'S').replace(/Z/g, 'S')
  .replace(/Y/g, 'I').replace(/W/g, 'V').replace(/PH/g, 'F').replace(/N$/, 'M');

function parecidos(lista, termo) {
  const tokens = norm(termo).split(/[^A-Z0-9]+/).filter(k => k.length >= 2 || /\d/.test(k)).map(pelaFala);
  if (!tokens.length) return [];
  const porNome = new Map();
  for (const x of lista) {
    const palavras = x.txt.split(/[^A-Z0-9]+/).filter(Boolean).map(pelaFala);
    if (!palavras.length) continue;
    const nota = tokens.reduce((s, k) => s + Math.max(...palavras.map(p => parecenca(k, p))), 0) / tokens.length;
    if (nota < 0.75) continue;
    const g = porNome.get(x.txt) || { nome: x.txt, idx: [], nota };
    g.idx.push(x.i); porNome.set(x.txt, g);
  }
  return [...porNome.values()].sort((a, b) => b.nota - a.nota);
}

function indices() {
  if (APP.idx) return APP.idx;
  const D = APP.dic;
  APP.idx = {
    cli: D.cli.map(([cod, nome], i) => ({ i, cod: norm(cod), txt: norm(nome) })),
    ref: D.ref.map(([ref, desc], i) => ({ i, cod: norm(ref), txt: norm(desc) })),
    cor: D.cor.map((c, i) => ({ i, cod: norm(c), txt: norm(c) })),
    faixa: (D.faixa || []).map((f, i) => ({ i, cod: norm(f), txt: norm(f) })),
    prep: D.prep.map((p, i) => ({ i, cod: norm(p), txt: norm(p) })),
  };
  return APP.idx;
}

const ROTULO_TIPO = {
  carteira: 'Carteira (a faturar)', faturado: 'Faturado', pedidos: 'Pedidos (faturado + carteira)',
  compraram: 'Clientes que compraram', nao_compraram: 'Clientes que não compraram',
  catalogo: 'Catálogo da carteira', entradas: 'Entradas na carteira', saidas: 'Saídas da carteira',
};
// Quem gera o catálogo é a própria Detalhada (mesmo arquivo do botão de lá).
// Caminho relativo: no GitHub Pages as duas pastas moram lado a lado.
const DETALHADA_URL = '../../apps-oly-v2/detalhada/';

function executar(q) {
  const D = APP.dic, X = indices();
  const tipo = ROTULO_TIPO[q.tipo] ? q.tipo : 'nao_entendi';
  q.limite = Number(q.limite) > 0 ? Math.floor(Number(q.limite)) : 0;
  if (tipo === 'nao_entendi') return { pede: true, erro: (q.duvida ? q.duvida + ' ' : '') + 'Pode explicar de outro jeito? Falo de carteira, faturado e de quem comprou ou não comprou um produto.' };

  const entendi = [`<b>${ROTULO_TIPO[tipo]}</b>`];
  const falta = [];
  let escolha = null;   // "Você quis dizer…?" — a primeira dúvida que aparecer
  const exato = q._exato || {};
  // Acha o termo do campo na lista. Sem nada parecido, anota em `falta`;
  // com um só nome bem perto, segue com ele e avisa; com vários, pergunta.
  const pegar = (lista, campo, rotulo, mostra, perguntaSeVarios) => {
    const termo = q[campo];
    if (!termo) return null;
    let achou = exato[campo] ? lista.filter(x => x.txt === exato[campo]).map(x => x.i) : casar(lista, termo);
    let nota = '';
    if (!exato[campo] && achou && achou.length && perguntaSeVarios && !(q._todos || {})[campo]) {
      const nomesDif = [...new Set(achou.map(i => lista.find(x => x.i === i).txt))];
      if (nomesDif.length > 1 && nomesDif.length <= 8 && !escolha) {
        escolha = { campo, rotulo, termo, opcoes: nomesDif, todos: true };
      }
    }
    if (!achou || !achou.length) {
      const cand = parecidos(lista, termo);
      const [a, b] = cand;
      if (a && ((a.nota >= 0.85 && (!b || b.nota <= a.nota - 0.1)) || (!b && a.nota >= 0.8))) {
        achou = a.idx;
        nota = ` <i>(você escreveu “${esc(termo)}”)</i>`;
      } else if (cand.length) {
        if (!escolha) escolha = { campo, rotulo, termo, opcoes: cand.slice(0, 4).map(c => c.nome) };
        return new Set();
      } else { falta.push(`${rotulo} “${termo}”`); return new Set(); }
    }
    const nomes = [...new Set(achou.map(mostra))];
    entendi.push(`${rotulo}: ${esc(nomes.slice(0, 4).join(', '))}${nomes.length > 4 ? ` e mais ${nomes.length - 4}` : ''}${nota}`);
    return new Set(achou);
  };

  let p = prepAtivo();
  if (q.vendedor && APP.veTudo && p < 0) {
    const s = pegar(X.prep, 'vendedor', 'vendedor', i => D.prep[i]);
    if (s && s.size) p = [...s][0];
  } else if (p >= 0) entendi.push(`vendedor: ${esc(D.prep[p])}`);
  // Cliente só entre os do vendedor: senão "achava" o cliente de outro e
  // respondia "nenhum par", como se ele não tivesse pedido nada.
  const meus = p < 0 ? null : new Set(APP.L.filter(r => r[C.PREP] === p).map(r => r[C.CLI]));
  // Cliente com nomes diferentes que casam ("ARMAZEM" → Paraíba e Eldorado)
  // pergunta qual; produto não, porque "CORRE" juntando a família é o esperado.
  const sCli = pegar(meus ? X.cli.filter(x => meus.has(x.i)) : X.cli, 'cliente', 'cliente', i => D.cli[i][1], true);
  const sRef = pegar(X.ref, 'produto', 'produto', i => `${D.ref[i][1]} (${D.ref[i][0]})`);
  const sCor = pegar(X.cor, 'cor', 'cor', i => D.cor[i]);
  const sFx = pegar(X.faixa, 'linha', 'linha', i => D.faixa[i]);
  if (escolha) return { entendi, escolha };
  const marca = q.marca === 'UA' || q.marca === 'OLY' ? q.marca : null;
  if (marca) entendi.push(`marca: ${marca === 'UA' ? 'Under Armour' : 'Olympikus'}`);
  const de = /^\d{4}-\d{2}-\d{2}$/.test(q.de || '') ? diaDe(q.de) : null;
  const ate = /^\d{4}-\d{2}-\d{2}$/.test(q.ate || '') ? diaDe(q.ate) : null;
  if (de != null || ate != null) entendi.push(`período: ${de != null ? dataDe(de) : 'início'} a ${ate != null ? dataDe(ate) : 'fim'}`);
  if (falta.length) return { entendi, pede: true, erro: `Não achei ${falta.join(' nem ')} ${p >= 0 ? 'na carteira deste vendedor' : 'na base'}. Confira o nome e me diga de novo.` };

  /* catálogo: só precisa do cliente e do formato; o resto (filtros, grade,
     fotos, repasse) é a Detalhada que resolve, igual ao botão de lá. */
  if (tipo === 'catalogo') {
    if (!sCli || !sCli.size) return { entendi, pede: true, erro: 'De qual cliente? Diga o nome ou o código.' };
    const cods = [...sCli].map(i => String(D.cli[i][0]));
    const formato = q.formato === 'pdf' || q.formato === 'xlsx' ? q.formato : null;
    const imagens = q.imagens === true || q.imagens === false ? q.imagens : null;
    if (formato) entendi.push(formato === 'pdf' ? 'PDF' : `Excel${imagens == null ? '' : imagens ? ' com imagens' : ' sem imagens'}`);
    const nomes = [...new Set([...sCli].map(i => D.cli[i][1]))];
    return { entendi, catalogo: { cods, nome: nomes.join(', '), formato, imagens } };
  }

  const doProduto = r => (!sRef || sRef.has(r[C.REF])) && (!sCor || sCor.has(r[C.COR])) &&
    (!sFx || sFx.has(r[C.FAIXA])) && (!marca || (marca === 'UA') === ehUA(D.marca[r[C.MARCA]]));
  const noPeriodo = d => d >= 0 && (de == null || d >= de) && (ate == null || d <= ate);
  // Quanto da linha conta para o tipo, e em que dia
  const partes = r => {
    const out = [];
    if (tipo !== 'faturado' && r[C.CART] > 0) out.push([r[C.CART], r[C.PREV]]);
    if (tipo !== 'carteira' && r[C.FAT] > 0) out.push([r[C.FAT], r[C.DFAT] >= 0 ? r[C.DFAT] : r[C.PREV]]);
    return out;
  };

  const linhas = APP.L.filter(r => (p < 0 || r[C.PREP] === p) && (!sCli || sCli.has(r[C.CLI])));
  const mostraVend = APP.veTudo && p < 0;
  const vendDoCli = new Map();
  if (mostraVend) for (const r of linhas) if (!vendDoCli.has(r[C.CLI])) vendDoCli.set(r[C.CLI], D.prep[r[C.PREP]]);

  /* não compraram: todo cliente do vendedor que aparece na base, menos quem
     teve pedido do produto no período. Os maiores clientes vêm primeiro. */
  if (tipo === 'nao_compraram' || tipo === 'compraram') {
    if (!sRef && !sFx && !marca && !sCor) return { entendi, pede: true, erro: 'De qual produto? Diga o modelo, a referência ou a linha.' };
    const total = new Map(), ult = new Map(), doProd = new Map(), ultProd = new Map();
    for (const r of linhas) {
      for (const [qt, d] of partes(r)) {
        const c = r[C.CLI];
        total.set(c, (total.get(c) || 0) + qt);
        if (d > (ult.get(c) ?? -1)) ult.set(c, d);
        if (doProduto(r) && noPeriodo(d)) {
          doProd.set(c, (doProd.get(c) || 0) + qt);
          if (d > (ultProd.get(c) ?? -1)) ultProd.set(c, d);
        }
      }
    }
    const lista = tipo === 'compraram' ? [...doProd.keys()] : [...total.keys()].filter(c => !doProd.has(c));
    const cols = ['Cliente', 'Código', ...(mostraVend ? ['Vendedor'] : []),
      tipo === 'compraram' ? 'Pares do produto' : 'Pares (tudo)', tipo === 'compraram' ? 'Último pedido' : 'Último pedido (qualquer)'];
    const rows = lista.map(c => ({
      v: [D.cli[c][1], D.cli[c][0], ...(mostraVend ? [vendDoCli.get(c)] : []),
        tipo === 'compraram' ? doProd.get(c) : total.get(c), tipo === 'compraram' ? ultProd.get(c) : ult.get(c)],
      ord: tipo === 'compraram' ? doProd.get(c) : total.get(c),
    })).sort((a, b) => b.ord - a.ord);
    if (q.limite > 0) rows.length = Math.min(rows.length, q.limite);
    const n = rows.length;
    return {
      entendi, cols, num: [cols.length - 2], data: [cols.length - 1],
      rows: rows.map(x => x.v),
      resumo: tipo === 'compraram'
        ? `${fmt(n)} cliente${n === 1 ? '' : 's'} compraram · ${fmt(rows.reduce((s, x) => s + x.ord, 0))} pares`
        : `${fmt(n)} cliente${n === 1 ? '' : 's'} sem pedido desse produto${de != null || ate != null ? ' no período' : ''}, de ${fmt(total.size)} na carteira`,
    };
  }

  /* Daqui em diante tudo vira "fato": quanto, de quê (a medida), em que dia,
     de qual cliente/produto/vendedor. Carteira, faturado e pedidos saem das
     linhas da base; entradas e saídas, do registro do mês (o mesmo do
     relatório Entradas e saídas da Detalhada). A tabela é uma só. */
  const fatos = [];
  let aviso = '';
  if (tipo === 'entradas' || tipo === 'saidas') {
    const mov = APP.base && APP.base.mov;
    if (!mov || !Array.isArray(mov.ev)) return { entendi, erro: 'A base de hoje veio sem o registro de entradas e saídas.' };
    const md = mov.dic;
    const inicio = diaDe(mov.mes + '-01');
    if (de != null && de < inicio) aviso = `O registro de entradas e saídas começa em ${dataDe(inicio)}: ele zera a cada mês.`;
    // O registro tem dicionário próprio: casa por código e nome com o da base.
    const codCli = sCli ? new Set([...sCli].map(i => String(D.cli[i][0]))) : null;
    const codRef = sRef ? new Set([...sRef].map(i => String(D.ref[i][0]))) : null;
    const nomeCor = sCor ? new Set([...sCor].map(i => String(D.cor[i]))) : null;
    const nomeFx = sFx ? new Set([...sFx].map(i => String(D.faixa[i]))) : null;
    const prepNome = p >= 0 ? norm(D.prep[p]) : null;
    const quer = tipo === 'entradas' ? 'e' : 's';
    for (const e of mov.ev) {
      const [dia, t, gci, iRef, iCor, iCli, iPrep, iMarca, iFaixa, prev, qt, motivo] = e;
      if (t !== quer || !noPeriodo(dia)) continue;
      const prep = String(md.prep[iPrep] || ''), cli = md.cli[iCli] || ['', ''], ref = md.ref[iRef] || ['', ''];
      const cor = String(md.cor[iCor] || ''), fx = String(md.faixa[iFaixa] || ''), mc = String(md.marca[iMarca] || '');
      if (prepNome && norm(prep) !== prepNome) continue;
      if ((codCli && !codCli.has(String(cli[0]))) || (codRef && !codRef.has(String(ref[0]))) ||
          (nomeCor && !nomeCor.has(cor)) || (nomeFx && !nomeFx.has(fx)) || (marca && (marca === 'UA') !== ehUA(mc))) continue;
      fatos.push({ m: tipo === 'entradas' ? 'ent' : (motivo || 'chk'), qt, dia, gci,
        cliCod: String(cli[0]), cliNome: String(cli[1] || cli[0]), prep, refCod: String(ref[0]), refNome: String(ref[1] || ref[0]), cor });
    }
  } else {
    for (const r of linhas) {
      if (!doProduto(r)) continue;
      const base = { gci: r[C.GCI], cliCod: String(D.cli[r[C.CLI]][0]), cliNome: D.cli[r[C.CLI]][1], prep: D.prep[r[C.PREP]],
        refCod: String(D.ref[r[C.REF]][0]), refNome: D.ref[r[C.REF]][1], cor: D.cor[r[C.COR]] };
      if (tipo !== 'faturado' && r[C.CART] > 0 && noPeriodo(r[C.PREV])) fatos.push({ ...base, m: 'cart', qt: r[C.CART], dia: r[C.PREV] });
      if (tipo !== 'carteira' && r[C.FAT] > 0) {
        const d = r[C.DFAT] >= 0 ? r[C.DFAT] : r[C.PREV];
        if (noPeriodo(d)) fatos.push({ ...base, m: 'fat', qt: r[C.FAT], dia: d });
      }
    }
  }

  // As colunas de número de cada tipo, na ordem em que aparecem.
  const MEDIDAS = {
    carteira: [['Carteira', f => f.m === 'cart']],
    faturado: [['Faturado', f => f.m === 'fat']],
    pedidos: [['Carteira', f => f.m === 'cart'], ['Faturado', f => f.m === 'fat'], ['Total', () => true]],
    entradas: [['Pares', () => true]],
    saidas: [['Faturou', f => f.m === 'fat'], ['Sem nota (transf.)', f => f.m === 'trf'], ['A confirmar', f => f.m === 'chk'], ['Total', () => true]],
  }[tipo];
  const somaDe = lista => MEDIDAS.map(([, ok]) => lista.reduce((s, f) => s + (ok(f) ? f.qt : 0), 0));
  const tot = somaDe(fatos);
  const totPares = tot[tot.length - 1];
  const nClis = new Set(fatos.map(f => f.cliCod)).size;
  const nEnc = new Set(fatos.map(f => f.cliCod + '|' + f.gci)).size;
  const movimento = tipo === 'entradas' || tipo === 'saidas';
  let resumo;
  if (!fatos.length) resumo = 'Nenhum par encontrado com esses filtros.';
  else if (tipo === 'pedidos') resumo = `${fmt(tot[0])} pares em carteira · ${fmt(tot[1])} faturados · ${fmt(tot[2])} no total`;
  else if (tipo === 'saidas') resumo = `${fmt(totPares)} pares saíram · ${fmt(nEnc)} encomendas · ${fmt(nClis)} clientes (faturou ${fmt(tot[0])} · sem nota ${fmt(tot[1])} · a confirmar ${fmt(tot[2])})`;
  else if (tipo === 'entradas') resumo = `${fmt(totPares)} pares entraram · ${fmt(nEnc)} encomendas · ${fmt(nClis)} clientes`;
  else resumo = `${fmt(totPares)} pares ${tipo === 'carteira' ? 'em carteira' : 'faturados'} · ${fmt(nClis)} cliente${nClis === 1 ? '' : 's'}`;

  const AGRUPAR = ['cliente', 'produto', 'produto_cor', 'mes', 'dia', 'vendedor', 'nenhum'];
  let agrupar = AGRUPAR.includes(q.agrupar) ? q.agrupar : null;
  const automatico = !agrupar;
  if (!agrupar) agrupar = sCli ? 'produto_cor' : 'cliente';
  if (agrupar === 'vendedor' && !mostraVend) agrupar = 'cliente';
  const res = { entendi, tipo, agrupar, resumo, aviso, rows: [], cols: [], num: [], data: [] };
  if (agrupar === 'nenhum' || !fatos.length) return res;

  const ROT = {
    cliente: f => [f.cliNome, f.cliCod, ...(mostraVend ? [f.prep] : [])],
    produto: f => [f.refNome, f.refCod], produto_cor: f => [f.refNome, f.refCod, f.cor],
    mes: f => [mesDe(f.dia)], dia: f => [dataDe(f.dia)], vendedor: f => [f.prep],
  }[agrupar];
  const CAB = {
    cliente: ['Cliente', 'Código', ...(mostraVend ? ['Vendedor'] : [])], produto: ['Produto', 'Referência'],
    produto_cor: ['Produto', 'Referência', 'Cor'], mes: ['Mês'], dia: ['Dia'], vendedor: ['Vendedor'],
  }[agrupar];
  const grupos = new Map();
  for (const f of fatos) {
    const rot = ROT(f), k = rot.join('|');
    let g = grupos.get(k);
    if (!g) grupos.set(k, g = { rot, dia: f.dia, lista: [] });
    g.lista.push(f); if (f.dia < g.dia) g.dia = f.dia;
  }
  // Contagem de clientes onde ela diz algo; de encomendas no movimento.
  // Com um cliente só, "Clientes" daria sempre 1: a coluna sai.
  const semConta = agrupar === 'cliente' ? !movimento : (!movimento && sCli && sCli.size);
  const extra = semConta ? [] : [movimento ? 'Encomendas' : 'Clientes'];
  const conta = g => semConta ? []
    : movimento ? [new Set(g.lista.map(f => f.cliCod + '|' + f.gci)).size] : [new Set(g.lista.map(f => f.cliCod)).size];
  res.cols = [...CAB, ...extra, ...MEDIDAS.map(([n]) => n)];
  const cronologico = agrupar === 'mes' || agrupar === 'dia';
  let rows = [...grupos.values()].map(g => {
    const s = somaDe(g.lista);
    return { v: [...g.rot, ...conta(g), ...s], ord: cronologico ? -g.dia : s[s.length - 1] };
  }).sort((a, b) => b.ord - a.ord);

  // Lista grande sem ter pedido o jeito de agrupar: pergunta antes.
  if (automatico && !q._grande && rows.length > 300) return { ...res, grande: rows.length };
  if (q.limite > 0) { rows = rows.slice(0, q.limite); res.resumo += ` · mostrando os ${rows.length} maiores`; }
  // Linha de total só quando a tabela traz tudo: no "top 10" ela somaria o que não aparece.
  res.rows = rows.map(x => x.v);
  res.num = res.cols.map((_, j) => j).filter(j => j >= CAB.length);
  if (!(q.limite > 0)) res.totais = res.cols.map((_, j) => j === 0 ? 'Total' : j >= res.cols.length - MEDIDAS.length ? tot[j - (res.cols.length - MEDIDAS.length)] : '');
  return res;
}

/* ── tela ─────────────────────────────────────────────── */
function rolar() { const m = $('main'); m.scrollTop = m.scrollHeight; }

function addMsg(quem, html) {
  const d = document.createElement('div');
  d.className = 'msg ' + quem;
  // A hora mora num atributo: as respostas trocam o conteúdo do balão
  // (innerHTML) e ela continua lá, desenhada pelo ::after.
  const agora = new Date();
  d.innerHTML = `<div class="bolha" data-hora="${String(agora.getHours()).padStart(2, '0')}:${String(agora.getMinutes()).padStart(2, '0')}">${html}</div>`;
  $('conversa').appendChild(d);
  rolar();
  return d.firstChild;
}

function tabelaHtml(res, limite) {
  const cel = (v, j) => {
    if (res.data.includes(j)) return `<td>${v != null && v >= 0 ? dataDe(v) : ''}</td>`;
    if (res.num.includes(j)) return `<td class="n">${fmt(v)}</td>`;
    return `<td class="${j === 0 ? 'nome' : ''}">${esc(v)}</td>`;
  };
  const corpo = res.rows.slice(0, limite).map(r => `<tr>${r.map(cel).join('')}</tr>`).join('');
  const tot = res.totais ? `<tr class="total">${res.totais.map((v, j) => j === 0 ? '<td>Total</td>' : v === '' ? '<td></td>' : `<td class="n">${fmt(v)}</td>`).join('')}</tr>` : '';
  return `<div class="tabela-wrap"><table><thead><tr>${res.cols.map((c, j) => `<th class="${res.num.includes(j) ? 'n' : ''}">${esc(c)}</th>`).join('')}</tr></thead><tbody>${corpo}${limite >= res.rows.length ? tot : ''}</tbody></table></div>`;
}

/* ── planilha e PDF ────────────────────────────────────
   Mesmo desenho dos relatórios da Detalhada (RFV): título, linha de
   filtros, data de geração; no PDF, cabeçalho verde-água e rodapé com a
   página. As bibliotecas só carregam quando alguém pede o arquivo. */
const textoPlano = html => { const d = document.createElement('div'); d.innerHTML = html; return d.textContent; };

function carregarScript(src) {
  return new Promise((ok, nao) => {
    const t = document.createElement('script');
    t.src = src; t.onload = ok; t.onerror = nao;
    document.head.appendChild(t);
  });
}

function dadosExport(res) {
  const titulo = textoPlano(res.entendi[0]);
  const filtros = res.entendi.slice(1).map(textoPlano).join(' · ');
  const corpo = res.rows.map(r => r.map((v, j) => res.data.includes(j) ? (v != null && v >= 0 ? dataDe(v) : '') : v));
  if (res.totais) corpo.push(res.totais);
  const quando = new Date().toLocaleString('pt-BR');
  const nome = `Assistente - ${titulo.replace(/[()]/g, '')} - ${hojeIso().split('-').reverse().join('-')}`.replace(/[\\/:*?"<>|]/g, '');
  return { titulo, filtros, corpo, quando, nome, linhas: res.rows.length };
}

async function baixarXlsx(res) {
  if (typeof XLSX === 'undefined') await carregarScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js');
  const x = dadosExport(res);
  const aoa = [[x.titulo], [x.filtros || 'Sem filtros'], [`${fmt(x.linhas)} linha(s) · gerado em ${x.quando}`], [], res.cols, ...x.corpo];
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  const linhaCab = 4;
  ws['!cols'] = res.cols.map((c, i) => ({ wch: i === 0 ? 38 : Math.max(10, c.length + 3) }));
  ws['!autofilter'] = { ref: XLSX.utils.encode_range({ s: { r: linhaCab, c: 0 }, e: { r: linhaCab + res.rows.length, c: res.cols.length - 1 } }) };
  for (let r = 0; r < x.corpo.length; r++) for (const c of res.num) {
    const cel = ws[XLSX.utils.encode_cell({ r: linhaCab + 1 + r, c })];
    if (cel && typeof cel.v === 'number') cel.z = '#,##0';
  }
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Assistente');
  XLSX.writeFile(wb, x.nome + '.xlsx');
}

async function baixarPdf(res) {
  const pronto = () => window.jspdf && window.jspdf.jsPDF && typeof window.jspdf.jsPDF.API.autoTable === 'function';
  if (!pronto()) {
    await carregarScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    await carregarScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js');
  }
  const x = dadosExport(res);
  const doc = new window.jspdf.jsPDF({ orientation: res.cols.length > 4 ? 'landscape' : 'portrait', unit: 'pt', format: 'a4' });
  doc.setFont('helvetica', 'bold'); doc.setFontSize(13); doc.setTextColor(15, 118, 110);
  doc.text(x.titulo, 24, 34);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(110, 116, 110);
  doc.text(doc.splitTextToSize(x.filtros || 'Sem filtros', doc.internal.pageSize.getWidth() - 48), 24, 48);
  doc.text(`${fmt(x.linhas)} linha(s) · ${x.quando}`, 24, 62);
  const colunas = {};
  res.cols.forEach((_, j) => { colunas[j] = { halign: res.num.includes(j) ? 'right' : 'left' }; });
  doc.autoTable({
    head: [res.cols],
    body: x.corpo.map(l => l.map((v, j) => typeof v === 'number' && res.num.includes(j) ? fmt(v) : v)),
    startY: 72, theme: 'grid',
    styles: { font: 'helvetica', fontSize: 8, cellPadding: 3, lineColor: [214, 222, 219], lineWidth: 0.4, textColor: [40, 46, 42] },
    headStyles: { fillColor: [15, 118, 110], textColor: 255 },
    alternateRowStyles: { fillColor: [244, 250, 248] },
    columnStyles: colunas,
    margin: { left: 24, right: 24, bottom: 28 },
    didParseCell: d => { if (res.totais && d.section === 'body' && d.row.index === x.corpo.length - 1) d.cell.styles.fontStyle = 'bold'; },
    didDrawPage: () => {
      const alt = doc.internal.pageSize.getHeight(), larg = doc.internal.pageSize.getWidth();
      doc.setFontSize(7); doc.setTextColor(150, 156, 150);
      doc.text('CMS Representações · Detalhada', 24, alt - 14);
      doc.text('página ' + doc.internal.getNumberOfPages(), larg - 24, alt - 14, { align: 'right' });
    },
  });
  doc.save(x.nome + '.pdf');
}

async function baixar(botao, res, formato) {
  const rot = botao ? botao.textContent : '';
  if (botao) { botao.disabled = true; botao.textContent = 'Gerando…'; }
  try { await (formato === 'pdf' ? baixarPdf(res) : baixarXlsx(res)); }
  catch (e) { addMsg('ia', `<span class="aviso">Não consegui gerar o ${formato === 'pdf' ? 'PDF' : 'Excel'} (${esc(e.message || e)}).</span>`); }
  finally { if (botao) { botao.disabled = false; botao.textContent = rot; } }
}

function mostrarResposta(bolha, res, q) {
  let h = res.entendi ? `<div class="entendi">Entendi: ${res.entendi.join(' · ')}</div>` : '';
  if (res.escolha) {
    const e = res.escolha;
    h += `<div>Qual ${esc(e.rotulo)} você quis dizer com “${esc(e.termo)}”?</div><div class="acoes">` +
      e.opcoes.map((o, i) => `<button class="sug" data-escolha="${i}">${esc(o)}</button>`).join('') +
      (e.todos ? `<button class="btn-sec" data-escolha="todos">Todos esses</button>` : '') + '</div>';
    bolha.innerHTML = h;
    bolha.addEventListener('click', ev => {
      const b = ev.target.closest('[data-escolha]');
      if (!b || bolha.dataset.escolhido) return;
      bolha.dataset.escolhido = '1';
      bolha.querySelectorAll('[data-escolha]').forEach(x => { x.disabled = true; });
      const todos = b.dataset.escolha === 'todos';
      const q2 = todos ? { ...q, _todos: { ...(q._todos || {}), [e.campo]: true } }
                       : { ...q, _exato: { ...(q._exato || {}), [e.campo]: e.opcoes[Number(b.dataset.escolha)] } };
      responderLocal(todos ? 'Todos esses' : e.opcoes[Number(b.dataset.escolha)], q2);
    });
    return;
  }
  if (res.grande) {
    // Lista enorme sem ter pedido o jeito de ver: pergunta antes de despejar.
    const opcoes = [['Por cliente', { agrupar: 'cliente' }], ['Por produto', { agrupar: 'produto' }],
                    ['Só o total', { agrupar: 'nenhum' }], [`Mostrar as ${fmt(res.grande)} linhas`, { _grande: true }]]
      .filter(([, d]) => d.agrupar !== res.agrupar);
    bolha.innerHTML = h + `<div>Deu ${fmt(res.grande)} linhas. Como você quer ver?</div><div class="acoes">` +
      opcoes.map(([rot], i) => `<button class="sug" data-grande="${i}">${esc(rot)}</button>`).join('') + '</div>';
    bolha.addEventListener('click', ev => {
      const b = ev.target.closest('[data-grande]');
      if (!b || bolha.dataset.escolhido) return;
      bolha.dataset.escolhido = '1';
      const [rot, delta] = opcoes[Number(b.dataset.grande)];
      responderLocal(rot, emendar(q, delta));
    });
    return;
  }
  if (res.catalogo) {
    // Abrir a outra aba precisa do toque do vendedor (o celular bloqueia
    // aba aberta sozinha), e o toque serve também de confirmação.
    const c = res.catalogo;
    const link = (gerar, fotos) => DETALHADA_URL + '?' + new URLSearchParams({ cliente: c.cods.join(','), gerar, ...(fotos == null ? {} : { fotos: fotos ? '1' : '0' }) });
    const btn = (gerar, fotos, rot) => `<a class="sug" target="_blank" rel="noopener" href="${esc(link(gerar, fotos))}">${rot}</a>`;
    let botoes;
    if (c.formato === 'pdf') botoes = btn('pdf', null, 'Gerar PDF na Detalhada');
    else if (c.formato === 'xlsx' && c.imagens != null) botoes = btn('xlsx', c.imagens, `Gerar Excel ${c.imagens ? 'com' : 'sem'} imagens na Detalhada`);
    else botoes = (c.formato ? '' : btn('pdf', null, 'PDF')) + btn('xlsx', true, 'Excel com imagens') + btn('xlsx', false, 'Excel sem imagens');
    const pergunta = c.formato === 'pdf' || (c.formato === 'xlsx' && c.imagens != null)
      ? `O catálogo de <b>${esc(c.nome)}</b> sai pela Detalhada, igual ao botão de lá. Toque para gerar:`
      : `Em que formato vai o catálogo de <b>${esc(c.nome)}</b>?`;
    const varios = c.cods.length > 1 ? `<div class="digitando" style="margin-top:6px">São ${c.cods.length} códigos com esse nome: se mais de um tiver carteira, a Detalhada pergunta se junta num arquivo só ou separa.</div>` : '';
    bolha.innerHTML = h + `<div>${pergunta}</div><div class="acoes">${botoes}</div>${varios}`;
    return;
  }
  if (res.erro) { bolha.innerHTML = h + `<div>${esc(res.erro)}</div>`; return; }
  h += `<div class="resumo">${esc(res.resumo)}</div>`;
  if (res.aviso) h += `<div class="digitando" style="margin:-4px 0 8px">${esc(res.aviso)}</div>`;
  if (res.rows.length) {
    h += `<div class="tab">${tabelaHtml(res, MOSTRAR)}</div><div class="acoes">`;
    if (res.rows.length > MOSTRAR) h += `<button class="btn-sec" data-acao="todas">Ver todas (${fmt(res.rows.length)})</button>`;
    h += `<button class="btn-sec" data-acao="xlsx">Baixar Excel</button><button class="btn-sec" data-acao="pdf">Baixar PDF</button>`;
    h += `<button class="btn-sec" data-acao="copiar">Copiar tabela</button></div>`;
  }
  // Ajustes de um toque: não passam pela IA, então não erram.
  const ajs = ajustes(res);
  if (ajs.length) h += `<div class="ajustes">${ajs.map(([rot], i) => `<button class="aj" data-ajuste="${i}">${esc(rot)}</button>`).join('')}</div>`;
  bolha.innerHTML = h;
  bolha.addEventListener('click', e => {
    const aj = e.target.closest('[data-ajuste]');
    if (aj) { const [rot, delta] = ajs[Number(aj.dataset.ajuste)]; responderLocal(rot, emendar(q, delta)); return; }
    const a = e.target.closest('[data-acao]');
    if (!a) return;
    if (a.dataset.acao === 'todas') { bolha.querySelector('.tab').innerHTML = tabelaHtml(res, Infinity); a.remove(); }
    if (a.dataset.acao === 'xlsx' || a.dataset.acao === 'pdf') baixar(a, res, a.dataset.acao);
    if (a.dataset.acao === 'copiar') {
      const tsv = [res.cols, ...res.rows.map(r => r.map((v, j) => res.data.includes(j) ? (v >= 0 ? dataDe(v) : '') : v))].map(r => r.join('\t')).join('\n');
      navigator.clipboard.writeText(tsv).then(() => { a.textContent = 'Copiado ✓'; setTimeout(() => a.textContent = 'Copiar tabela', 1800); });
    }
  });
  // Pediu o arquivo na pergunta ("me manda em Excel…"): já baixa.
  if (res.rows.length && (q.formato === 'xlsx' || q.formato === 'pdf')) {
    baixar(bolha.querySelector(`[data-acao="${q.formato}"]`), res, q.formato);
  }
}

/* ── conversa que emenda ──────────────────────────────── */
// O que vai para a IA e para o histórico: sem os campos internos (_exato…)
// e sem o formato, que vale só para a resposta em que foi pedido.
const limpa = q => Object.fromEntries(Object.entries(q || {}).filter(([k, v]) =>
  !k.startsWith('_') && v != null && k !== 'formato' && k !== 'continua' && k !== 'limpar'));

// Junta a consulta na tela com só o que mudou. Campo trocado perde a escolha
// feita antes ("você quis dizer…"), senão o cliente novo viraria o antigo.
function emendar(base, delta) {
  const q = { ...base };
  delete q.formato; delete q._grande;
  const ex = { ...(q._exato || {}) }, td = { ...(q._todos || {}) };
  for (const [k, v] of Object.entries(delta)) {
    if (k === 'continua' || k === 'limpar' || v == null) continue;
    q[k] = v; delete ex[k]; delete td[k];
  }
  for (const k of (Array.isArray(delta.limpar) ? delta.limpar : [])) { delete q[k]; delete ex[k]; delete td[k]; }
  q._exato = ex; q._todos = td;
  return q;
}

// Botões embaixo da resposta: trocar a medida e o jeito de agrupar.
function ajustes(res) {
  const t = res.tipo, out = [];
  if (!t) return out;
  if (t === 'carteira') out.push(['+ faturado', { tipo: 'pedidos' }]);
  if (t === 'faturado') out.push(['+ carteira', { tipo: 'pedidos' }]);
  if (t === 'pedidos') out.push(['só carteira', { tipo: 'carteira' }], ['só faturado', { tipo: 'faturado' }]);
  if (t === 'entradas') out.push(['ver as saídas', { tipo: 'saidas' }]);
  if (t === 'saidas') out.push(['ver as entradas', { tipo: 'entradas' }]);
  const mov = t === 'entradas' || t === 'saidas';
  [['por cliente', 'cliente'], ['por produto', 'produto'], ['por cor', 'produto_cor'], mov ? ['por dia', 'dia'] : ['por mês', 'mes'],
   ...(APP.veTudo && prepAtivo() < 0 ? [['por vendedor', 'vendedor']] : []), ['só o total', 'nenhum']]
    .forEach(([rot, a]) => { if (a !== res.agrupar) out.push([rot, { agrupar: a }]); });
  return out;
}

function registrar(texto, q, res) {
  if (res.pede || res.escolha || res.grande || res.erro) return;
  APP.atual = q;
  APP.anteriores.push({ p: texto, c: limpa(q) });
  APP.anteriores = APP.anteriores.slice(-3);
}

// Resposta montada aqui mesmo, sem IA: botão de ajuste, "você quis dizer",
// escolha de como ver uma lista grande.
function responderLocal(rotulo, q) {
  APP.pendente = null;
  addMsg('eu', esc(rotulo));
  const res = executar(q);
  mostrarResposta(addMsg('ia', ''), res, q);
  registrar(rotulo, q, res);
  rolar();
}

async function perguntar(texto) {
  texto = texto.trim();
  if (!texto) return;
  addMsg('eu', esc(texto));
  const bolha = addMsg('ia', '<span class="digitando">Pensando…</span>');
  $('enviar').disabled = true;
  // Resposta curta logo depois de uma pergunta do assistente ("De qual
  // produto?") completa a pergunta anterior; frase longa é pergunta nova.
  const enviada = APP.pendente && texto.split(/\s+/).length <= 6 ? `${APP.pendente} (complemento: ${texto})` : texto;
  APP.pendente = null;
  try {
    const p = prepAtivo();
    const r = await chamarWorker('chatDetalhada', {
      pergunta: enviada, hoje: hojeIso(), linhas: APP.dic.faixa || [],
      vendedores: APP.veTudo && p < 0 ? APP.dic.prep : [], anteriores: APP.anteriores,
      atual: APP.atual ? limpa(APP.atual) : null,
    }, 30000);
    if (!r || !r.ok) throw new Error(r?.erro || 'sem resposta');
    const c = r.consulta || {};
    const q = c.continua && APP.atual ? emendar(APP.atual, c) : c;
    const res = executar(q);
    mostrarResposta(bolha, res, q);
    if (res.pede || res.escolha) APP.pendente = enviada;
    registrar(enviada, q, res);
  } catch (e) {
    bolha.innerHTML = `<span class="aviso">Não consegui responder agora (${esc(e.message || e)}). Tente de novo em instantes.</span>`;
  } finally {
    $('enviar').disabled = false;
    rolar();
  }
}

async function iniciar() {
  APP.sessao = lerSessao();
  if (!APP.sessao) {
    $('conversa').innerHTML = '<div class="bloqueio"><h2>Entre pelo Portal</h2><p>O assistente usa o login do Portal do Vendedor.</p></div>';
    $('quem').textContent = 'Sem login';
    return;
  }
  if (SO_DEV && norm(APP.sessao.nome) !== 'MARCOS (DEV)') {
    $('conversa').innerHTML = '<div class="bloqueio"><h2>Em desenvolvimento</h2><p>O assistente ainda não foi liberado para a equipe.</p></div>';
    $('quem').textContent = APP.sessao.nome;
    return;
  }
  APP.veTudo = MANDA_EM_TUDO.includes(norm(APP.sessao.nome));
  $('quem').textContent = 'Carregando a base…';
  const base = await carregarBase();
  if (!base) { $('quem').textContent = 'Não foi possível carregar a base'; return; }
  APP.base = base; APP.dic = base.dic; APP.L = base.l;

  if (APP.veTudo) {
    $('verComo').innerHTML = '<option value="">Todos os vendedores</option>' +
      APP.dic.prep.map((p, i) => `<option value="${i}">${esc(p)}</option>`).join('');
    $('verComoWrap').hidden = false;
    $('verComo').addEventListener('change', () => { APP.anteriores = []; APP.atual = null; });
  } else {
    APP.prep = acharPreposto(APP.sessao.nome);
    if (APP.prep < 0) { $('quem').textContent = `Nenhuma linha de ${APP.sessao.nome} na base`; return; }
  }
  $('quem').textContent = APP.veTudo ? APP.sessao.nome : `Carteira de ${APP.dic.prep[APP.prep]}`;
  $('baseInfo').textContent = `Base da Detalhada de ${new Date(base.gerado || base.publicadoEm).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' })} · as respostas podem errar: confira o “Entendi”.`;
  $('pergunta').disabled = false; $('enviar').disabled = false;
  $('pergunta').focus();
}

$('form').addEventListener('submit', e => { e.preventDefault(); const t = $('pergunta'); const v = t.value; t.value = ''; t.style.height = ''; perguntar(v); });
$('pergunta').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('form').requestSubmit(); } });
$('pergunta').addEventListener('input', e => { const t = e.target; t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 120) + 'px'; });
iniciar();
</script>
