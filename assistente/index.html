    lista.slice(0, 15).map(x => `${x.nome} (${x.cod})${x.cidade ? ', ' + x.cidade : ''}: ${fmt(x.pares)} pares no 1º semestre, parado há ${fmtDias(x.dias)}; oferecer ${x.ofertas.slice(0, 2).map(o => `${o.o.nome} ${o.o.cor}${o.rep ? ' (repasse ' + fmt(o.rep) + ')' : ''}`).join(' e ')}`).join('\n') +
    (lista.length > 15 ? `\n(e mais ${lista.length - 15} na tabela)` : '') +
    '\nA tabela já apareceu: não copie. Diga quantos são, destaque os 3 maiores e o que oferecer a cada um (repasse primeiro), e diga que ele pode perguntar de um cliente para ver tudo o que oferecer.' };
}

/* rfv: o RFV da Detalhada (apps-oly-v2/detalhada, rfvApurar/rfvAgrupar), no chat. Quem comprou em cada
   semestre. 1º semestre = faturou até junho; 2º = faturou de julho em diante OU tem pedido em carteira
   (qualquer previsão: é venda que vai acontecer) OU repasse com previsão no semestre esperando a fábrica.
   Portas da mesma rede somam numa linha: basta uma ter comprado. Os filtros de produto (marca, faixa,
   produto, cor) não tiram ninguém da carteira: quem não comprou aquilo fica zerado, que é a resposta
   que se procura ("quem não comprou chinelo no 2º semestre"). */
const RFV_SIT = { dois: 'Comprou nos dois semestres', so1: 'Comprou só no 1º semestre', so2: 'Comprou só no 2º semestre (novo)', sem2: 'Sem compra no 2º semestre' };
async function agRfv(a) {
  const D = APP.dic, X = indices();
  // De quem: o vendedor só a carteira dele; quem vê tudo escolhe (ou vê o time).
  let p = prepAtivo();
  if (APP.veTudo && !a.vendedor && a.frase) {
    const ws = new Set(norm(a.frase).split(/[^A-Z]+/)), i = D.prep.findIndex(x => ws.has(norm(x).split(/\s+/)[0]));
    if (i >= 0) { a = { ...a, vendedor: D.prep[i] }; if (a.cliente && norm(a.cliente) === norm(D.prep[i]).split(/\s+/)[0]) delete a.cliente; }
  }
  if (APP.veTudo && a.vendedor && !/^(cms|todos|time|equipe)$/i.test(String(a.vendedor).trim())) {
    const t = norm(a.vendedor).split(/\s+/)[0], i = D.prep.findIndex(x => norm(x).split(/\s+/)[0] === t || norm(x).includes(t));
    if (i < 0) return { erro: `Não achei o vendedor "${a.vendedor}".` };
    p = i;
  }
  // O recorte de produto.
  const filtros = [], um = v => Array.isArray(v) ? v[0] : v;
  let fRef = null, fCor = null, fFx = null, fMarca = '';
  if (um(a.produto)) { const r = agFiltro(X.ref, String(um(a.produto)), 'produto', i => D.ref[i][1] || D.ref[i][0]); if (r.erro) return { erro: r.erro }; fRef = r.set; filtros.push(r.texto); }
  if (um(a.cor)) { const r = agFiltro(X.cor, String(um(a.cor)), 'cor', i => D.cor[i]); if (r.erro) return { erro: r.erro }; fCor = r.set; filtros.push(r.texto); }
  if (um(a.linha)) { const r = agFiltro(X.faixa, String(um(a.linha)), 'linha', i => D.faixa[i]); if (r.erro) return { erro: r.erro }; fFx = r.set; filtros.push(r.texto); }
  if (um(a.marca)) { fMarca = /ua|under/i.test(String(um(a.marca))) ? 'UA' : 'OLY'; filtros.push('marca: ' + (fMarca === 'UA' ? 'Under Armour' : 'Olympikus')); }
  const marcaDe = r => /UA|UNDER/i.test(String((D.marca || [])[r[C.MARCA]] || '')) ? 'UA' : 'OLY';
  // O corte: julho do ano mais recente da base.
  let ultDia = -1;
  for (const r of APP.L) { if (r[C.FAT] && r[C.DFAT] > ultDia) ultDia = r[C.DFAT]; if (r[C.CART] && r[C.PREV] > ultDia) ultDia = r[C.PREV]; }
  const ano = new Date(Math.max(ultDia, 0) * 864e5).getUTCFullYear(), corte = Math.floor(Date.UTC(ano, 6, 1) / 864e5);
  const porCli = new Map();
  for (const r of APP.L) {
    if (p >= 0 && r[C.PREP] !== p) continue;
    const q = (r[C.CART] || 0) + (r[C.FAT] || 0);
    const fora = (fMarca && marcaDe(r) !== fMarca) || (fFx && !fFx.has(r[C.FAIXA])) || (fRef && !fRef.has(r[C.REF])) || (fCor && !fCor.has(r[C.COR]));
    if (fora && !q) continue;
    let e = porCli.get(r[C.CLI]);
    if (!e) { e = { p1: 0, f2: 0, car: 0, ult: -1, prep: new Map() }; porCli.set(r[C.CLI], e); }
    if (q) e.prep.set(r[C.PREP], (e.prep.get(r[C.PREP]) || 0) + q);
    if (fora) continue;
    if (r[C.FAT] && r[C.DFAT] >= 0) { if (r[C.DFAT] < corte) e.p1 += r[C.FAT]; else e.f2 += r[C.FAT]; if (r[C.DFAT] > e.ult) e.ult = r[C.DFAT]; }
    if (r[C.CART] && r[C.PREV] >= 0) e.car += r[C.CART];
  }
  // Repasse esperando a fábrica, com previsão no 2º semestre.
  const rep2 = new Set();
  try { for (const it of await baseRepasses()) { const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(it.prevFat); if (m && (+m[3] > ano || (+m[3] === ano && +m[2] >= 7))) rep2.add(String(it.cliCod)); } } catch (e) {}
  // A rede: o mesmo nome fantasia em dois ou mais códigos.
  const porNome = new Map();
  D.cli.forEach(([, nome]) => { const k = norm(nome); if (k) porNome.set(k, (porNome.get(k) || 0) + 1); });
  const grupos = new Map();
  for (const [ci, e] of porCli) {
    const k = norm(D.cli[ci][1]), ch = porNome.get(k) > 1 ? 'r:' + k : 'c:' + ci;
    let g = grupos.get(ch);
    if (!g) grupos.set(ch, g = { rede: ch[0] === 'r', portas: [], p1: 0, f2: 0, car: 0, ult: -1, prep: new Map(), rep: false });
    const porta = { ci, cod: String(D.cli[ci][0]), nome: D.cli[ci][1], ...e, rep: rep2.has(String(D.cli[ci][0])) };
    g.portas.push(porta); g.p1 += e.p1; g.f2 += e.f2; g.car += e.car; g.rep = g.rep || porta.rep;
    if (e.ult > g.ult) g.ult = e.ult;
    for (const [k2, v] of e.prep) g.prep.set(k2, (g.prep.get(k2) || 0) + v);
  }
  const comprou2 = x => x.f2 + x.car > 0 || x.rep;
  const lista = [...grupos.values()].map(g => {
    g.portas.sort((x, y) => (y.p1 + y.f2 + y.car) - (x.p1 + x.f2 + x.car));
    const pt = g.portas[0], v = [...g.prep.entries()].sort((x, y) => y[1] - x[1])[0];
    g.cod = pt.cod; g.nome = pt.nome; g.ci = pt.ci; g.p2 = g.f2 + g.car; g.total = g.p1 + g.p2; g.vend = v ? D.prep[v[0]] : '';
    g.sit = g.p1 > 0 && comprou2(g) ? 'dois' : g.p1 > 0 ? 'so1' : comprou2(g) ? 'so2' : 'nada';
    return g;
  });
  const total = lista.length, compraram = lista.filter(comprou2).length, sem = total - compraram;
  const pct = n => total ? Math.round(100 * n / total) + '%' : '—';
  const dataDe = d => d < 0 ? '' : new Date(d * 864e5).toISOString().slice(0, 10).split('-').reverse().join('/');
  const quem = p >= 0 ? D.prep[p] : 'o time', rec = filtros.length ? ` (${filtros.join('; ')})` : '';
  const placar = `${quem}${rec}, ${ano}: ${fmt(total)} clientes ativos; ${fmt(compraram)} compraram no 2º semestre (${pct(compraram)}); ${fmt(sem)} sem compra no 2º semestre (${pct(sem)}). Comprar no 2º = nota de julho em diante, pedido em carteira ou repasse esperando a fábrica; rede conta como um cliente.`;
  // Um cliente só.
  if (a.cliente) {
    const f = agFiltroPed(X.cli.filter(x => porCli.has(x.i)), String(a.cliente), 'cliente', i => D.cli[i][1]);
    if (f.erro) return { erro: f.erro };
    const g = lista.find(x => x.portas.some(pt => f.set.has(pt.ci)));
    if (!g) return { texto: `${f.texto}: não tem compra${rec} na base deste ano.` };
    const varia = g.p1 ? Math.round((g.p2 - g.p1) / g.p1 * 100) : null;
    const res = g.rede ? { entendi: ['<b>RFV</b>', esc(g.nome), 'porta a porta'], cols: ['Loja', '1º sem.', '2º sem. faturado', 'Carteira', 'Último faturamento'], num: [1, 2, 3], data: [], totais: null, resumo: '',
      rows: g.portas.map(pt => [`${pt.nome} (${pt.cod})`, pt.p1, pt.f2, pt.car, dataDe(pt.ult)]) } : undefined;
    return { res, texto: `RFV de ${g.nome} (${g.cod})${g.rede ? `, rede com ${g.portas.length} lojas` : ''}${rec}: ${RFV_SIT[g.sit] || 'sem compra nos dois semestres'}.\n` +
      `1º semestre: ${fmt(g.p1)} pares faturados. 2º semestre: ${fmt(g.p2)} pares (${fmt(g.f2)} faturados + ${fmt(g.car)} em carteira)${g.rep ? ', e tem repasse esperando a fábrica' : ''}.` +
      (varia != null ? ` Variação do 2º sobre o 1º: ${varia > 0 ? '+' : ''}${varia}%.` : '') + (g.ult >= 0 ? ` Último faturamento: ${dataDe(g.ult)}.` : '') +
      (g.rede ? `\nPortas paradas (sem compra no 2º): ${g.portas.filter(pt => pt.p1 > 0 && !comprou2(pt)).map(pt => pt.nome + ' ' + pt.cod).join(', ') || 'nenhuma'}. A tabela porta a porta já apareceu.` : '') +
      '\nLembre que o 2º semestre ainda está em andamento se for o caso.' };
  }
  // A lista de uma situação (sem dizer qual, a de quem não comprou no 2º).
  const sit = ['dois', 'so1', 'so2', 'sem2'].includes(a.situacao) ? a.situacao : 'sem2';
  const sel = lista.filter(g => sit === 'sem2' ? !comprou2(g) : g.sit === sit).sort((x, y) => y.total - x.total || y.p1 - x.p1);
  const res = { entendi: ['<b>RFV</b>', esc(RFV_SIT[sit]), esc(quem), ...filtros.map(esc)],
    cols: ['Cliente', 'Vendedor', '1º sem.', '2º sem.', 'Carteira', 'Último faturamento'], num: [2, 3, 4], data: [], totais: null, resumo: '',
    rows: sel.map(g => [`${g.nome} (${g.cod})${g.rede ? ` · rede, ${g.portas.length} lojas` : ''}`, g.vend, g.p1, g.p2, g.car, dataDe(g.ult)]),
    oculta: p >= 0 ? [1] : [] };
  if (!sel.length) return { texto: `${placar}\nNinguém em "${RFV_SIT[sit]}".` };
  return { res, texto: `${placar}\nLista "${RFV_SIT[sit]}": ${fmt(sel.length)} cliente(s). Os maiores:\n` +
    sel.slice(0, 12).map(g => `${g.nome} (${g.cod})${p < 0 && g.vend ? ' · ' + g.vend : ''}: 1º sem. ${fmt(g.p1)}, 2º sem. ${fmt(g.p2)}${g.car ? ` (${fmt(g.car)} em carteira)` : ''}${g.ult >= 0 ? `, último faturamento ${dataDe(g.ult)}` : ''}`).join('\n') +
    (sel.length > 12 ? `\n(e mais ${sel.length - 12} na tabela)` : '') +
    '\nA tabela já apareceu: não copie. Dê o placar (quantos compraram e quantos não, com %), destaque os maiores da lista e lembre que o 2º semestre está em andamento.' +
    (sit === 'sem2' ? ' Se ele quiser saber o que oferecer a quem parou, a pergunta é "quem eu preciso reativar".' : '') };
}

/* problemas: as "Encomendas com problema" da Detalhada (probAtrasadas/probAdiadas), no chat.
   Atrasada = em carteira com a previsão de faturamento já vencida. Adiada = a previsão de hoje é mais
   tarde que a primeira que a encomenda teve (base.prev0, do script diário). Uma encomenda é
   cliente · GCI · referência · cor. Na tabela vai um pedido (cliente + GCI) por linha, com pares e
   previsão; ao tocar, abrem os produtos e o problema de cada um. */
async function agProblemas(a) {
  const D = APP.dic, hoje = diaDe(hojeIso()), p0 = (APP.base.prev0 && APP.base.prev0.k) || {};
  let p = prepAtivo();
  // Quem vê tudo e citou um vendedor ("pedidos com problema do Jorge").
  const doVend = t => { const w = norm(t).split(/\s+/)[0]; return D.prep.findIndex(x => norm(x).split(/\s+/)[0] === w); };
  if (APP.veTudo) {
    if (a.cliente && doVend(a.cliente) >= 0 && String(a.cliente).trim().split(/\s+/).length === 1) { a = { ...a, vendedor: a.cliente }; delete a.cliente; }
    if (!a.vendedor && a.frase) { const ws = new Set(norm(a.frase).split(/[^A-Z]+/)), i = D.prep.findIndex(x => ws.has(norm(x).split(/\s+/)[0])); if (i >= 0) a = { ...a, vendedor: D.prep[i] }; }
    if (a.vendedor && !/^(cms|todos|time|equipe)$/i.test(String(a.vendedor).trim())) { const i = doVend(a.vendedor); if (i < 0) return { erro: `Não achei o vendedor "${a.vendedor}".` }; p = i; }
  }
  let cliSet = null, rotCli = '';
  if (a.cliente) {
    const meus = indices().cli.filter(x => p < 0 || APP.L.some(r => r[C.CLI] === x.i && r[C.PREP] === p));
    const f = agFiltroPed(meus, String(a.cliente), 'cliente', i => D.cli[i][1]);
    if (f.erro) return { erro: f.erro };
    cliSet = f.set; rotCli = f.texto.replace(/\s*\[ATENÇÃO:[^\]]*\]/, '');
  }
  // As encomendas em carteira (uma por cliente · GCI · referência · cor).
  const enc = new Map();
  for (const r of APP.L) {
    if (r[C.CART] <= 0 || (p >= 0 && r[C.PREP] !== p) || (cliSet && !cliSet.has(r[C.CLI]))) continue;
    const k = [D.cli[r[C.CLI]][0], r[C.GCI], D.ref[r[C.REF]][0], D.cor[r[C.COR]]].join('|');
    const o = enc.get(k);
    if (o) { o.cart += r[C.CART]; o.prev = Math.max(o.prev, r[C.PREV]); } else enc.set(k, { k, r, cart: r[C.CART], prev: r[C.PREV] });
  }
  const tipo = /adi|prorrog/i.test(String(a.tipo || '')) ? 'adi' : /atras|venc/i.test(String(a.tipo || '')) ? 'atr' : '';
  const itens = [];
  for (const e of enc.values()) {
    const atr = e.prev >= 0 && e.prev < hoje, adi = p0[e.k] != null && e.prev > p0[e.k];
    if ((atr && tipo !== 'adi') || (adi && tipo !== 'atr')) itens.push({ ...e, atr: atr ? hoje - e.prev : 0, adi: adi ? e.prev - p0[e.k] : 0, era: adi ? p0[e.k] : null });
  }
  const min = Number(a.dias) || 0;
  const sel = min ? itens.filter(e => Math.max(e.atr, e.adi) >= min) : itens;
  const dataDe = d => d < 0 || d == null ? '' : new Date(d * 864e5).toISOString().slice(0, 10).split('-').reverse().join('/');
  const quem = rotCli || (p >= 0 ? D.prep[p] : 'o time');
  if (!sel.length) return { texto: `${quem}: nenhum pedido ${tipo === 'adi' ? 'com previsão adiada' : tipo === 'atr' ? 'atrasado' : 'com problema (atrasado ou com previsão adiada)'}${min ? ` há mais de ${min} dias` : ''}. Diga isso como boa notícia, em uma frase.` };
  // Um pedido por linha: cliente + GCI.
  const ped = new Map();
  for (const e of sel) {
    const k = e.r[C.CLI] + '|' + e.r[C.GCI];
    if (!ped.has(k)) ped.set(k, { cli: e.r[C.CLI], gci: e.r[C.GCI], prep: e.r[C.PREP], itens: [] });
    ped.get(k).itens.push(e);
  }
  const lista = [...ped.values()].map(g => {
    g.pares = g.itens.reduce((t, e) => t + e.cart, 0);
    g.prev = Math.min(...g.itens.map(e => e.prev));
    g.maxAtr = Math.max(...g.itens.map(e => e.atr)); g.maxAdi = Math.max(...g.itens.map(e => e.adi));
    g.itens.sort((x, y) => y.cart - x.cart);
    return g;
  }).sort((x, y) => y.maxAtr - x.maxAtr || y.maxAdi - x.maxAdi || y.pares - x.pares);
  const probTxt = e => [e.atr && `atrasado ${e.atr} dia${e.atr > 1 ? 's' : ''}`, e.adi && `adiado ${e.adi} dia${e.adi > 1 ? 's' : ''} (era ${dataDe(e.era)})`].filter(Boolean).join(' e ');
  const prodTxt = e => { const [ref, desc] = D.ref[e.r[C.REF]]; return `${desc || ref} ${D.cor[e.r[C.COR]]} (${ref}) · ${fmt(e.cart)} pares · prev. ${dataDe(e.prev)} · ${probTxt(e)}`; };
  const res = { entendi: ['<b>Pedidos com problema</b>', esc(quem), ...(tipo ? [tipo === 'atr' ? 'atrasados' : 'previsão adiada'] : []), ...(min ? [esc(`+${min} dias`)] : [])],
    cols: ['Cliente', 'GCI', 'Pares', 'Prev. fat.', 'Produtos', 'Vendedor'], num: [2], data: [], totais: null, resumo: '',
    rows: lista.map(g => [`${D.cli[g.cli][1]} (${D.cli[g.cli][0]})`, String(g.gci), g.pares, dataDe(g.prev), g.itens.map(prodTxt).join('\n'), D.prep[g.prep]]),
    oculta: [4, 5], detalhe: x => (APP.veTudo && p < 0 ? `Vendedor ${x[5]}\n` : '') + x[4],
    // No Excel e no PDF, uma linha por produto, cada informação na sua coluna.
    // O modelo é o que o Marcos formatou à mão (05/11/2026): Calibri 12 centralizado, bordas finas, sem
    // grade, cabeçalho alto e congelado, e Novo Destino e Prazo em branco para preencher.
    exportar: { cols: ['Cliente', 'Código', 'GCI', 'Artigo', 'Descrição', 'Cor', 'Pares', 'Prev. fat.', 'Situação', 'Dias atrasado', 'Novo Destino', 'Prazo'],
      num: [6, 9], larguras: [30.875, 10.875, 11.875, 12.875, 28.875, 10.875, 7.875, 11.875, 18.875, 12.875, 13, 13], formatado: true,
      rows: lista.flatMap(g => g.itens.map(e => { const [ref, desc] = D.ref[e.r[C.REF]];
        return [D.cli[g.cli][1], String(D.cli[g.cli][0]), String(g.gci), String(ref), desc || '', D.cor[e.r[C.COR]], e.cart, dataDe(e.prev),
          e.atr && e.adi ? 'Atrasado e adiado' : e.atr ? 'Atrasado' : 'Previsão adiada', e.atr || null, null, null]; })) } };
  const nAtr = sel.filter(e => e.atr).length, nAdi = sel.filter(e => e.adi).length, mais15 = sel.filter(e => e.atr > 15).length;
  const terceira = APP.veTudo && p >= 0 ? ` (quem pergunta é da CMS: fale de ${D.prep[p]} na terceira pessoa)` : '';
  return { res, texto: `Pedidos com problema ${rotCli ? 'de ' + quem : p >= 0 ? 'da carteira de ' + quem : 'do time'}${terceira}: ${lista.length} pedido(s) (GCI), ${fmt(sel.reduce((t, e) => t + e.cart, 0))} pares. Por produto: ${nAtr} atrasado(s) (previsão vencida; ${mais15} há mais de 15 dias) e ${nAdi} com a previsão adiada.\n` +
    lista.slice(0, 10).map(g => `${D.cli[g.cli][1]} · GCI ${g.gci} · ${fmt(g.pares)} pares · prev. ${dataDe(g.prev)} · ${[g.maxAtr && `atraso de até ${g.maxAtr} dias`, g.maxAdi && `adiado até ${g.maxAdi} dias`].filter(Boolean).join(', ')}`).join('\n') +
    (lista.length > 10 ? `\n(e mais ${lista.length - 10} na tabela)` : '') +
    '\nA tabela já apareceu (cliente, GCI, pares e previsão; tocando na linha abrem os produtos). Não copie: diga quantos pedidos e pares, o mais atrasado, e que ele toca na linha para ver os produtos. Atraso de poucos dias é rotina de faturamento: não alarme.' };
}

/* link_cliente: o link para o cliente, pelo chat. Os mesmos produtos do catálogo (palavras, coleção ou
   Showroom); em etapas: de onde (se não disse) → para qual cliente → o vendedor toca no cliente certo
   (é a confirmação) → o link sai com Copiar e WhatsApp. Da coleção, o link é a página do Catálogo
   (link.html, criarLink com origem "catalogo"); do Showroom, o próprio Showroom gera escondido (as
   regras de grade, lote e mês são dele). Enquanto falta o cliente, AG.linkPend guarda o pedido. */
const LINK_HORAS = 168;
function linkProdutoCatalogo(r) {
  return { k: r.codigo + '|' + r.cor, codigo: r.codigo, cor: r.cor, corCodigo: '', produto: r.produto, imagem: r.imagem, genero: r.genero,
    categoria: r.categoria, segmento: r.segmento, colecao: r.colecao, lanc: r.lanc, novaCor: r.novaCor, cont: r.cont,
    pdv: r.preco ? 'R$ ' + r.preco.toFixed(2).replace('.', ',') : '', tam: (r.tam || '').replace('/', '-') };
}
function linkShowroomPeloNexo(marca, itens, cliente, origem) {
  return new Promise(res => {
    const id = 'lk' + Date.now() + Math.random().toString(36).slice(2, 6);
    CAT_PEDIDOS.set(id, { itens, cliente });
    const frame = document.createElement('iframe');
    frame.style.cssText = 'position:fixed;left:-9999px;top:0;width:1200px;height:900px;border:0;visibility:hidden';
    const fim = r => { window.removeEventListener('message', ouve); clearTimeout(limite); CAT_PEDIDOS.delete(id); frame.remove(); res(r); };
    const ouve = ev => { const d = ev.data || {}; if (d.id === id && (d.cmsCat === 'link' || d.cmsCat === 'erro')) fim(d); };
    const limite = setTimeout(() => fim({ cmsCat: 'erro', erro: 'O Showroom demorou demais para responder.' }), 120000);
    window.addEventListener('message', ouve);
    frame.src = SHOWROOM_URL + '?' + new URLSearchParams({ marca, nexo: 'link', nexoid: id, origem: origem || 'tudo', horas: LINK_HORAS });
    document.body.appendChild(frame);
  });
}
async function agLinkCliente(a) {
  const D = APP.dic, rows = await catCarregar();
  // "…para a Degraus" é o cliente, não produto: sai da busca (a IA às vezes manda a frase inteira).
  const busca = String(a.busca || '').replace(/\s+\bpar[ao]\s+(?:o\s+|a\s+)?(?:cliente\s+)?\S.*$/i, '').trim(), texto = busca.replace(/\blinks?\b/gi, ' catálogo ');
  const q = catEntender(texto, rows);
  if (q.fonte === 'showroom' && !q.origem) q.origem = 'tudo';
  // 1) de onde
  if (!q.origem && !q.fonte && !q.colecao) {
    const r = await catPerguntaFonte(q, rows, texto);
    if (!r.cartao) return r;
    return { cartao: r.cartao.replace(/catálogo d([ao]) /g, 'link d$1 ').replace('Catálogo', 'Link para o cliente'),
      texto: 'Apareceu a pergunta de onde vêm os produtos do link: coleção ou Showroom (estoque, repasse, produção ou tudo). Peça para ele tocar numa opção; não repita os números e NÃO pergunte o cliente ainda (isso vem no passo seguinte).' };
  }
  // 2) os produtos, por marca
  const atual = [...new Set(rows.map(r => r.colecao).filter(Boolean))].sort((x, y) => catOrdemColecao(x) - catOrdemColecao(y))[0];
  let porMarca = [];
  if (q.origem) {
    let L; try { L = await baseDisponivel(); } catch (e) { return { erro: 'Não consegui ler o Showroom agora: ' + (e.message || e) }; }
    const achados = catShowroomFiltrar(q, rows, L, q.origem);
    porMarca = CAT_MARCAS.map(m => ({ m, itens: achados.filter(o => o.marca === m.id) })).filter(x => x.itens.length);
  } else {
    const col = q.colecao || atual, vistos = new Set();
    const achados = catFiltrar(rows, { ...q, colecao: col }).filter(r => { const k = r.marca + r.codigo + '|' + r.cor; if (vistos.has(k)) return false; vistos.add(k); return true; });
    porMarca = CAT_MARCAS.map(m => ({ m, itens: achados.filter(r => r.marca === m.id) })).filter(x => x.itens.length);
    q.colecao = col;
  }
  const filtro = [q.origem ? 'Showroom · ' + (q.origem === 'tudo' ? 'tudo que tem' : CAT_ORIGEM[q.origem].rot) : 'Coleção ' + q.colecao, catDescricao(q)].filter(Boolean).join(' · ');
  const total = porMarca.reduce((t, x) => t + x.itens.length, 0);
  if (!total) { AG.linkPend = null; return { erro: `Não achei produtos para o link (${filtro}). Peça para ele dizer de outro jeito.` }; }
  const frase = q.origem ? `link do showroom ${q.origem === 'tudo' ? '' : CAT_ORIGEM[q.origem].rot.toLowerCase() + ' '}${catDescricao(q)}` : `link da coleção ${q.colecao.toLowerCase()} ${catDescricao(q)}`;
  // 3) para qual cliente
  const p = prepAtivo();
  const meus = indices().cli.filter(x => p < 0 || APP.L.some(r => r[C.CLI] === x.i && r[C.PREP] === p) || (!APP.veTudo && APP.soCad?.has(x.i)));
  if (!a.codigo) {
    if (!a.cliente) {
      AG.linkPend = { busca: frase.trim() };
      return { texto: `Os produtos do link: ${total} (${filtro})${porMarca.length > 1 ? `, em ${porMarca.length} links, um por marca` : ''}. Falta o cliente: pergunte, numa frase curta, para qual cliente é o link (o nome da loja ou o código). Não liste produtos.` };
    }
    const f = agFiltroPed(meus, String(a.cliente), 'cliente', i => D.cli[i][1]);
    AG.linkPend = { busca: frase.trim() };
    if (f.erro) return { erro: f.erro };
    const cods = [...new Set([...f.set].map(i => String(D.cli[i][0])))].slice(0, 8);
    const opcoes = cods.map(cod => { const i = D.cli.findIndex(c => String(c[0]) === cod), cad = APP.cad && APP.cad.get(cod);
      return { rotulo: `${D.cli[i][1]} · ${cod}${cad && cad.cidade ? ' · ' + cad.cidade : ''}`, valor: `confirmo o link para o cliente ${cod}` }; });
    return { opcoes, texto: `Achei ${cods.length === 1 ? 'este cliente' : cods.length + ' clientes'} para "${a.cliente}": os botões já apareceram. Peça para ele tocar no cliente certo para confirmar e gerar o link (${total} produtos, ${filtro}). Não liste os nomes de novo.` };
  }
  // 4) confirmado: gera
  const cod = String(a.codigo), ci = D.cli.findIndex(c => String(c[0]) === cod);
  if (ci < 0 || !meus.some(x => x.i === ci)) return { erro: `O cliente ${cod} não está na carteira dele.` };
  const nomeCli = (APP.fantasia && APP.fantasia[cod]) || D.cli[ci][1];
  const prontos = [], falhas = [];
  for (const { m, itens } of porMarca) {
    if (q.origem) {
      const r = await linkShowroomPeloNexo(m.id, itens.map(o => o.k), cod, q.origem);
      if (r.cmsCat === 'link') prontos.push({ m, url: r.url, qtd: r.qtd || itens.length }); else falhas.push(`${m.nome}: ${r.erro}`);
    } else {
      try {
        const j = await chamarWorker('criarLink', { data: { vendedor: String(APP.sessao.codigo || ''), vendedorNome: String(APP.sessao.nome || ''), cliente: cod, clienteNome: nomeCli,
          marca: m.id, origem: 'catalogo', validadeHoras: LINK_HORAS, produtos: itens.map(linkProdutoCatalogo) } }, 30000);
        if (!j || !j.success || !j.codigo) throw new Error((j && j.erro) || 'o servidor não devolveu o link');
        prontos.push({ m, url: new URL(CATALOGO_URL + 'link.html?link=' + j.codigo, location.href).href, qtd: itens.length });
      } catch (e) { falhas.push(`${m.nome}: ${e.message || e}`); }
    }
  }
  AG.linkPend = null;
  if (!prontos.length) return { erro: 'Não consegui gerar o link agora. ' + falhas.join(' · ') };
  const cartao = `<div class="cartao-dae cartao-link"><div class="cd-tit">Link para ${esc(nomeCli)}</div>` + prontos.map(x => {
    const msg = `Olá! Separei ${x.qtd} produto${x.qtd !== 1 ? 's' : ''} da ${x.m.nome} para você. Toque em "Quero" nos que gostar e me devolva por aqui:\n${x.url}`;
    return `<div class="lk-linha"><div class="cd-l">${esc(x.m.nome)} · ${fmt(x.qtd)} produto${x.qtd !== 1 ? 's' : ''} · ${esc(filtro)} · vale 7 dias</div><div class="lk-url">${esc(x.url)}</div>` +
      `<div class="acoes"><button class="sug" data-copiar="${esc(x.url)}">Copiar</button><a class="sug forte" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(msg)}">Enviar no WhatsApp</a></div></div>`;
  }).join('') + (falhas.length ? `<div class="cd-l aviso">${esc(falhas.join(' · '))}</div>` : '') +
    `<div class="cd-l">${q.origem ? 'A resposta do cliente chega no Showroom.' : 'A resposta do cliente aparece no botão Links do Catálogo, e vai para a sacola.'}</div></div>`;
  return { cartao, texto: `Link gerado para ${nomeCli} (${cod}): ${prontos.map(x => `${x.m.nome} com ${x.qtd} produtos`).join(' e ')}. O cartão com Copiar e Enviar no WhatsApp já apareceu. Diga em uma frase que está pronto; não repita o endereço.` };
}

/* meta_showroom: o "Vamos buscar?" da tela de Metas, no chat. A faixa da meta vira o filtro do Showroom
   pelo mesmo de-para da tela (data/faixas.json: artigo → faixa); as famílias sem faixa lá vão pela
   categoria. O que tem repasse vem primeiro: é o que se quer oferecer antes. */
const META_SHOWROOM = {
  OLY: { tot: { cat: 'TENIS', marca: 'oly' }, CLASSICOS: { faixa: 'CLASSICOS' }, CONF_FEM: { faixa: 'CONF_FEM' }, CONF_MASC: { faixa: 'CONF_MASC' },
    'CORRIDA/TREINO': { faixa: 'CORRIDA/TREINO' }, INFANTIL: { faixa: 'INFANTIL' }, CORRE: { faixa: 'CORRE' }, ACOLY: { faixa: 'ACESSORIOS' },
    CHOLY: { faixa: 'CHINELOS' }, MEOLY: { faixa: 'MEIA OLY' }, CFOLY: { cat: 'VESTUARIO', marca: 'oly' }, UA: { marca: 'ua' } },
  UA: { tot: { faixa: 'TENIS UA' }, UA_ME: { faixa: 'MEIA UA' }, UA_AC: { cat: 'ACESSORIO', marca: 'ua' }, UA_CH: { cat: 'CHINELO', marca: 'ua' }, UA_CF: { cat: 'VESTUARIO', marca: 'ua' } },
};
const META_CAT_SR = { TENIS: ['TENIS', 'FTW'], VESTUARIO: ['VESTUARIO', 'V&A'], ACESSORIO: ['ACESSORIO', 'ACC'], CHINELO: ['CHINELO', 'CHI'] };
async function metaFaixas() {
  if (!APP.faixas) { const r = await fetch('../data/faixas.json?t=' + Date.now(), { cache: 'no-store' }); APP.faixas = r.ok ? ((await r.json()).faixa || {}) : {}; }
  return APP.faixas;
}
function metaShowroomItens(L, fx, sp) {
  return L.filter(o => (!sp.faixa || String(fx[o.artigo] || '').toUpperCase() === sp.faixa)
    && (!sp.marca || o.marca === sp.marca) && (!sp.cat || META_CAT_SR[sp.cat].includes(norm(o.categoria))));
}
async function agMetaShowroom(a) {
  // UA só pela marca pedida ou pelo "(UA)" do botão: "Under Armour" sozinho é a família da meta Olympikus.
  const ua = /^(UA|UNDER)/i.test(String(a.marca || '').trim()) || /\(UA\)/i.test(String(a.faixa || '')), marca = ua ? 'UA' : 'OLY';
  const limpo = t => norm(t).replace(/[^A-Z0-9/ ]/g, ' ').replace(/\s+/g, ' ').trim();
  const termo = limpo(String(a.faixa || '').replace(/\(UA\)/gi, ''));
  if (!termo) return { erro: 'De qual faixa da meta? Pergunte ao vendedor.' };
  const nomes = { tot: 'Total de tênis', UA: 'Under Armour' }, chaves = Object.keys(META_SHOWROOM[marca]);
  const nomeDe = k => nomes[k] || META_NOMES[k] || k;
  const chave = chaves.find(k => limpo(nomeDe(k)) === termo || limpo(k) === termo) || chaves.find(k => limpo(nomeDe(k)).includes(termo) || termo.includes(limpo(nomeDe(k))))
    || (/TENIS/.test(termo) ? 'tot' : '');
  if (!chave) return { erro: `"${a.faixa}" não é uma faixa da meta que eu ligue ao Showroom. As que eu ligo: ${chaves.map(nomeDe).join(', ')}.` };
  let L, fx;
  try { [L, fx] = await Promise.all([baseDisponivel(), metaFaixas()]); } catch (e) { return { erro: 'Não consegui ler o Showroom agora: ' + (e.message || e) }; }
  const sp = META_SHOWROOM[marca][chave], rot = nomeDe(chave);
  const qt = (o, k) => o[CAT_ORIGEM[k].campo] ? CAT_ORIGEM[k].pares(o) : 0;
  const itens = metaShowroomItens(L, fx, sp).map(o => ({ o, rep: qt(o, 'repasse'), est: qt(o, 'estoque'), pro: qt(o, 'producao') }))
    .sort((x, y) => y.rep - x.rep || y.est - x.est || y.pro - x.pro);
  if (!itens.length) return { texto: `Hoje o Showroom não tem nada de ${rot}${ua ? ' (UA)' : ''}: nem repasse, nem estoque, nem produção. Diga isso ao vendedor.` };
  const soma = k => itens.reduce((s, x) => s + x[k], 0);
  const res = { entendi: ['<b>Showroom</b>', esc(`para fechar ${rot}${ua ? ' (UA)' : ''}`)], cols: ['Produto', 'Cor', 'Repasse', 'Estoque', 'Produção', 'Total'], num: [2, 3, 4, 5], data: [],
    rows: itens.map(x => [`${x.o.nome} (${x.o.artigo})`, x.o.cor, x.rep, x.est, x.pro, x.rep + x.est + x.pro]), totais: null, resumo: '' };
  const q = new URLSearchParams({ marca: ua || sp.marca === 'ua' ? 'ua' : 'oly', origem: 'tudo' });
  if (sp.faixa) q.set('faixa', sp.faixa); else if (sp.cat) q.set('categoria', sp.cat);
  const porMarca = CAT_MARCAS.map(m => [m, itens.filter(x => x.o.marca === m.id)]).filter(x => x[1].length);
  const cartao = `<div class="cartao-dae cartao-cat"><div class="cd-tit">Showroom · ${esc(rot)}${ua ? ' (UA)' : ''}</div>` +
    porMarca.map(([m, it]) => `<div class="cat-linha"><div class="cat-txt"><b>${esc(m.nome)}</b><div class="cd-l">${fmt(it.length)} cor${it.length > 1 ? 'es' : ''}</div><div class="dots-rot" data-cat-st></div></div>` +
      `<button class="sug forte" data-cat-pdf="${esc(JSON.stringify({ fonte: 'showroom', marca: m.id, origem: 'tudo', col: '', itens: it.map(x => x.o.k), filtro: 'Meta · ' + rot }))}">Gerar PDF</button></div>`).join('') +
    `<div class="acoes"><a class="sug" target="_blank" rel="noopener" href="${esc(SHOWROOM_URL + '?' + q)}">Abrir no Showroom</a></div></div>`;
  const top = itens.slice(0, 8).map(x => `${x.o.nome} ${x.o.cor}: ${[x.rep && `repasse ${fmt(x.rep)}`, x.est && `estoque ${fmt(x.est)}`, x.pro && `produção ${fmt(x.pro)}`].filter(Boolean).join(', ')}`).join('\n');
  return { res, cartao, texto: `Showroom para fechar a meta de ${rot}${ua ? ' (UA)' : ''}: ${itens.length} produto(s); somando, repasse ${fmt(soma('rep'))}, estoque ${fmt(soma('est'))} e produção ${fmt(soma('pro'))}. Os primeiros (repasse primeiro):\n${top}\n` +
    'A tabela e o botão do PDF já apareceram. Destaque em poucas frases o que tem de repasse (é o que vale oferecer primeiro) e não copie a tabela.' };
}

/* clientes: o cadastro em lista, uma linha por loja ("CNPJs da Ideal",
   "meus clientes de Caxias", "quem é o 21511"). Junta o cadastro do portal
   com os clientes da Detalhada que não estão nele (esses vêm sem CNPJ).
   Trava: o vendedor só carregou o cadastro dele; quem vê tudo, ao escolher
   um vendedor, fica só com os clientes dele na Detalhada. */
function agClientes(a) {
  const D = APP.dic, p = prepAtivo();
  if (!APP.cadLista) {
    const det = new Map(D.cli.map(([cod, nome]) => [String(cod), nome]));
    const cods = new Set([...(APP.cad ? APP.cad.keys() : []), ...det.keys()]);
    APP.cadLista = [...cods].map((cod, i) => {
      const c = APP.cad?.get(cod) || {}, fant = APP.fantasia?.[cod] || det.get(cod) || '';
      return { i, cod, fant, razao: c.razao || '', doc: c.doc || '', cidade: c.cidade || '', uf: c.uf || '', tel: c.tel || '',
        emailNfe: c.emailNfe || '', emailBanc: c.emailBanc || '',
        busca: { i, cod: norm(cod), txt: [...new Set([fant, det.get(cod), c.razao].filter(Boolean).map(norm))].join(' | '), nome: norm(fant || c.razao), doc: c.doc || '' } };
    });
  }
  let lista = APP.cadLista;
  // O vendedor vê os clientes dele na Detalhada mais o cadastro dele; quem vê tudo, ao escolher um vendedor, só os da Detalhada.
  if (p >= 0) { const meus = new Set(APP.L.filter(r => r[C.PREP] === p).map(r => String(D.cli[r[C.CLI]][0]))); lista = lista.filter(x => meus.has(x.cod) || (!APP.veTudo && APP.cad?.has(x.cod))); }
  const aplicados = [];
  if (a.nome || a.cnpj || a.codigo) {
    const termo = String(a.cnpj || a.codigo || a.nome);
    const r = agFiltro(lista.map(x => x.busca), termo, 'cliente', i => APP.cadLista[i].fant || APP.cadLista[i].razao);
    if (r.erro) return { erro: r.erro };
    // Aqui não há número somado: o aviso de "SOMAM" do filtro não vale.
    lista = lista.filter(x => r.set.has(x.i)); aplicados.push(r.texto.replace(/\s*\[ATENÇÃO:[^\]]*\]/, ''));
  }
  if (a.cidade) { const c = norm(a.cidade); lista = lista.filter(x => norm(x.cidade).includes(c)); aplicados.push('cidade: ' + a.cidade); }
  if (a.uf) { const u = norm(a.uf); lista = lista.filter(x => norm(x.uf) === u); aplicados.push('UF: ' + a.uf); }
  if (!aplicados.length) return { erro: 'Diga um nome, código, CNPJ, cidade ou UF para filtrar a lista de clientes.' };
  lista = [...lista].sort((x, y) => (x.fant || x.razao).localeCompare(y.fant || y.razao) || x.cidade.localeCompare(y.cidade));
  const res = { entendi: ['<b>Cadastro de clientes</b>', ...aplicados.map(esc)],
    cols: ['Código', 'Nome fantasia', 'Razão social', 'CNPJ/CPF', 'Cidade', 'Telefone', 'E-mail NF-e', 'E-mail bancário'], num: [], data: [],
    rows: lista.map(x => [x.cod, x.fant, x.razao, fmtDoc(x.doc), x.cidade ? `${x.cidade}${x.uf ? '/' + x.uf : ''}` : '', x.tel, x.emailNfe, x.emailBanc]), totais: null, resumo: '' };
  const semCad = lista.filter(x => !x.doc).length;
  return { res, texto: `${lista.length} cliente(s) encontrados (${aplicados.join('; ')}):\n` +
    lista.slice(0, LINHAS_IA).map(x => [x.cod, x.fant, x.razao, fmtDoc(x.doc), x.cidade && `${x.cidade}/${x.uf}`, x.tel, x.emailNfe && 'NF-e ' + x.emailNfe, x.emailBanc && 'bancário ' + x.emailBanc].filter(Boolean).join(' · ')).join('\n') +
    (lista.length > LINHAS_IA ? `\nATENÇÃO: a lista tem ${lista.length} e só as ${LINHAS_IA} primeiras aparecem acima; a tabela completa está embaixo da resposta.` : '') +
    (semCad ? `\n${semCad} deles não estão no cadastro do portal (sem CNPJ, cidade e contato).` : '') };
}

/* boleto → TESTE: 2ª via pelo robô do CMS Boletos rodando NESTE computador
   (C:\SCRIPTS AUTONOMOS\boletos_local.py). Fora daqui o serviço não existe e
   a ferramenta avisa. A trava por vendedor vale aqui: o código sai da base,
   só entre os clientes de quem pergunta. Quando houver VPS, só muda o endereço.
   Como no DAE, antes de buscar o cartão mostra quem é o cliente, e só o TOQUE aciona o robô. */
const BOLETOS_URL = 'http://127.0.0.1:8765';
async function agBoleto(a) {
  const D = APP.dic, X = indices(), p = prepAtivo();
  const meus = p < 0 ? null : new Set([...APP.L.filter(r => r[C.PREP] === p).map(r => r[C.CLI]), ...soCadDele()]);
  if (!a.cliente) return { erro: 'De qual cliente? Pergunte ao vendedor.' };
  const r = agFiltro(meus ? X.cli.filter(x => meus.has(x.i)) : X.cli, String(a.cliente), 'cliente', i => D.cli[i][1]);
  if (r.erro) return { erro: r.erro };
  // Mais de uma loja (filiais com o mesmo nome, ou nomes parecidos): mostra
  // a lista com fantasia, código e cidade para ele escolher, ou "todas".
  const lojas = [...r.set].sort((x, y) => rotuloLoja(x).localeCompare(rotuloLoja(y)));
  if (lojas.length > 1 && !a.todas) {
    const lista = lojas.slice(0, 12).map(rotuloLoja);
    return { erro: `"${a.cliente}" tem ${lojas.length} lojas: ${lista.join('; ')}${lojas.length > 12 ? ' e mais' : ''}. Os botões de escolha já apareceram para o vendedor: diga só que achou ${lojas.length} lojas e pergunte de qual ele quer o boleto (ou se quer de todas). Se ele escolher uma, chame boleto com o código dela; se disser todas, chame com "todas":true.`,
      opcoes: [...lojas.slice(0, 12).map(i => ({ rotulo: rotuloLoja(i), valor: `boleto do código ${D.cli[i][0]}` })),
        ...(lojas.length <= 6 ? [{ rotulo: `Todas as ${lojas.length}`, valor: 'de todas' }] : [])] };
  }
  if (lojas.length > 6) return { erro: `São ${lojas.length} lojas; de uma vez o robô busca no máximo 6. Peça para ele escolher as lojas.` };
  const codigos = [...new Set(lojas.map(i => String(D.cli[i][0])))];
  const dados = esc(JSON.stringify({ codigos, de: a.de, ate: a.ate }));
  const periodo = a.de || a.ate ? `<div class="cd-l">Vencimento ${a.de ? 'de ' + esc(dataIso(a.de)) : ''}${a.ate ? ' até ' + esc(dataIso(a.ate)) : ''}</div>` : '';
  const uma = codigos.length === 1, quem = codigos.map(quemE);

// Texto da IA com o básico de markdown: negrito, listas, quebras e tabelas.
function mdSimples(t) {
  // Espaços que não quebram linha (o gpt-oss usa muito) viram espaço comum.
  const linhas = String(t).replace(/[   ]/g, ' ').replace(/‑/g, '-').split('\n');
  const out = [];
  let lista = null, tabela = null;
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*([^*]+)\*/g, '$1<i>$2</i>');
  const fecha = () => {
    if (lista) { out.push(`<${lista.tag}>${lista.itens.map(i => `<li>${i}</li>`).join('')}</${lista.tag}>`); lista = null; }
    if (tabela) {
      const [cab, ...corpo] = tabela.filter(l => !/^\s*\|?\s*:?-{2,}/.test(l)).map(l => l.replace(/^\s*\||\|\s*$/g, '').split('|').map(c => inline(c.trim())));
      out.push(`<div class="tabela-wrap"><table><thead><tr>${(cab || []).map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>${corpo.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`);
      tabela = null;
    }
  };
  for (const l of linhas) {
    if (/^\s*\|.*\|\s*$/.test(l)) { if (lista) fecha(); (tabela = tabela || []).push(l); continue; }
    const ul = l.match(/^\s*[-•*]\s+(.*)$/), ol = l.match(/^\s*\d+[.)]\s+(.*)$/);
    if (ul || ol) {
      const tag = ul ? 'ul' : 'ol';
      if (tabela || (lista && lista.tag !== tag)) fecha();
      (lista = lista || { tag, itens: [] }).itens.push(inline((ul || ol)[1]));
      continue;
    }
    fecha();
    out.push(l.trim() ? `<p>${inline(l)}</p>` : '');
  }
  fecha();
  return out.join('');
}

const catOrdemColecao = c => { const m = /^([12])S(\d{2})$/.exec(c); return m ? -(Number(m[2]) * 2 + Number(m[1])) : 0; };

function catEntender(texto, rows) {
  const palavras = norm(texto).replace(/[^A-Z0-9&\s]/g, ' ').split(/\s+/).filter(Boolean);
  const segs = new Map(rows.map(r => [catSeg(r.segmento), r.segmento]).filter(([k]) => k));

  for (const w of palavras) {

    else if (/^[12]S\d{2}$/.test(w)) q.colecao = w;
    else if (/^COLECA?O(ES)?$/.test(w)) q.fonte = 'colecao';
    else if (/^SHOW-?ROOM$/.test(w)) q.fonte = 'showroom';
    else if (w === 'CORRE') q.corre = true;
    // Origem do Showroom: o catálogo passa a ser do que TEM, e sai do Showroom com quantidade e grade.
    else if (/^(ESTOQUES?|PRONTA)$/.test(w)) q.origem = 'estoque';
    else if (/^REPASSES?$/.test(w)) q.origem = 'repasse';
    else if (/^(PRODUCAO|PRODUCOES|META|METAS)$/.test(w)) q.origem = 'producao';

    else if (/^LANCAMENTOS?$/.test(w)) q.novo = q.novo && q.novo !== 'lanc' ? 'tudo' : 'lanc';

    else if (/^(NOVIDADES?|NOVOS?)$/.test(w)) q.novo = 'tudo';
    else if (CAT_PALAVRA_CATEGORIA[w]) q.categoria = CAT_PALAVRA_CATEGORIA[w];
    else if (CAT_PALAVRA_GENERO[w]) q.genero = CAT_PALAVRA_GENERO[w];
    else if (segs.has(w) || (w.endsWith('S') && segs.has(w.slice(0, -1)))) q.segmento = segs.has(w) ? w : w.slice(0, -1);

const CAT_ORIGEM = { estoque: { rot: 'Estoque', campo: 'pronta', pares: o => o.pronta.total },

function catShowroomFiltrar(q, rows, L, origem) {
  const O = CAT_ORIGEM[origem], chave = (a, c) => a + '|' + String(c).replace(/[^A-Z0-9]/gi, '').toUpperCase();

  const gen = { Feminino: ['FEMININO'], Masculino: ['MASCULINO'], Infantil: ['INFANTIL', 'KIDS'], Unissex: ['UNISSEX'] };
  const nomeTem = (o, w) => { const n = ' ' + norm(o.nome).replace(/[^A-Z0-9]/g, ' ') + ' '; return n.includes(' ' + w) || (w.length > 3 && w.endsWith('S') && n.includes(' ' + w.slice(0, -1))); };
  return L.filter(o => {
    if (!(O.tem ? O.tem(o) : o[O.campo])) return false;
    const c = doCat.get(chave(o.artigo, o.cor));
    return (!q.marca || o.marca === q.marca) && (!q.categoria || CAT_CATEG_SHOWROOM[q.categoria].includes(norm(o.categoria)))
      && (!q.genero || gen[q.genero].includes(norm(o.genero))) && (!q.corre || RE_CORRE.test(norm(o.nome)))
      && (!q.segmento || (c && catSeg(c.segmento) === q.segmento)) && (!q.colecao || (c && c.colecao === q.colecao))
      && (!q.novo || (c && (q.novo === 'lanc' ? c.lanc : q.novo === 'cor' ? c.novaCor : c.lanc || c.novaCor)))
      && q.nome.every(w => nomeTem(o, w));
  });
}

async function agFotoProduto(a) {

    let sug = catSugerir(nomes, palavras.join(' ')), comCor = '';
    if (!sug.length && fim) { sug = catSugerir(nomes, palavras.slice(0, -1).join(' ')); comCor = ' ' + fim; }
    if (sug.length) return { erro: `Não achei "${palavras.join(' ').toLowerCase()}" no catálogo. Os botões com os nomes parecidos já apareceram: pergunte numa frase curta qual deles ele quis dizer, sem listar de novo.`,

  const nomeQ = palavras.slice(0, cor ? -1 : undefined).join(' ');
  const exatos = lista.filter(r => norm(r.produto) === nomeQ);
  if (exatos.length) lista = exatos;
  lista.sort((x, y) => catOrdemColecao(x.colecao) - catOrdemColecao(y.colecao));

      opcoes: ops.map(r => ({ rotulo: `${r.produto} · ${r.codigo}`, valor: `foto do ${r.codigo}${cor ? ' cor ' + cor : ''}` })) };

        if (out.erro && AG.parecidos && !out.opcoes) {
          const p = AG.parecidos;
          out = { ...out, erro: out.erro.replace(/\s*Pergunte qual é\.?$/, '') + ' Os botões com esses nomes já apareceram para ele: pergunte numa frase curta qual deles ele quis dizer, sem listar os nomes de novo.',
            opcoes: p.nomes.map(n => ({ rotulo: n, valor: trocarTermo(texto, p.termo, n) })) };
        }
        AG.parecidos = null;
      }
      if (out.res && out.res.rows) { tabelas.push(out.res); AG.ultimaTabela = out.res; }
      if (out.cartao) extras.push(out.cartao);
      if (out.pdf && out.pdf.length) extras.push(pdfHtml(out.pdf));
      if (out.opcoes && out.opcoes.length) {
        extras.push(`<div class="acoes">${out.opcoes.map(o => `<button class="sug" data-opcao="${esc(o.valor)}">${esc(o.rotulo)}</button>`).join('')}</div>`);
      }
      if (out.cartaoArq) extras.push(out.cartaoArq);
      if (out.links && out.links.length) {
        extras.push(`<div class="acoes">${out.links.map(l => linkPdf(l.url, l.nome, l.rotulo)).join('')}</div>`);
      }
      if (out.catalogo) {
        const c = out.catalogo.catalogo;
        const link = (gerar, fotos) => DETALHADA_URL + '?' + new URLSearchParams({ cliente: c.cods.join(','), gerar, ...(fotos == null ? {} : { fotos: fotos ? '1' : '0' }) });
        const btn = (gerar, fotos, rot) => `<a class="sug" target="_blank" rel="noopener" href="${esc(link(gerar, fotos))}">${rot}</a>`;
        extras.push(`<div class="acoes">${c.formato !== 'xlsx' ? btn('pdf', null, 'Catálogo em PDF') : ''}${c.formato !== 'pdf' ? btn('xlsx', c.imagens !== false, `Catálogo em Excel${c.imagens === false ? ' sem imagens' : ' com imagens'}`) : ''}</div>`);
      }
      AG.msgs.push({ role: 'user', content: paraIA(r.nome, out) });
    }
  } catch (e) {
    AG.msgs.length = inicio;
    throw e;
  }
}

async function perguntarAgente(texto) {
  texto = texto.trim();
  if (!texto) return;
  addMsg('eu', esc(texto));
  const bolha = addMsg('ia', digitando());
  $('enviar').disabled = true;
  try {
    const { texto: resp, tabelas, extras, entendi } = await agRodar(texto, (nome, passo) => {
      bolha.innerHTML = ampulheta(`${ROTULO_FERRAMENTA[nome] || 'Consultando'}…`);
      rolar();
    });
    bolha.innerHTML = (entendi ? `<div class="entendi">Entendi: “${esc(entendi)}”</div>` : '') + `<div class="ag-texto">${mdSimples(resp)}</div>` + extras.join('') + tabelas.map(agTabelaHtml).join('');
    bolha.addEventListener('click', ev => {
      const op = ev.target.closest('[data-opcao]');
      if (op) { if (!$('enviar').disabled) perguntarAgente(op.dataset.opcao); return; }
      const b = ev.target.closest('[data-ag]');
      if (!b) return;
      const res = tabelas[Number(b.dataset.i)];
      if (b.dataset.ag === 'todas') { b.closest('details').querySelector('.tabela-wrap').outerHTML = tabelaHtml(res, Infinity); b.remove(); }
      else baixar(b, res, b.dataset.ag);
    });
  } catch (e) {
    // Cota grátis diária da Cloudflare (10 mil "neurons"). Sem hora de volta: em 30/10
    // o painel já mostrava 0 usados às 9h e a IA ainda recusava.
    bolha.innerHTML = /4006|daily free allocation/i.test(e.message || '')
      ? '<span class="aviso">A cota grátis de IA acabou por enquanto. Tente de novo mais tarde.</span>'
      : `<span class="aviso">Não consegui responder agora (${esc(e.message || e)}). Tente de novo em instantes.</span>`;
  } finally {
    $('enviar').disabled = false;
    rolar();
  }
}

/* ── bateria de testes do agente (?agente=1&bateria=1, só DEV) ──────────
   Perguntas fixas de vendedor; o gabarito sai das próprias ferramentas na
   hora do teste, então continua valendo quando a carteira muda. A conferência
   procura na resposta o número (ou nome, data, código) que a base dá. */
const BATERIA = AGENTE && new URLSearchParams(location.search).has('bateria');
const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const isoDe = d => `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}-${String(d.getUTCDate()).padStart(2, '0')}`;
// Mês relativo ao de hoje: 0 = este, -1 = passado, 1 = próximo.
function batMes(off) {
  const h = new Date(hojeIso() + 'T00:00:00Z');
  const ini = new Date(Date.UTC(h.getUTCFullYear(), h.getUTCMonth() + off, 1));
  const fim = new Date(Date.UTC(h.getUTCFullYear(), h.getUTCMonth() + off + 1, 0));
  return { de: isoDe(ini), ate: isoDe(fim), nome: MESES[ini.getUTCMonth()] };
}
const batAno = () => hojeIso().slice(0, 4);
const batSem = n => ({ de: `${batAno()}-${n === 1 ? '01-01' : '07-01'}`, ate: `${batAno()}-${n === 1 ? '06-30' : '12-31'}` });
const batDia = off => { const d = new Date(hojeIso() + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + off); return isoDe(d); };
// Valor de uma coluna: total (sem linha), linha pelo número ou pelo nome.
function batValor(res, medida, linha) {
  const j = medida ? res.cols.indexOf(medida) : res.num[res.num.length - 1];
  if (j < 0) return null;
  if (linha == null) return res.rows.reduce((s, r) => s + (Number(r[j]) || 0), 0);
  const row = typeof linha === 'number' ? res.rows[linha] : res.rows.find(r => norm(String(r[0])).includes(norm(linha)));
  return row ? Number(row[j]) || 0 : null;
}
const batCons = a => { const o = agConsultar(a); if (o.erro) throw new Error(o.erro); return o.res; };
const batNums = t => (String(t).match(/\d{1,3}(?:\.\d{3})+|\d+/g) || []).map(s => Number(s.replace(/\./g, '')));
const batTem = (t, v) => v != null && batNums(t).includes(Math.round(v));
const batNome = (t, nome) => norm(t).includes(norm(String(nome).split(/\s+/)[0]));
const batUsou = (r, nome) => r.usadas.some(u => u.nome === nome);
const NAO_VE = /(n[aã]o|nem) (enxergo|tenho|consigo|vejo|possuo|acesso)/i;
// Movimento sem agrupar só traz o total no resumo ("3.480 pares entraram…").
function batMov(r, a) {
  const o = FERRAMENTAS.movimento(a);
  if (!o.res) return { ok: /n[aã]o/i.test(r.texto), esp: 'sem registro do período' };
  const v = /^Nenhum/.test(o.res.resumo) ? 0 : batNums(o.res.resumo)[0];
  return { ok: v ? batTem(r.texto, v) : /nenhum|n[aã]o|\b0\b/i.test(r.texto), esp: `${fmt(v)} (de ${dataDe(diaDe(a.de))} a ${dataDe(diaDe(a.ate))})` };
}

function montarBateria() {
  const box = addMsg('ia', `<div class="ag-texto"><p><b>Bateria de testes</b> · ${TESTES.length} perguntas. O gabarito sai da base agora; cada pergunta roda numa conversa nova.</p></div>
    <div class="acoes"><select id="batModelo"><option value="">Automático (gpt-oss, com reserva)</option><option value="@cf/openai/gpt-oss-120b">Só gpt-oss-120b</option><option value="@cf/meta/llama-3.3-70b-instruct-fp8-fast">Só Llama 3.3 70B</option></select>
    <button class="btn-sec" id="batRodar">Rodar bateria</button></div><div id="batSaida"></div>`);
  box.querySelector('#batRodar').addEventListener('click', ev => rodarBateria(ev.target, box.querySelector('#batModelo').value));

async function rodarBateria(botao, modelo) {
  const saida = $('batSaida'), sel = $('verComo');
  const antes = { msgs: AG.msgs, tab: AG.ultimaTabela, modelo: AG.modelo, ver: sel.value };
  botao.disabled = true; AG.modelo = modelo; AG.testando = true;
  const linhas = [], t0 = Date.now();
  const desenha = fim => {
    const certos = linhas.filter(l => l[3] === 'certo').length;
    saida.innerHTML = `<p class="ag-texto"><b>${certos} de ${linhas.length}</b> certas${fim ? '' : ` · rodando ${linhas.length + 1} de ${TESTES.length}…`} · ${Math.round((Date.now() - t0) / 1000)} s</p>` +
      `<div class="tabela-wrap"><table><thead><tr><th>#</th><th>Pergunta</th><th>Resultado</th><th>Esperado</th><th>Resposta</th><th>Ferramentas</th><th>s</th></tr></thead><tbody>` +
      linhas.map(l => `<tr class="bat-${l[3]}"><td>${l[0]}</td><td>${esc(l[1])}</td><td>${l[3] === 'certo' ? '✔' : l[3] === 'errado' ? '✘' : '⚠'}</td><td>${esc(l[4])}</td><td>${esc(l[5])}</td><td>${esc(l[6])}</td><td>${l[7]}</td></tr>`).join('') +
      `</tbody></table></div>` + (fim ? `<div class="acoes"><button class="btn-sec" id="batXlsx">Baixar Excel</button></div>` : '');
    rolar();
  };
  try {
    for (let i = 0; i < TESTES.length; i++) {
      const t = TESTES[i];
      desenha(false);
      AG.msgs = []; AG.ultimaTabela = null;
      const iv = t.v ? APP.dic.prep.findIndex(p => norm(p).includes(t.v)) : -1;
      sel.value = iv >= 0 ? String(iv) : '';
      const ti = Date.now();
      let r = { texto: '', usadas: [] }, situacao, esp = '', modeloUsado = '';
      try {
        for (const q of t.q) {
          const x = await agRodar(q);
          r = { texto: x.texto, usadas: [...r.usadas, ...x.usadas] };
          modeloUsado = x.modelo || '';
        }
        const c = t.ok(r);
        situacao = c.ok ? 'certo' : 'errado'; esp = c.esp;
      } catch (e) { situacao = 'falhou'; esp = 'erro: ' + (e.message || e); }
      linhas.push([i + 1, (t.v ? `[${t.v}] ` : '[todos] ') + t.q.join(' → '), modeloUsado.split('/').pop(), situacao, esp, r.texto,
        r.usadas.map(u => u.nome + ' ' + JSON.stringify(u.args)).join(' | '), Math.round((Date.now() - ti) / 1000)]);
    }
  } finally {
    Object.assign(AG, { msgs: antes.msgs, ultimaTabela: antes.tab, modelo: antes.modelo, testando: false });
    sel.value = antes.ver; botao.disabled = false;
  }
  desenha(true);
  const certos = linhas.filter(l => l[3] === 'certo').length;
  $('batXlsx').addEventListener('click', ev => baixar(ev.target, {
    entendi: [`<b>Bateria do agente</b>`, esc(`${certos} de ${linhas.length} certas · ${modelo || 'automático'} · ${Math.round((Date.now() - t0) / 1000)} s`)],
    cols: ['#', 'Pergunta', 'Modelo', 'Resultado', 'Esperado', 'Resposta', 'Ferramentas', 'Segundos'], num: [7], data: [], rows: linhas, totais: null,
  }, 'xlsx'));
}

async function iniciar() {
  if (AGENTE) {
    document.title = 'Nexo · CMS';
    $('titulo').textContent = 'Nexo';
  }
  APP.sessao = lerSessao();
  if (!APP.sessao) {
    $('conversa').innerHTML = '<div class="bloqueio"><h2>Entre pelo Portal</h2><p>O assistente usa o login do Portal do Vendedor.</p></div>';
    $('quem').textContent = 'Sem login';
    return;
  }
  // O Nexo já abre também para a CMS; a página antiga do assistente continua só do DEV.
  if (SO_DEV && norm(APP.sessao.nome) !== 'MARCOS (DEV)' && !(AGENTE && norm(APP.sessao.nome) === 'CMS')) {
    $('conversa').innerHTML = '<div class="bloqueio"><h2>Em desenvolvimento</h2><p>O assistente ainda não foi liberado para a equipe.</p></div>';
    $('quem').textContent = APP.sessao.nome;
    return;
  }
  APP.veTudo = MANDA_EM_TUDO.includes(norm(APP.sessao.nome));
  // Sem a linha de status no topo, o carregando e os erros aparecem na conversa.
  const carregando = addMsg('ia', ampulheta('Carregando a base…'));
  const base = await carregarBase();
  carregando.closest('.msg').remove();
  if (!base) { addMsg('ia', '<span class="aviso">Não foi possível carregar a base. Tente abrir de novo em instantes.</span>'); return; }
  APP.base = base; APP.dic = base.dic; APP.L = base.l;
  APP.catPronto = carregarCatalogo().catch(() => {}).then(olharRobo);

  if (APP.veTudo) {
    $('verComo').innerHTML = '<option value="">Todos os vendedores</option>' +
      APP.dic.prep.map((p, i) => `<option value="${i}">${esc(p)}</option>`).join('');
    $('verComoWrap').hidden = false;
    $('verComo').addEventListener('change', () => { APP.anteriores = []; APP.atual = null; APP.tela = ''; AG.msgs = []; AG.ultimaTabela = null; });
  } else {
    APP.prep = acharPreposto(APP.sessao.nome);
    if (APP.prep < 0) { addMsg('ia', `<span class="aviso">Não achei nenhuma linha de ${esc(APP.sessao.nome)} na base.</span>`); return; }
  }
  $('pergunta').disabled = false; $('enviar').disabled = false;
  $('pergunta').focus();
  // Teste no Chrome do Marcos (com a extensão do EBM): só existe no localhost; o arquivo não vai para o site.
  if (AGENTE && location.hostname === 'localhost' && new URLSearchParams(location.search).has('teste')) {
    const noAr = await chamarWorker('agenteDetalhada', { hoje: hojeIso(), contexto: {}, modelo: 'claude-haiku-5-5', mensagens: [{ role: 'user', content: 'oi' }] }, 30000).then(r => !!(r && r.ok)).catch(() => false);
    if (!noAr) try { (0, eval)(await (await fetch('_teste_demo.js', { cache: 'no-store' })).text())(); } catch (e) { console.warn('sem demonstração', e); }
  }
  // Abertura do Nexo: fixa, sem IA, e fora do histórico que vai para ela.
  if (AGENTE) {
    const nome = String(APP.sessao.nome || '').replace(/\(.*?\)/g, '').trim().split(/\s+/)[0];
    const primeiro = nome ? nome[0].toUpperCase() + nome.slice(1).toLowerCase() : '';
    addMsg('ia', `<div class="ag-texto">Oi${primeiro ? ', ' + esc(primeiro) : ''}! Sou o Nexo, o assistente da CMS. O que você precisa hoje?</div>`);
  }
  if (BATERIA && APP.veTudo) montarBateria();
}

// Campo vazio mostra o microfone no lugar do enviar, como no WhatsApp.
const ajustaBotoes = () => $('form').classList.toggle('vazio', !!VOZ && !$('pergunta').value.trim());
$('form').addEventListener('submit', e => { e.preventDefault(); const t = $('pergunta'); const v = t.value; t.value = ''; t.style.height = ''; ajustaBotoes(); (AGENTE ? perguntarAgente : perguntar)(v); });
$('pergunta').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('form').requestSubmit(); } });
$('pergunta').addEventListener('input', e => { const t = e.target; t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 120) + 'px'; ajustaBotoes(); });

/* Falar em vez de digitar: reconhecimento de fala do próprio navegador
   (Chrome e Safari; o Firefox não tem). O texto cai no campo e quem
   envia é a pessoa, depois de conferir: nome de cliente às vezes sai torto. */
const VOZ = window.SpeechRecognition || window.webkitSpeechRecognition;
let ouvindo = null;
if (VOZ) {
  $('mic').hidden = false;
  $('mic').addEventListener('click', () => {
    if (ouvindo) { ouvindo.stop(); return; }
    const t = $('pergunta'), antes = t.value.trim();
    const rec = new VOZ();
    rec.lang = 'pt-BR'; rec.interimResults = true; rec.continuous = false;
    rec.onresult = ev => {
      const falado = [...ev.results].map(r => r[0].transcript).join('');
      t.value = (antes ? antes + ' ' : '') + falado;
      t.dispatchEvent(new Event('input'));
    };
    rec.onerror = ev => {
      if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') addMsg('ia', '<span class="aviso">Libere o microfone para esta página (no cadeado ao lado do endereço) e toque de novo.</span>');
      else if (ev.error !== 'no-speech' && ev.error !== 'aborted') addMsg('ia', `<span class="aviso">Não consegui ouvir (${esc(ev.error)}). Tente de novo.</span>`);
    };
    rec.onend = () => { ouvindo = null; $('mic').classList.remove('ouvindo'); ajustaBotoes(); if (t.value.trim()) t.focus(); };
    ouvindo = rec;
    $('mic').classList.add('ouvindo');
    rec.start();
  });
}
ajustaBotoes();
iniciar();
</script>
</body>
