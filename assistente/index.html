<script>
const WORKER_URL = 'https://repasse-worker-cms.marcosrep-cms.workers.dev/';
const SESSION_KEY = 'cms_portal_session_v1';
const MANDA_EM_TUDO = ['CMS', 'MARCOS (DEV)'];
// Em obra: só o DEV entra, mesmo com o endereço na mão. Para liberar à
// equipe, false aqui e tirar a classe dev-only do card no portal.
const SO_DEV = true;
// Mesma posição de campos da Detalhada (apps-oly-v2/detalhada, const C)
const C = { PREP: 0, CLI: 1, MARCA: 2, FAB: 3, FIL: 4, REF: 5, COR: 6, GCI: 7, NF: 8, OC: 9, PREV: 10, CART: 11, FAT: 12, DFAT: 13, FAIXA: 14 };
const MOSTRAR = 50;

const $ = id => document.getElementById(id);
const APP = { sessao: null, veTudo: false, base: null, dic: null, L: [], prep: -1, anteriores: [], atual: null, tela: '' };

/* ── utilidades ───────────────────────────────────────── */
const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().trim();
const fmt = n => Number(n || 0).toLocaleString('pt-BR');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const diaDe = iso => { const [y, m, d] = String(iso).split('-').map(Number); return Math.floor(Date.UTC(y, m - 1, d) / 86400000); };
const dataDe = dia => { const d = new Date(dia * 86400000); return `${String(d.getUTCDate()).padStart(2, '0')}/${String(d.getUTCMonth() + 1).padStart(2, '0')}/${d.getUTCFullYear()}`; };
const mesDe = dia => { const d = new Date(dia * 86400000); return `${String(d.getUTCMonth() + 1).padStart(2, '0')}/${d.getUTCFullYear()}`; };
const hojeIso = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const ehUA = m => /^UA/.test(String(m || ''));

async function chamarWorker(action, extra = {}, ms = 15000) {
  const corta = new AbortController();
  const t = setTimeout(() => corta.abort(), ms);
  try {
    const r = await fetch(WORKER_URL, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action, ...extra }), signal: corta.signal,
    });
    if (!r.ok) throw new Error(`worker respondeu ${r.status}`);
    return await r.json();
  } finally { clearTimeout(t); }
}

/* ── sessão e base ────────────────────────────────────── */
function lerSessao() {
  try {
    const s = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
    if (!s || !s.expiraEm || new Date(s.expiraEm).getTime() < Date.now()) return null;
    return s;
  } catch (_) { return null; }
}

// O nome do portal nem sempre é o da base ("CHRISTIAN LUCAS" x "CHRISTIAN").
function acharPreposto(nome) {
  const n = norm(nome), prep = APP.dic.prep.map(norm);
  let i = prep.indexOf(n);
  if (i < 0) i = prep.findIndex(p => p && (n.startsWith(p + ' ') || p.startsWith(n.split(' ')[0])));
  return i;
}

async function carregarBase() {
  // Igual à Detalhada: o worker às vezes devolve 503 ao montar a base; a
  // segunda tentativa costuma vir. A cópia do repositório é só reserva.
  for (let t = 1; t <= 2; t++) {
    try {
      const b = await chamarWorker('getDetalhada', {}, 45000);
      if (b && Array.isArray(b.l)) return b;
    } catch (_) {}
  }
  const r = await fetch('../data/detalhada.json', { cache: 'no-store' });
  return r.ok ? r.json() : null;
}

function prepAtivo() {
  if (!APP.veTudo) return APP.prep;
  const v = $('verComo').value;
  return v === '' ? -1 : Number(v);
}

/* ── casar o que a IA entendeu com a base ─────────────── */
// Código exato primeiro; depois a frase dentro do nome; por fim todas as
// palavras (cada uma igual a uma palavra do nome, ou começo dela com 3+ letras).
function casar(lista, termo) {
  const t = norm(termo);
  if (!t) return null;
  // CNPJ ou CPF (com ou sem pontuação); só a raiz de 8 dígitos traz todas as filiais.
  if (/^[\d.\/\-\s]+$/.test(String(termo))) {
    const d = String(termo).replace(/\D/g, '');
    if (d.length === 14 || d.length === 11) { const r = lista.filter(x => x.doc === d); if (r.length) return r.map(x => x.i); }
    if (d.length === 8) { const r = lista.filter(x => x.doc && x.doc.startsWith(d)); if (r.length) return r.map(x => x.i); }
  }
  const exato = lista.filter(x => x.cod === t);
  if (exato.length) return exato.map(x => x.i);
  const frase = lista.filter(x => x.txt.includes(t));
  if (frase.length) return frase.map(x => x.i);
  const tokens = t.split(/[^A-Z0-9]+/).filter(Boolean);
  // Cada palavra digitada usa uma palavra diferente do nome: "TOK TOK" não
  // pode casar duas vezes com o mesmo "TOK" de "TOK DO PE".
  return lista.filter(x => {
    const livres = x.txt.split(/[^A-Z0-9]+/);
    return tokens.every(k => {
      const j = livres.findIndex(p => p === k || (k.length >= 3 && p.startsWith(k)));
      if (j < 0) return false;
      livres.splice(j, 1);
      return true;
    });
  }).map(x => x.i);
}

/* Erro de digitação: quando nada casa, procura o nome mais PARECIDO.
   Nota de 0 a 1 por palavra digitada contra a palavra mais próxima do nome
   ("ESPORT" x "SPORT" = 0,83), e a média delas. Volta agrupado por nome,
   porque o mesmo cliente aparece com vários códigos. */
// Letras trocadas de lugar ("RSUH") contam como um erro só.
function distancia(a, b) {
  if (a === b) return 0;
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) {
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
  }
  return d[a.length][b.length];
}
const parecenca = (a, b) => 1 - distancia(a, b) / Math.max(a.length, b.length, 1);
// Trocas de quem escreve pelo som: "KENTE" = "QUENTE", "ARMAZEN" = "ARMAZEM".
const pelaFala = s => s.replace(/QU/g, 'K').replace(/C(?=[AOU]|$)/g, 'K').replace(/SS/g, 'S').replace(/Z/g, 'S')
  .replace(/Y/g, 'I').replace(/W/g, 'V').replace(/PH/g, 'F').replace(/N$/, 'M');

function parecidos(lista, termo) {
  const tokens = norm(termo).split(/[^A-Z0-9]+/).filter(k => k.length >= 2 || /\d/.test(k)).map(pelaFala);
  if (!tokens.length) return [];
  const porNome = new Map();
  for (const x of lista) {
    const palavras = x.txt.split(/[^A-Z0-9]+/).filter(Boolean).map(pelaFala);
    if (!palavras.length) continue;
    const nota = tokens.reduce((s, k) => s + Math.max(...palavras.map(p => parecenca(k, p))), 0) / tokens.length;
    if (nota < 0.75) continue;
    const nome = x.nome || x.txt;
    const g = porNome.get(nome) || { nome, idx: [], nota };
    g.idx.push(x.i); porNome.set(nome, g);
  }
  return [...porNome.values()].sort((a, b) => b.nota - a.nota);
}

/* Erro de digitação nas palavras do PRÓPRIO Nexo ("cataloho chonelo", "carteria", "disponibildade").
   Nomes de cliente e de produto não passam por aqui (eles têm o parecidos() nas ferramentas): palavra que
   existe num nome nunca é trocada, para "Marte" não virar "metas". Uma só palavra perto: troca e avisa
   o que entendeu. Duas perto ("meas": meias ou metas): o Nexo pergunta antes de consultar. */
const NEXO_PALAVRAS = ('catálogo catálogos chinelo chinelos mochila mochilas boné bonés meia meias vestuário roupa roupas calçado calçados '
  + 'tênis sandália sandálias acessório acessórios camiseta camisetas bermuda bermudas jaqueta jaquetas feminino feminina masculino '
  + 'masculina infantil unissex lançamento lançamentos novidades estoque repasse repasses produção showroom coleção carteira faturado '
  + 'faturados faturamento faturar pedido pedidos boleto boletos disponível disponíveis disponibilidade foto fotos imagem imagens meta metas '
  + 'previsão cliente clientes vendedor vendedores campanha campanhas olympikus under armour corrida entradas saídas cancelado cancelados '
  + 'transferência cadastro telefone endereço grade grades tamanho tamanhos nota fiscal código').split(' ');
// Palavras comuns que ficam a uma letra de alguma acima ("preciso" x "previsão", "bons" x "boné", "tens" x "tênis").
const NEXO_COMUNS = new Set(('preciso precisa precisava quero queria quanto quantos quantas quais onde quando porque tenho temos tens tem '
  + 'existe mostra mostrar manda mande mandar passa passar gerar fazer consegue consigo voce obrigado obrigada valeu beleza bons boas '
  + 'tarde noite hoje ontem amanha semana este esse essa isso aquele todos todas tudo mais menos maior maiores menores melhor primeiro '
  + 'ultimo proximo tambem ainda agora depois antes sobre entre desde pares total valor preco cores numero loja lojas cidade nome junto '
  + 'favor pode podes poderia gostaria dele dela deles delas meus minhas minha nosso nossa quem como entao assim certo errado novo nova '
  + 'novos novas data dias mandou chegou saiu entrou faturou vendeu vendi comprou compra comprar vender venda vendas fato mesa metal '
  + 'gente nada nenhum nenhuma algum alguma outro outra outros outras mesmo mesma cada sabe saber falta faltam fala falar '
  + 'mes dia ano foi sem boa bom meu seu sua com que nao ver tal produto produtos modelo modelos linha linhas referencia notas '
  + 'faturei faturamos faturaram faturando fatura faturas pedi pediu pediram pedimos pedindo pedir vendemos venderam recebeu receber').split(' ').map(norm));
let NEXO_NOMES = null;
function nexoNomes() {
  const tam = (APP.dic ? APP.dic.cli.length + APP.dic.ref.length : 0) + (CAT.rows ? CAT.rows.length : 0);
  if (NEXO_NOMES && NEXO_NOMES.tam === tam) return NEXO_NOMES.set;
  const set = new Set(), poe = t => { for (const w of String(t).split(/[^A-Z0-9]+/)) if (w.length >= 4) set.add(w); };
  try { const I = indices(); for (const k of ['cli', 'ref', 'cor', 'prep', 'faixa']) for (const x of I[k] || []) poe(x.txt); } catch (e) {}
  for (const r of CAT.rows || []) poe(norm(r.produto));
  for (const w of NEXO_PALAVRAS) set.delete(norm(w));
  NEXO_NOMES = { tam, set };
  return set;
}
// Plural e singular do mesmo termo não são dúvida ("fotoss": foto ou fotos dá na mesma).
const nexoRaiz = w => pelaFala(norm(w).replace(/S$/, ''));
function corrigirFrase(texto) {
  const voc = NEXO_PALAVRAS.map(p => ({ p, k: pelaFala(norm(p)) })), exatos = new Set(NEXO_PALAVRAS.map(norm));
  const nomes = nexoNomes(), trocas = [], duvidas = [];
  const novo = String(texto).replace(/\p{L}+/gu, w => {
    const n = norm(w);
    if (n.length < 3 || exatos.has(n) || NEXO_COMUNS.has(n) || nomes.has(n)) return w;
    const k = pelaFala(n), lim = n.length >= 7 ? 2 : 1;
    let melhor = Infinity, cands = [];
    for (const v of voc) {
      // Quem erra digitando quase nunca erra a primeira letra: isso segura muita troca indevida.
      if (v.k[0] !== k[0] || Math.abs(v.k.length - k.length) > lim) continue;
      const d = distancia(k, v.k);
      if (d < melhor) { melhor = d; cands = [v.p]; } else if (d === melhor) cands.push(v.p);
    }
    if (melhor > lim) return w;
    const grupos = [...new Map(cands.map(c => [nexoRaiz(c), c])).values()];
    if (grupos.length > 1) { duvidas.push({ palavra: w, opcoes: grupos.slice(0, 3) }); return w; }
    trocas.push([w, grupos[0]]);
    return grupos[0];
  });
  return { texto: novo, trocas, duvidas };
}
// Troca na frase o trecho que a ferramenta não achou ("degrauss") pelo nome escolhido no botão.
function trocarTermo(texto, termo, nome) {
  const ws = [...String(texto).matchAll(/[\p{L}\p{N}]+/gu)], alvo = norm(termo).split(/[^A-Z0-9]+/).filter(Boolean);
  if (!ws.length || !alvo.length || alvo.length > ws.length) return `${texto} (${nome})`;
  let nota = -1, em = -1;
  for (let i = 0; i + alvo.length <= ws.length; i++) {
    const x = alvo.reduce((t, a, j) => t + parecenca(pelaFala(a), pelaFala(norm(ws[i + j][0]))), 0) / alvo.length;
    if (x > nota) { nota = x; em = i; }
  }
  if (nota < 0.5) return `${texto} (${nome})`;
  const ult = ws[em + alvo.length - 1];
  return texto.slice(0, ws[em].index) + nome + texto.slice(ult.index + ult[0].length);
}

function indices() {
  if (APP.idx) return APP.idx;
  const D = APP.dic;
  APP.idx = {
    cli: D.cli.map(([cod, nome], i) => ({ i, cod: norm(cod), txt: norm(nome) })),
    ref: D.ref.map(([ref, desc], i) => ({ i, cod: norm(ref), txt: norm(desc) })),
    cor: D.cor.map((c, i) => ({ i, cod: norm(c), txt: norm(c) })),
    faixa: (D.faixa || []).map((f, i) => ({ i, cod: norm(f), txt: norm(f) })),
    prep: D.prep.map((p, i) => ({ i, cod: norm(p), txt: norm(p) })),
  };
  return APP.idx;
}

/* ── fichas: o que se sabe de um produto ou de um cliente ──
   Produto junta a Detalhada (referência, descrição, cores com pedido) com o
   catálogo (data/produtos.json: preço, segmento, gênero) e as fichas
   técnicas (data/fichas.json: composição, tecnologias, coleção). Cliente
   junta a Detalhada com o nome fantasia (data/clientes-fantasia.json).
   Carrega depois da base, sem segurar a tela. */
async function carregarCatalogo() {
  const ler = async url => { try { const r = await fetch(url, { cache: 'no-cache' }); return r.ok ? await r.json() : null; } catch (_) { return null; } };
  const [prods, fichas, fant] = await Promise.all([ler('../data/produtos.json'), ler('../data/fichas.json'), ler('../data/clientes-fantasia.json')]);
  const D = APP.dic, porRef = new Map();
  const pega = ref => {
    let p = porRef.get(ref);
    if (!p) { p = { ref, desc: '', nome: '', marca: '', preco: null, segmento: '', genero: '', categoria: '', cores: new Set() }; porRef.set(ref, p); }
    return p;
  };
  D.ref.forEach(([ref, desc]) => { pega(String(ref)).desc = desc; });
  for (const x of (Array.isArray(prods) ? prods : [])) {
    const p = pega(String(x.codigo));
    p.nome = p.nome || x.produto || ''; p.marca = p.marca || x.marca || '';
    if (x.preco > 0) p.preco = x.preco;
    p.segmento = p.segmento || x.segmento || ''; p.genero = p.genero || x.genero || ''; p.categoria = p.categoria || x.categoria || '';
    if (x.cor) p.cores.add(x.cor);
  }
  APP.prods = [...porRef.values()];
  APP.iRef = new Map(D.ref.map(([ref], i) => [String(ref), i]));
  APP.fichas = fichas && typeof fichas === 'object' ? fichas : {};
  APP.fantasia = fant && fant.clientes ? fant.clientes : {};
  indices().prod = APP.prods.map((p, i) => ({ i, cod: norm(p.ref), txt: norm(p.desc || p.nome) }));
  APP.cad = await carregarCadastro();
  indexarClientes();
}

/* Cadastro de clientes do portal (o mesmo do botão Clientes): razão social,
   CNPJ, cidade, telefone e e-mails por código. Quem vê tudo carrega todos os
   vendedores; o vendedor, só o dele. Cobre ~95% dos clientes. */
// Os mesmos códigos da tela Clientes: a base de cada vendedor é um arquivo com o código dele.
const VENDEDOR_DA_BASE = { 114611: 'JORGE', 109839: 'MARIANA', 1333497: 'RAFAEL', 25471: 'WILLAME', 25745: 'LEANDRO', 4322318: 'CHRISTIAN LUCAS' };
async function carregarCadastro() {
  const pede = extra => chamarWorker('getClientes', extra, 20000).then(j => (Array.isArray(j?.clientes) ? j.clientes : []).map(c => ({ ...c, _vend: VENDEDOR_DA_BASE[extra.vendedor] || '' }))).catch(() => []);
  let listas;
  if (APP.veTudo) {
    const l = await chamarWorker('listClientesVendedores', {}, 20000).catch(() => null);
    listas = await Promise.all((l?.vendedores || []).map(v => pede({ vendedor: v.codigo })));
  } else listas = [await pede({ vendedor: APP.sessao.codigo })];
  // Nome às vezes vem com o CNPJ na frente ("23.961.354 MARISETE"), como na tela Clientes.
  const limpa = s => String(s || '').trim().replace(/^\d{2}\.?\d{3}\.?\d{3}\/?\d{4}-?\d{2}\s+/, '').replace(/^\d{3}\.?\d{3}\.?\d{3}-?\d{2}\s+/, '')
    .replace(/^(\d{2,3}[\s.]\d{3}[\s.]\d{3}(?:[\s.]\d{1,4})?)\s+/, '').replace(/^\d{8,14}\s+/, '').replace(/ï¿½|�/g, 'ã');
  const cad = new Map();
  for (const c of listas.flat()) {
    const cod = String(c.codigo || '').trim();
    if (!cod || cad.has(cod)) continue;
    cad.set(cod, { razao: limpa(c.nome || c.razaoSocial), doc: String(c.cnpj || c.documento || '').replace(/\D/g, ''),
      cidade: c.cidade || c.CIDADE || '', uf: c.estado || c.ESTADO || '', tel: c.telefone || c.TELEFONE || '',
      emailNfe: c.emailNfe || c.EMAIL_NFE || '', emailBanc: c.emailBancario || c.EMAIL_BANCARIO || '', avista: limpa(c.avista || c.AVISTA || ''), vendedor: c._vend });
  }
  return cad;
}

// O cliente passa a ser achado por qualquer nome que tenha: o da Detalhada,
// o fantasia e a razão social do cadastro, além do código e do CNPJ.
// Quem só está no cadastro (cerca de metade: sem pedido na Detalhada) entra no fim da lista: as linhas
// da base não apontam para eles, então os totais não mudam, e ficha e boleto passam a achá-los.
function indexarClientes() {
  const D = APP.dic, naBase = new Set(D.cli.map(([cod]) => String(cod).trim()));
  APP.soCad = new Set();
  for (const [k, c] of APP.cad || []) if (!naBase.has(k)) { APP.soCad.add(D.cli.length); D.cli.push([k, APP.fantasia?.[k] || c.razao || k]); }
  indices().cli = D.cli.map(([cod, nome], i) => {
    const k = String(cod), c = APP.cad?.get(k) || {};
    const nomes = [...new Set([nome, APP.fantasia?.[k], c.razao].filter(Boolean).map(norm))];
    return { i, cod: norm(cod), txt: nomes.join(' | '), nome: norm(nome), doc: c.doc || '' };
  });
}

const fmtDoc = d => d.length === 14 ? `${d.slice(0, 2)}.${d.slice(2, 5)}.${d.slice(5, 8)}/${d.slice(8, 12)}-${d.slice(12)}`
  : d.length === 11 ? `${d.slice(0, 3)}.${d.slice(3, 6)}.${d.slice(6, 9)}-${d.slice(9)}` : d;
// "IDEAL CENTRO · 21511 · FORTALEZA/CE": como cada loja aparece numa escolha.
function rotuloLoja(i) {
  const [cod, nome] = APP.dic.cli[i], k = String(cod), c = APP.cad?.get(k) || {};
  const fant = APP.fantasia?.[k] && norm(APP.fantasia[k]) !== norm(nome) ? APP.fantasia[k] : nome;
  return [fant, k, c.cidade ? `${c.cidade}${c.uf ? '/' + c.uf : ''}` : ''].filter(Boolean).join(' · ');
}

const reais = v => Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

// Devolve o HTML do balão e o mesmo em texto (o texto vai para a IA, que
// conversa em cima dele: "e qual o preço?", "tem em preto?").
function fichaProduto(sRef, linhas, termo) {
  const D = APP.dic, t = norm(termo);
  // Nome igual ao que ele escreveu vem primeiro ("CORRE 4" antes de
  // "MEIA CORRE 4"); depois, o que tem mais pares.
  const igual = p => norm(p.desc) === t || norm(p.nome) === t || norm(p.ref) === t;
  const itens = [...sRef].map(i => {
    const p = APP.prods[i], iR = APP.iRef.get(p.ref);
    const rs = iR == null ? [] : linhas.filter(r => r[C.REF] === iR);
    const cart = rs.reduce((s, r) => s + (r[C.CART] || 0), 0), fat = rs.reduce((s, r) => s + (r[C.FAT] || 0), 0);
    return { p, rs, cart, fat };
  }).sort((a, b) => (igual(b.p) - igual(a.p)) || ((b.cart + b.fat) - (a.cart + a.fat)));
  const html = [], txt = [];
  for (const { p, rs, cart, fat } of itens.slice(0, 5)) {
    const f = APP.fichas[p.ref] || {};
    const linha = [...new Set(rs.map(r => D.faixa[r[C.FAIXA]]).filter(Boolean))].join(', ');
    const marca = p.marca || (rs.length ? (ehUA(D.marca[rs[0][C.MARCA]]) ? 'Under Armour' : 'Olympikus') : '');
    const coresPed = [...new Set(rs.map(r => D.cor[r[C.COR]]).filter(Boolean))];
    const cores = coresPed.length ? coresPed : [...p.cores];
    // A ficha técnica traz o preço como texto, ora "129,99", ora "599.99".
    const ps = String(f.precoSugerido || '').trim();
    const precoFicha = /,\d{1,2}$/.test(ps) ? Number(ps.replace(/\./g, '').replace(',', '.')) : Number(ps);
    const preco = precoFicha > 0 ? reais(precoFicha) : p.preco ? reais(p.preco) : '';
    const clientes = new Set(rs.map(r => r[C.CLI])).size;
    const campos = [
      ['Referência', p.ref], ['Marca', marca], ['Linha', linha], ['Segmento', p.segmento], ['Gênero', p.genero || f.genero],
      ['Preço sugerido', preco], ['Coleção', f.colecao], ['Pisada', f.pisada], ['Composição', f.composicao],
      ['Tecnologias', (f.tecnologias || []).join(', ')],
      ['Cores' + (coresPed.length ? ' com pedido' : ''), cores.join(', ')],
      ['Pedidos', rs.length ? `${fmt(cart)} pares a faturar, ${fmt(fat)} faturados, em ${fmt(clientes)} cliente${clientes === 1 ? '' : 's'}` : 'nenhum pedido na base'],
    ].filter(([, v]) => v);
    const nome = p.desc || p.nome || p.ref;
    html.push(`<div class="ficha"><div class="ficha-tit">${esc(nome)}</div>` +
      campos.map(([k, v]) => `<div class="ficha-l"><span>${esc(k)}</span><div>${esc(v)}</div></div>`).join('') +
      (f.descricao ? `<div class="ficha-desc">${esc(String(f.descricao).slice(0, 260))}${String(f.descricao).length > 260 ? '…' : ''}</div>` : '') + '</div>');
    txt.push(`Produto ${nome}\n` + campos.map(([k, v]) => `${k}: ${v}`).join('\n') + (f.descricao ? `\nDescrição: ${String(f.descricao).slice(0, 400)}` : ''));
  }
  const mais = itens.length > 5 ? `<div class="digitando">E mais ${itens.length - 5} produto(s) com esse nome: seja mais específico para ver.</div>` : '';
  return { ficha: html.join('') + mais, fichaTexto: txt.join('\n\n') };
}

function fichaCliente(sCli, linhas) {
  const D = APP.dic;
  // Códigos diferentes com o mesmo nome (filiais) ficam numa ficha só.
  const porNome = new Map();
  for (const c of sCli) { const n = D.cli[c][1]; if (!porNome.has(n)) porNome.set(n, []); porNome.get(n).push(c); }
  const html = [], txt = [];
  for (const [nome, cods] of [...porNome].slice(0, 5)) {
    const set = new Set(cods), rs = linhas.filter(r => set.has(r[C.CLI]));
    const cart = rs.reduce((s, r) => s + (r[C.CART] || 0), 0), fat = rs.reduce((s, r) => s + (r[C.FAT] || 0), 0);
    const prev = rs.filter(r => r[C.CART] > 0 && r[C.PREV] >= 0).map(r => r[C.PREV]);
    const dfat = rs.filter(r => r[C.FAT] > 0 && r[C.DFAT] >= 0).map(r => r[C.DFAT]);
    const fant = [...new Set(cods.map(c => APP.fantasia[String(D.cli[c][0])]).filter(f => f && norm(f) !== norm(nome)))];
    const marcas = [...new Set(rs.map(r => ehUA(D.marca[r[C.MARCA]]) ? 'Under Armour' : 'Olympikus'))];
    // Do cadastro do portal; com várias filiais, cada valor diferente aparece uma vez.
    const cad = cods.map(c => APP.cad?.get(String(D.cli[c][0]))).filter(Boolean);
    const doCad = (f, fmtar = v => v) => [...new Set(cad.map(c => c[f]).filter(Boolean).map(fmtar))].join(', ');
    const campos = [
      ['Código', cods.map(c => D.cli[c][0]).join(', ')], ['Nome fantasia', fant.join(', ')],
      ['Razão social', doCad('razao')], ['CNPJ', doCad('doc', fmtDoc)],
      ['Cidade', [...new Set(cad.filter(c => c.cidade).map(c => `${c.cidade}${c.uf ? '/' + c.uf : ''}`))].join(', ')],
      ['Telefone', doCad('tel')], ['E-mail NF-e', doCad('emailNfe')], ['E-mail bancário', doCad('emailBanc')], ['À vista', doCad('avista')],
      ['Vendedor', [...new Set(rs.map(r => D.prep[r[C.PREP]]))].join(', ') || doCad('vendedor')], ['Marcas', marcas.join(', ')],
      ...(rs.length ? [['Carteira', `${fmt(cart)} pares a faturar`], ['Faturado', `${fmt(fat)} pares`],
        ['Produtos', `${fmt(new Set(rs.map(r => r[C.REF])).size)} referências pedidas`]] : [['Pedidos', 'nenhum pedido na Detalhada']]),
      ['Próxima previsão', prev.length ? dataDe(Math.min(...prev)) : ''], ['Último faturamento', dfat.length ? dataDe(Math.max(...dfat)) : ''],
    ].filter(([, v]) => v);
    html.push(`<div class="ficha"><div class="ficha-tit">${esc(nome)}</div>` + campos.map(([k, v]) => `<div class="ficha-l"><span>${esc(k)}</span><div>${esc(v)}</div></div>`).join('') + '</div>');
    txt.push(`Cliente ${nome}\n` + campos.map(([k, v]) => `${k}: ${v}`).join('\n'));
  }
  const mais = porNome.size > 5 ? `<div class="digitando">E mais ${porNome.size - 5} cliente(s) com esse nome.</div>` : '';
  return { ficha: html.join('') + mais, fichaTexto: txt.join('\n\n') };
}

const ROTULO_TIPO = {
  ficha: 'Ficha',
  carteira: 'Carteira (a faturar)', faturado: 'Faturado', pedidos: 'Pedidos (faturado + carteira)',
  compraram: 'Clientes que compraram', nao_compraram: 'Clientes que não compraram',
  catalogo: 'Catálogo da carteira', entradas: 'Entradas na carteira', saidas: 'Saídas da carteira',
};
// Quem gera o catálogo é a própria Detalhada (mesmo arquivo do botão de lá).
// Caminho relativo: no GitHub Pages as duas pastas moram lado a lado.
const DETALHADA_URL = '../../apps-oly-v2/detalhada/';

function executar(q) {
  const D = APP.dic, X = indices();
  const tipo = ROTULO_TIPO[q.tipo] ? q.tipo : 'nao_entendi';
  q.limite = Number(q.limite) > 0 ? Math.floor(Number(q.limite)) : 0;
  if (tipo === 'nao_entendi') return { pede: true, erro: (q.duvida ? q.duvida + ' ' : '') + 'Pode explicar de outro jeito? Falo de carteira, faturado e de quem comprou ou não comprou um produto.' };

  const entendi = [`<b>${ROTULO_TIPO[tipo]}</b>`];
  const falta = [];
  let escolha = null;   // "Você quis dizer…?" — a primeira dúvida que aparecer
  const exato = q._exato || {};
  // Acha o termo do campo na lista. Sem nada parecido, anota em `falta`;
  // com um só nome bem perto, segue com ele e avisa; com vários, pergunta.
  const pegar = (lista, campo, rotulo, mostra, perguntaSeVarios) => {
    const termo = q[campo];
    if (!termo) return null;
    let achou = exato[campo] ? lista.filter(x => x.txt === exato[campo]).map(x => x.i) : casar(lista, termo);
    let nota = '';
    if (!exato[campo] && achou && achou.length && perguntaSeVarios && !(q._todos || {})[campo]) {
      const nomesDif = [...new Set(achou.map(i => lista.find(x => x.i === i).txt))];
      if (nomesDif.length > 1 && nomesDif.length <= 8 && !escolha) {
        escolha = { campo, rotulo, termo, opcoes: nomesDif, todos: true };
      }
    }
    if (!achou || !achou.length) {
      const cand = parecidos(lista, termo);
      const [a, b] = cand;
      if (a && ((a.nota >= 0.85 && (!b || b.nota <= a.nota - 0.1)) || (!b && a.nota >= 0.8))) {
        achou = a.idx;
        nota = ` <i>(você escreveu “${esc(termo)}”)</i>`;
      } else if (cand.length) {
        if (!escolha) escolha = { campo, rotulo, termo, opcoes: cand.slice(0, 4).map(c => c.nome) };
        return new Set();
      } else { falta.push(`${rotulo} “${termo}”`); return new Set(); }
    }
    const nomes = [...new Set(achou.map(mostra))];
    entendi.push(`${rotulo}: ${esc(nomes.slice(0, 4).join(', '))}${nomes.length > 4 ? ` e mais ${nomes.length - 4}` : ''}${nota}`);
    return new Set(achou);
  };

  // A IA às vezes manda a cor grudada no produto ("SWIFT 6 PECDUN"): se o
  // nome inteiro não casa, a palavra que é código de cor vira o filtro de cor.
  if (q.produto && !q.cor && !exato.produto) {
    const lista = tipo === 'ficha' && X.prod ? X.prod : X.ref;
    const achou = casar(lista, q.produto);
    if (!achou || !achou.length) {
      const cores = new Set(X.cor.map(x => x.cod));
      const pal = norm(q.produto).split(/\s+/);
      const ehCor = pal.filter(w => cores.has(w));
      if (ehCor.length === 1 && pal.length > 1) {
        q = { ...q, produto: pal.filter(w => w !== ehCor[0]).join(' '), cor: ehCor[0] };
      }
    }
  }

  let p = prepAtivo();
  if (q.vendedor && APP.veTudo && p < 0) {
    const s = pegar(X.prep, 'vendedor', 'vendedor', i => D.prep[i]);
    if (s && s.size) p = [...s][0];
  } else if (p >= 0) entendi.push(`vendedor: ${esc(D.prep[p])}`);
  // Cliente só entre os do vendedor: senão "achava" o cliente de outro e
  // respondia "nenhum par", como se ele não tivesse pedido nada.
  const meus = p < 0 ? null : new Set([...APP.L.filter(r => r[C.PREP] === p).map(r => r[C.CLI]), ...soCadDele()]);
  // Cliente com nomes diferentes que casam ("ARMAZEM" → Paraíba e Eldorado)
  // pergunta qual; produto não, porque "CORRE" juntando a família é o esperado.
  const sCli = pegar(meus ? X.cli.filter(x => meus.has(x.i)) : X.cli, 'cliente', 'cliente', i => D.cli[i][1], true);
  // Na ficha, o produto vale mesmo sem pedido: procura também no catálogo.
  const sRef = tipo === 'ficha' && X.prod
    ? pegar(X.prod, 'produto', 'produto', i => `${APP.prods[i].desc || APP.prods[i].nome} (${APP.prods[i].ref})`)
    : pegar(X.ref, 'produto', 'produto', i => `${D.ref[i][1]} (${D.ref[i][0]})`);
  const sCor = pegar(X.cor, 'cor', 'cor', i => D.cor[i]);
  const sFx = pegar(X.faixa, 'linha', 'linha', i => D.faixa[i]);
  if (escolha) return { entendi, escolha };
  const marca = q.marca === 'UA' || q.marca === 'OLY' ? q.marca : null;
  if (marca) entendi.push(`marca: ${marca === 'UA' ? 'Under Armour' : 'Olympikus'}`);
  const de = /^\d{4}-\d{2}-\d{2}$/.test(q.de || '') ? diaDe(q.de) : null;
  const ate = /^\d{4}-\d{2}-\d{2}$/.test(q.ate || '') ? diaDe(q.ate) : null;
  if (de != null || ate != null) entendi.push(`período: ${de != null ? dataDe(de) : 'início'} a ${ate != null ? dataDe(ate) : 'fim'}`);
  if (falta.length) return { entendi, pede: true, erro: `Não achei ${falta.join(' nem ')} ${p >= 0 ? 'na carteira deste vendedor' : 'na base'}. Confira o nome e me diga de novo.` };

  /* ficha: o cadastro do produto ou do cliente, com os pares do vendedor */
  if (tipo === 'ficha') {
    if (!X.prod) return { entendi, erro: 'O catálogo de produtos ainda está carregando. Tente de novo em instantes.' };
    if (!(sRef && sRef.size) && !(sCli && sCli.size)) return { entendi, pede: true, erro: 'De qual produto ou cliente? Diga o nome, o modelo ou o código.' };
    const minhas = APP.L.filter(r => p < 0 || r[C.PREP] === p);
    const out = { entendi };
    if (sRef && sRef.size) {
      const daqui = sCli && sCli.size ? minhas.filter(r => sCli.has(r[C.CLI])) : minhas;
      Object.assign(out, fichaProduto(sRef, daqui, q._exato?.produto || q.produto));
    } else Object.assign(out, fichaCliente(sCli, minhas));
    return out;
  }

  /* catálogo: só precisa do cliente e do formato; o resto (filtros, grade,
     fotos, repasse) é a Detalhada que resolve, igual ao botão de lá. */
  if (tipo === 'catalogo') {
    if (!sCli || !sCli.size) return { entendi, pede: true, erro: 'De qual cliente? Diga o nome ou o código.' };
    const cods = [...sCli].map(i => String(D.cli[i][0]));
    const formato = q.formato === 'pdf' || q.formato === 'xlsx' ? q.formato : null;
    const imagens = q.imagens === true || q.imagens === false ? q.imagens : null;
    if (formato) entendi.push(formato === 'pdf' ? 'PDF' : `Excel${imagens == null ? '' : imagens ? ' com imagens' : ' sem imagens'}`);
    const nomes = [...new Set([...sCli].map(i => D.cli[i][1]))];
    return { entendi, catalogo: { cods, nome: nomes.join(', '), formato, imagens } };
  }

  const doProduto = r => (!sRef || sRef.has(r[C.REF])) && (!sCor || sCor.has(r[C.COR])) &&
    (!sFx || sFx.has(r[C.FAIXA])) && (!marca || (marca === 'UA') === ehUA(D.marca[r[C.MARCA]]));
  const noPeriodo = d => d >= 0 && (de == null || d >= de) && (ate == null || d <= ate);
  // Quanto da linha conta para o tipo, e em que dia
  const partes = r => {
    const out = [];
    if (tipo !== 'faturado' && r[C.CART] > 0) out.push([r[C.CART], r[C.PREV]]);
    if (tipo !== 'carteira' && r[C.FAT] > 0) out.push([r[C.FAT], r[C.DFAT] >= 0 ? r[C.DFAT] : r[C.PREV]]);
    return out;
  };

  const linhas = APP.L.filter(r => (p < 0 || r[C.PREP] === p) && (!sCli || sCli.has(r[C.CLI])));
  const mostraVend = APP.veTudo && p < 0;
  const vendDoCli = new Map();
  if (mostraVend) for (const r of linhas) if (!vendDoCli.has(r[C.CLI])) vendDoCli.set(r[C.CLI], D.prep[r[C.PREP]]);

  /* não compraram: todo cliente do vendedor que aparece na base, menos quem
     teve pedido do produto no período. Os maiores clientes vêm primeiro. */
  if (tipo === 'nao_compraram' || tipo === 'compraram') {
    if (!sRef && !sFx && !marca && !sCor) return { entendi, pede: true, erro: 'De qual produto? Diga o modelo, a referência ou a linha.' };
    const total = new Map(), ult = new Map(), doProd = new Map(), ultProd = new Map();
    for (const r of linhas) {
      for (const [qt, d] of partes(r)) {
        const c = r[C.CLI];
        total.set(c, (total.get(c) || 0) + qt);
        if (d > (ult.get(c) ?? -1)) ult.set(c, d);
        if (doProduto(r) && noPeriodo(d)) {
          doProd.set(c, (doProd.get(c) || 0) + qt);
          if (d > (ultProd.get(c) ?? -1)) ultProd.set(c, d);
        }
      }
    }
    const lista = tipo === 'compraram' ? [...doProd.keys()] : [...total.keys()].filter(c => !doProd.has(c));
    const cols = ['Cliente', 'Código', ...(mostraVend ? ['Vendedor'] : []),
      tipo === 'compraram' ? 'Pares do produto' : 'Pares (tudo)', tipo === 'compraram' ? 'Último pedido' : 'Último pedido (qualquer)'];
    const rows = lista.map(c => ({
      v: [D.cli[c][1], D.cli[c][0], ...(mostraVend ? [vendDoCli.get(c)] : []),
        tipo === 'compraram' ? doProd.get(c) : total.get(c), tipo === 'compraram' ? ultProd.get(c) : ult.get(c)],
      ord: tipo === 'compraram' ? doProd.get(c) : total.get(c),
    })).sort((a, b) => b.ord - a.ord);
    if (q.limite > 0) rows.length = Math.min(rows.length, q.limite);
    const n = rows.length;
    return {
      entendi, cols, num: [cols.length - 2], data: [cols.length - 1],
      rows: rows.map(x => x.v),
      resumo: tipo === 'compraram'
        ? `${fmt(n)} cliente${n === 1 ? '' : 's'} compraram · ${fmt(rows.reduce((s, x) => s + x.ord, 0))} pares`
        : `${fmt(n)} cliente${n === 1 ? '' : 's'} sem pedido desse produto${de != null || ate != null ? ' no período' : ''}, de ${fmt(total.size)} na carteira`,
    };
  }

  /* Daqui em diante tudo vira "fato": quanto, de quê (a medida), em que dia,
     de qual cliente/produto/vendedor. Carteira, faturado e pedidos saem das
     linhas da base; entradas e saídas, do registro do mês (o mesmo do
     relatório Entradas e saídas da Detalhada). A tabela é uma só. */
  const fatos = [];
  let aviso = '';
  if (tipo === 'entradas' || tipo === 'saidas') {
    const mov = APP.base && APP.base.mov;
    if (!mov || !Array.isArray(mov.ev)) return { entendi, erro: 'A base de hoje veio sem o registro de entradas e saídas.' };
    const md = mov.dic;
    const inicio = diaDe(mov.mes + '-01');
    if (de != null && de < inicio) aviso = `O registro de entradas e saídas começa em ${dataDe(inicio)}: ele zera a cada mês.`;
    // O registro tem dicionário próprio: casa por código e nome com o da base.
    const codCli = sCli ? new Set([...sCli].map(i => String(D.cli[i][0]))) : null;
    const codRef = sRef ? new Set([...sRef].map(i => String(D.ref[i][0]))) : null;
    const nomeCor = sCor ? new Set([...sCor].map(i => String(D.cor[i]))) : null;
    const nomeFx = sFx ? new Set([...sFx].map(i => String(D.faixa[i]))) : null;
    const prepNome = p >= 0 ? norm(D.prep[p]) : null;
    const quer = tipo === 'entradas' ? 'e' : 's';
    for (const e of mov.ev) {
      const [dia, t, gci, iRef, iCor, iCli, iPrep, iMarca, iFaixa, prev, qt, motivo] = e;
      if (t !== quer || !noPeriodo(dia)) continue;
      const prep = String(md.prep[iPrep] || ''), cli = md.cli[iCli] || ['', ''], ref = md.ref[iRef] || ['', ''];
      const cor = String(md.cor[iCor] || ''), fx = String(md.faixa[iFaixa] || ''), mc = String(md.marca[iMarca] || '');
      if (prepNome && norm(prep) !== prepNome) continue;
      if ((codCli && !codCli.has(String(cli[0]))) || (codRef && !codRef.has(String(ref[0]))) ||
          (nomeCor && !nomeCor.has(cor)) || (nomeFx && !nomeFx.has(fx)) || (marca && (marca === 'UA') !== ehUA(mc))) continue;
      fatos.push({ m: tipo === 'entradas' ? 'ent' : (motivo || 'chk'), qt, dia, gci,
        cliCod: String(cli[0]), cliNome: String(cli[1] || cli[0]), prep, refCod: String(ref[0]), refNome: String(ref[1] || ref[0]), cor });
    }
  } else {
    for (const r of linhas) {
      if (!doProduto(r)) continue;
      const base = { gci: r[C.GCI], cliCod: String(D.cli[r[C.CLI]][0]), cliNome: D.cli[r[C.CLI]][1], prep: D.prep[r[C.PREP]],
        refCod: String(D.ref[r[C.REF]][0]), refNome: D.ref[r[C.REF]][1], cor: D.cor[r[C.COR]] };
      if (tipo !== 'faturado' && r[C.CART] > 0 && noPeriodo(r[C.PREV])) fatos.push({ ...base, m: 'cart', qt: r[C.CART], dia: r[C.PREV] });
      if (tipo !== 'carteira' && r[C.FAT] > 0) {
        const d = r[C.DFAT] >= 0 ? r[C.DFAT] : r[C.PREV];
        if (noPeriodo(d)) fatos.push({ ...base, m: 'fat', qt: r[C.FAT], dia: d });
      }
    }
  }

  // As colunas de número de cada tipo, na ordem em que aparecem.
  const MEDIDAS = {
    carteira: [['Carteira', f => f.m === 'cart']],
    faturado: [['Faturado', f => f.m === 'fat']],
    pedidos: [['Carteira', f => f.m === 'cart'], ['Faturado', f => f.m === 'fat'], ['Total', () => true]],
    entradas: [['Pares', () => true]],
    saidas: [['Faturou', f => f.m === 'fat'], ['Sem nota (transf.)', f => f.m === 'trf'], ['A confirmar', f => f.m === 'chk'], ['Total', () => true]],
  }[tipo];
  const somaDe = lista => MEDIDAS.map(([, ok]) => lista.reduce((s, f) => s + (ok(f) ? f.qt : 0), 0));
  const tot = somaDe(fatos);
  const totPares = tot[tot.length - 1];
  const nClis = new Set(fatos.map(f => f.cliCod)).size;
  const nEnc = new Set(fatos.map(f => f.cliCod + '|' + f.gci)).size;
  const movimento = tipo === 'entradas' || tipo === 'saidas';
  let resumo;
  if (!fatos.length) resumo = 'Nenhum par encontrado com esses filtros.';
  else if (tipo === 'pedidos') resumo = `${fmt(tot[0])} pares em carteira · ${fmt(tot[1])} faturados · ${fmt(tot[2])} no total`;
  else if (tipo === 'saidas') resumo = `${fmt(totPares)} pares saíram · ${fmt(nEnc)} encomendas · ${fmt(nClis)} clientes (faturou ${fmt(tot[0])} · sem nota ${fmt(tot[1])} · a confirmar ${fmt(tot[2])})`;
  else if (tipo === 'entradas') resumo = `${fmt(totPares)} pares entraram · ${fmt(nEnc)} encomendas · ${fmt(nClis)} clientes`;
  else resumo = `${fmt(totPares)} pares ${tipo === 'carteira' ? 'em carteira' : 'faturados'} · ${fmt(nClis)} cliente${nClis === 1 ? '' : 's'}`;

  const AGRUPAR = ['cliente', 'produto', 'produto_cor', 'mes', 'dia', 'vendedor', 'nenhum'];
  let agrupar = AGRUPAR.includes(q.agrupar) ? q.agrupar : null;
  const automatico = !agrupar;
  if (!agrupar) agrupar = sCli ? 'produto_cor' : 'cliente';
  if (agrupar === 'vendedor' && !mostraVend) agrupar = 'cliente';
  const res = { entendi, tipo, agrupar, resumo, aviso, rows: [], cols: [], num: [], data: [] };
  if (agrupar === 'nenhum' || !fatos.length) return res;

  const ROT = {
    cliente: f => [f.cliNome, f.cliCod, ...(mostraVend ? [f.prep] : [])],
    produto: f => [f.refNome, f.refCod], produto_cor: f => [f.refNome, f.refCod, f.cor],
    mes: f => [mesDe(f.dia)], dia: f => [dataDe(f.dia)], vendedor: f => [f.prep],
  }[agrupar];
  const CAB = {
    cliente: ['Cliente', 'Código', ...(mostraVend ? ['Vendedor'] : [])], produto: ['Produto', 'Referência'],
    produto_cor: ['Produto', 'Referência', 'Cor'], mes: ['Mês'], dia: ['Dia'], vendedor: ['Vendedor'],
  }[agrupar];
  const grupos = new Map();
  for (const f of fatos) {
    const rot = ROT(f), k = rot.join('|');
    let g = grupos.get(k);
    if (!g) grupos.set(k, g = { rot, dia: f.dia, lista: [] });
    g.lista.push(f); if (f.dia < g.dia) g.dia = f.dia;
  }
  // Contagem de clientes onde ela diz algo; de encomendas no movimento.
  // Com um cliente só, "Clientes" daria sempre 1: a coluna sai.
  const semConta = agrupar === 'cliente' ? !movimento : (!movimento && sCli && sCli.size);
  const extra = semConta ? [] : [movimento ? 'Encomendas' : 'Clientes'];
  const conta = g => semConta ? []
    : movimento ? [new Set(g.lista.map(f => f.cliCod + '|' + f.gci)).size] : [new Set(g.lista.map(f => f.cliCod)).size];
  res.cols = [...CAB, ...extra, ...MEDIDAS.map(([n]) => n)];
  const cronologico = agrupar === 'mes' || agrupar === 'dia';
  let rows = [...grupos.values()].map(g => {
    const s = somaDe(g.lista);
    return { v: [...g.rot, ...conta(g), ...s], ord: cronologico ? -g.dia : s[s.length - 1] };
  }).sort((a, b) => b.ord - a.ord);

  // Lista grande sem ter pedido o jeito de agrupar: pergunta antes.
  if (automatico && !q._grande && rows.length > 300) return { ...res, grande: rows.length };
  if (q.limite > 0) { rows = rows.slice(0, q.limite); res.resumo += ` · mostrando os ${rows.length} maiores`; }
  // Linha de total só quando a tabela traz tudo: no "top 10" ela somaria o que não aparece.
  res.rows = rows.map(x => x.v);
  // Agrupado por cliente, vendedor ou data: ao tocar, os produtos do grupo (produto · cor · pares · GCI).
  if (movimento && !['produto', 'produto_cor'].includes(agrupar)) {
    const MOT = { fat: 'faturou', trf: 'sem nota', chk: 'a confirmar' };
    const itensDe = new Map();
    for (const [k, g] of grupos) {
      const m = new Map();
      for (const f of g.lista) { const kk = [f.refNome, f.cor, f.gci, f.m].join('|'); const x = m.get(kk) || { f, qt: 0 }; x.qt += f.qt; m.set(kk, x); }
      const ls = [...m.values()].sort((a, b) => b.qt - a.qt);
      itensDe.set(k, ls.slice(0, 40).map(({ f, qt }) => `${f.refNome} ${f.cor} · ${fmt(qt)} pares · GCI ${f.gci}${tipo === 'saidas' ? ' · ' + (MOT[f.m] || f.m) : ''}${agrupar !== 'cliente' ? ' · ' + f.cliNome : ''}`).join('\n') + (ls.length > 40 ? `\n… e mais ${ls.length - 40}` : ''));
    }
    res.detalhe = row => itensDe.get(row.slice(0, CAB.length).join('|')) || '';
  }
  res.num = res.cols.map((_, j) => j).filter(j => j >= CAB.length);
  if (!(q.limite > 0)) res.totais = res.cols.map((_, j) => j === 0 ? 'Total' : j >= res.cols.length - MEDIDAS.length ? tot[j - (res.cols.length - MEDIDAS.length)] : '');
  return res;
}

/* ── tela ─────────────────────────────────────────────── */
function rolar() { const m = $('main'); m.scrollTop = m.scrollHeight; }

function addMsg(quem, html) {
  const d = document.createElement('div');
  d.className = 'msg ' + quem;
  // A hora mora num atributo: as respostas trocam o conteúdo do balão
  // (innerHTML) e ela continua lá, desenhada pelo ::after.
  const agora = new Date();
  // O robô do cabeçalho vai ao lado de cada balão da IA, como foto de contato.
  const av = quem === 'ia' ? `<div class="av">${document.querySelector('header .robo').outerHTML}</div>` : '';
  d.innerHTML = `${av}<div class="bolha" data-hora="${String(agora.getHours()).padStart(2, '0')}:${String(agora.getMinutes()).padStart(2, '0')}">${html}</div>`;
  $('conversa').appendChild(d);
  rolar();
  return d.querySelector('.bolha');
}

// "Digitando…" do WhatsApp: três pontinhos pulando e, embaixo, o que ele está fazendo.
const digitando = rot => `<span class="dots" aria-label="digitando"><i></i><i></i><i></i></span>${rot ? `<span class="dots-rot">${esc(rot)}</span>` : ''}`;
// Quando o Nexo vai buscar alguma coisa (consulta, PDF do EBM, boleto, DAE, Excel), a ampulheta diz que está trabalhando.
// Os três pontinhos ficam só para o "pensando" antes de ele escolher o que buscar.
const ampulheta = rot => `<span class="ampulheta" role="status"><svg viewBox="0 0 24 24" aria-hidden="true">` +
  `<path class="am-areia am-cima" d="M8.4 5.2h7.2c-.7 2-2.3 3.3-3.6 4.2-1.3-.9-2.9-2.2-3.6-4.2z"/>` +
  `<path class="am-areia am-baixo" d="M7.9 20.6h8.2c-.6-2-2.3-3.3-4.1-4-1.8.7-3.5 2-4.1 4z"/>` +
  `<line class="am-fio" x1="12" y1="10.4" x2="12" y2="17"/>` +
  `<path class="am-moldura" d="M5.5 2.5h13M5.5 21.5h13M7 2.5c0 5 4.2 6.6 4.2 9.5S7 16.5 7 21.5M17 2.5c0 5-4.2 6.6-4.2 9.5s4.2 4.5 4.2 9.5"/>` +
  `</svg>${rot ? `<span class="am-rot">${esc(rot)}</span>` : ''}</span>`;

/* ── arquivos no chat ──────────────────────────────────────
   Todo arquivo que passa pelo Nexo (PDF do robô, boleto, DAE, Excel e PDF das
   tabelas) vira um cartão na conversa: capa, nome e três botões. "Ver" abre ali
   mesmo, sem sair do chat; "WhatsApp" manda o arquivo de verdade pelo
   compartilhar do aparelho (Android, iPhone e o Windows têm); onde não há,
   baixa e abre o WhatsApp para anexar. O PDF da extensão do EBM não passa
   pela página: esse continua indo direto para os downloads. */
const ARQ = new Map();
let _arqSeq = 0;
const tipoArq = nome => /\.xlsx?$/i.test(nome) ? 'xlsx' : 'pdf';
function cartaoArquivo({ url, blob, nome, rotulo }) {
  const id = 'a' + (++_arqSeq), tipo = tipoArq(nome);
  ARQ.set(id, { url, blob, nome, tipo });
  return `<div class="arq" data-arq="${id}">` +
    `<button class="arq-capa ${tipo}" data-arq-ver="${id}" aria-label="Ver ${esc(nome)}"><span>${tipo === 'xlsx' ? 'XLSX' : 'PDF'}</span></button>` +
    `<div class="arq-info"><div class="arq-nome">${esc(rotulo || nome)}</div><div class="arq-meta">${rotulo ? esc(nome) : (tipo === 'xlsx' ? 'Planilha do Excel' : 'Documento PDF')}</div>` +
    `</div><div class="arq-bts"><button class="arq-bt" data-arq-ver="${id}">Ver</button>` +
    `<button class="arq-bt wa" data-arq-wa="${id}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.3-.5 0-1 .2-3.3-.7-2.8-1.1-4.5-3.9-4.7-4.1-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.3 0 .5l-.4.6-.4.4c-.1.1-.3.3-.1.6.2.3.7 1.2 1.6 2 1.1 1 2 1.3 2.3 1.4.3.2.4.1.6-.1l.8-1c.2-.3.4-.2.6-.1l2 .9c.3.1.5.2.5.3.1.2.1.7-.2 1.3z"/></svg>WhatsApp</button>` +
    `<button class="arq-bt" data-arq-baixar="${id}">Baixar</button></div><div class="dots-rot arq-st"></div></div>`;
}
async function arqBlob(id) {
  const a = ARQ.get(id);
  if (!a.blob) { const r = await fetch(a.url); if (!r.ok) throw new Error('o arquivo não está mais no robô'); a.blob = await r.blob(); }
  return a.blob;
}
async function carregarPdfJs() {
  if (!window.pdfjsLib) {
    await carregarScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }
  return window.pdfjsLib;
}
async function abrirPdf(id) {
  const a = ARQ.get(id);
  if (!a.pdf) a.pdf = (await carregarPdfJs()).getDocument({ data: new Uint8Array(await (await arqBlob(id)).arrayBuffer()) }).promise;
  return a.pdf;
}
async function pagina(pdf, n, largura) {
  const p = await pdf.getPage(n), v0 = p.getViewport({ scale: 1 }), esc2 = largura / v0.width, dpr = Math.min(2, window.devicePixelRatio || 1);
  const v = p.getViewport({ scale: esc2 * dpr }), c = document.createElement('canvas');
  c.width = v.width; c.height = v.height; c.style.width = Math.round(v.width / dpr) + 'px';
  await p.render({ canvasContext: c.getContext('2d'), viewport: v }).promise;
  return c;
}
// A capa (primeira página) e quantas páginas: desenhada quando o cartão aparece.
async function prepararCartao(el) {
  el.dataset.pronto = '1';
  const id = el.dataset.arq, a = ARQ.get(id), meta = el.querySelector('.arq-meta');
  if (!a || a.tipo !== 'pdf') return;
  try {
    const pdf = await abrirPdf(id), capa = el.querySelector('.arq-capa'), c = await pagina(pdf, 1, 64);
    capa.innerHTML = ''; capa.appendChild(c); capa.classList.add('com-capa');
    meta.textContent = `${meta.textContent ? meta.textContent + ' · ' : ''}${pdf.numPages} página${pdf.numPages > 1 ? 's' : ''}`;
  } catch (_) { /* sem capa: fica o selo PDF */ }
}
new MutationObserver(() => document.querySelectorAll('.arq:not([data-pronto])').forEach(prepararCartao))
  .observe(document.documentElement, { childList: true, subtree: true });

function fecharVisor() { const v = document.querySelector('.visor'); if (v) v.remove(); document.body.style.overflow = ''; }
async function verArquivo(id) {
  const a = ARQ.get(id);
  fecharVisor();
  const v = document.createElement('div');
  v.className = 'visor'; v.setAttribute('role', 'dialog'); v.setAttribute('aria-label', a.nome);
  v.innerHTML = `<div class="visor-top"><button class="visor-x" data-visor-fechar aria-label="Fechar">✕</button><div class="t">${esc(a.nome)}</div>` +
    `<button class="arq-bt wa" data-arq-wa="${id}">WhatsApp</button><button class="arq-bt" data-arq-baixar="${id}">Baixar</button></div>` +
    `<div class="visor-corpo">${ampulheta('Abrindo o arquivo…')}</div>`;
  document.body.appendChild(v); document.body.style.overflow = 'hidden';
  const corpo = v.querySelector('.visor-corpo');
  try {
    if (a.tipo === 'pdf') {
      const pdf = await abrirPdf(id), larg = Math.min(900, corpo.clientWidth - 16);
      corpo.innerHTML = '';
      for (let n = 1; n <= pdf.numPages; n++) { if (!v.isConnected) return; corpo.appendChild(await pagina(pdf, n, larg)); }
    } else {
      if (typeof XLSX === 'undefined') await carregarScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js');
      const wb = XLSX.read(new Uint8Array(await (await arqBlob(id)).arrayBuffer()), { type: 'array' });
      corpo.innerHTML = `<div class="visor-planilha">${XLSX.utils.sheet_to_html(wb.Sheets[wb.SheetNames[0]], { header: '', footer: '' })}</div>`;
    }
  } catch (e) { corpo.innerHTML = `<div class="visor-erro">Não consegui abrir: ${esc(e.message || e)}</div>`; }
}
async function baixarArquivo(id) {
  const a = ARQ.get(id), u = URL.createObjectURL(await arqBlob(id)), l = document.createElement('a');
  l.href = u; l.download = a.nome; l.style.display = 'none'; document.body.appendChild(l); l.click(); l.remove();
  setTimeout(() => URL.revokeObjectURL(u), 60000);
}
async function whatsArquivo(id, st) {
  const a = ARQ.get(id), blob = await arqBlob(id);
  const f = new File([blob], a.nome, { type: a.tipo === 'pdf' ? 'application/pdf' : 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  if (navigator.canShare && navigator.canShare({ files: [f] })) {
    try { await navigator.share({ files: [f], title: a.nome }); } catch (e) { if (e.name !== 'AbortError') throw e; }
    return;
  }
  // Sem o compartilhar do aparelho (endereço sem https, navegador antigo): baixa e abre o WhatsApp para anexar.
  await baixarArquivo(id);
  window.open('https://wa.me/', '_blank', 'noopener');
  if (st) st.textContent = 'Este navegador não manda arquivo direto: ele foi baixado. Na conversa do WhatsApp, toque no clipe e anexe.';
}
document.addEventListener('click', async ev => {
  if (ev.target.closest('[data-visor-fechar]') || ev.target.classList.contains('visor')) { fecharVisor(); return; }
  const b = ev.target.closest('[data-arq-ver],[data-arq-wa],[data-arq-baixar]');
  if (!b) return;
  ev.stopPropagation();
  const st = b.closest('.arq')?.querySelector('.arq-st');
  try {
    if (b.dataset.arqVer) await verArquivo(b.dataset.arqVer);
    else if (b.dataset.arqWa) await whatsArquivo(b.dataset.arqWa, st);
    else await baixarArquivo(b.dataset.arqBaixar);
  } catch (e) { if (st) { st.textContent = 'Não deu: ' + (e.message || e); st.style.color = 'var(--erro)'; } else alert('Não deu: ' + (e.message || e)); }
}, true);
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') fecharVisor(); });

function tabelaHtml(res, limite) {
  const cel = (v, j) => {
    if (res.data.includes(j)) return `<td>${v != null && v >= 0 ? dataDe(v) : ''}</td>`;
    if (res.num.includes(j)) return `<td class="n">${fmt(v)}</td>`;
    // Tabela compacta: ano curto na tela; o Excel e o PDF continuam com a data inteira.
    const ano = String(new Date().getFullYear());
    const txt = res.detalhe ? String(v == null ? '' : v).replace(/^(\d{2}\/\d{2})\/(\d{2})(\d{2})$/, (m, dm, a1, a2) => a1 + a2 === ano ? dm : `${dm}/${a2}`) : v;
    return `<td class="${j === 0 ? 'nome' : ''}">${esc(txt)}</td>`;
  };
  // res.oculta: colunas que só vão para o Excel/PDF. res.detalhe: o que abre ao tocar na linha.
  const mostra = res.cols.map((_, j) => j).filter(j => !(res.oculta || []).includes(j));
  const linha = r => {
    const g = res.pdfLinha ? res.pdfLinha(r) : null;
    const bot = res.pdfLinha ? `<td class="com-pdf">${g ? `<button class="pdf-mini" data-pedido-pdf="${esc(JSON.stringify(g))}" title="Gerar o PDF deste pedido">PDF</button>` : ''}</td>` : '';
    const tds = mostra.map(j => cel(r[j], j)).join('') + bot;
    return res.detalhe ? `<tr class="tem-det" onclick="if (!event.target.closest('button')) this.nextElementSibling.hidden = !this.nextElementSibling.hidden">${tds}</tr><tr class="det" hidden><td colspan="${mostra.length + (res.pdfLinha ? 1 : 0)}">${esc(res.detalhe(r))}</td></tr>` : `<tr>${tds}</tr>`;
  };
  const corpo = res.rows.slice(0, limite).map(linha).join('');
  const tot = res.totais ? `<tr class="total">${mostra.map((j, i) => { const v = res.totais[j]; return i === 0 ? '<td>Total</td>' : v === '' || v == null ? '<td></td>' : `<td class="n">${fmt(v)}</td>`; }).join('')}${res.pdfLinha ? '<td></td>' : ''}</tr>` : '';
  return `<div class="tabela-wrap${res.detalhe ? ' compacta' : ''}"><table><thead><tr>${mostra.map(j => `<th class="${res.num.includes(j) ? 'n' : ''}">${esc((res.curtos && res.curtos[res.cols[j]]) || res.cols[j])}</th>`).join('')}${res.pdfLinha ? '<th></th>' : ''}</tr></thead><tbody>${corpo}${limite >= res.rows.length ? tot : ''}</tbody></table></div>`;
}

/* ── planilha e PDF ────────────────────────────────────
   Mesmo desenho dos relatórios da Detalhada (RFV): título, linha de
   filtros, data de geração; no PDF, cabeçalho verde-água e rodapé com a
   página. As bibliotecas só carregam quando alguém pede o arquivo. */
const textoPlano = html => { const d = document.createElement('div'); d.innerHTML = html; return d.textContent; };

function carregarScript(src) {
  return new Promise((ok, nao) => {
    const t = document.createElement('script');
    t.src = src; t.onload = ok; t.onerror = nao;
    document.head.appendChild(t);
  });
}

function dadosExport(res) {
  const titulo = textoPlano(res.entendi[0]);
  const filtros = res.entendi.slice(1).map(textoPlano).join(' · ');
  const corpo = res.rows.map(r => r.map((v, j) => res.data.includes(j) ? (v != null && v >= 0 ? dataDe(v) : '') : v));
  if (res.totais) corpo.push(res.totais);
  const quando = new Date().toLocaleString('pt-BR');
  const nome = `Assistente - ${titulo.replace(/[()]/g, '')} - ${hojeIso().split('-').reverse().join('-')}`.replace(/[\\/:*?"<>|]/g, '');
  return { titulo, filtros, corpo, quando, nome, linhas: res.rows.length };
}

async function baixarXlsxFormatado(res) {
  if (typeof ExcelJS === 'undefined') await carregarScript('https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js');
  const x = dadosExport(res), wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet('Assistente', { views: [{ state: 'frozen', ySplit: 5, showGridLines: false }] });
  const fonte = { name: 'Calibri', size: 12 }, meio = { horizontal: 'center', vertical: 'middle' };
  const fina = { style: 'thin' }, borda = { top: fina, left: fina, bottom: fina, right: fina };
  [x.titulo, x.filtros || 'Sem filtros', `${fmt(x.linhas)} linha(s) · gerado em ${x.quando}`].forEach((t, i) => {
    const c = ws.getCell(i + 1, 1); c.value = t; c.font = fonte; c.alignment = { horizontal: 'center' };
  });
  const cab = ws.getRow(5);
  cab.values = res.cols; cab.height = 38.25;
  cab.eachCell(c => { c.font = fonte; c.alignment = { ...meio, wrapText: true }; c.border = borda; });
  x.corpo.forEach((linha, i) => {
    const row = ws.getRow(6 + i);
    row.values = linha;
    for (let j = 1; j <= res.cols.length; j++) {
      const c = row.getCell(j);
      c.font = fonte; c.alignment = { horizontal: 'center' }; c.border = borda;
      if (res.num.includes(j - 1) && typeof c.value === 'number') c.numFmt = '#,##0';
    }
  });
  (res.larguras || []).forEach((w, j) => { ws.getColumn(j + 1).width = w; });
  ws.autoFilter = { from: { row: 5, column: 1 }, to: { row: 5 + x.corpo.length, column: res.cols.length } };
  const dados = await wb.xlsx.writeBuffer();
  return { blob: new Blob([dados], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), nome: x.nome + '.xlsx' };
}

async function baixarXlsx(res) {
  if (res.formatado) return baixarXlsxFormatado(res);
  if (typeof XLSX === 'undefined') await carregarScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js');
  const x = dadosExport(res);
  const aoa = [[x.titulo], [x.filtros || 'Sem filtros'], [`${fmt(x.linhas)} linha(s) · gerado em ${x.quando}`], [], res.cols, ...x.corpo];
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  const linhaCab = 4;
  ws['!cols'] = res.cols.map((c, i) => ({ wch: (res.larguras && res.larguras[i]) || (i === 0 ? 38 : Math.max(10, c.length + 3)) }));
  ws['!autofilter'] = { ref: XLSX.utils.encode_range({ s: { r: linhaCab, c: 0 }, e: { r: linhaCab + res.rows.length, c: res.cols.length - 1 } }) };
  for (let r = 0; r < x.corpo.length; r++) for (const c of res.num) {
    const cel = ws[XLSX.utils.encode_cell({ r: linhaCab + 1 + r, c })];
    if (cel && typeof cel.v === 'number') cel.z = '#,##0';
  }
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Assistente');
  const dados = XLSX.write(wb, { type: 'array', bookType: 'xlsx' });
  return { blob: new Blob([dados], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), nome: x.nome + '.xlsx' };
}

async function baixarPdf(res) {
  const pronto = () => window.jspdf && window.jspdf.jsPDF && typeof window.jspdf.jsPDF.API.autoTable === 'function';
  if (!pronto()) {
    await carregarScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    await carregarScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js');
  }
  const x = dadosExport(res);
  const doc = new window.jspdf.jsPDF({ orientation: res.cols.length > 4 ? 'landscape' : 'portrait', unit: 'pt', format: 'a4' });
  doc.setFont('helvetica', 'bold'); doc.setFontSize(13); doc.setTextColor(15, 118, 110);
  doc.text(x.titulo, 24, 34);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(110, 116, 110);
  doc.text(doc.splitTextToSize(x.filtros || 'Sem filtros', doc.internal.pageSize.getWidth() - 48), 24, 48);
  doc.text(`${fmt(x.linhas)} linha(s) · ${x.quando}`, 24, 62);
  const colunas = {};
  res.cols.forEach((_, j) => { colunas[j] = { halign: res.num.includes(j) ? 'right' : 'left' }; });
  doc.autoTable({
    head: [res.cols],
    body: x.corpo.map(l => l.map((v, j) => typeof v === 'number' && res.num.includes(j) ? fmt(v) : v)),
    startY: 72, theme: 'grid',
    styles: { font: 'helvetica', fontSize: 8, cellPadding: 3, lineColor: [214, 222, 219], lineWidth: 0.4, textColor: [40, 46, 42] },
    headStyles: { fillColor: [15, 118, 110], textColor: 255 },
    alternateRowStyles: { fillColor: [244, 250, 248] },
    columnStyles: colunas,
    margin: { left: 24, right: 24, bottom: 28 },
    didParseCell: d => { if (res.totais && d.section === 'body' && d.row.index === x.corpo.length - 1) d.cell.styles.fontStyle = 'bold'; },
    didDrawPage: () => {
      const alt = doc.internal.pageSize.getHeight(), larg = doc.internal.pageSize.getWidth();
      doc.setFontSize(7); doc.setTextColor(150, 156, 150);
      doc.text('CMS Representações · Detalhada', 24, alt - 14);
      doc.text('página ' + doc.internal.getNumberOfPages(), larg - 24, alt - 14, { align: 'right' });
    },
  });
  return { blob: doc.output('blob'), nome: x.nome + '.pdf' };
}

// O arquivo da tabela vira um cartão logo abaixo dos botões, como os do robô.
async function baixar(botao, res, formato) {
  // A tela pode ser resumida (um pedido por linha, produtos ao tocar) e o arquivo sair item a item, em colunas.
  if (res.exportar) res = { ...res, cols: res.exportar.cols, rows: res.exportar.rows, num: res.exportar.num || [], larguras: res.exportar.larguras, formatado: res.exportar.formatado, data: [], totais: null, oculta: [] };
  const rot = botao ? botao.textContent : '';
  if (botao) { botao.disabled = true; botao.textContent = 'Gerando…'; }
  try {
    const arq = await (formato === 'pdf' ? baixarPdf(res) : baixarXlsx(res)), html = `<div class="acoes">${cartaoArquivo(arq)}</div>`;
    if (botao) { (botao.closest('.acoes') || botao).insertAdjacentHTML('afterend', html); rolar(); }
    return html;
  }
  catch (e) { addMsg('ia', `<span class="aviso">Não consegui gerar o ${formato === 'pdf' ? 'PDF' : 'Excel'} (${esc(e.message || e)}).</span>`); }
  finally { if (botao) { botao.disabled = false; botao.textContent = rot; } }
}

function mostrarResposta(bolha, res, q) {
  let h = res.entendi ? `<div class="entendi">Entendi: ${res.entendi.join(' · ')}</div>` : '';
  if (res.escolha) {
    const e = res.escolha;
    h += `<div>Qual ${esc(e.rotulo)} você quis dizer com “${esc(e.termo)}”?</div><div class="acoes">` +
      e.opcoes.map((o, i) => `<button class="sug" data-escolha="${i}">${esc(o)}</button>`).join('') +
      (e.todos ? `<button class="btn-sec" data-escolha="todos">Todos esses</button>` : '') + '</div>';
    bolha.innerHTML = h;
    bolha.addEventListener('click', ev => {
      const b = ev.target.closest('[data-escolha]');
      if (!b || bolha.dataset.escolhido) return;
      bolha.dataset.escolhido = '1';
      bolha.querySelectorAll('[data-escolha]').forEach(x => { x.disabled = true; });
      const todos = b.dataset.escolha === 'todos';
      const q2 = todos ? { ...q, _todos: { ...(q._todos || {}), [e.campo]: true } }
                       : { ...q, _exato: { ...(q._exato || {}), [e.campo]: e.opcoes[Number(b.dataset.escolha)] } };
      responderLocal(todos ? 'Todos esses' : e.opcoes[Number(b.dataset.escolha)], q2);
    });
    return;
  }
  if (res.grande) {
    // Lista enorme sem ter pedido o jeito de ver: pergunta antes de despejar.
    const opcoes = [['Por cliente', { agrupar: 'cliente' }], ['Por produto', { agrupar: 'produto' }],
                    ['Só o total', { agrupar: 'nenhum' }], [`Mostrar as ${fmt(res.grande)} linhas`, { _grande: true }]]
      .filter(([, d]) => d.agrupar !== res.agrupar);
    bolha.innerHTML = h + `<div>Deu ${fmt(res.grande)} linhas. Como você quer ver?</div><div class="acoes">` +
      opcoes.map(([rot], i) => `<button class="sug" data-grande="${i}">${esc(rot)}</button>`).join('') + '</div>';
    bolha.addEventListener('click', ev => {
      const b = ev.target.closest('[data-grande]');
      if (!b || bolha.dataset.escolhido) return;
      bolha.dataset.escolhido = '1';
      const [rot, delta] = opcoes[Number(b.dataset.grande)];
      responderLocal(rot, emendar(q, delta));
    });
    return;
  }
  if (res.catalogo) {
    // Abrir a outra aba precisa do toque do vendedor (o celular bloqueia
    // aba aberta sozinha), e o toque serve também de confirmação.
    const c = res.catalogo;
    const link = (gerar, fotos) => DETALHADA_URL + '?' + new URLSearchParams({ cliente: c.cods.join(','), gerar, ...(fotos == null ? {} : { fotos: fotos ? '1' : '0' }) });
    const btn = (gerar, fotos, rot) => `<a class="sug" target="_blank" rel="noopener" href="${esc(link(gerar, fotos))}">${rot}</a>`;
    let botoes;
    if (c.formato === 'pdf') botoes = btn('pdf', null, 'Gerar PDF na Detalhada');
    else if (c.formato === 'xlsx' && c.imagens != null) botoes = btn('xlsx', c.imagens, `Gerar Excel ${c.imagens ? 'com' : 'sem'} imagens na Detalhada`);
    else botoes = (c.formato ? '' : btn('pdf', null, 'PDF')) + btn('xlsx', true, 'Excel com imagens') + btn('xlsx', false, 'Excel sem imagens');
    const pergunta = c.formato === 'pdf' || (c.formato === 'xlsx' && c.imagens != null)
      ? `O catálogo de <b>${esc(c.nome)}</b> sai pela Detalhada, igual ao botão de lá. Toque para gerar:`
      : `Em que formato vai o catálogo de <b>${esc(c.nome)}</b>?`;
    const varios = c.cods.length > 1 ? `<div class="digitando" style="margin-top:6px">São ${c.cods.length} códigos com esse nome: se mais de um tiver carteira, a Detalhada pergunta se junta num arquivo só ou separa.</div>` : '';
    bolha.innerHTML = h + `<div>${pergunta}</div><div class="acoes">${botoes}</div>${varios}`;
    return;
  }
  if (res.erro) { bolha.innerHTML = h + `<div>${esc(res.erro)}</div>`; return; }
  if (res.ficha) { bolha.innerHTML = h + res.ficha; APP.tela = res.fichaTexto; return; }
  h += `<div class="resumo">${esc(res.resumo)}</div>`;
  if (res.aviso) h += `<div class="digitando" style="margin:-4px 0 8px">${esc(res.aviso)}</div>`;
  if (res.rows.length) {
    h += `<div class="tab">${tabelaHtml(res, MOSTRAR)}</div><div class="acoes">`;
    if (res.rows.length > MOSTRAR) h += `<button class="btn-sec" data-acao="todas">Ver todas (${fmt(res.rows.length)})</button>`;
    h += `<button class="btn-sec" data-acao="xlsx">Baixar Excel</button><button class="btn-sec" data-acao="pdf">Baixar PDF</button>`;
    h += `<button class="btn-sec" data-acao="copiar">Copiar tabela</button></div>`;
  }
  // Ajustes de um toque: não passam pela IA, então não erram.
  const ajs = ajustes(res);
  if (ajs.length) h += `<div class="ajustes">${ajs.map(([rot], i) => `<button class="aj" data-ajuste="${i}">${esc(rot)}</button>`).join('')}</div>`;
  bolha.innerHTML = h;
  bolha.addEventListener('click', e => {
    const aj = e.target.closest('[data-ajuste]');
    if (aj) { const [rot, delta] = ajs[Number(aj.dataset.ajuste)]; responderLocal(rot, emendar(q, delta)); return; }
    const a = e.target.closest('[data-acao]');
    if (!a) return;
    if (a.dataset.acao === 'todas') { bolha.querySelector('.tab').innerHTML = tabelaHtml(res, Infinity); a.remove(); }
    if (a.dataset.acao === 'xlsx' || a.dataset.acao === 'pdf') baixar(a, res, a.dataset.acao);
    if (a.dataset.acao === 'copiar') {
      const tsv = [res.cols, ...res.rows.map(r => r.map((v, j) => res.data.includes(j) ? (v >= 0 ? dataDe(v) : '') : v))].map(r => r.join('\t')).join('\n');
      navigator.clipboard.writeText(tsv).then(() => { a.textContent = 'Copiado ✓'; setTimeout(() => a.textContent = 'Copiar tabela', 1800); });
    }
  });
  // Pediu o arquivo na pergunta ("me manda em Excel…"): já baixa.
  if (res.rows.length && (q.formato === 'xlsx' || q.formato === 'pdf')) {
    baixar(bolha.querySelector(`[data-acao="${q.formato}"]`), res, q.formato);
  }
}

/* ── conversa que emenda ──────────────────────────────── */
// O que vai para a IA e para o histórico: sem os campos internos (_exato…)
// e sem o formato, que vale só para a resposta em que foi pedido.
const limpa = q => Object.fromEntries(Object.entries(q || {}).filter(([k, v]) =>
  !k.startsWith('_') && v != null && k !== 'formato' && k !== 'continua' && k !== 'limpar'));

// Junta a consulta na tela com só o que mudou. Campo trocado perde a escolha
// feita antes ("você quis dizer…"), senão o cliente novo viraria o antigo.
function emendar(base, delta) {
  const q = { ...base };
  delete q.formato; delete q._grande;
  const ex = { ...(q._exato || {}) }, td = { ...(q._todos || {}) };
  for (const [k, v] of Object.entries(delta)) {
    if (k === 'continua' || k === 'limpar' || v == null) continue;
    q[k] = v; delete ex[k]; delete td[k];
  }
  for (const k of (Array.isArray(delta.limpar) ? delta.limpar : [])) { delete q[k]; delete ex[k]; delete td[k]; }
  q._exato = ex; q._todos = td;
  return q;
}

// Botões embaixo da resposta: trocar a medida e o jeito de agrupar.
function ajustes(res) {
  const t = res.tipo, out = [];
  if (!t) return out;
  if (t === 'carteira') out.push(['+ faturado', { tipo: 'pedidos' }]);
  if (t === 'faturado') out.push(['+ carteira', { tipo: 'pedidos' }]);
  if (t === 'pedidos') out.push(['só carteira', { tipo: 'carteira' }], ['só faturado', { tipo: 'faturado' }]);
  if (t === 'entradas') out.push(['ver as saídas', { tipo: 'saidas' }]);
  if (t === 'saidas') out.push(['ver as entradas', { tipo: 'entradas' }]);
  const mov = t === 'entradas' || t === 'saidas';
  [['por cliente', 'cliente'], ['por produto', 'produto'], ['por cor', 'produto_cor'], mov ? ['por dia', 'dia'] : ['por mês', 'mes'],
   ...(APP.veTudo && prepAtivo() < 0 ? [['por vendedor', 'vendedor']] : []), ['só o total', 'nenhum']]
    .forEach(([rot, a]) => { if (a !== res.agrupar) out.push([rot, { agrupar: a }]); });
  return out;
}

// Comentário da IA embaixo do resumo: ela lê o que já está na tela (título,
// totais e as primeiras linhas) e diz o que chama atenção. Chega depois da
// tabela; se falhar, a resposta fica como estava.
const respostaComTabela = res => res.rows && res.rows.length && !res.pede && !res.escolha && !res.grande && !res.erro && !res.catalogo;

// A resposta em texto corrido: é o que a IA lê para comentar e, depois,
// para conversar sobre ela ("qual desses é o maior?").
function resumoDaTela(res, n = 15) {
  const linha = r => r.map((v, j) => res.data.includes(j) ? (v != null && v >= 0 ? dataDe(v) : '') : res.num.includes(j) && v !== '' ? fmt(v) : v).join(' | ');
  return [
    textoPlano('Consulta: ' + (res.entendi || []).join(' · ')),
    res.resumo,
    res.cols.join(' | '),
    ...res.rows.slice(0, n).map(linha),
    res.rows.length > n ? `(mais ${fmt(res.rows.length - n)} linhas)` : '',
    res.totais ? 'Total: ' + linha(res.totais).replace(/^Total \| /, '') : '',
  ].filter(Boolean).join('\n');
}

async function comentar(bolha, res, pergunta) {
  if (!respostaComTabela(res)) return;
  const lugar = bolha.querySelector('.resumo');
  if (!lugar) return;
  const div = document.createElement('div');
  div.className = 'comentario digitando';
  div.textContent = 'Analisando…';
  lugar.after(div);
  const resumo = resumoDaTela(res);
  APP.tela = resumo;
  try {
    const r = await chamarWorker('comentarDetalhada', { pergunta, resumo }, 30000);
    if (!r || !r.ok || !r.texto) throw 0;
    div.className = 'comentario';
    div.textContent = r.texto;
    // Só vale se ainda for a última resposta: o vendedor pode ter
    // perguntado outra coisa enquanto o comentário vinha.
    if (APP.tela === resumo) APP.tela = resumo + '\nComentário que você fez: ' + r.texto;
  } catch (e) {
    div.remove();
  }
  rolar();
}

function registrar(texto, q, res) {
  if (res.pede || res.escolha || res.grande || res.erro) return;
  APP.atual = q;
  APP.anteriores.push({ p: texto, c: limpa(q) });
  APP.anteriores = APP.anteriores.slice(-4);
}

// Resposta montada aqui mesmo, sem IA: botão de ajuste, "você quis dizer",
// escolha de como ver uma lista grande.
function responderLocal(rotulo, q) {
  APP.pendente = null;
  addMsg('eu', esc(rotulo));
  const res = executar(q);
  const bolha = addMsg('ia', '');
  mostrarResposta(bolha, res, q);
  registrar(rotulo, q, res);
  rolar();
  comentar(bolha, res, rotulo);
}

async function perguntar(texto) {
  texto = texto.trim();
  if (!texto) return;
  addMsg('eu', esc(texto));
  const bolha = addMsg('ia', digitando());
  $('enviar').disabled = true;
  // Resposta curta logo depois de uma pergunta do assistente ("De qual
  // produto?") completa a pergunta anterior; frase longa é pergunta nova.
  const enviada = APP.pendente && texto.split(/\s+/).length <= 6 ? `${APP.pendente} (complemento: ${texto})` : texto;
  APP.pendente = null;
  try {
    const p = prepAtivo();
    const r = await chamarWorker('chatDetalhada', {
      pergunta: enviada, hoje: hojeIso(), linhas: APP.dic.faixa || [],
      vendedores: APP.veTudo && p < 0 ? APP.dic.prep : [], anteriores: APP.anteriores,
      atual: APP.atual ? limpa(APP.atual) : null, tela: APP.tela || '',
    }, 30000);
    if (!r || !r.ok) throw new Error(r?.erro || 'sem resposta');
    const c = r.consulta || {};
    if (c.tipo === 'conversa' && c.resposta) {
      // Conversa não mexe na consulta da tela: a próxima pergunta que
      // emenda ("e em outubro?") continua valendo sobre ela.
      bolha.innerHTML = esc(String(c.resposta)).replace(/\n/g, '<br>');
      APP.anteriores.push({ p: enviada, c: { tipo: 'conversa', resposta: String(c.resposta).slice(0, 400) } });
      APP.anteriores = APP.anteriores.slice(-4);
      return;
    }
    const q = c.continua && APP.atual ? emendar(APP.atual, c) : c;
    if (q.tipo === 'ficha') await APP.catPronto;
    const res = executar(q);
    mostrarResposta(bolha, res, q);
    if (res.pede || res.escolha) APP.pendente = enviada;
    registrar(enviada, q, res);
    comentar(bolha, res, enviada);
  } catch (e) {
    // Cota grátis diária da Cloudflare (10 mil "neurons"). Sem hora de volta: em 30/10
    // o painel já mostrava 0 usados às 9h e a IA ainda recusava.
    bolha.innerHTML = /4006|daily free allocation/i.test(e.message || '')
      ? '<span class="aviso">A cota grátis de IA acabou por enquanto. Tente de novo mais tarde.</span>'
      : `<span class="aviso">Não consegui responder agora (${esc(e.message || e)}). Tente de novo em instantes.</span>`;
  } finally {
    $('enviar').disabled = false;
    rolar();
  }
}

/* ══ AGENTE (protótipo, ?agente=1) ═════════════════════════
   Conversa livre: a IA (worker, action agenteDetalhada) responde em texto
   ou pede uma ferramenta; a página roda a ferramenta sobre a base e devolve
   o resultado na conversa, até a IA ter o que responder. A trava por
   vendedor mora nas ferramentas: a IA não tem como enxergar além. */
const AGENTE = new URLSearchParams(location.search).has('agente');
const PASSOS_MAX = 6;
const AG = { msgs: [], ultimaTabela: null };

// Datas que a base cobre: a IA confundia o mês do registro de entradas e
// saídas com o período da base inteira e se recusava a comparar semestres.
function agPeriodo() {
  if (AG.periodo) return AG.periodo;
  let fDe = Infinity, fAte = -Infinity, pDe = Infinity, pAte = -Infinity;
  for (const r of APP.L) {
    if (r[C.FAT] > 0 && r[C.DFAT] >= 0) { if (r[C.DFAT] < fDe) fDe = r[C.DFAT]; if (r[C.DFAT] > fAte) fAte = r[C.DFAT]; }
    if (r[C.CART] > 0 && r[C.PREV] >= 0) { if (r[C.PREV] < pDe) pDe = r[C.PREV]; if (r[C.PREV] > pAte) pAte = r[C.PREV]; }
  }
  const fx = (a, b) => a <= b ? { de: dataDe(a), ate: dataDe(b) } : null;
  return (AG.periodo = { faturado: fx(fDe, fAte), carteira: fx(pDe, pAte) });
}

// Filtro por nome com a mesma tolerância do assistente: exato, frase,
// palavras; senão o mais parecido, se ficar claro. Diz com o que casou.
function agFiltro(lista, termo, rotulo, mostra) {
  let achou = casar(lista, termo);
  let nota = '';
  if (!achou || !achou.length) {
    const cand = parecidos(lista, termo);
    const [a, b] = cand;
    if (a && ((a.nota >= 0.85 && (!b || b.nota <= a.nota - 0.1)) || (!b && a.nota >= 0.8))) {
      achou = a.idx; nota = ` (escrito "${termo}")`;
    } else if (cand.length) {
      AG.parecidos = { termo, nomes: cand.slice(0, 5).map(c => c.nome) };
      return { erro: `${rotulo} "${termo}" não existe; os mais parecidos: ${cand.slice(0, 5).map(c => c.nome).join(', ')}. Pergunte qual é.` };
    } else return { erro: `${rotulo} "${termo}" não existe na base${rotulo === 'cliente' && prepAtivo() >= 0 ? ' deste vendedor' : ''}.` };
  }
  const nomes = [...new Set(achou.map(mostra))];
  // Vários nomes no mesmo termo ("LUAR" → LUAR SPORT e BALUARTE): soma
  // todos, mas avisa a IA para conferir com o vendedor.
  const varios = rotulo === 'cliente' && nomes.length > 1 ? ` [ATENÇÃO: "${termo}" casou com ${nomes.length} clientes diferentes e os números deste resultado SOMAM todos eles; não atribua o total a um só. Se ele quis um só, pergunte qual antes de dar números]` : '';
  return { set: new Set(achou), texto: `${rotulo}: ${nomes.slice(0, 8).join(', ')}${nomes.length > 8 ? ` e mais ${nomes.length - 8}` : ''}${nota}${varios}` };
}

// Para os números: se o nome casou com quem tem pedido e também com quem só está no cadastro, valem os
// primeiros. Sem isso, "Degraus" perguntava de qual loja por causa de uma filial que nunca teve pedido.
function agFiltroPed(lista, termo, rotulo, mostra) {
  const r = agFiltro(lista, termo, rotulo, mostra), so = APP.soCad;
  if (rotulo !== 'cliente' || !so || !r.set) return r;
  const v = [...r.set];
  return v.some(i => so.has(i)) && v.some(i => !so.has(i)) ? agFiltro(lista.filter(x => !so.has(x.i)), termo, rotulo, mostra) : r;
}

/* ebm_disponivel: o Disponível por tamanho e a Meta Prod. lidos AO VIVO na digitação de pedido do EBM

   diz que não acha. Os dois números mudam com a data de faturamento: o robô passa pelos dias 01 e 08
   (1ª quinzena) e 16 e 23 (2ª) deste mês e dos dois seguintes. Para só pesquisar, entra com a CMS (7293)

function datasEbm(hoje = new Date()) {
  const out = [], dd = n => String(n).padStart(2, '0');

    const a = new Date(hoje.getFullYear(), hoje.getMonth() + k, 1);

      const d = new Date(a.getFullYear(), a.getMonth(), dia);

// O cliente que entra na digitação: o de mais pares em carteira do vendedor (de todos, para quem vê tudo).
function clienteDaConsulta() {

async function agEbmDisponivel(a) {

// Quadro data x tamanho, como o rodapé do EBM: datas seguidas com a mesma grade viram uma linha,
// ▲ marca a data em que entrou mais produto e a meta (que não tem grade) vai embaixo.
function respostaEbm(r, pedido) {
  const dm = d => d.slice(0, 5), blocos = [];
  for (const c of r.cores || []) {
    const ls = c.linhas || [];
    if (!ls.length) continue;
    const nome = `${c.cor}${c.nome && corChave(c.nome) !== corChave(c.cor) ? ' · ' + c.nome : ''}`;
    const tams = Object.keys(ls[0].grade || {}), grupos = [];
    for (const l of ls) {

      else grupos.push({ l, de: l.data, ate: l.data });

      return `<tr${novo ? ' class="novo"' : ''}><td class="dt">${dt}</td>` +
        tams.map(t => g.l.grade[t] ? `<td>${fmt(g.l.grade[t])}</td>` : '<td class="z">·</td>').join('') + `<td class="tot">${fmt(g.l.total)}</td></tr>`;
    }).join('');

      ? `<div class="ebm-wrap"><table class="ebm-tab"><thead><tr><th class="dt">Fatura</th>${tams.map(t => `<th>${esc(t)}</th>`).join('')}<th class="tot">Total</th></tr></thead><tbody>${linhas}</tbody></table></div>`
      : '<div class="ebm-meta">Nada disponível nessas datas.</div>') + `<div class="ebm-meta">${meta}</div></div>`);
