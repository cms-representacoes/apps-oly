  --lima:#C4FA28; --lima-claro:#E6FF95; --lima-forte:#A3E400; --oliva:#5E8F00;
  --sobre-lima:#132000; --oliva-escuro:#2E4A00; --lima-fundo:#F4FBE3;
  --papel:#ECEFE1;            /* creme-sálvia: o limão aparece sem gritar */
  --balao-eu:#E2F9B8;         /* o "verde do WhatsApp", puxado para o limão */
  --tinta:#111b21; --tinta-2:#54656f; --tinta-3:#8696a0;
  --linha:#e2e8f0; --branco:#ffffff; --erro:#b91c1c;
}
*{ box-sizing:border-box; }
html,body{ height:100%; }
html{ background:var(--papel); }
body{
  margin:0; background:transparent; color:var(--tinta);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; font-size:15px;
  display:flex; flex-direction:column;
}
/* figurinhas presas à janela, atrás de tudo — o mesmo arranjo do catálogo */
body::before{
  content:''; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background-color:color-mix(in srgb, var(--oliva) 15%, transparent);
  -webkit-mask-image:var(--cr-fig); mask-image:var(--cr-fig);
  -webkit-mask-size:440px 440px; mask-size:440px 440px;
  -webkit-mask-repeat:repeat; mask-repeat:repeat;
}
@media (max-width:700px){ body::before{ -webkit-mask-size:340px 340px; mask-size:340px 340px; } }

/* ── Voltar ao Portal (mesma peça de todas as telas) ── */
.portal-btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  flex:none; height:36px; padding:0 12px; border-radius:999px;
  border:1px solid #E2E8F0; background:#FFFFFF; color:#475569;
  font-family:inherit; font-size:14px; font-weight:700; line-height:1;
  text-decoration:none; cursor:pointer; white-space:nowrap;
  transition:background .15s ease, border-color .15s ease;
}
.portal-btn:hover{ background:#F8FAFC; border-color:#CBD5E1; color:#334155; }
.portal-btn:focus-visible{ outline:2px solid #475569; outline-offset:2px; }
.portal-btn svg{ width:14px; height:14px; flex:none; }
.portal-btn[hidden]{ display:none; }

header{
  position:relative; color:var(--sobre-lima);
  background:linear-gradient(112deg,#E6FF95 0%,#C4FA28 38%,#A3E400 68%,#5E8F00 100%);
  border-bottom:1px solid rgba(94,143,0,.35); box-shadow:0 2px 10px rgba(46,74,0,.18);
  padding:12px 16px; padding-top:max(12px, env(safe-area-inset-top));
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
}
header::before{ content:''; position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(ellipse at 88% 10%, rgba(245,255,215,.40) 0%, transparent 58%); }
header > *{ position:relative; }
header h1{ margin:0; font-size:18px; font-weight:800; letter-spacing:-.01em; }
.robo{ width:42px; height:42px; flex:none; border-radius:50%; box-shadow:0 0 0 2px rgba(255,255,255,.55), 0 2px 6px rgba(46,74,0,.3); }
#quem, .ver-como{ display:none !important; }

main{ flex:1; overflow-y:auto; overflow-x:hidden; padding:14px 16px; }
.conversa{ max-width:820px; margin:0 auto; display:flex; flex-direction:column; gap:6px; }

/* ── balões no jeito do WhatsApp: rabinho no canto de cima e a hora embaixo ── */
.msg{ display:flex; margin-top:4px; min-width:0; }
.msg.eu{ justify-content:flex-end; }
/* overflow-wrap: nome comprido ou texto da IA com espaço que não quebra
   (o gpt-oss manda U+202F) não pode vazar do balão */
.bolha{ position:relative; max-width:100%; min-width:0; border-radius:8px; padding:7px 10px 18px; line-height:1.4;
  box-shadow:0 1px .5px rgba(11,20,26,.13); overflow-wrap:anywhere; }
.bolha .tabela-wrap{ max-width:100%; }
.bolha td, .bolha th{ overflow-wrap:normal; }
.bolha::before{ content:''; position:absolute; top:0; width:10px; height:13px; }
.bolha::after{ content:attr(data-hora); position:absolute; right:9px; bottom:4px;
  font-size:11px; color:var(--tinta-3); line-height:1; }
.eu .bolha{ background:var(--balao-eu); color:var(--tinta); border-top-right-radius:0; max-width:85%; min-width:64px; }
.eu .bolha::before{ right:-9px; background:var(--balao-eu); clip-path:polygon(0 0, 100% 0, 0 100%); }
.eu .bolha::after{ color:#667781; }
.ia .bolha{ background:var(--branco); border-top-left-radius:0; flex:0 1 760px; }
.msg.ia{ gap:14px; align-items:flex-start; }
.av{ flex:none; width:32px; height:32px; }
.av .robo{ width:32px; height:32px; box-shadow:0 1px 3px rgba(46,74,0,.25); }
/* digitando: três pontos que pulam, como no WhatsApp */
.dots{ display:inline-flex; gap:4px; align-items:center; height:18px; padding:2px 2px 0; }
.dots i{ width:7px; height:7px; border-radius:50%; background:var(--tinta-3); animation:pula 1.2s infinite ease-in-out; }
.dots i:nth-child(2){ animation-delay:.15s; } .dots i:nth-child(3){ animation-delay:.3s; }
@keyframes pula{ 0%,60%,100%{ transform:translateY(0); opacity:.45; } 30%{ transform:translateY(-5px); opacity:1; } }
@media (prefers-reduced-motion: reduce){ .dots i{ animation:none; opacity:.7; } }
.dots-rot{ display:block; margin-top:4px; font-size:12.5px; font-style:italic; color:var(--tinta-3); }
/* ampulheta: a espera longa de quem está gerando um arquivo */
.ampulheta{ display:inline-flex; align-items:center; gap:9px; padding:2px 0; }
.ampulheta svg{ width:28px; height:28px; flex:none; overflow:visible; animation:am-vira 3s infinite ease-in-out; }
.am-moldura{ fill:none; stroke:var(--oliva-escuro); stroke-width:1.6; stroke-linecap:round; }
.am-areia{ fill:var(--lima-forte); transform-box:fill-box; }
.am-cima{ transform-origin:50% 100%; animation:am-esvazia 3s infinite linear; }
.am-baixo{ transform-origin:50% 100%; animation:am-enche 3s infinite linear; }
.am-fio{ stroke:var(--lima-forte); stroke-width:1.2; stroke-dasharray:1.5 1.5; animation:am-cai 3s infinite linear; }
.am-rot{ font-size:12.5px; font-style:italic; color:var(--tinta-3); }
@keyframes am-vira{ 0%,82%{ transform:rotate(0); } 100%{ transform:rotate(180deg); } }
@keyframes am-esvazia{ 0%{ transform:scaleY(1); } 80%,100%{ transform:scaleY(0); } }
@keyframes am-enche{ 0%{ transform:scaleY(0); } 80%,100%{ transform:scaleY(1); } }
@keyframes am-cai{ 0%{ stroke-dashoffset:6; opacity:1; } 78%{ opacity:1; } 80%,100%{ stroke-dashoffset:0; opacity:0; } }
@media (prefers-reduced-motion: reduce){ .ampulheta svg, .am-cima, .am-baixo, .am-fio{ animation:none; } }

/* cartão de arquivo: capa, nome e os três botões */
.arq{ display:flex; gap:10px 12px; align-items:center; width:100%; max-width:440px; margin-top:6px; padding:10px;
  background:var(--branco); border:1px solid var(--linha); border-radius:12px; flex-wrap:wrap; }
.arq-capa{ flex:none; width:58px; height:76px; padding:0; border-radius:6px; border:1px solid var(--linha); overflow:hidden;
  display:grid; place-items:center; cursor:pointer; color:#fff; font:800 12px/1 inherit; letter-spacing:.04em; }
.arq-capa.pdf{ background:#dc2626; } .arq-capa.xlsx{ background:#15803d; }
.arq-capa.com-capa{ background:#fff; align-items:start; }
.arq-capa canvas{ display:block; width:100% !important; height:auto; }
.arq-info{ flex:1; min-width:0; }
.arq-nome{ font-weight:700; font-size:14px; color:var(--tinta); overflow-wrap:anywhere; }
.arq-meta{ font-size:12px; color:var(--tinta-3); margin-top:2px; overflow-wrap:anywhere; }
.arq-bts{ display:flex; gap:6px; flex-basis:100%; }
.arq-bts .arq-bt{ flex:1 1 auto; justify-content:center; white-space:nowrap; padding:0 10px; }
.arq-bt{ display:inline-flex; align-items:center; gap:5px; min-height:34px; padding:0 12px; border-radius:999px; cursor:pointer;
  border:1px solid var(--lima-forte); background:var(--lima-fundo); color:var(--oliva-escuro); font:700 13px/1 inherit; }
.arq-bt:hover{ background:var(--lima-claro); }
.arq-bt.wa{ background:#25D366; border-color:#1DA851; color:#fff; }
.arq-bt.wa:hover{ background:#1DA851; }
.arq-bt svg{ width:15px; height:15px; fill:currentColor; }
.arq-st{ flex-basis:100%; margin-top:0; }
.arq-st:empty{ display:none; }
/* o visualizador: o arquivo aberto por cima do chat */
.visor{ position:fixed; inset:0; z-index:1000; display:flex; flex-direction:column; background:#111b21; }
.visor-top{ display:flex; align-items:center; gap:8px; padding:10px 12px; padding-top:max(10px, env(safe-area-inset-top)); color:#fff; }
.visor-top .t{ flex:1; min-width:0; font-weight:700; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.visor-x{ flex:none; width:36px; height:36px; border-radius:50%; border:0; background:rgba(255,255,255,.14); color:#fff; font-size:16px; cursor:pointer; }
.visor-corpo{ flex:1; overflow:auto; padding:8px 8px 24px; display:flex; flex-direction:column; align-items:center; gap:10px; }
.visor-corpo canvas{ max-width:100%; height:auto; background:#fff; box-shadow:0 2px 10px rgba(0,0,0,.35); }
.visor-corpo .ampulheta .am-rot{ color:#cbd5e1; }
.visor-corpo .am-moldura{ stroke:#fff; }
.visor-planilha{ background:#fff; border-radius:6px; overflow:auto; max-width:100%; }
.visor-planilha table{ border-collapse:collapse; font-size:12px; }
.visor-planilha td{ border:1px solid #e2e8f0; padding:4px 7px; white-space:nowrap; }
.visor-erro{ color:#fecaca; padding:20px; }
@media (max-width:420px){ .visor-top .arq-bt{ padding:0 10px; font-size:12px; } }
.ia .bolha::before{ left:-9px; background:var(--branco); clip-path:polygon(0 0, 100% 0, 100% 100%); }

.sug{ border:1px solid var(--lima-forte); background:var(--lima-fundo); color:var(--oliva-escuro); border-radius:999px;
  padding:8px 13px; font:inherit; font-size:13px; font-weight:600; cursor:pointer; text-align:left; }
.sug:hover{ background:var(--lima-claro); }
.sug.forte{ background:var(--lima); color:var(--sobre-lima); border-color:var(--oliva); font-weight:800; font-size:14.5px; padding:11px 18px; box-shadow:0 1px 3px rgba(46,74,0,.25); }
.sug.forte:hover{ background:var(--lima-forte); }
.cartao-dae{ border:1px solid var(--lima-forte); background:var(--lima-fundo); border-radius:12px; padding:12px 14px; margin-top:6px; }
.cd-tit{ font-weight:800; font-size:15.5px; color:var(--oliva-escuro); }
.cd-l{ font-size:13px; color:var(--tinta-2); margin-top:3px; }
.cd-p{ font-weight:700; margin-top:9px; }
.cartao-dae [data-dae-status]{ margin-top:8px; font-style:normal; }
.cartao-dae button:disabled{ opacity:.55; cursor:default; }
.cartao-ebm [data-dae-status] .ag-texto, .cartao-ebm [data-dae-status] .ebm-cor{ font-style:normal; font-size:14px; color:var(--tinta); }
.cartao-ebm [data-dae-status] .ag-texto .cd-l{ font-size:12.5px; }
.ebm-cor{ margin-top:12px; }
.ebm-cor h4{ margin:0 0 4px; font-size:14px; color:var(--oliva-escuro); }
.ebm-cor h4 + .ebm-wrap{ margin-top:6px; }
.ebm-wrap{ overflow-x:auto; border-radius:8px; background:#fff; }
.ebm-tab{ border-collapse:collapse; width:100%; font-size:11px; font-variant-numeric:tabular-nums; }
.ebm-tab th, .ebm-tab td{ padding:5px 1px; text-align:center; border-bottom:1px solid #eef3e2; white-space:nowrap; }
.ebm-tab thead th{ background:var(--lima-claro); color:var(--oliva-escuro); font-weight:800; font-size:11px; text-transform:none; letter-spacing:0; position:static; }
@media (max-width:500px){ .bolha:has(.cartao-ebm){ padding-left:5px; padding-right:5px; } .cartao-ebm{ padding:10px 9px; } .cartao-ebm .ebm-wrap{ margin:0 -8px; } }
.ebm-tab .dt{ text-align:left; padding:5px 2px 5px 4px; position:sticky; left:0; background:#fff; font-weight:700; font-size:11px; line-height:1.15; }
.ebm-tab thead .dt{ background:var(--lima-claro); }
.ebm-tab .dt small{ font-weight:500; color:var(--tinta-3); font-size:10px; }
.ebm-tab tr.novo .dt::after{ content:" ▲"; color:var(--oliva); font-size:9px; }
.ebm-tab td.z{ color:#c9d2b8; }
.ebm-tab .tot{ font-weight:800; text-align:right; padding:5px 4px 5px 2px; }
.ebm-meta{ font-size:12.5px; color:var(--tinta-2); margin-top:6px; }
.ebm-meta b{ color:var(--tinta); }
.cat-linha{ display:flex; align-items:center; justify-content:space-between; gap:10px; background:#fff; border-radius:10px; padding:9px 10px; margin-top:8px; }
.cat-linha .sug{ flex:none; text-decoration:none; }
.cat-txt{ min-width:0; flex:1; }
.cat-linha .sug.forte{ padding:9px 13px; font-size:13.5px; }
.cat-linha + .arq{ margin-top:6px; }
.cat-antigas{ margin-top:10px; }
.cat-antigas summary{ cursor:pointer; font-size:13px; font-weight:700; color:var(--oliva-escuro); padding:6px 2px; }
.cat-sem{ margin-top:8px; }
.cartao-link .lk-linha{ margin-top:8px; }
.cartao-link .lk-url{ font-size:12.5px; background:#fff; border-radius:8px; padding:7px 9px; word-break:break-all; margin:4px 0; color:var(--tinta-2); }
.cartao-tri .ct-meses{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; margin-top:8px; }
.cartao-tri .ct-m{ background:#fff; border-radius:10px; padding:7px 8px; display:flex; flex-direction:column; gap:1px; min-width:0; }
.cartao-tri .ct-m.atual{ outline:2px solid var(--lima-forte); }
.cartao-tri .ct-m span{ font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--tinta-2); }
.cartao-tri .ct-m b{ font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.cartao-tri .ct-m small{ font-size:11px; color:var(--tinta-2); }
.cartao-tri .ct-tot{ display:flex; justify-content:space-between; align-items:baseline; margin-top:10px; font-size:13px; }
.cartao-tri .ct-tot b{ font-size:17px; }
.cat-atalhos{ margin-top:6px; }
.cat-atalhos .sug{ font-size:12.5px; padding:6px 11px; }
.cartao-cat .cd-p{ margin-top:10px; }
.foto-grande{ background:#fff; border-radius:10px; margin-top:8px; display:flex; justify-content:center; }
.foto-g{ max-width:100%; max-height:340px; object-fit:contain; }
.foto-angs{ display:flex; gap:6px; margin-top:6px; flex-wrap:wrap; }
.foto-ang{ border:1px solid var(--lima-claro); background:#fff; border-radius:8px; padding:2px; cursor:pointer; }
.foto-ang .foto-mini{ width:58px; height:58px; object-fit:contain; display:block; }
.foto-cores{ display:grid; grid-template-columns:repeat(auto-fill, minmax(92px, 1fr)); gap:6px; margin-top:8px; }
.foto-q{ border:1px solid var(--lima-claro); background:#fff; border-radius:10px; padding:4px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:2px; font:600 11.5px/1.2 inherit; color:var(--oliva-escuro); }
.foto-q .foto-mini{ width:100%; aspect-ratio:1; object-fit:contain; display:block; }
.dica-pdf{ flex-basis:100%; font-size:12.5px; font-style:italic; color:var(--tinta-3); }
a.sug{ text-decoration:none; display:inline-block; }
.entendi{ font-size:12px; color:var(--tinta-2); background:var(--lima-fundo); border:1px dashed var(--lima-forte);
  border-radius:8px; padding:6px 9px; margin-bottom:8px; }
.entendi b{ color:var(--oliva); }
.resumo{ font-weight:700; margin:2px 0 8px; }
.aviso{ color:var(--erro); }
.digitando{ color:var(--tinta-3); font-style:italic; }
/* o comentário da IA: entre o resumo e a tabela, com o fio verde de citação */
.comentario{ margin:-2px 0 10px; padding:2px 0 2px 10px; border-left:3px solid var(--lima-forte);
  font-size:14px; line-height:1.45; color:var(--tinta); }
.comentario.digitando{ color:var(--tinta-3); }
/* agente: texto corrido da IA e as tabelas que ela usou, fechadas embaixo */
.ag-texto p{ margin:0 0 6px; }
.ag-texto p:last-child{ margin-bottom:0; }
.ag-texto ul, .ag-texto ol{ margin:2px 0 8px; padding-left:20px; }
.ag-texto li{ margin:2px 0; }
.ag-texto .tabela-wrap{ margin:6px 0 8px; }
.ag-tab{ margin-top:10px; border:1px solid var(--linha); border-radius:10px; padding:0 10px; }
.ag-tab summary{ cursor:pointer; padding:9px 0; font-size:13px; font-weight:600; color:var(--oliva-escuro); }
.ag-tab summary span{ font-weight:500; color:var(--tinta-3); }
.ag-tab summary{ list-style:none; }
.ag-tab summary::-webkit-details-marker{ display:none; }
.ag-tab summary .ver{ display:block; font-weight:700; color:var(--oliva-escuro); }
.ag-tab summary .ver::after{ content:' ▾'; }
.ag-tab[open] summary .ver::after{ content:' ▴'; }
.ag-tab summary .sobre{ display:block; font-size:11.5px; margin-top:2px; }
.ag-tab .dica-det{ font-size:12px; color:var(--tinta-3); margin:0 0 6px; }
.ag-tab tr.tem-det{ cursor:pointer; }
.ag-tab[open]{ padding-bottom:10px; }
#batModelo{ font:inherit; font-size:13px; padding:7px 8px; border:1px solid var(--linha); border-radius:8px; background:#fff; max-width:100%; }
#batSaida td{ vertical-align:top; max-width:320px; white-space:normal; }
#batSaida .bat-errado td{ background:#fdecea; }
#batSaida .bat-falhou td{ background:#fff4d6; }
/* ficha de produto ou cliente: rótulo pequeno em cima do valor, sem tabela */
.ficha{ border:1px solid var(--linha); border-radius:10px; padding:10px 12px; margin-top:6px; font-size:14px; line-height:1.45; }
.ficha + .ficha{ margin-top:8px; }
.ficha-tit{ font-weight:800; font-size:15px; margin-bottom:6px; color:var(--oliva-escuro); }
.ficha-l{ display:grid; grid-template-columns:118px 1fr; gap:10px; padding:2px 0; }
.ficha-l span{ font-size:12px; font-weight:600; color:var(--tinta-2); padding-top:2px; }
.ficha-desc{ margin-top:6px; font-size:13px; color:var(--tinta-2); }
@media (max-width:520px){ .ficha-l{ grid-template-columns:92px 1fr; gap:8px; } .ficha-l span{ font-size:11.5px; } }

.tabela-wrap{ overflow-x:auto; border:1px solid var(--linha); border-radius:10px; }
table{ border-collapse:collapse; width:100%; font-size:13px; }
th,td{ padding:7px 10px; text-align:left; border-bottom:1px solid #f1f5f9; white-space:nowrap; }
th{ background:#f8faf3; color:var(--tinta-2); font-size:11px; text-transform:uppercase; letter-spacing:.04em; position:sticky; top:0; }

td.nome{ white-space:normal; min-width:160px; }
tr.total td{ font-weight:800; background:var(--lima-fundo); border-bottom:none; }

.tem-det td:last-child:not(.com-pdf)::after{ content:' ▾'; color:var(--tinta-3); font-size:11px; }

.tabela-wrap.compacta td{ white-space:pre-line; }
.acoes{ display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
.btn-sec{ border:1px solid var(--linha); background:#fff; color:var(--tinta-2); border-radius:8px;
  height:32px; padding:0 11px; font:inherit; font-size:13px; font-weight:600; cursor:pointer; }
.btn-sec:hover{ border-color:#cbd5e1; color:var(--tinta); }

form{ max-width:820px; margin:0 auto; display:flex; gap:8px; align-items:flex-end; }

/* microfone no lugar do enviar enquanto o campo está vazio */

/* computador: robô e nome à esquerda, Portal no canto direito */
