<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prévia · abertura da vitrine</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#f1f5f9;font-family:Inter,sans-serif;color:#0f172a;padding:26px}
  h1{font-family:'Space Grotesk',sans-serif;font-size:19px;margin:0 0 4px}
  p.lead{margin:0 0 20px;color:#64748b;font-size:13px}
  .telas{display:flex;gap:26px;flex-wrap:wrap}
  .fone{width:330px}
  .fone .rot{font-size:12px;font-weight:700;color:#475569;margin-bottom:8px;text-transform:uppercase;letter-spacing:.08em}
  .moldura{position:relative;width:330px;height:660px;border-radius:34px;overflow:hidden;
    border:9px solid #0f172a;box-shadow:0 18px 40px rgba(15,23,42,.25);background:#020617}
  .moldura #vSplash, .moldura .vsp{position:absolute}
  button{margin:18px 0 0;padding:10px 18px;border-radius:999px;border:0;cursor:pointer;
    background:#0f172a;color:#fff;font-weight:700;font-family:'Space Grotesk',sans-serif}
  /* ── Tela de abertura (só no app instalado) ───────────────────────────
   Mesma linguagem da splash do Portal — quadrado CMS, nome, as duas
   marcas —, mas aqui os três selos acendem em sequência: quem abre a
   vitrine precisa saber, antes de ver o primeiro cartão, que ali tem
   estoque, repasse e produção no mesmo lugar. */
#vSplash{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;
  background:linear-gradient(160deg,#1e293b,#0f172a 55%,#020617);
  opacity:1;transition:opacity .45s ease}
#vSplash.out{opacity:0;pointer-events:none}
#vSplash[hidden]{display:none}
.vs-box{display:flex;flex-direction:column;align-items:center;gap:9px;
  padding:0 20px;text-align:center;
  animation:vsIn .5s cubic-bezier(.22,1,.36,1) both}
.vs-logo{position:relative;overflow:hidden;width:88px;height:88px;border-radius:24px;
  background:linear-gradient(145deg,var(--splash-claro) 0%,var(--marca) 55%,var(--splash-escuro) 100%);
  display:grid;place-items:center;color:#fff;font:700 29px "Space Grotesk",sans-serif;
  box-shadow:0 14px 40px color-mix(in srgb,var(--marca) 45%,transparent);
  animation:vsPulse 1.6s ease-in-out .4s infinite}
.vs-shine{position:absolute;top:-30%;left:-80%;width:55%;height:160%;transform:rotate(18deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);
  animation:vsShine 1.8s ease-in-out .6s infinite}
.vs-nome{color:#f1f5f9;font:600 15px "Space Grotesk",sans-serif}
.vs-sub{color:#94a3b8;font:500 11px "Inter",sans-serif;letter-spacing:.14em;text-transform:uppercase}
.vs-selos{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:16px;flex-wrap:wrap}
.vs-selo{display:inline-flex;align-items:center;gap:6px;border-radius:999px;
  padding:6px 12px;font:700 10.5px "Space Grotesk",sans-serif;letter-spacing:.06em;
  text-transform:uppercase;color:#fff;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.14);opacity:0;transform:translateY(8px);
  animation:vsAcende .5s cubic-bezier(.22,1,.36,1) forwards}
.vs-selo i{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.vs-selo.est{animation-delay:.55s;color:#34D399}
.vs-selo.rep{animation-delay:1s;color:#93A5FF}
.vs-selo.pro{animation-delay:1.45s;color:#C4A0F5}
.vs-frase{margin-top:16px;color:#cbd5e1;font:500 12.5px "Inter",sans-serif;
  opacity:0;animation:vsAcende .5s ease 1.95s forwards}
.vs-marcas{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:18px;height:40px;
  opacity:0;animation:vsAcende .5s ease 2.35s forwards}
.vs-marcas img{width:auto;display:block}
.vs-marcas .oly{height:24px}
.vs-marcas .ua{height:34px}
.vs-marcas .div{width:1px;height:28px;background:rgba(255,255,255,.22)}
@keyframes vsIn{from{transform:scale(.88);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes vsPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes vsShine{0%{left:-80%}55%,100%{left:130%}}
@keyframes vsAcende{to{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){
  .vs-logo,.vs-shine{animation:none}
  .vs-selo,.vs-frase,.vs-marcas{animation:none;opacity:1;transform:none}
}

  /* a prévia roda dentro da moldura, não na tela inteira */
  .vsp{position:absolute;inset:0;z-index:1;display:grid;place-items:center;
    background:linear-gradient(160deg,#1e293b,#0f172a 55%,#020617)}
</style></head><body>
<h1>Abertura da vitrine CMS — prévia</h1>
<p class="lead">É o que aparece ao abrir a vitrine pelo ícone do app no celular. Clique em repetir para ver de novo.</p>
<div class="telas">
  <div class="fone"><div class="rot">Olympikus</div><div class="moldura" id="fOly"></div></div>
  <div class="fone"><div class="rot">Under Armour</div><div class="moldura" id="fUa"></div></div>
</div>
<button onclick="tocar()">↻ Repetir a animação</button>
<script>
const MARCAS = {
  oly:{ nome:'Olympikus', marca:'#2c39e2', claro:'#5B69E8', escuro:'#1B27B0' },
  ua: { nome:'Under Armour', marca:'#e52125', claro:'#F2494C', escuro:'#A81215' }
};
const MK = "<div id=\"vSplash\" hidden>\n  <div class=\"vs-box\">\n    <div class=\"vs-logo\">CMS<span class=\"vs-shine\"></span></div>\n    <div class=\"vs-nome\">CMS PASS</div>\n    <div class=\"vs-sub\" id=\"vsSub\">Vitrine \u00b7 Olympikus e Under Armour</div>\n    <div class=\"vs-selos\" aria-hidden=\"true\">\n      <span class=\"vs-selo est\"><i></i>Estoque</span>\n      <span class=\"vs-selo rep\"><i></i>Repasse</span>\n      <span class=\"vs-selo pro\"><i></i>Produ\u00e7\u00e3o</span>\n    </div>\n    <div class=\"vs-frase\">Tudo em um S\u00f3 Lugar</div>\n    <div class=\"vs-marcas\" aria-hidden=\"true\">\n      <img class=\"oly\" src=\"../logo-oly-simbolo.png\" alt=\"\">\n      <span class=\"div\"></span>\n      <img class=\"ua\" src=\"../logo-ua-simbolo.png\" alt=\"\">\n    </div>\n  </div>\n</div>";
function montar(idAlvo, m){
  const alvo = document.getElementById(idAlvo);
  alvo.innerHTML = '';
  const cx = document.createElement('div');
  cx.className = 'vsp';
  cx.style.setProperty('--marca', MARCAS[m].marca);
  cx.style.setProperty('--splash-claro', MARCAS[m].claro);
  cx.style.setProperty('--splash-escuro', MARCAS[m].escuro);
  cx.innerHTML = MK.replace('id="vSplash" hidden', 'class="interna"')
                   ;
  // dentro da moldura o bloco é o próprio conteúdo
  const interna = cx.querySelector('.interna');
  interna.style.cssText = 'position:absolute;inset:0;display:grid;place-items:center';
  alvo.appendChild(cx);
}
function tocar(){ montar('fOly','oly'); montar('fUa','ua'); }
tocar();
</script></body></html>
