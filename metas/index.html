<!doctype html>
<html lang="pt-BR" data-tema="escuro" data-card="osso">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14110A">
<title>Metas · CMS PASS</title>
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap">
<style>
/* ══════════════════════════════════════════════════════════════════════
   METAS

   A tela de Metas do Gestor, com todos os filtros dela, nas cores da CMS:
   âmbar #FFBE0B e preto, as mesmas da vitrine — e com o visual e as
   animações de lá (cartão branco sobre o preto, brilho que atravessa no
   cursor, barras que sobem em 1,3 s e param).

   Os números saem de dados/metas.json, o arquivo que o robô da Carta
   publica e que o Metas Preposto já lê. Nada vem do Gestor: ele fica atrás
   de um login que não é nosso, e os dois leem a mesma Carta.

   Quem vê o quê sai da sessão do portal: o vendedor abre travado no código
   dele, sem a lista dos colegas e sem o comparativo; a CMS e quem desenvolve
   veem o time inteiro.

   A RÉGUA DA VULCABRAS, como está no Gestor:
     · o TOTAL de tênis bate com 90% da meta
     · cada FAIXA de tênis bate com 100%
     · cada FAMÍLIA em R$ bate com 95%
   A TRAVA DOS 15% é regra interna da CMS: as outras famílias Olympikus
   mais a Under Armour inteira, sobre a META de tênis Olympikus em R$.

   As barras NÃO são âmbar: o âmbar fica nos acentos (abas, mês ativo,
   bordas do total). Barra da CMS é azul, a do vendedor é cinza, e o
   dourado é reservado para quem bateu — ordem dele, no Gestor.
   ══════════════════════════════════════════════════════════════════════ */
:root{
  --papel:#14110A; --barra:rgba(20,17,10,.86);
  --carta:#FAF7F1; --suave:#F2EDE4;
  --tinta:#0F172A; --texto:#1E293B; --fraco:#6B7280; --tenue:#94A3B8;
  --linha:#E5E7EB; --linha-forte:#D6DAE1;

  --marca:#FFBE0B; --marca-claro:#FFD35A; --marca-escuro:#D99A00;
  --sobre-marca:#1A1407; --marca-tinta:#B45309;

  /* As cores dos dados são as mesmas do Gestor, para quem já lê um ler o
     outro sem reaprender: CMS azul, vendedor verde, ouro de quem bateu e
     prata do meio-termo. */
  --cms:#2E3EFC;            /* a barra da CMS */
  --vend:#3EE6A0;           /* a barra do vendedor */
  --vend-escuro:#1C7D59;    /* o mesmo verde levado ao ponto em que se lê como texto */
  --ouro:#F2B632; --ouro-borda:#A8761A; --prata:#ADAEB3; --prata-borda:#7C7D82;
  --pronta:#15803D;

  --sombra:0 1px 2px rgba(0,0,0,.30), 0 10px 28px -16px rgba(0,0,0,.55);
  --sombra-alta:0 1px 2px rgba(0,0,0,.35), 0 18px 36px -16px rgba(0,0,0,.65);
  color-scheme:dark;
}
*{ box-sizing:border-box; margin:0; padding:0 }
html{ background:var(--papel); -webkit-text-size-adjust:100% }
body{ background:var(--papel); color:#F5F1E8; min-height:100vh;
  font-family:'Plus Jakarta Sans', Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  padding:0 0 calc(28px + env(safe-area-inset-bottom)) }
button{ font-family:inherit; cursor:pointer; border:0; background:none; color:inherit }

/* ── o cabeçalho, como o da vitrine: faixa escura com desfoque ── */
.topo{ position:sticky; top:0; z-index:30; background:var(--barra);
  -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  display:flex; align-items:center; gap:12px; flex-wrap:wrap }
.topo .marca{ display:flex; align-items:center; gap:10px; min-width:0 }
.topo .selo{ width:34px; height:34px; border-radius:10px; flex:none;
  background:var(--marca); color:var(--sobre-marca); display:grid; place-items:center;
  font-weight:800; font-size:12.5px; letter-spacing:.04em }
.topo h1{ font-size:16px; font-weight:800; letter-spacing:-.01em; line-height:1.15 }
.topo .sub{ font-size:11px; font-weight:600; color:#B9B2A3; letter-spacing:.02em }
.topo .dir{ margin-left:auto; display:flex; align-items:center; gap:8px }
.bt-voltar{ display:inline-flex; align-items:center; gap:7px; height:36px; padding:0 14px;
  border-radius:999px; background:rgba(255,255,255,.08); color:#F5F1E8;
  font-size:13px; font-weight:700; border:1px solid rgba(255,255,255,.14);
  transition:background .18s ease, border-color .18s ease }
.bt-voltar:hover{ background:rgba(255,255,255,.14); border-color:rgba(255,190,11,.5) }
.bt-voltar svg{ width:15px; height:15px; fill:currentColor }

.env{ max-width:1320px; margin:0 auto; padding:16px }

/* ── os filtros ─────────────────────────────────────────────────────── */
/* O menu também fica congelado, logo abaixo do cabeçalho: trocar de mês ou
   de vendedor é o que mais se faz aqui, e rolar até o topo para isso quebrava
   a leitura. O fundo é o do papel, opaco, com um fio embaixo. */
.filtros{ display:flex; flex-direction:column; gap:13px;
  position:sticky; top:calc(56px + env(safe-area-inset-top)); z-index:25;
  background:var(--papel); padding:13px 0 12px; margin:-13px 0 0;
  box-shadow:inset 0 -1px 0 rgba(255,255,255,.08) }
.grupo{ display:flex; align-items:center; gap:10px; flex-wrap:wrap }
.grupo > .rot{ font-size:10px; font-weight:800; letter-spacing:.12em; text-transform:uppercase;
  color:#A79F8E; flex:none; width:74px }
/* preposto e medida dividem a linha: o segundo rótulo não precisa da coluna
   de 74px, só de um respiro e de um fio que separe os dois grupos */
.grupo > .rot.sep{ width:auto; margin-left:8px; padding-left:16px;
  border-left:1px solid rgba(255,255,255,.14) }
#fVisao{ margin-left:auto }
@media(max-width:900px){
  .grupo > .rot.sep{ margin-left:0; padding-left:0; border-left:0 }
  #fVisao{ margin-left:0 }
}
@media(max-width:700px){ .grupo > .rot{ width:auto } }

.chips{ display:flex; gap:7px; flex-wrap:wrap; min-width:0 }
.chips[hidden]{ display:none }
.chips.rola{ flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; padding-bottom:2px;
  -webkit-overflow-scrolling:touch }
.chips.rola::-webkit-scrollbar{ display:none }
.chip{ height:34px; padding:0 14px; border-radius:999px; flex:none;
  background:rgba(255,255,255,.06); color:#E8E2D5; border:1px solid rgba(255,255,255,.13);
  font-size:12.5px; font-weight:700; white-space:nowrap;
  transition:background .18s ease, color .18s ease, border-color .18s ease, transform .18s ease }
.chip:hover{ background:rgba(255,255,255,.12); transform:translateY(-1px) }
.chip.on{ background:var(--marca); color:var(--sobre-marca); border-color:var(--marca);
  box-shadow:0 6px 18px -8px rgba(255,190,11,.75) }
.chip small{ font-weight:600; opacity:.72; margin-left:5px }

/* o seletor de mês: segmentado, como no Gestor */
.segm{ display:flex; gap:3px; padding:4px; border-radius:13px; background:rgba(255,255,255,.06);
  overflow-x:auto; scrollbar-width:none; min-width:0 }
.segm::-webkit-scrollbar{ display:none }
.segm button{ height:36px; padding:0 13px; border-radius:9px; flex:none;
  font-size:12.5px; font-weight:700; color:#B9B2A3; white-space:nowrap;
  transition:background .18s ease, color .18s ease }
.segm button:hover{ color:#F5F1E8; background:rgba(255,255,255,.07) }
.segm button.on{ background:var(--marca); color:var(--sobre-marca); font-weight:800 }
.segm .sep{ width:1px; margin:6px 4px; background:rgba(255,255,255,.14); flex:none; padding:0;
  pointer-events:none }
.segm .mais{ font-size:17px; font-weight:700; line-height:1; padding:0 13px; color:#8C8575 }
.segm .mais:hover{ color:var(--marca); background:rgba(255,190,11,.1) }

/* ── o painel ───────────────────────────────────────────────────────── */
.mt{ display:flex; flex-direction:column; gap:20px }
.mt .sec{ display:flex; flex-direction:column }
.mt .rot{ font-size:10.5px; font-weight:800; letter-spacing:.13em; text-transform:uppercase;
  color:#A79F8E; margin-bottom:10px }
.mt .rolo{ overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:thin; padding-bottom:4px }
.mt .fila{ display:flex; align-items:stretch; gap:9px; width:max-content; position:relative }
@media(min-width:1000px){ .mt .fila{ width:auto } }

/* O quadro tem papel, não fundo chapado — o mesmo da vitrine: degradê que
   escurece de leve para baixo, fio de luz na borda de cima e sombra curta. */
.mt .cd{ width:134px; flex:0 0 134px; display:flex; flex-direction:column; position:relative;
  background:linear-gradient(170deg,#FFFFFF 0%,#FCFBF7 58%,var(--carta) 100%);
  border:1px solid var(--linha); border-radius:13px;
  box-shadow:0 1px 2px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.9);
  padding:11px 11px 10px; text-align:left; color:var(--tinta);
  transition:transform .2s cubic-bezier(.2,.8,.2,1), box-shadow .2s ease, border-color .2s ease }
/* o brilho atravessa o quadro uma vez, no instante em que o cursor chega */
.mt .cd::after{ content:''; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
  background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.72) 50%,transparent 58%);
  background-size:250% 100%; background-position:130% 0; opacity:0;
  transition:background-position .62s cubic-bezier(.3,.7,.3,1), opacity .2s ease }
.mt .cd:hover{ transform:translateY(-3px); border-color:var(--linha-forte);
  box-shadow:0 14px 30px -12px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.9) }
.mt .cd:hover::after{ background-position:-30% 0; opacity:1 }
/* o cartão do TOTAL: separado, com a borda âmbar da casa */
.mt .cd.tot{ flex:0 0 178px; width:178px; margin-right:16px;
  border-color:var(--marca); box-shadow:0 0 0 1px var(--marca) inset,
  0 10px 26px -12px rgba(255,190,11,.5) }
.mt .cd.tot:hover{ box-shadow:0 0 0 1px var(--marca) inset, 0 16px 34px -12px rgba(255,190,11,.6) }
@media(min-width:1000px){ .mt .cd{ width:auto; flex:1 1 0 } .mt .cd.tot{ flex:0 0 190px; width:190px } }
/* o estado do mês, do Gestor: foco vivo, padrão normal, abandonado opaco */
.mt .cd.foco{ border-color:var(--marca-escuro); box-shadow:0 0 0 1px var(--marca-escuro) inset,
  0 10px 24px -12px rgba(217,154,0,.45) }
.mt .cd.abandonado{ opacity:.62 }

.mt .cd .nm{ font-size:11.5px; font-weight:800; line-height:1.25; min-height:28px; letter-spacing:.01em }
.mt .cd.tot .nm{ letter-spacing:.09em; font-size:12px }
/* A estrela fica EM CIMA da barra que bateu, não no canto do cartão: de
   relance se vê qual das duas acendeu, que era o que o canto não dizia. */
.mt .pb{ position:relative; flex:0 0 auto; width:27px; height:100%;
  display:flex; align-items:flex-end; justify-content:center }
.mt .cd.tot .pb{ width:33px }
.mt .pb .b{ width:100% }
.mt .pb .s{ position:absolute; left:0; right:0; margin:0 auto; bottom:calc(var(--h) + 4px);
  width:15px; height:15px; line-height:0; z-index:3; pointer-events:none }
.mt .pb .s svg{ width:15px; height:15px; fill:var(--ouro); stroke:var(--ouro-borda); stroke-width:1.1 }
.mt .pb .s.pr svg{ fill:var(--prata); stroke:var(--prata-borda) }
/* A estrela da barra cheia sobe acima da área, e por isso a margem de 19px
   acima: o respiro vem por FORA. Padding aqui encolheria a altura das barras
   sem encolher a das réguas, e uma barra acima do gatilho apareceria abaixo
   da linha dele. */

.mt .bars{ position:relative; height:152px; display:flex; align-items:flex-end;
  justify-content:center; gap:6px; border-bottom:1px solid var(--linha-forte); margin-top:19px }
.mt .cd.tot .bars{ height:168px }
.mt .l100{ position:absolute; left:-3px; right:-3px; border-top:1.5px dashed var(--fraco);
  pointer-events:none; z-index:2 }
.mt .l100 b{ position:absolute; right:-3px; top:-12px; font-size:8px; font-weight:800;
  color:var(--tinta); background:var(--carta); padding:0 3px; letter-spacing:.02em;
  border-radius:3px; box-shadow:0 0 0 1px var(--linha) }
/* a segunda régua do cartão do total: os 100%, pontilhada e com o rótulo por baixo */
.mt .lref{ position:absolute; left:-3px; right:-3px; border-top:1.5px dotted var(--linha-forte);
  pointer-events:none; z-index:2 }
.mt .lref b{ position:absolute; left:-3px; bottom:3px; font-size:8px; font-weight:700;
  color:var(--tenue); background:var(--carta); padding:0 3px; border-radius:3px; line-height:1.4 }

.mt .b{ width:27px; border-radius:5px 5px 0 0; transform-origin:bottom; position:relative; z-index:1;
  animation:mtSobe 1.3s cubic-bezier(.2,.8,.2,1) both }
.mt .cd.tot .b{ width:33px }
@keyframes mtSobe{ from{ transform:scaleY(0) } to{ transform:scaleY(1) } }
.mt .b.c{ background:var(--cms) }
.mt .b.v{ background:var(--vend) }
.mt .b.ouro{ background:linear-gradient(180deg,#FFD35A,var(--ouro)) }
.mt .b.vazia{ height:0; border-top:2px dotted var(--tenue) }

.mt .num{ display:flex; flex-direction:column; gap:2px; margin-top:6px }
.mt .num > div{ display:flex; align-items:baseline; gap:5px; min-width:0 }
.mt .num .q{ font-size:8.5px; font-weight:800; letter-spacing:.05em; text-transform:uppercase;
  color:var(--tenue); line-height:1; flex:none; max-width:54px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.mt .num .g{ font-size:13.5px; font-weight:800; line-height:1.3; white-space:nowrap;
  font-variant-numeric:tabular-nums; overflow:hidden; text-overflow:ellipsis;
  flex:1 1 auto; min-width:0; text-align:right }
.mt .cd.tot .num .g{ font-size:16px }
.mt .num .g.c{ color:#2433C9 }
.mt .num .g.v{ color:var(--vend-escuro) }
.mt .cd .mm{ display:block; font-size:9.5px; color:var(--tenue); font-weight:600; margin-top:6px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis }

/* ── a trava dos 15% ────────────────────────────────────────────────── */
/* A trava fica grudada abaixo do cabeçalho: é o número que se consulta
   enquanto se olha os cartões, e rolar para cima toda vez para conferir os
   15% tirava o sentido de ter os dois na mesma tela. O fundo é opaco e a
   sombra curta a solta do que passa por baixo. */
.mt .t15{ display:flex; flex-direction:column; gap:10px;
  background:var(--carta); border:1px solid var(--linha); border-radius:14px;
  padding:13px 15px; color:var(--tinta);
  position:sticky; top:calc(56px + var(--alt-menu, 116px) + env(safe-area-inset-top)); z-index:20;
  box-shadow:0 10px 24px -16px rgba(0,0,0,.85) }
.mt .t15 > .rot{ margin:0; color:var(--fraco) }
.mt .t15 .un{ display:flex; align-items:center; gap:10px; flex-wrap:wrap }
.mt .t15 .qd{ font-size:9.5px; font-weight:800; color:var(--tenue); letter-spacing:.07em;
  text-transform:uppercase; width:74px; flex:none }
.mt .t15 .trk{ position:relative; flex:1 1 240px; height:16px; border-radius:99px;
  background:var(--suave); display:flex; overflow:hidden; border:1px solid var(--linha) }
/* um filete claro entre as fatias: sem ele as cores vizinhas se borram */
.mt .t15 .trk i{ display:block; height:100%; flex:0 0 auto;
  box-shadow:inset -1px 0 0 rgba(255,255,255,.6);
  animation:mtCresce 1.3s cubic-bezier(.2,.7,.2,1) both; transform-origin:left }
@keyframes mtCresce{ from{ transform:scaleX(0) } to{ transform:scaleX(1) } }
/* o tracinho dos 15% cruza fatia colorida e trilho vazio: o halo branco o
   mantém legível nos dois */
.mt .t15 .mk{ position:absolute; top:-2px; bottom:-2px; border-left:2px dashed var(--fraco); z-index:3;
  box-shadow:-1px 0 0 rgba(255,255,255,.85),1px 0 0 rgba(255,255,255,.85) }
.mt .t15 .mk.ok{ border-color:var(--pronta) }
.mt .t15 .pc{ font-size:14px; font-weight:800; white-space:nowrap; min-width:58px; text-align:right }
.mt .t15 .pc.ok{ color:var(--pronta) }
.mt .t15 .fa{ font-size:10.5px; color:var(--fraco); white-space:nowrap }
.mt .t15 .lg{ display:flex; flex-wrap:wrap; gap:5px 14px; font-size:10px; color:var(--fraco) }
.mt .t15 .lg span{ display:inline-flex; align-items:center; gap:5px }
.mt .t15 .lg i{ width:10px; height:10px; border-radius:3px; flex:none }
.mt .t15 .lg i.mk{ width:0; height:12px; border-left:2px dashed var(--fraco); border-radius:0;
  position:static; box-shadow:none }
/* O tênis Olympikus é o denominador e ocupa quase toda a régua: âmbar da casa.
   As famílias vêm depois, cada uma num matiz próprio; a UA no vermelho dela. */
.mt .f-OLY{ background:#2E3EFC }
.mt .f-MEOLY{ background:#FFD400 }
.mt .f-CHOLY{ background:#FF8A00 }
.mt .f-ACOLY{ background:#B06CFF }
.mt .f-CFOLY{ background:#2EC4E6 }
.mt .f-UA{ background:#E3001B }

/* ── o trimestre, mês a mês ──
   Cada mês é um grupo de barras com o seu rótulo embaixo; somar os três
   esconderia o mês ruim atrás do bom. */
.mt.tri .cd{ min-width:152px }
.mt.tri .cd.tot{ min-width:176px }
@media(max-width:640px){ .mt.tri .cd{ flex:0 0 152px } .mt.tri .cd.tot{ flex:0 0 176px } }
.mt.tri .bars{ gap:11px }
.mt.tri .mb{ display:flex; align-items:flex-end; justify-content:center; gap:3px;
  flex:1 1 0; min-width:0; height:100% }
.mt.tri .pb{ flex:1 1 0; width:auto; max-width:none }
.mt.tri .pb .b{ max-width:20px }
.mt.tri .cd.tot .pb .b{ max-width:24px }
.mt .quem{ display:flex; gap:11px; margin-top:5px }
.mt .quem .par{ flex:1 1 0; min-width:0; display:flex; gap:3px; justify-content:center }
.mt .quem i{ flex:1 1 0; min-width:0; display:flex; align-items:center; justify-content:center }
.mt .quem svg{ width:13px; height:13px; display:block }
.mt .quem i.c svg{ fill:#2433C9 }
.mt .quem i.v svg{ fill:var(--vend-escuro) }
.mt .leg-mes{ display:flex; gap:11px; margin-top:4px }
.mt .leg-mes span{ flex:1 1 0; min-width:0; font-size:8.5px; font-weight:700; text-align:center;
  color:var(--fraco); line-height:1.3; text-transform:uppercase; letter-spacing:.04em }
.mt .leg-mes span b{ display:block; font-size:11px; color:var(--tinta); font-weight:800;
  font-variant-numeric:tabular-nums; letter-spacing:0 }

/* ── a visão de comparar vendedores ─────────────────────────────────── */
.mt.cmp .cd{ width:auto; flex:1 1 0; min-width:138px }
.mt.cmp .cd.tot{ flex:1.4 1 0; min-width:176px }
.mt.cmp .bars{ gap:4px }
/* a COLUNA ocupa a sua fatia inteira (é ela que fica sobre o rótulo); quem
   tem largura limitada é a barra dentro dela */
.mt.cmp .pb{ flex:1 1 0; width:auto; min-width:0; max-width:none }
.mt.cmp .pb .b{ max-width:19px; min-width:6px }
.mt.cmp .cd.tot .pb .b{ max-width:24px }
.mt.cmp .pb .s{ width:12px; height:12px; bottom:calc(var(--h) + 3px) }
.mt.cmp .pb .s svg{ width:12px; height:12px }
.mt.cmp .leg-prep{ display:flex; gap:4px; margin-top:6px }
.mt.cmp .leg-prep span{ flex:1 1 0; min-width:0; font-size:7.5px; font-weight:700; text-align:center;
  color:var(--fraco); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; line-height:1.35;
  letter-spacing:-.01em }
.mt.cmp .leg-prep span b{ display:block; font-size:10px; color:var(--tinta); font-weight:800;
  font-variant-numeric:tabular-nums }
.mt.cmp .leg-prep span.cms{ color:var(--marca-tinta) }
.mt.cmp .leg-prep span.cms b{ color:var(--marca-tinta) }

/* ── legenda e rodapé ───────────────────────────────────────────────── */
.mt .leg{ display:flex; flex-wrap:wrap; gap:7px 18px; font-size:11px; color:#A79F8E }
.mt .leg span{ display:inline-flex; align-items:center; gap:6px }
.mt .leg i.q{ width:11px; height:11px; border-radius:3px; flex:none }
.mt .leg i.q.c{ background:var(--cms) }
.mt .leg i.q.v{ background:var(--vend) }
.mt .leg i.q.o{ background:linear-gradient(180deg,#FFD35A,var(--ouro)) }
.mt .leg i.s{ display:inline-flex; line-height:0 }
.mt .leg i.s svg{ width:13px; height:13px; fill:var(--ouro); stroke:var(--ouro-borda); stroke-width:1.1 }
.mt .pe{ font-size:10.5px; color:#8C8575; line-height:1.55 }

.aviso{ background:rgba(255,190,11,.1); border:1px solid rgba(255,190,11,.3);
  border-radius:12px; padding:12px 14px; font-size:12.5px; color:#F0E6D0; line-height:1.5 }
.carregando{ padding:50px 0; text-align:center; color:#A79F8E; font-size:13px }
.carregando i{ display:inline-block; width:22px; height:22px; border-radius:50%;
  border:2.5px solid rgba(255,255,255,.18); border-top-color:var(--marca);
  animation:gira .8s linear infinite; margin-bottom:12px }
@keyframes gira{ to{ transform:rotate(360deg) } }

/* ── no celular ──
   O cartão alto obriga a rolar duas vezes: de lado para ver as faixas e para
   baixo para ver os números. Encurtar a barra resolve as duas. */
@media(max-width:640px){
  .topo{ padding:calc(8px + env(safe-area-inset-top)) 13px 8px; gap:9px }
  .topo h1{ font-size:15px }
  .topo .sub{ font-size:10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    max-width:100% }
  .topo .marca{ flex:1 1 0; min-width:0 } .topo .marca > div{ min-width:0 }
  .topo .dir{ margin-left:0; flex:none }
  .bt-voltar{ height:32px; padding:0 12px; font-size:12px }
  .env{ padding:13px }
  .grupo > .rot{ width:auto; font-size:9.5px }
  .mt .bars{ height:116px } .mt .cd.tot .bars{ height:128px }
  .mt .cd{ width:122px; flex:0 0 122px } .mt .cd.tot{ flex:0 0 156px; width:156px; margin-right:12px }
  .mt .t15 .qd{ width:auto }
  .mt .t15 .pc{ min-width:auto }
  /* No celular o menu inteiro tomaria 70% da tela preso no topo e sobraria
     um palmo para os cartões. Congelado ele vira duas faixas que rolam de
     lado, sem os rótulos — "Olympikus" e "out/26" dizem sozinhos o que são. */
  .filtros{ top:calc(50px + env(safe-area-inset-top)); gap:7px; padding:9px 0 8px }
  .filtros > .grupo{ flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; gap:7px }
  .filtros > .grupo::-webkit-scrollbar{ display:none }
  .filtros > .grupo > .rot{ display:none }
  .filtros > .grupo > *{ flex:0 0 auto }
  .filtros .chips{ flex-wrap:nowrap }
  .filtros .chip{ flex:0 0 auto }
  .mt .t15{ top:calc(50px + var(--alt-menu, 116px) + env(safe-area-inset-top));
    gap:7px; padding:10px 12px }
  .mt .t15 .so-largo{ display:none }
  .mt .t15 .lg{ font-size:9.5px; gap:4px 10px }
}

/* No modo comparar cada barra leva nome e % embaixo: o cartão precisa de
   largura, senão os números se encavalam. */
.mt.cmp .cd{ min-width:244px }
.mt.cmp .cd.tot{ min-width:258px }
@media(max-width:640px){ .mt.cmp .cd{ flex:0 0 244px } .mt.cmp .cd.tot{ flex:0 0 258px } }

@media(prefers-reduced-motion:reduce){
  .mt .b, .mt .t15 .trk i{ animation:none }
  .mt .cd, .mt .cd::after, .chip, .bt-voltar{ transition:none }
  .mt .cd:hover{ transform:none } .mt .cd:hover::after{ opacity:0 }
  .carregando i{ animation-duration:2.4s }
}
</style>
</head>
<body>

<header class="topo">
  <div class="marca">
    <div class="selo">CMS</div>
    <div><h1>Metas</h1></div>
  </div>
  <div class="dir">
    <a class="bt-voltar" href="../index.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 4.5 8 12l7.5 7.5 1.4-1.4L10.8 12l6.1-6.1z"/></svg>
      Portal
    </a>
  </div>
</header>

<div class="env">
  <div class="filtros">
    <div class="grupo">
      <span class="rot">Marca</span><div class="chips" id="fMarca"></div>
      <span class="rot sep">Mês</span><div class="segm" id="fMes"></div>
    </div>
    <div class="grupo">
      <span class="rot">Preposto</span><div class="chips" id="fPrep"></div>
      <span class="rot sep">Medida</span><div class="chips" id="fMedida"></div>
      <div class="chips" id="fVisao"></div>
    </div>
  </div>
  <div id="painel"><div class="carregando"><i></i><div>lendo as metas…</div></div></div>
</div>

<script>
/* ── a régua da Vulcabras ─────────────────────────────────────────────
   O total de tênis bate com 90% da meta, a faixa com 100% e a família em
   R$ com 95%. A trava dos 15% é regra interna da CMS. */
const GATILHO_TOTAL = 0.90, GATILHO_FAIXA = 1.00, GATILHO_FAMILIA = 0.95;
const TRAVA_15 = 0.15;
const TETO = 1.5;            // o eixo vai até 150% da meta; os 100% ficam a 2/3 da altura

/* Cada marca tem o seu tênis e as suas famílias. O tênis da Olympikus vem
   na marca "OLY" e o da Under Armour em "UA_TN"; as famílias são linhas
   próprias, uma por tipo. */
const MARCAS = {
  OLY: { rotulo:'Olympikus', tenis:'OLY', familias:['ACOLY','CHOLY','MEOLY','CFOLY'],
         ordemFaixa:{ 'CLASSICOS':1, 'CONF_FEM':2, 'CONF_MASC':3, 'CORRIDA/TREINO':4, 'INFANTIL':5, 'CORRE':6 } },
  UA:  { rotulo:'Under Armour', tenis:'UA_TN', familias:['UA_AC','UA_ME','UA_CH','UA_CF'],
         ordemFaixa:{ 'RUN INSPIRED':1, 'RUNNING':2, 'TRAINING':3, 'BASKETBALL':4 } },
};
const NOMES = {
  'CLASSICOS':'Clássicos', 'CONF_FEM':'Conf. feminino', 'CONF_MASC':'Conf. masculino',
  'CORRIDA/TREINO':'Corrida e treino', 'INFANTIL':'Infantil', 'CORRE':'Corre',
  'RUN INSPIRED':'Run inspired', 'RUNNING':'Running', 'TRAINING':'Training', 'BASKETBALL':'Basketball',
  'ACOLY':'Acessórios', 'CHOLY':'Chinelos', 'MEOLY':'Meias', 'CFOLY':'Confecção',
  'UA_AC':'Acessórios', 'UA_CH':'Chinelos', 'UA_ME':'Meias', 'UA_CF':'Confecção',
};
/* As famílias que entram no numerador dos 15%, do lado Olympikus; a Under
   Armour entra inteira, numa fatia só. */
const FAMS15 = [['MEOLY','Meias'], ['CHOLY','Chinelos'], ['ACOLY','Acessórios'],
                ['CFOLY','Confecção'], ['UA','Under Armour']];
const MARCAS_UA = ['UA_TN','UA_AC','UA_CH','UA_ME','UA_CF'];
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto',
               'setembro','outubro','novembro','dezembro'];
const MES3 = ['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];
const ESTRELA = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l3 6.9 7.5.7-5.7 5 1.7 7.4L12 18l-6.5 4 1.7-7.4-5.7-5 7.5-.7z"/></svg>';
/* No trimestre são duas barras por mês e a coluna tem 16px: nome nenhum cabe
   ali. A casa é a CMS, a silhueta é o vendedor. */
const ICO_CMS = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21V9.5L12 3l9 6.5V21h-6v-6H9v6z"/></svg>';
const ICO_VEND = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7.5" r="4"/><path d="M4 21v-1.2c0-3.3 3.6-5.3 8-5.3s8 2 8 5.3V21z"/></svg>';

/* ── quem está vendo ───────────────────────────────────────────────────
   A tela entrou no portal, então ela obedece à mesma sessão das outras: o
   vendedor vê só o que é dele, a CMS e quem desenvolve veem o time inteiro.
   Sem sessão válida, a tela não abre — o número de meta de um não é assunto
   do outro. */
const SESSION_KEY = 'cms_portal_session_v1';
const NOMES_CMS = ['CMS', 'MARCOS (DEV)'];
/* Só na própria máquina: ?vendedor=JORGE abre como ele, para conferir o que
   cada um enxerga. No endereço publicado isto nunca vale. */
const VENDEDORES_TESTE = { '25846':'CMS', '25745':'LEANDRO', '4322318':'CHRISTIAN LUCAS',
  '114611':'JORGE', '109839':'MARIANA', '1333497':'RAFAEL', '25471':'WILLAME',
  '3616654':'MARCOS (DEV)' };
function getSessao(){
  try{
    const s = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
    if(!s || !s.expiraEm || new Date(s.expiraEm).getTime() < Date.now()) return null;
    const h = location.hostname;
    if(h !== 'localhost' && h !== '127.0.0.1' && h !== '') return s;
    const q = (new URLSearchParams(location.search).get('vendedor') || '').trim().toUpperCase();
    if(!q) return s;
    const cod = VENDEDORES_TESTE[q] ? q
      : Object.keys(VENDEDORES_TESTE).find(k => VENDEDORES_TESTE[k] === q);
    return cod ? { ...s, codigo:cod, nome:VENDEDORES_TESTE[cod] } : s;
  }catch(_){ return null; }
}
const SESSAO = getSessao();
const souCms = () => NOMES_CMS.includes(String((SESSAO && SESSAO.nome) || '').toUpperCase());
const meuCodigo = () => String((SESSAO && SESSAO.codigo) || '').trim();

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g,
  c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const nf = n => Math.round(n || 0).toLocaleString('pt-BR');
const kk = v => { const a = Math.abs(v || 0);
  if(a >= 1e6) return (a/1e6).toFixed(2).replace('.',',') + 'M';
  return a >= 1000 ? (a/1000).toFixed(1).replace('.',',') + 'k' : String(Math.round(a)); };
const pctTxt = p => p == null ? '—' : (p*100).toFixed(1).replace('.',',') + '%';

let METAS = null;
const F = { marca:'OLY', mes:null, prep:'TODOS', medida:'pot', comparar:false, abrirMeses:false };

/* ── a leitura ────────────────────────────────────────────────────────
   O mesmo arquivo do Metas Preposto e da vitrine: se divergisse, uma das
   três telas estaria mentindo. */
async function carregar(){
  if(!SESSAO){
    $('painel').innerHTML = `<div class="aviso">Entre pelo <b>Portal do Vendedor</b> para ver as metas.
      <a href="../index.html" style="color:var(--marca);font-weight:800">Ir para o portal</a></div>`;
    document.querySelector('.filtros').hidden = true;
    return;
  }
  try{
    const r = await fetch('dados/metas.json?t=' + Date.now(), { cache:'no-store' });
    if(!r.ok) throw new Error('HTTP ' + r.status);
    METAS = await r.json();
  }catch(e){
    $('painel').innerHTML = `<div class="aviso">Não consegui ler <b>dados/metas.json</b>
      (${esc(e.message)}). O arquivo é publicado pelo robô da Carta.</div>`;
    return;
  }
  const meses = (METAS.meses || []).map(m => m.mes).sort();
  if(!meses.length){ $('painel').innerHTML = '<div class="aviso">O arquivo não tem mês nenhum.</div>'; return; }
  // abre no mês corrente quando ele existe; senão, no último que veio
  const hoje = new Date();
  const atual = hoje.getFullYear() + '-' + String(hoje.getMonth()+1).padStart(2,'0');
  F.mes = meses.includes(atual) ? atual : meses[meses.length-1];
  // o vendedor abre no que é dele e fica nisso; a CMS abre no time inteiro
  if(!souCms()) F.prep = meuCodigo();
  montarFiltros();
  pintar();
}

/* ── os filtros ───────────────────────────────────────────────────── */
function mesesDoArquivo(){ return (METAS.meses || []).map(m => m.mes).sort(); }
function trimestresDoArquivo(){
  const t = new Set();
  for(const m of mesesDoArquivo()) t.add(m.slice(0,4) + '-T' + (Math.floor((+m.slice(5,7)-1)/3) + 1));
  return [...t].sort();
}
/* "2026-T4" vira os três meses dele que existem no arquivo. */
function mesesDe(sel){
  const q = /^(\d{4})-T(\d)$/.exec(sel);
  if(!q) return [sel];
  const base = (+q[2]-1)*3;
  const alvo = [0,1,2].map(i => q[1] + '-' + String(base+i+1).padStart(2,'0'));
  const tem = new Set(mesesDoArquivo());
  return alvo.filter(m => tem.has(m));
}
/* No seletor o mês vem com o ano — "jul/26" —, porque a lista cobre mais de
   um semestre e só "JUL" deixaria dúvida quando houver dois anos no arquivo. */
const rotuloMesCurto = sel => {
  const q = /^(\d{4})-T(\d)$/.exec(sel);
  if(q) return q[2] + 'º tri';
  return MES3[+sel.slice(5,7)-1].toLowerCase() + '/' + sel.slice(2,4);
};
const rotuloMes = sel => {
  const q = /^(\d{4})-T(\d)$/.exec(sel);
  if(q) return q[2] + 'º tri';
  return MES3[+sel.slice(5,7)-1];
};
const rotuloMesLongo = sel => {
  const q = /^(\d{4})-T(\d)$/.exec(sel);
  if(q) return mesesDe(sel).map(m => MESES[+m.slice(5,7)-1]).join(' · ') || (q[2] + 'º trimestre');
  return MESES[+sel.slice(5,7)-1] + ' de ' + sel.slice(0,4);
};

/* Só o primeiro nome: a tela é para quem convive com o time todo dia, e
   "Leandro" basta.

   Dois nomes precisam de cuidado. "CMS" é a SOMA da casa — o antigo "Todos",
   e é o que a barra azul mostra em todo cartão. O preposto que vem na Carta
   como "C M S" é a carteira do NÚCLEO, uma entre as outras; chamar os dois
   de CMS fazia parecer que um era o total do outro. */
const ehCms = p => /^c\s*m\s*s$/i.test(String((p && p.nome) || '').trim());
const nomeBonito = n => {
  const v = String(n || '').trim();
  if(/^c\s*m\s*s$/i.test(v)) return 'Núcleo';
  const p = v.toLowerCase().split(/\s+/)[0] || '';
  return p.charAt(0).toUpperCase() + p.slice(1);
};

/* Fora da lista por ora (pedido dele, 13/10). Ele sai dos chips e da visão
   de comparar; continua dentro da soma da CMS, que é o número oficial da
   Carta — tirá-lo de lá mudaria o total da casa. */
const FORA = ['4322318'];
function prepostosDoMes(sel){
  const vistos = new Map();
  for(const mes of mesesDe(sel)){
    const m = (METAS.meses || []).find(x => x.mes === mes);
    for(const p of ((m && m.prepostos) || []))
      if(!vistos.has(String(p.codigo))) vistos.set(String(p.codigo), p);
  }
  for(const c of FORA) vistos.delete(c);
  return [...vistos.values()].sort((a,b) =>
    ehCms(a) ? -1 : ehCms(b) ? 1 : String(a.nome).localeCompare(String(b.nome), 'pt-BR'));
}

/* O que cada um pode escolher. Para o vendedor a lista tem um nome só — o
   dele —, e o chip fica aceso sem ser um botão de verdade: dois cliques não
   levam a lugar nenhum, e uma lista com os colegas em cinza só avisaria que
   existe algo que ele não pode ver. */
function prepostosVisiveis(){
  const todos = prepostosDoMes(F.mes);
  if(souCms()) return todos;
  const eu = meuCodigo();
  return todos.filter(p => String(p.codigo) === eu);
}
function montarFiltros(){
  // marca
  $('fMarca').innerHTML = Object.entries(MARCAS).map(([k,v]) =>
    `<button class="chip${F.marca === k ? ' on' : ''}" data-marca="${k}">${esc(v.rotulo)}</button>`).join('');
  /* O ano inteiro não cabe na linha junto com a marca. Os meses do primeiro
     semestre — os dois primeiros trimestres — ficam atrás de um "+", e os do
     segundo aparecem por extenso. Se o escolhido está lá atrás, abre sozinho:
     um mês selecionado e invisível seria um estado sem saída. */
  const meses = mesesDoArquivo();
  const antigo = m => +m.slice(5, 7) <= 6;
  const escondidos = meses.filter(antigo);
  const abertos = F.abrirMeses || escondidos.includes(F.mes);
  const bt = m => `<button class="${F.mes === m ? 'on' : ''}" data-mes="${m}">${rotuloMesCurto(m)}</button>`;
  const presoAberto = escondidos.includes(F.mes);
  $('fMes').innerHTML =
    (escondidos.length ? (abertos
      ? (presoAberto ? '' : `<button class="mais" id="btMenosMeses"
            title="Esconder os meses do primeiro semestre"
            aria-label="Esconder os meses do primeiro semestre">−</button>`) + escondidos.map(bt).join('')
      : `<button class="mais" id="btMaisMeses" title="Mostrar ${escondidos.length} meses do primeiro semestre"
          aria-label="Mostrar os meses do primeiro semestre">+</button>`) : '')
    + meses.filter(m => !antigo(m)).map(bt).join('')
    + '<span class="sep"></span>'
    + trimestresDoArquivo().map(x =>
      `<button class="${F.mes === x ? 'on' : ''}" data-mes="${x}">${rotuloMes(x)}</button>`).join('');
  // preposto
  const lista = prepostosVisiveis();
  const cms = souCms();
  if(cms){
    if(!lista.some(p => String(p.codigo) === F.prep)) F.prep = 'TODOS';
  }else{
    F.prep = meuCodigo();
  }
  $('fPrep').innerHTML =
    (cms ? `<button class="chip${F.prep === 'TODOS' ? ' on' : ''}" data-prep="TODOS">CMS</button>` : '')
    + lista.map(p => `<button class="chip${F.prep === String(p.codigo) ? ' on' : ''}"
        data-prep="${esc(p.codigo)}">${esc(nomeBonito(p.nome))}</button>`).join('');
  // comparar vendedores é visão de gestor
  $('fVisao').hidden = !cms;
  if(!cms) F.comparar = false;
  // medida
  $('fMedida').innerHTML = [['pot','Potencial'], ['real','Realizado'], ['fat','Faturado']]
    .map(([k,r]) => `<button class="chip${F.medida === k ? ' on' : ''}" data-medida="${k}">${r}</button>`).join('');
  // a visão do gestor: uma barra por vendedor em cada cartão
  $('fVisao').innerHTML = `<button class="chip${F.comparar ? ' on' : ''}" id="btComparar">
    ${F.comparar ? 'Ver um por vez' : 'Comparar vendedores'}</button>`;
  $('fVisao').title = ehTrimestre(F.mes)
    ? 'No trimestre a comparação soma os três meses de cada um'
    : 'Uma barra por vendedor em cada cartão, com a CMS na frente';
}

document.addEventListener('click', ev => {
  const b = ev.target.closest('button'); if(!b) return;
  if(b.dataset.marca){ F.marca = b.dataset.marca; }
  else if(b.dataset.mes){ F.mes = b.dataset.mes; }
  else if(b.dataset.prep){ F.prep = b.dataset.prep; }
  else if(b.dataset.medida){ F.medida = b.dataset.medida; }
  else if(b.id === 'btComparar'){ F.comparar = !F.comparar; }
  else if(b.id === 'btMaisMeses'){ F.abrirMeses = true; montarFiltros(); return; }
  else if(b.id === 'btMenosMeses'){ F.abrirMeses = false; montarFiltros(); return; }
  else return;
  montarFiltros(); pintar();
});

/* ── as contas ────────────────────────────────────────────────────────
   O Potencial é o que abre: é o número que a equipe acompanha, porque
   inclui o vendido que ainda não faturou. Quando o arquivo não traz o
   potencial de uma linha, o realizado faz as vezes — foi assim que a
   conta passou a bater com a do Gestor. */
function valor(l, campo){
  const m = F.medida;
  if(m === 'fat') return l['fat_' + campo];
  if(m === 'real') return l['real_' + campo];
  const p = l['pot_' + campo];
  return p == null ? l['real_' + campo] : p;
}
const zero = () => ({ meta_q:0, meta_r:0, pos_q:0, pos_r:0, tem:false });
function somar(a, l){
  a.meta_q += l.meta_qtd || 0; a.meta_r += l.meta_rs || 0;
  a.pos_q += valor(l,'qtd') || 0; a.pos_r += valor(l,'rs') || 0;
  a.tem = true; return a;
}
/* Percorre as linhas do recorte: os meses escolhidos, os prepostos pedidos
   ('TODOS' soma o time inteiro) e devolve cada linha ao visitante. */
function percorrer(sel, codigo, visita){
  for(const mes of mesesDe(sel)){
    const m = (METAS.meses || []).find(x => x.mes === mes);
    for(const p of ((m && m.prepostos) || [])){
      if(codigo !== 'TODOS' && String(p.codigo) !== String(codigo)) continue;
      for(const l of (p.linhas || [])) visita(l, p, mes);
    }
  }
}

/* O recorte de uma marca: o total de tênis, as faixas dele e as famílias
   em R$. */
function agregar(sel, codigo, marcaId){
  const cfg = MARCAS[marcaId];
  const tot = zero(), faixas = {}, familias = {};
  /* Com a Olympikus na tela, a Under Armour INTEIRA entra como mais uma
     família: é assim que ela conta na Carta Campanha e é assim que ela soma
     na trava dos 15% — tênis dela incluso, numa coluna só. Sem ela o bloco
     mostrava quatro das cinco parcelas que formam os 15%, e o vendedor não
     via de onde vinha o pedaço que falta. */
  const ua = marcaId === 'OLY' ? zero() : null;
  percorrer(sel, codigo, l => {
    if(l.marca === cfg.tenis){
      somar(tot, l);
      somar(faixas[l.faixa] = faixas[l.faixa] || zero(), l);
    }else if(cfg.familias.includes(l.marca)){
      somar(familias[l.marca] = familias[l.marca] || zero(), l);
    }else if(ua && MARCAS_UA.includes(l.marca)){
      somar(ua, l);
    }
  });
  const ord = (o, k) => (cfg.ordemFaixa[k] != null ? cfg.ordemFaixa[k] : 90);
  const lista = (obj, usarOrdem) => Object.entries(obj)
    .map(([k,v]) => ({ chave:k, nome:NOMES[k] || k, ...v }))
    .sort((a,b) => usarOrdem ? (ord(0,a.chave) - ord(0,b.chave))
                             : (cfg.familias.indexOf(a.chave) - cfg.familias.indexOf(b.chave)));
  // a fila das famílias é a da marca, não a do preposto: sem isso, quem não
  // tem meta de confecção perdia a coluna, e o Gestor a mantém com "sem meta"
  for(const k of cfg.familias) if(!familias[k]) familias[k] = zero();
  const fams = lista(familias, false);
  // a Under Armour fecha a fila, depois das famílias da própria marca
  if(ua && ua.tem) fams.push({ chave:'UA', nome:'Under Armour', ...ua });
  return { tot, faixas:lista(faixas, true), familias:fams };
}

/* A TRAVA DOS 15%: no numerador, as outras famílias Olympikus mais a Under
   Armour inteira (tênis dela incluso, uma família só); no denominador, a
   META de tênis Olympikus em R$ — não o tênis vendido. */
function trava(sel, codigo){
  let meta = 0; const partes = {};
  percorrer(sel, codigo, l => {
    if(l.marca === 'OLY'){ meta += l.meta_rs || 0; return; }
    const k = MARCAS_UA.includes(l.marca) ? 'UA' : (['ACOLY','CHOLY','MEOLY','CFOLY'].includes(l.marca) ? l.marca : null);
    if(!k) return;
    partes[k] = (partes[k] || 0) + (valor(l,'rs') || 0);
  });
  if(!meta) return null;
  const num = Object.values(partes).reduce((s,v) => s+v, 0);
  const pct = num / meta;
  // para a CMS é leitura, não trava: a cobrança dos 15% é de cada vendedor
  const informativo = codigo === 'TODOS';
  return { meta, num, partes, pct, informativo,
    ok: !informativo && pct >= TRAVA_15, falta: meta*TRAVA_15 - num };
}

const bateu = (pos, meta, g) => meta > 0 && pos >= meta * g;
const alvo = (meta, g) => (meta || 0) * g;
/* altura em % da área: 100% da meta fica a 2/3 do cartão, porque o eixo
   sobe até 150% — assim quem passou da meta ainda aparece inteiro */
function altura(pos, meta, escala){
  if(!pos || pos <= 0) return 0;
  const ref = meta || escala; if(!ref) return 0;
  return Math.round(Math.min(pos/ref, TETO) / TETO * 1000) / 10;
}
const linhaRegua = (g, rot, classe) =>
  `<i class="${classe || 'l100'}" style="bottom:${(g/TETO*100).toFixed(2)}%"><b>${rot}</b></i>`;

/* Cada barra mora numa coluna, e a estrela de quem bateu fica EM CIMA dela —
   no topo da própria coluna, não no canto do cartão: assim se lê de relance
   qual das barras bateu, que era o que o canto não dizia. */
function coluna(quem, pos, meta, ok, tom, atraso, escala){
  const h = altura(pos, meta, escala);
  const ouro = ok && tom !== 'prata';
  return `<div class="pb" style="--h:${h}%">
    ${ok ? `<span class="s${tom === 'prata' ? ' pr' : ''}">${ESTRELA}</span>` : ''}
    <div class="b ${quem}${ouro ? ' ouro' : ''}${pos ? '' : ' vazia'}"
      style="height:${h}%;animation-delay:${(atraso||0).toFixed(2)}s"></div>
  </div>`;
}

/* ── o desenho ──────────────────────────────────────────────────────── */
const ehTrimestre = sel => /^\d{4}-T\d$/.test(String(sel || ''));

function pintar(){
  const cfg = MARCAS[F.marca];
  const soCms = F.prep === 'TODOS';
  const dCms = agregar(F.mes, 'TODOS', F.marca);
  const dVen = soCms ? dCms : agregar(F.mes, F.prep, F.marca);
  const prep = prepostosDoMes(F.mes).find(p => String(p.codigo) === F.prep);
  const nome = soCms ? 'CMS' : nomeBonito(prep && prep.nome);

  if(!dCms.tot.tem){
    $('painel').innerHTML = `<div class="aviso">Não há linha de <b>${esc(cfg.rotulo)}</b>
      em ${esc(rotuloMesLongo(F.mes))}. Escolha outro mês ou outra marca.</div>`;
    return;
  }
  /* O trimestre não vira um número só: cada mês tem a sua barra e a sua
     estrela, pelas mesmas regras. Somar os três esconderia o mês ruim atrás
     do bom, que é justamente o que o diretor precisa enxergar. Com
     "comparar vendedores" ligado a visão é outra — ali o trimestre soma,
     porque o que se compara é o acumulado de cada um. */
  const porMes = (ehTrimestre(F.mes) && !F.comparar)
    ? mesesDe(F.mes).map(m => ({ mes:m, cms:agregar(m, 'TODOS', F.marca),
        ven:soCms ? null : agregar(m, F.prep, F.marca) }))
    : null;

  const cmsDestravou = bateu(dCms.tot.pos_q, dCms.tot.meta_q, GATILHO_TOTAL);
  const t15Mes = trava(F.mes, F.prep);
  const porta = !soCms && cmsDestravou && bateu(dVen.tot.pos_q, dVen.tot.meta_q, GATILHO_TOTAL)
                && !!(t15Mes && t15Mes.ok);

  const t15Tri = trava(trimestreDe(F.mes), F.prep);
  const ctx = { soCms, cmsDestravou, porta, nome, porMes, tem15: !!(t15Tri && t15Tri.ok) };
  const html = [];
  if(t15Mes) html.push(blocoTrava(t15Mes, trava(trimestreDe(F.mes), F.prep), nome));
  html.push(blocoTenis(dCms, dVen, ctx));
  if(dCms.familias.length) html.push(blocoFamilias(dCms, dVen, ctx));
  html.push(blocoLegenda(soCms, nome));
  const modo = F.comparar ? ' cmp' : (porMes ? ' tri' : '');
  $('painel').innerHTML = `<div class="mt${modo}">${html.join('')}</div>`;
}

/* O trimestre a que o mês escolhido pertence — quando já é um trimestre,
   ele mesmo. A trava é cobrada no trimestre; o mês ao lado é a leitura
   parcial dele. */
function trimestreDe(sel){
  if(/^\d{4}-T\d$/.test(sel)) return sel;
  return sel.slice(0,4) + '-T' + (Math.floor((+sel.slice(5,7)-1)/3) + 1);
}
function blocoTrava(tMes, tTri, nome){
  /* A régua começa pela META de tênis — o denominador — e as famílias se
     empilham depois. Ela vai até a meta mais os 15% (ou até o fim do que
     existe, quando passou), então o vazio entre a pilha e o tracinho É
     exatamente o que falta. */
  const uma = (rot, t) => {
    if(!t) return '';
    const i = !!t.informativo;
    // sem trava, a régua vai só até onde as fatias somam
    const ref = i ? (t.meta + t.num) : Math.max(t.meta + t.num, t.meta * (1 + TRAVA_15));
    const w = v => (v/ref*100).toFixed(2);
    const seg = `<i class="f-OLY" style="width:${w(t.meta)}%"></i>` +
      FAMS15.map(([k]) => { const v = t.partes[k] || 0;
        return v > 0 ? `<i class="f-${k}" style="width:${w(v)}%"></i>` : ''; }).join('');
    return `<div class="un">
      <span class="qd">${esc(rot)}</span>
      <span class="trk">${i ? '' : `<i class="mk${t.ok ? ' ok' : ''}" style="left:${w(t.meta*(1+TRAVA_15))}%"></i>`}${seg}</span>
      <span class="pc${t.ok ? ' ok' : ''}">${pctTxt(t.pct)}</span>
      <span class="fa">${i ? 'das outras famílias sobre o tênis'
        : (t.falta > 0 ? 'faltam R$ ' + kk(t.falta) : 'R$ ' + kk(-t.falta) + ' acima')}</span>
    </div>`;
  };
  const base = tTri || tMes;
  const info = !!base.informativo;
  const detalhe = FAMS15.map(([k,r]) => { const v = base.partes[k] || 0;
    return v > 0 ? `<span><i class="f-${k}"></i>${esc(r.toLowerCase())} ${pctTxt(v/base.meta)}</span>` : ''; }).join('');
  const mesmo = /^\d{4}-T\d$/.test(F.mes);
  return `<div class="t15">
    <div class="rot">${info ? 'Composição do faturamento' : 'Trava dos 15% · ' + esc(nome)}<span class="so-largo"> ·
      outras famílias e Under Armour sobre a meta de tênis Olympikus</span></div>
    ${mesmo ? '' : uma(rotuloMes(F.mes), tMes)}
    ${uma(mesmo ? rotuloMes(F.mes) : 'Trimestre', tTri)}
    <div class="lg"><span><i class="f-OLY"></i>meta de tênis R$ ${kk(base.meta)}</span>${detalhe}
      ${info ? '' : '<span><i class="mk"></i>15% da meta</span>'}
      <span>${info ? 'a CMS não tem trava: os 15% são cobrados de cada vendedor'
                   : 'a trava é cobrada no trimestre; o mês é a leitura parcial dele'}</span></div>
  </div>`;
}

function blocoTenis(dCms, dVen, ctx){
  const esc100 = !dCms.tot.meta_q ? Math.max(1, dCms.tot.pos_q, dVen.tot.pos_q) : null;
  const cartoes = [cartao({
    classe:'tot', nome:'TOTAL', c:dCms.tot, v:dVen.tot, gatilho:GATILHO_TOTAL,
    unidade:'q', i:0, escala:esc100, okC:ctx.cmsDestravou, okV:ctx.porta ? 'ouro' : null,
    segunda:true, grupo:'tot', ctx,
  })];
  dCms.faixas.forEach((f, i) => {
    const v = dVen.faixas.find(x => x.chave === f.chave) || zero();
    const okC = ctx.cmsDestravou && bateu(f.pos_q, f.meta_q, GATILHO_FAIXA);
    const okV = ctx.porta && okC ? (bateu(v.pos_q, v.meta_q, GATILHO_FAIXA) ? 'ouro' : 'prata') : null;
    cartoes.push(cartao({ nome:f.nome, c:f, v, gatilho:GATILHO_FAIXA, unidade:'q',
      i:i+1, okC, okV, chave:f.chave, ctx }));
  });
  return `<div class="sec">
    <div class="rot">Calçados · pares${F.medida === 'fat' ? ' faturados' : (F.medida === 'pot' ? ' · potencial' : '')}</div>
    <div class="rolo"><div class="fila">${cartoes.join('')}</div></div>
  </div>`;
}

function blocoFamilias(dCms, dVen, ctx){
  const cartoes = dCms.familias.map((f, i) => {
    const v = dVen.familias.find(x => x.chave === f.chave) || zero();
    /* Regra do Gestor de 13/10: a família é INDEPENDENTE dos tênis. Ele bateu
       os 95%, doura e ganha a estrela — sem porta e sem esperar a CMS. A prata
       (os 50% da carta) é quando a CMS bateu a família, ele não, e ele tem os
       15% do trimestre. As faixas de tênis seguem com a porta tripla. */
    const okC = bateu(f.pos_r, f.meta_r, GATILHO_FAMILIA);
    const okV = bateu(v.pos_r, v.meta_r, GATILHO_FAMILIA) ? 'ouro'
              : ((ctx.tem15 && okC) ? 'prata' : null);
    return cartao({ nome:f.nome, c:f, v, gatilho:GATILHO_FAMILIA, unidade:'r',
      i, okC, okV, chave:f.chave, ctx });
  });
  return `<div class="sec">
    <div class="rot">Outras famílias · R$</div>
    <div class="rolo"><div class="fila">${cartoes.join('')}</div></div>
  </div>`;
}

/* Tira do recorte agregado o grupo deste cartão — o total, a faixa ou a
   família, pela chave. */
function grupoDo(d, o){
  if(!d) return zero();
  if(o.grupo === 'tot') return d.tot;
  return d.faixas.find(x => x.chave === o.chave) || d.familias.find(x => x.chave === o.chave) || zero();
}

/* Um cartão: nome, as barras com a régua do gatilho e os números embaixo —
   a falta (ou o excedente) grande, a meta pequena. */
function cartao(o){
  const ctx = o.ctx, q = o.unidade === 'q';
  const pos = g => q ? g.pos_q : g.pos_r, meta = g => q ? g.meta_q : g.meta_r;
  const num = v => q ? nf(v) : 'R$ ' + kk(v);
  const gap = (g, a) => { const d = a - pos(g);
    return !meta(g) ? '—' : (d > 0 ? '−' + num(d) : '+' + num(-d)); };
  const metaTxt = g => !meta(g) ? 'sem meta'
    : Math.round(o.gatilho*100) + '% de ' + num(meta(g));

  let barras, rodape;
  if(F.comparar){
    barras = barrasComparadas(o);
    rodape = legendaComparados(o);
  }else if(ctx.porMes){
    barras = barrasPorMes(o);
    rodape = tiraQuem(o) + legendaPorMes(o);
  }else{
    barras = coluna('c', pos(o.c), meta(o.c), o.okC, null, o.i*0.06, o.escala)
      + (ctx.soCms ? '' : coluna('v', pos(o.v), meta(o.v), !!o.okV, o.okV, o.i*0.06 + 0.05, o.escala));
    rodape = `<div class="num">
      <div><span class="q">CMS</span><b class="g c${o.okC ? ' ok' : ''}">${gap(o.c, alvo(meta(o.c), o.gatilho))}</b></div>
      ${ctx.soCms ? '' : `<div><span class="q">${esc(ctx.nome)}</span>
        <b class="g v${bateu(pos(o.v), meta(o.v), o.gatilho) ? ' ok' : ''}">${gap(o.v, alvo(meta(o.v), o.gatilho))}</b></div>`}
    </div>
    <span class="mm">${esc(metaTxt(ctx.soCms ? o.c : o.v))}</span>`;
  }

  const reguas = linhaRegua(o.gatilho, Math.round(o.gatilho*100) + '%')
    + (o.segunda && o.gatilho !== 1 ? linhaRegua(1, 'meta', 'lref') : '');

  return `<div class="cd ${o.classe || ''}">
    <div class="nm">${esc(o.nome)}</div>
    <div class="bars">${reguas}${barras}</div>
    ${rodape}
  </div>`;
}

/* ── o trimestre, mês a mês ───────────────────────────────────────────
   Uma coluna por mês. Com um vendedor escolhido são duas barras por mês
   (CMS e ele); com a CMS, uma só. As regras são as mesmas de um mês
   isolado, aplicadas dentro de cada um. */
function barrasPorMes(o){
  const ctx = o.ctx;
  return ctx.porMes.map((m, i) => {
    const gc = grupoDo(m.cms, o), gv = grupoDo(m.ven, o);
    const q = o.unidade === 'q';
    const pc = q ? gc.pos_q : gc.pos_r, mc = q ? gc.meta_q : gc.meta_r;
    const pv = q ? gv.pos_q : gv.pos_r, mv = q ? gv.meta_q : gv.meta_r;
    // o destrave da CMS é do mês, não do trimestre
    const destravou = bateu(m.cms.tot.pos_q, m.cms.tot.meta_q, GATILHO_TOTAL);
    const familia = o.unidade === 'r';
    const okC = o.grupo === 'tot' ? destravou
      : (familia ? bateu(pc, mc, o.gatilho) : destravou && bateu(pc, mc, o.gatilho));
    // família: ele bateu, acende; tênis: só com a CMS tendo destravado o mês
    const okV = ctx.soCms ? null
      : (familia ? (bateu(pv, mv, o.gatilho) ? 'ouro' : ((ctx.tem15 && okC) ? 'prata' : null))
                 : ((okC && bateu(pv, mv, o.gatilho)) ? 'ouro' : null));
    return `<div class="mb">
      ${coluna('c', pc, mc, okC, null, i*0.06, o.escala)}
      ${ctx.soCms ? '' : coluna('v', pv, mv, !!okV, okV, i*0.06 + 0.04, o.escala)}
    </div>`;
  }).join('');
}
/* Uma casa e uma silhueta sob cada par de barras, na mesma grade dos meses —
   assim cada desenho cai sob a sua coluna. Com a CMS escolhida há uma barra
   só por mês, e a silhueta não aparece. */
function tiraQuem(o){
  const ctx = o.ctx;
  return `<div class="quem" aria-hidden="true">${ctx.porMes.map(() =>
    `<span class="par"><i class="c">${ICO_CMS}</i>${ctx.soCms ? '' : `<i class="v">${ICO_VEND}</i>`}</span>`
  ).join('')}</div>`;
}
function legendaPorMes(o){
  const ctx = o.ctx, q = o.unidade === 'q';
  return `<div class="leg-mes">${ctx.porMes.map(m => {
    const g = grupoDo(ctx.soCms ? m.cms : m.ven, o);
    const pos = q ? g.pos_q : g.pos_r, meta = q ? g.meta_q : g.meta_r;
    return `<span><b>${meta ? Math.round(100*pos/meta) + '%' : '—'}</b>${MES3[+m.mes.slice(5,7)-1]}</span>`;
  }).join('')}</div>`;
}

/* ── comparar vendedores ──────────────────────────────────────────────
   Uma barra por vendedor no mesmo cartão, na ordem dos chips, com a CMS
   primeiro — ela é a régua contra a qual os outros se leem. */
function prepostosComparar(){
  return [{ codigo:'TODOS', nome:'CMS', cms:true },
          ...prepostosVisiveis().filter(p => !ehCms(p))];
}
/* Cada coluna do comparativo é um recorte caro de montar (as linhas de todos
   os meses do preposto), e os onze cartões pedem o mesmo. Calcula uma vez por
   pintura e guarda. */
let CMP = null;
function dadosComparar(){
  if(CMP && CMP.chave === F.mes + '|' + F.marca + '|' + F.medida) return CMP.lista;
  const cms = agregar(F.mes, 'TODOS', F.marca);
  const destravou = bateu(cms.tot.pos_q, cms.tot.meta_q, GATILHO_TOTAL);
  const lista = prepostosComparar().map(p => {
    const d = p.cms ? cms : agregar(F.mes, String(p.codigo), F.marca);
    const t15 = p.cms ? null : trava(trimestreDe(F.mes), String(p.codigo));
    // a porta do vendedor, só para as faixas de tênis
    const porta = !p.cms && destravou && bateu(d.tot.pos_q, d.tot.meta_q, GATILHO_TOTAL)
                  && !!(t15 && t15.ok);
    return { p, d, porta };
  });
  CMP = { chave: F.mes + '|' + F.marca + '|' + F.medida, lista };
  return lista;
}
function barrasComparadas(o){
  const familia = o.unidade === 'r';
  return dadosComparar().map(({ p, d, porta }, i) => {
    const g = grupoDo(d, o);
    const pos = familia ? g.pos_r : g.pos_q, meta = familia ? g.meta_r : g.meta_q;
    const bateuEle = bateu(pos, meta, o.gatilho);
    // a CMS acende ao bater; o vendedor também, mas nas faixas de tênis só com
    // a porta aberta — a família é independente (regra de 13/10)
    const ok = p.cms ? bateuEle : (familia ? bateuEle : (bateuEle && porta));
    return coluna(p.cms ? 'c' : 'v', pos, meta, ok, null, i*0.05, o.escala);
  }).join('');
}
function legendaComparados(o){
  const q = o.unidade === 'q';
  return `<div class="leg-prep">${dadosComparar().map(({ p, d }) => {
    const g = grupoDo(d, o);
    const pos = q ? g.pos_q : g.pos_r, meta = q ? g.meta_q : g.meta_r;
    const pc = meta ? Math.round(100*pos/meta) + '%' : '—';
    const nome = p.cms ? 'CMS' : nomeBonito(p.nome);
    return `<span title="${esc(p.nome)}"${p.cms ? ' class="cms"' : ''}><b>${pc}</b>${esc(nome)}</span>`;
  }).join('')}</div>`;
}

function blocoLegenda(soCms, nome){
  if(F.comparar) return `<div class="leg">
    <span><i class="q c"></i>CMS, a primeira barra</span>
    <span><i class="q v"></i>cada vendedor, na ordem dos chips</span>
    <span><i class="q o"></i>bateu</span>
    <span><i class="s">${ESTRELA}</i>total ${Math.round(GATILHO_TOTAL*100)}% ·
      faixa ${Math.round(GATILHO_FAIXA*100)}% · família ${Math.round(GATILHO_FAMILIA*100)}%</span>
  </div>`;
  return `<div class="leg">
    <span><i class="q c"></i>CMS</span>
    ${soCms ? '' : `<span><i class="q v"></i>${esc(nome)}</span>`}
    <span><i class="q o"></i>bateu</span>
    <span><i class="s">${ESTRELA}</i>total ${Math.round(GATILHO_TOTAL*100)}% ·
      faixa ${Math.round(GATILHO_FAIXA*100)}% · família ${Math.round(GATILHO_FAMILIA*100)}%</span>
  </div>`;
}

/* A altura do menu muda com a largura da tela e com o "+" dos meses, então
   ela é medida, não chutada: é dela que a trava sabe onde parar. */
function medirMenu(){
  const f = document.querySelector('.filtros');
  if(!f || f.hidden) return;
  document.documentElement.style.setProperty('--alt-menu',
    Math.round(f.getBoundingClientRect().height) + 'px');
}
new ResizeObserver(medirMenu).observe(document.querySelector('.filtros'));
window.addEventListener('resize', medirMenu, { passive:true });

carregar();
</script>
</body>
</html>
