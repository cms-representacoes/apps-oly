<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>Desmembramentos • Repasse Olympikus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <style>
    :root{
      --bg:#f6f7fb; --card:#ffffff; --text:#0f172a; --line:#e2e8f0;
      --brand:#2836d4; --brand-soft:rgba(40,54,212,.10);
      --shadow:0 18px 42px rgba(15,23,42,.08);
      --success:#15803d; --success-soft:#dcfce7;
      --warning:#b45309; --warning-soft:#fef3c7;
      --danger:#b91c1c; --danger-soft:#fee2e2;
      --muted:#475569; --muted-soft:#e2e8f0;
    }
    .dark{
      --bg:#0f172a; --card:#1e293b; --text:#f1f5f9; --line:#334155;
      --brand:#818cf8; --brand-soft:rgba(129,140,248,.15);
      --shadow:0 18px 42px rgba(0,0,0,.4);
      --success:#4ade80; --success-soft:#14532d;
      --warning:#fbbf24; --warning-soft:#451a03;
      --danger:#f87171; --danger-soft:#450a0a;
      --muted:#94a3b8; --muted-soft:#1e293b;
    }
    *{ box-sizing:border-box; }
    body{ font-family:Inter,system-ui,sans-serif; background:var(--bg); color:var(--text); margin:0; }

    /* Dark mode overrides */
    .dark .bg-white{ background:var(--card)!important; }
    .dark .bg-slate-50,.dark .bg-slate-100{ background:#1e293b!important; }
    .dark .border-slate-200{ border-color:var(--line)!important; }
    .dark .text-slate-800,.dark .text-slate-700{ color:var(--text)!important; }
    .dark .text-slate-500,.dark .text-slate-400{ color:var(--muted)!important; }
    .dark .shadow-card{ box-shadow:var(--shadow)!important; }
    .dark .hover\:bg-slate-50:hover,.dark .hover\:bg-slate-100:hover{ background:#334155!important; }
    .dark .table-wrap thead th{ background:#263248!important; color:#94a3b8!important; }
    .dark .table-wrap tbody tr:hover td{ background:#263248!important; }
    .dark .table-wrap tbody td{ border-color:#334155!important; }

    .shadow-card{ box-shadow:var(--shadow); }
    .focus-ring:focus-visible{ outline:none; box-shadow:0 0 0 4px rgba(40,54,212,.15); }

    /* TABLE */
    /* A altura vem do JS (ver ajustarAlturaTabela): o 280px fixo foi
       calculado para o cabecalho antigo, de tres fileiras, e com o novo
       sobravam 100 px de vazio embaixo da tabela. O valor aqui e so o
       primeiro desenho, antes de o JS medir. */
    .table-wrap{ overflow:auto; border-radius:20px; border:1px solid var(--line); background:var(--card); max-height:calc(100vh - 210px); }
    .table-wrap table{ width:100%; min-width:1000px; border-collapse:separate; border-spacing:0; }
    .table-wrap thead th{ position:sticky; top:0; z-index:2; background:#f8fafc; color:#475569; font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; text-align:left; padding:11px 14px; border-bottom:1px solid var(--line); white-space:nowrap; user-select:none; }
    .table-wrap tbody td{ padding:11px 14px; font-size:13px; border-bottom:1px solid #edf2f7; vertical-align:middle; }
    /* A linha da visao por LOTE carrega duas alturas de texto (Nº com o GCI
       embaixo, produto com o codigo), entao ela engordou de 50 para 59 px -
       e o que o cabecalho devolveu em altura, a linha comia de volta. Com o
       respiro menor e a segunda linha mais junta, ela volta para ~46 px. */
    #tableWrap tbody td{ padding:8px 12px; }
    #tableWrap .cel-fraca{ line-height:1.25; }
    .table-wrap tbody tr:last-child td{ border-bottom:none; }
    .table-wrap tbody tr:hover td{ background:#f8fafc; cursor:default; }

    .chip{ display:inline-flex; align-items:center; gap:4px; border-radius:999px; padding:3px 10px; font-size:11px; font-weight:700; }
    .chip-pend{ background:var(--warning-soft); color:var(--warning); border:0.5px solid #fde68a; }
    .chip-fin{ background:var(--success-soft); color:var(--success); border:0.5px solid #bbf7d0; }
    .chip-parc{ background:#ffedd5; color:#c2410c; border:0.5px solid #fdba74; }

    /* As duas visoes da tela. Mesmo trilho da DISPO e do Repasses: diz que
       a escolha esta um nivel acima dos filtros. */
    .visao-tabs{ display:inline-flex; gap:3px; padding:3px; background:#eef1f7;
      border:0.5px solid var(--line,#e2e8f0); border-radius:999px; }
    .visao-tab{ display:inline-flex; align-items:center; gap:6px; border:0;
      background:transparent; cursor:pointer; border-radius:999px; padding:5px 14px;
      font-size:12.5px; font-weight:800; color:#64748b; white-space:nowrap;
      transition:background .15s, color .15s, box-shadow .15s; }
    .visao-tab:hover{ color:#0f172a; }
    .visao-tab.active{ background:#fff; color:var(--brand); box-shadow:0 2px 8px rgba(15,23,42,.14); }
    .dark .visao-tabs{ background:rgba(255,255,255,.05)!important; border-color:rgba(255,255,255,.10)!important; }
    .dark .visao-tab{ color:#a9b8d6!important; }
    .dark .visao-tab.active{ background:#1e293b!important; color:#93c5fd!important; }
    .cli-linha{ cursor:pointer; }
    .cli-linha:hover{ background:var(--brand-soft,#eef2ff); }

    .toast-wrap{ position:fixed; top:18px; right:18px; display:flex; flex-direction:column; gap:10px; z-index:9999; pointer-events:none; }
    .toast{ pointer-events:auto; min-width:240px; border-radius:16px; padding:12px 16px; box-shadow:0 8px 24px rgba(15,23,42,.14); font-size:13px; font-weight:700; border:1px solid transparent; }
    .toast-success{ background:#f0fdf4; color:#166534; border-color:#bbf7d0; }
    .toast-error{ background:#fef2f2; color:#b91c1c; border-color:#fecaca; }
    .toast-info{ background:#eff6ff; color:#1d4ed8; border-color:#bfdbfe; }

    /* Tooltips */
    [data-tip]{ position:relative; }
    [data-tip]:hover::after{ content:attr(data-tip); position:absolute; bottom:calc(100% + 6px); left:50%; transform:translateX(-50%); background:#0f172a; color:#f8fafc; font-size:11px; font-weight:600; border-radius:8px; padding:4px 9px; white-space:nowrap; z-index:300; pointer-events:none; }
    .dark [data-tip]:hover::after{ background:#334155; }

    .empty-state{ text-align:center; padding:60px 24px; color:#94a3b8; }
    .empty-state i{ font-size:36px; margin-bottom:14px; display:block; }

    /* Expand de lojas */
    .tr-main{ cursor:pointer; }
    .tr-main:hover td{ background:#f8fafc; }
    .tr-main.open td{ background:#f0f4ff; }
    .dark .tr-main.open td{ background:#1e2a4a!important; }
    .tr-expand td{ padding:0; background:#f8fafc; border-bottom:1px solid var(--line); }
    .dark .tr-expand td{ background:#1e293b!important; }
    .tr-expand-inner{ padding:10px 16px 14px; }
    .sub-table{ width:100%; border-collapse:collapse; font-size:12px; min-width:600px; }
    .sub-table thead th{ background:#e8ecff; color:#3730a3; font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; padding:7px 12px; border-bottom:1px solid #c7d2fe; text-align:left; white-space:nowrap; }
    .dark .sub-table thead th{ background:#1e2a4a!important; color:#818cf8!important; border-color:#334155!important; }
    .sub-table tbody td{ padding:8px 12px; border-bottom:1px solid #eef2ff; vertical-align:middle; color:var(--text); }
    .dark .sub-table tbody td{ border-color:#334155!important; }
    .sub-table tbody tr:last-child td{ border-bottom:none; }
    .btn-det{ display:inline-flex; align-items:center; gap:5px; border:0.5px solid var(--line); border-radius:999px; padding:4px 11px; font-size:11px; font-weight:700; cursor:pointer; background:none; color:var(--muted); white-space:nowrap; transition:all .1s; }
    .btn-det:hover,.btn-det.open{ border-color:var(--brand); color:var(--brand); background:var(--brand-soft); }
    .badge-lojas{ background:#e0e7ff; color:#3730a3; border-radius:999px; padding:1px 6px; font-size:10px; font-weight:700; }
    .dark .badge-lojas{ background:#1e2a4a; color:#818cf8; }

    /* o cabecalho numa linha: tudo nele e flex:none e a linha rola */
    .cab-uma-linha{ display:flex; align-items:center; gap:8px;
      overflow-x:auto; scrollbar-width:none; }
    .cab-uma-linha::-webkit-scrollbar{ display:none; }
    .campo-periodo.hidden{ display:none; }
    .campo-periodo{ display:inline-flex; align-items:center; gap:6px; flex:none;
      border:1px solid var(--line); background:#fff; border-radius:999px;
      padding:5px 10px 5px 13px; font-size:11.5px; font-weight:700; color:#64748b; }
    .campo-periodo select{ border:0; background:none; font:inherit; font-size:12.5px;
      font-weight:800; color:var(--text); outline:none; cursor:pointer; }
    .dark .campo-periodo{ background:var(--card); }
    .pill-resumo{ display:inline-flex; align-items:center; gap:4px; flex:none;
      border-radius:999px; padding:4px 9px; font-size:11px; font-weight:700; white-space:nowrap; }
    .pill-resumo b{ font-weight:800; }
    /* a linha da tabela: nome forte em cima, dado fraco embaixo */
    .cel-forte{ font-weight:800; color:var(--text); }
    .cel-fraca{ font-size:11px; font-weight:600; color:var(--muted); }
    /* Com so o numero dentro de um circulo, ninguem via que era um botao -
       ele precisa da seta para dizer que abre. */
    .det-abrir{ display:inline-flex; align-items:center; gap:5px; border:1px solid var(--line);
      border-radius:999px; padding:3px 10px 3px 8px; background:#fff; color:var(--muted);
      font-size:11px; font-weight:800; cursor:pointer; white-space:nowrap; transition:all .1s; }
    .det-abrir i{ font-size:9px; }
    .det-abrir:hover,.det-abrir.open{ border-color:var(--brand); color:var(--brand);
      background:var(--brand-soft); }
    .dark .det-abrir{ background:var(--card); }
    /* recolher todos: so existe quando ha algo aberto */
    /* Com um lote em foco a lista some, e este botao e a unica saida.
       Vermelho com letra branca a pedido dele em 25/11/2026: antes era
       branco com letra cinza, igual aos botoes que nao levam a lugar
       nenhum, e quem nao sabia do foco ficava preso. #DC2626 da 4,8:1
       contra o branco e e o mesmo vermelho que o Showroom ja usa. */
    .btn-voltar-lista{ background:#DC2626 !important; color:#fff !important;
      border-color:#DC2626 !important; font-weight:800 !important;
      box-shadow:0 2px 8px rgba(220,38,38,.3); }
    .btn-voltar-lista:hover{ background:#B91C1C !important;
      border-color:#B91C1C !important; }
    .btn-voltar-lista i{ color:#fff !important; }
    /* O display mora aqui, e nao no elemento: com style="display:flex"
       inline, a classe .hidden (display:none) perdia para ele e as pilulas
       nunca sumiam - foi o que aconteceu ao entrar no foco. */
    #pillsResumo:not(.hidden){ display:flex; gap:6px; align-items:center; margin-left:6px; }

    @keyframes shimmer{ 100%{ transform:translateX(100%); } }
    .loading-shimmer{ position:relative; overflow:hidden; }
    .loading-shimmer::after{ content:""; position:absolute; inset:0; transform:translateX(-100%); background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent); animation:shimmer 1.2s infinite; }
  </style>
</head>
<body>
<div id="toastWrap" class="toast-wrap"></div>

<main class="min-h-screen p-4 sm:p-6">
  <div class="mx-auto max-w-[1400px]">

    <!-- HEADER -->
    <header class="rounded-[32px] border border-slate-200 bg-white p-4 sm:p-5 shadow-card mb-4 sticky top-4 z-30">
      <!-- Uma linha so, que rola de lado no celular e no tablet: eram tres
           fileiras (titulo, busca+visoes+periodo, botoes) e 303 px antes da
           primeira linha da tabela. -->
      <div class="cab-uma-linha">
        <div class="flex items-center gap-3" style="flex:none">
          <button onclick="voltarParaDispo()" data-tip="Voltar ao DISPO"
            class="focus-ring flex items-center justify-center h-10 w-10 rounded-2xl border border-slate-200 bg-slate-50 text-slate-600 hover:bg-slate-100 transition-colors">
            <i class="fa-solid fa-arrow-left text-sm"></i>
          </button>
          <div>
            <div class="text-[11px] font-bold text-slate-500">Controle de estoque</div>
            <div class="text-lg font-extrabold" style="white-space:nowrap">Desmembramentos</div>
          </div>
        </div>

        <div class="flex items-center gap-2" style="flex:none">
          <!-- Busca -->
          <div class="flex items-center gap-2 rounded-full border border-slate-200 bg-white px-3 py-2 min-w-[220px]" style="flex:none">
            <i class="fa-solid fa-magnifying-glass text-slate-400 text-sm"></i>
            <input id="searchInput" class="focus-ring w-full bg-transparent text-sm outline-none" placeholder="Produto, código, Nº, GCI..."/>
            <button id="btnClearSearch" class="hidden text-slate-400 hover:text-slate-600" data-tip="Limpar busca (ESC)">
              <i class="fa-solid fa-xmark text-sm"></i>
            </button>
          </div>

          <!-- As duas visões -->
          <div class="visao-tabs" id="visaoTabs" role="tablist" aria-label="Visão">
            <button type="button" class="visao-tab active" data-visao="lote" role="tab"
                    aria-selected="true" title="Os lotes desmembrados, como sempre">
              <i class="fa-solid fa-boxes-stacked"></i>Por lote
            </button>
            <button type="button" class="visao-tab" data-visao="cliente" role="tab"
                    aria-selected="false" title="Quem recebeu e quantos pares, pela planilha do Chris">
              <i class="fa-solid fa-store"></i>Por cliente
            </button>
          </div>

          <!-- Periodo: lista suspensa desde 24/11/2026. Os seis botoes
               ocupavam quase a largura da busca, e o que esta escolhido se
               le igual aqui. -->
          <label class="campo-periodo" id="campoPeriodo">
            <span>Período</span>
            <select id="selPeriodo" aria-label="Período">
              <option value="all">Todos</option>
              <option value="24h">24 horas</option>
              <option value="7d">7 dias</option>
              <option value="15d">15 dias</option>
              <option value="1m">1 mês</option>
              <option value="6m">6 meses</option>
            </select>
          </label>

          <!-- Exportar XLSX selecionados -->
          <button id="btnExportarXlsx" onclick="exportarSelecionados()" data-tip="Exportar selecionados para XLSX"
            class="focus-ring rounded-full border border-emerald-200 bg-emerald-50 px-4 py-2 text-sm font-bold text-emerald-700 flex items-center gap-2 hover:bg-emerald-100 transition-colors hidden">
            <i class="fa-solid fa-file-excel text-xs"></i>
            Exportar <span id="badgeExport" class="bg-emerald-600 text-white text-[10px] font-extrabold rounded-full px-1.5 py-0.5">0</span>
          </button>

          <!-- Tela cheia e modo escuro sairam em 24/11/2026: esta tela ja
               le o tema que a DISPO guardou (admin_dark / dispo_dark), e o
               botao daqui dava duas verdades para a mesma coisa. Quem
               escolhe o tema na DISPO escolhe aqui. -->

          <!-- So existe com um lote em foco: abrir um lote recorta a lista
               para ele (ver entrarNoFoco), e este botao desfaz. -->
          <!-- Atualizar -->
          <button id="btnRefresh" onclick="loadData()" data-tip="Atualizar dados"
            class="focus-ring w-9 h-9 rounded-full border border-slate-200 bg-white flex items-center justify-center text-slate-500 hover:bg-slate-50 transition-colors">
            <i class="fa-solid fa-rotate-right text-xs"></i>
          </button>

          <!-- as pilulas de resumo moram no fim da linha, nao numa fileira
               propria abaixo dela -->
          <span id="pillsResumo" class="hidden">
            <span class="pill-resumo" style="background:#fef3c7;color:#92400e;border:.5px solid #fde68a">
              <b id="pillPendente">—</b> pendente(s)</span>
            <span class="pill-resumo" style="background:#dcfce7;color:#166534;border:.5px solid #bbf7d0">
              <b id="pillFinalizado">—</b> finalizado(s)</span>
            <span class="pill-resumo" style="background:var(--brand-soft);color:var(--brand);border:.5px solid var(--brand)">
              <b id="pillTotal">—</b> lote(s)</span>
          </span>
        </div>
      </div>
    </header>


    <!-- resumo da visão por cliente -->
    <div id="pillsClientes" class="flex flex-wrap items-center gap-2 mb-4 hidden">
      <span class="inline-flex items-center gap-1.5 rounded-full px-3 py-1 text-[11px] font-bold" style="background:var(--brand-soft);color:var(--brand);border:0.5px solid var(--brand)">
        <span id="pillCliQtd">—</span> cliente(s)
      </span>
      <span class="inline-flex items-center gap-1.5 rounded-full px-3 py-1 text-[11px] font-bold" style="background:#dcfce7;color:#166534;border:0.5px solid #bbf7d0">
        <span id="pillCliPares">—</span>
      </span>
      <span class="text-[11px] font-bold text-slate-400" id="pillCliFonte"></span>
    </div>

    <!-- TABELA -->
    <div class="rounded-[28px] border border-slate-200 bg-white shadow-card p-4">
      <div class="flex items-center justify-between gap-3 mb-4">
        <div class="text-sm font-extrabold">Registros de desmembramento</div>
        <div class="text-xs font-bold text-slate-400" id="tableCount">— registros</div>
      </div>

      <div id="loadingState" class="loading-shimmer rounded-2xl bg-slate-100 h-48 mb-2"></div>

      <div id="emptyState" class="hidden empty-state">
        <i class="fa-solid fa-inbox"></i>
        <p class="font-semibold">Nenhum desmembramento encontrado.</p>
      </div>

      <!-- POR CLIENTE: quem recebeu desmembramento, pela planilha do Chris -->
      <div id="wrapClientes" class="table-wrap hidden">
        <table>
          <thead>
            <tr>
              <th>Cliente</th>
              <!-- centralizadas a pedido dele: o nome do cliente é o único
                   texto corrido da linha; o resto é número ou etiqueta curta,
                   e alinhado ao meio a coluna lê de cima a baixo. O style é
                   inline porque .table-wrap thead th força o alinhamento. -->
              <th style="text-align:center">Pares</th>
              <th style="text-align:center">Repasses</th>
              <th style="text-align:center">Último</th>
              <th style="text-align:center">Vendedor</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="bodyClientes"></tbody>
        </table>
      </div>

      <div id="tableWrap" class="table-wrap hidden">
        <table>
          <thead>
            <!-- Oito colunas desde 24/11/2026, no lugar de doze. Saldo DISPO
                 e Saldo restante sairam: estavam em branco em 60 de 60
                 linhas, porque os lotes ja sairam da DISPO, e o que existe
                 agora aparece em texto ao lado do desmembrado.
                 O Nº e o GCI voltaram a ser colunas proprias - empilhados
                 ficavam apertados -, e o codigo e a cor foram para a linha
                 do produto, que tinha largura sobrando. Assim a linha tem
                 UMA altura de texto, e cabem mais lotes na tela. -->
            <tr>
              <th style="width:36px"><input type="checkbox" id="chkAll" title="Selecionar todos" style="cursor:pointer"></th>
              <th style="width:62px">Nº</th>
              <th style="width:104px">GCI</th>
              <th>Produto</th>
              <th style="width:104px">Prev. Fat.</th>
              <th style="width:168px">Pares</th>
              <th style="width:186px">Situação</th>
              <th style="width:58px"></th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>

  </div>
</main>

<script>
// Dark mode imediato
if(localStorage.getItem('admin_dark') === '1' || localStorage.getItem('dispo_dark') === '1') document.documentElement.classList.add('dark');

const WORKER_URL = 'https://repasse-worker-cms.marcosrep-cms.workers.dev';

// ── AUTH GUARD (SSO do Portal — mesmo padrão do index.html) ───────────────────
function getPortalSession(){
  try{
    const raw = localStorage.getItem('cms_portal_session_v1');
    if(!raw) return null;
    const s = JSON.parse(raw);
    if(!s || !s.expiraEm || new Date(s.expiraEm).getTime() < Date.now()) return null;
    return s;
  }catch(_){ return null; }
}
function isCmsLogado(){
  const s = getPortalSession();
  return !!(s && (s.nome === 'CMS' || s.nome === 'MARCOS (DEV)'));
}
if(!isCmsLogado()) window.location.replace('./index.html');

const $ = id => document.getElementById(id);

const DISPO_FILE_URL = '../DISPO.xlsx';
let _allProdutos = [];
let _dispoMap = new Map();
let _dispoPorNum = new Map();   // Nº do lote -> linha da DISPO (ver loadDispoMap)
let _periodoAtivo = localStorage.getItem('consulta_desm_periodo') || 'all';
let _searchQuery  = '';
const _expandidos  = new Set(JSON.parse(localStorage.getItem('consulta_desm_expandidos') || '[]'));
const _selecionados = new Set();

const PERIODO_MS = { '24h':86400000, '7d':604800000, '15d':1296000000, '1m':2592000000, '6m':15552000000 };


function voltarParaDispo(){
  if(document.fullscreenElement){
    document.exitFullscreen().then(()=>window.location.replace('./dispo.html')).catch(()=>window.location.replace('./dispo.html'));
  } else {
    window.location.replace('./dispo.html');
  }
}

function showToast(msg, type='info'){
  const t = document.createElement('div');
  t.className = `toast toast-${type}`;
  t.textContent = msg;
  $('toastWrap').appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity .2s'; }, 3200);
  setTimeout(()=>t.remove(), 3500);
}

function formatDateUTC(value){
  if(!value) return '—';
  let d = null;
  if(typeof value === 'number' && value > 40000 && value < 60000){
    d = new Date(Date.UTC(1899,11,30)); d.setUTCDate(d.getUTCDate()+value);
  } else if(typeof value === 'string' && /^\d{4,6}$/.test(value.trim())){
    const n=Number(value);
    if(n>40000&&n<60000){ d=new Date(Date.UTC(1899,11,30)); d.setUTCDate(d.getUTCDate()+n); }
  }
  if(!d) d=new Date(value);
  if(isNaN(d)) return String(value);
  return `${String(d.getUTCDate()).padStart(2,'0')}/${String(d.getUTCMonth()+1).padStart(2,'0')}/${d.getUTCFullYear()}`;
}

function safeHtml(v){ return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;'); }

function canonicalStatus(s){
  const v=(s||'').toLowerCase();
  if(['aprovado','finalizado','faturado','atendido parcialmente'].includes(v)) return 'Aprovado';
  if(['cancelado','rejeitado'].includes(v)) return 'Cancelado';
  return 'Pendente';
}

async function loadDispoMap(){
  try{
    const res = await fetch(`${DISPO_FILE_URL}?t=${Date.now()}`, { cache:'no-store' });
    if(!res.ok) return;
    const buf = await res.arrayBuffer();
    const wb = XLSX.read(buf, { type:'array', cellDates:true });
    const ws = wb.Sheets[wb.SheetNames.find(n=>n.toUpperCase()==='DISPO')||wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { defval:null, raw:false });
    _dispoMap = new Map();
    _dispoPorNum = new Map();
    for(const r of rows){
      const gci  = String(r['GCI']||r['Gci']||'').trim();
      const ebm  = String(r['EBM']||r['Ebm']||'').trim();
      const num  = String(r['Nº']??r['N']??r['Numero']??'').trim();
      const saldo = Number(r['SALDO']||r['Saldo']||0);
      /* A planilha tem Código, Produto, COR e DATA ENTREGA e a tela lia só
         o saldo - era por isso que a linha do lote importado ficava quase
         toda vazia. */
      const d = { num, saldo,
                  codigo:  String(r['Código']||r['CODIGO']||r['Codigo']||'').trim(),
                  produto: String(r['Produto']||r['PRODUTO']||'').trim(),
                  cor:     String(r['COR']||r['Cor']||'').trim(),
                  prevFat: String(r['DATA ENTREGA']||r['Data Entrega']||'').trim(),
                  gci, ebm };
      if(gci) _dispoMap.set(gci, d);
      if(ebm && !_dispoMap.has(ebm)) _dispoMap.set(ebm, d);
      if(num && !_dispoPorNum.has(num)) _dispoPorNum.set(num, d);
    }
  }catch(e){ console.warn('DISPO.xlsx não carregado:', e); }
}

async function loadData(){
  $('loadingState').classList.remove('hidden');
  $('tableWrap').classList.add('hidden');
  $('emptyState').classList.add('hidden');
  $('pillsResumo').classList.add('hidden');
  try{
    await loadDispoMap();
    const [desmRes, pedidosRes] = await Promise.all([
      fetch(WORKER_URL, { method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify({action:'get'}) }),
      fetch(`${WORKER_URL}?t=${Date.now()}`, { cache:'no-store' })
    ]);
    const desm    = desmRes.ok ? await desmRes.json() : {};
    const pedidos = pedidosRes.ok ? await pedidosRes.json() : [];
    const pedidoMap = new Map();
    for(const p of (Array.isArray(pedidos)?pedidos:[])) pedidoMap.set(p.id, p);

    /* O histórico do Chris também serve aqui: nos lotes antigos é ele que
       sabe o artigo, a cor e a entrega. Carrega junto e não segura a tela. */
    await carregarHistorico().catch(()=>{});
    const histPorLote = new Map();
    for(const l of ((_hist && _hist.linhas) || [])){
      const k = String(l.lote || '');
      if(k && !histPorLote.has(k)) histPorLote.set(k, l);
    }

    _allProdutos = [];
    for(const [chave, lojas] of Object.entries(desm||{})){
      /* Duas gerações de chave convivem: "<código>|<cor>|<prev fat>", dos
         pedidos nascidos na CMS, e "lote:<Nº>", da importação da planilha.
         A segunda não tem o que a tela mostrava nas colunas - daí o "lote:36"
         no lugar do código e o resto em branco. */
      const ehLote = chave.startsWith('lote:');
      let [codigo, cor, prevFat] = ehLote ? ['', '', ''] : chave.split('|');
      const numChave = ehLote ? chave.slice(5).trim() : '';
      const linhasLojas = [];
      let totalDesmembrado=0, ultimoUpdate=null, gciRef='';

      for(const [lineKey, situacao] of Object.entries(lojas||{})){
        const [orderId, gci] = lineKey.split('||');
        /* Nos registros "lote:<Nº>" esse pedaço É o Nº, não o GCI - usá-lo
           como GCI punha o número do lote na coluna errada. O GCI de verdade
           vem da DISPO ou do histórico, logo abaixo. */
        if(!ehLote && !gciRef && gci) gciRef=gci;
        const pedido = pedidoMap.get(orderId);
        const cliente = pedido ? (pedido.clienteNome?`${pedido.clienteCodigo} — ${pedido.clienteNome}`:pedido.clienteCodigo||'—') : '—';
        let qtde=0,produto='—',prazo=pedido?.prazo||'—';
        let campanha=(pedido?.campanha||'').replace(/\s*\bOLY\b\s*/gi,'').trim()||'—';
        let orderStatus=pedido?.status||'—';
        let updatedAt=pedido?.updatedAt||pedido?.createdAt||null;
        if(pedido && Array.isArray(pedido.items)){
          /* O pedaço do meio da lineKey é GCI em umas linhas e o Nº do lote
             em outras: a importação da planilha do Chris gravou o Nº. Sem
             o terceiro teste, esses repasses apareciam com Qtde 0 - era o
             que estava na tela em 23/11/2026. */
          const alvo=String(gci||'').trim();
          const item=pedido.items.find(it=>String(it.gci||'').trim()===alvo
                                        ||String(it.ebm||'').trim()===alvo
                                        ||String(it.num||'').trim()===alvo);
          if(item){ produto=item.produto||produto; qtde=Number(item.totalUnits||0)||(item.grade||[]).reduce((s,g)=>s+Number(g.qty||0),0); }
        }
        totalDesmembrado+=qtde;
        if(updatedAt&&(!ultimoUpdate||new Date(updatedAt)>new Date(ultimoUpdate))) ultimoUpdate=updatedAt;
        linhasLojas.push({ lineKey,gci,codigo,cor,prevFat,produto,cliente,prazo,campanha,qtde,situacao,orderStatus,orderId,updatedAt });
      }

      /* A DISPO pelo Nº da chave, pelo GCI ou pelo EBM — o que existir. */
      const daDispo = (numChave && _dispoPorNum.get(numChave))
                      || _dispoMap.get(gciRef) || null;
      const daPlanilha = numChave ? histPorLote.get(numChave) : null;
      codigo  = codigo  || daDispo?.codigo  || daPlanilha?.ref  || '—';
      cor     = cor     || daDispo?.cor     || daPlanilha?.cor  || '—';
      prevFat = prevFat || daDispo?.prevFat || daPlanilha?.data || '';
      if(!gciRef) gciRef = daDispo?.gci || daPlanilha?.gci || '';

      const produtoNome = linhasLojas[0]?.produto
                          || daDispo?.produto || daPlanilha?.desc || '—';
      const saldoDispo = daDispo ? daDispo.saldo : null;
      const num = numChave || daDispo?.num || '—';

      // Situação baseada no saldo real
      let situacaoProd;
      if(totalDesmembrado===0){ situacaoProd='pendente'; }
      else if(saldoDispo!==null && totalDesmembrado>=saldoDispo){ situacaoProd='total'; }
      else { situacaoProd='parcial'; }

      const saldoRestante = saldoDispo!==null ? Math.max(0,saldoDispo-totalDesmembrado) : null;

      _allProdutos.push({ chave,codigo,cor,prevFat,num,gci:gciRef,produto:produtoNome,saldoDispo,totalDesmembrado,saldoRestante,ultimoUpdate,situacao:situacaoProd,lojas:linhasLojas });
    }

    /* A outra ponta: o que tem cliente e ainda nao foi digitado. Entra nas
       linhas do lote que ja esta na tela, ou cria o lote - e so assim o
       Chris ve o que FALTA, nao so o que ja foi. */
    const faltando = linhasAindaNaoFeitas(pedidos, desm);
    const porNum = new Map(_allProdutos.map(p => [String(p.num), p]));
    for(const [num, linhas] of faltando){
      const existente = porNum.get(num);
      if(existente){
        existente.lojas.push(...linhas);
        /* Um lote com destino esperando nao pode aparecer como "Total":
           o que a coluna Situacao compara e o saldo, e o saldo pode ter
           acabado por outro caminho. Falta digitacao, entao e parcial. */
        if(existente.situacao === 'total') existente.situacao = 'parcial';
        continue;
      }
      const daDispo = _dispoPorNum.get(num) || null;
      const daPlanilha = histPorLote.get(num) || null;
      const base = linhas[0];
      const saldoDispo = daDispo ? daDispo.saldo : null;
      _allProdutos.push({
        chave: `lote:${num}`,
        codigo: base.codigo || daDispo?.codigo || daPlanilha?.ref || '—',
        cor: base.cor || daDispo?.cor || daPlanilha?.cor || '—',
        prevFat: base.prevFat || daDispo?.prevFat || daPlanilha?.data || '',
        num,
        gci: base.gci || daDispo?.gci || daPlanilha?.gci || '',
        produto: base.produto !== '—' ? base.produto
                 : (daDispo?.produto || daPlanilha?.desc || '—'),
        saldoDispo,
        totalDesmembrado: 0,
        saldoRestante: saldoDispo !== null ? saldoDispo : null,
        ultimoUpdate: linhas.reduce((m, l) =>
          (l.updatedAt && (!m || new Date(l.updatedAt) > new Date(m))) ? l.updatedAt : m, null),
        situacao: 'pendente',
        lojas: linhas,
      });
    }

    renderTable();
  }catch(err){
    console.error(err);
    showToast('Erro ao carregar dados.', 'error');
    $('loadingState').classList.add('hidden');
    $('emptyState').classList.remove('hidden');
  }
}

/* ── POR CLIENTE ───────────────────────────────────────────────────────
   Quem recebeu desmembramento e quantos pares, somando a BASE DE VENDAS da
   planilha do Chris (data/repasses_historico.json). É a pergunta que ele faz
   quando o cliente liga: "quanto este já pegou de repasse?".

   A planilha é a fonte porque é ela que tem o histórico inteiro - a CMS só
   registra o que passou por ela. Quando o desmembramento todo vier pela
   casa, esta visão troca de fonte e a planilha sai de cena. */
let _visao = localStorage.getItem('consulta_desm_visao') || 'lote';
let _hist = null;          // { fonte, lido_em, linhas:[...] }
let _clientes = [];        // agrupado, já ordenado por pares
let _cliAbertos = new Set();

async function carregarHistorico(){
  if(_hist) return _hist;
  try{
    const r = await fetch('../data/repasses_historico.json?t=' + Date.now(), { cache:'no-cache' });
    _hist = r.ok ? await r.json() : { linhas:[] };
  }catch(e){ _hist = { linhas:[] }; }
  const por = new Map();
  for(const l of (_hist.linhas || [])){
    const k = String(l.cod || '');
    if(!k) continue;
    if(!por.has(k)) por.set(k, { cod:k, nome:l.cli || '', pares:0, feitos:0,
                                 repasses:0, ultimo:'', vend:new Map(), linhas:[] });
    const c = por.get(k);
    c.pares += Number(l.pares || 0);
    /* O total é o que o cliente levou; o desmembrado é o que já virou pedido
       no EBM. A diferença é trabalho que ainda está na fila - e é ela que faz
       o número da tela discordar do que o Chris já digitou. */
    if(String(l.status || '').toUpperCase() === 'DESMEMBRADO')
      c.feitos += Number(l.pares || 0);
    c.repasses++;
    if(l.cli && !c.nome) c.nome = l.cli;
    if(l.data && l.data > c.ultimo) c.ultimo = l.data;
    if(l.vend) c.vend.set(l.vend, (c.vend.get(l.vend) || 0) + 1);
    c.linhas.push(l);
  }
  _clientes = [...por.values()].map(c => ({
    ...c,
    // o vendedor que mais atendeu aquele cliente; os outros aparecem no detalhe
    vendedor: [...c.vend.entries()].sort((a,b) => b[1] - a[1]).map(x => x[0])[0] || '—',
    linhas: c.linhas.sort((a,b) => String(b.data||'').localeCompare(String(a.data||'')))
  })).sort((a,b) => b.pares - a.pares);
  return _hist;
}

function filtrarClientes(){
  const q = _searchQuery.toLowerCase().trim();
  if(!q) return _clientes;
  return _clientes.filter(c =>
    `${c.cod} ${c.nome} ${c.vendedor}`.toLowerCase().includes(q)
    || c.linhas.some(l => `${l.lote} ${l.ref} ${l.desc} ${l.cor} ${l.ebm} ${l.gci}`
         .toLowerCase().includes(q)));
}

        <div style="font-size:10px;font-weight:700;color:var(--muted)">${
          c.feitos >= c.pares ? 'tudo desmembrado'
            : c.feitos ? nf(c.feitos) + ' desmembrados' : 'nada desmembrado'}</div>
      </td>
      <td style="text-align:center;font-weight:700;color:var(--muted)">${nf(c.repasses)}</td>
      <td style="text-align:center;color:var(--muted);white-space:nowrap;font-size:11px">${dataBR(c.ultimo)}</td>
      <td style="text-align:center;color:var(--muted);font-size:11px;font-weight:700">${safeHtml(c.vendedor)}</td>
      <td><button class="btn-det${aberto ? ' open' : ''}">${aberto ? '↑ Fechar' : '↓ Detalhes'}

    const tre = document.createElement('tr');
    tre.className = 'tr-expand';
    tre.style.display = aberto ? '' : 'none';
    tre.innerHTML = `<td colspan="6">
      <div class="tr-expand-inner">

        <div style="overflow-x:auto"><table class="sub-table">
          <thead><tr><th>Entrega</th><th>Nº</th><th>Produto</th><th>Cor</th>
            <th style="text-align:right">Pares</th><th>Vendedor</th><th>Veio de</th><th>Situação</th></tr></thead>
          <tbody>${c.linhas.map(l => `<tr>
            <td style="color:var(--muted);white-space:nowrap;font-size:11px">${dataBR(l.data)}</td>
            <td class="tabular-nums" style="font-size:11px;font-weight:700">${safeHtml(l.lote || '—')}</td>
            <td style="font-weight:700;color:var(--text)">${safeHtml(l.desc || l.ref || '—')}</td>
            <td style="color:var(--muted);font-size:11px">${safeHtml(l.cor || '—')}</td>
            <td style="text-align:right;font-weight:800">${nf(l.pares)}</td>
            <td style="color:var(--muted);font-size:11px">${safeHtml(l.vend || '—')}</td>
            <td style="color:var(--muted);font-size:11px">${safeHtml(l.deCli || l.deCod || '—')}</td>
            <td>${chipDesmSit(l.status === 'DESMEMBRADO' ? 'Desmembrado' : (l.status || 'Pendente'))}</td>
          </tr>`).join('')}</tbody>
        </table></div>
      </div></td>`;

    const alternar = () => {
      if(_cliAbertos.has(c.cod)) _cliAbertos.delete(c.cod); else _cliAbertos.add(c.cod);
      renderClientes();
    };
    tr.addEventListener('click', alternar);
    tb.appendChild(tr);
    tb.appendChild(tre);
  }
}

async function setVisao(nome){
  _foco = null;        // trocar de visao sempre volta para a lista
  if(nome !== 'lote' && nome !== 'cliente') return;
  _visao = nome;
  try{ localStorage.setItem('consulta_desm_visao', nome); }catch(e){}
  document.querySelectorAll('#visaoTabs .visao-tab').forEach(t => {
    const on = t.dataset.visao === nome;
    t.classList.toggle('active', on);
    t.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  const porCliente = nome === 'cliente';
  // o período filtra pela data do PEDIDO, que a planilha não tem
  // (o id mudou em 24/11/2026: os seis botões viraram uma lista suspensa,
  //  e com o id velho esta linha estourava ao trocar de visão)
  $('campoPeriodo').classList.toggle('hidden', porCliente);
  $('pillsResumo').classList.toggle('hidden', porCliente);
  $('pillsClientes').classList.toggle('hidden', !porCliente);
  $('tableWrap').classList.toggle('hidden', porCliente);
  $('wrapClientes').classList.add('hidden');
  $('searchInput').placeholder = porCliente
    ? 'Cliente, código, produto, Nº...' : 'Produto, código, Nº, GCI...';
  if(porCliente){
    $('loadingState').classList.remove('hidden');
    await carregarHistorico();
    $('loadingState').classList.add('hidden');
    renderClientes();
  }else{
    $('emptyState').classList.add('hidden');
    renderTable();
  }
}

/* Quao bem este lote responde ao que foi digitado. Menor = mais perto.
   O numero do lote ganha do GCI e do codigo porque e por ele que se
   procura aqui: digitar "521" e perguntar pelo lote 521, nao pelo GCI
   que por acaso tem 521 no meio (o 5521969, do lote 289). */
function _relevancia(p, q){
  const num  = String(p.num ?? '').toLowerCase();
  const gci  = String(p.gci ?? '').toLowerCase();
  const cod  = String(p.codigo ?? '').toLowerCase();
  const nome = String(p.produto ?? '').toLowerCase();
  if(num === q) return 0;
  if(gci === q) return 1;
  if(cod === q) return 2;
  if(num.startsWith(q)) return 3;
  if(gci.startsWith(q) || cod.startsWith(q)) return 4;
  if(nome.startsWith(q)) return 5;
  if(nome.includes(q)) return 6;
  return 7;                       // achado em algum outro campo
}

function filtrarProdutos(){
  // o foco manda em tudo: com um lote escolhido, a lista e so ele
  if(_foco){
    const so = _allProdutos.filter(p => p.chave === _foco);
    if(so.length) return so;
    _foco = null;            // o lote sumiu (recarregou os dados): volta
  }
  const q=_searchQuery.toLowerCase().trim();
  const ms=PERIODO_MS[_periodoAtivo];
  const desde=ms?Date.now()-ms:null;
  const achados = _allProdutos.filter(p=>{
    if(desde&&p.ultimoUpdate){ const t=new Date(p.ultimoUpdate).getTime(); if(!isNaN(t)&&t<desde) return false; }
    if(q){ const hay=`${p.produto} ${p.codigo} ${p.gci} ${p.cor} ${p.prevFat} ${p.num} ${p.lojas.map(l=>l.cliente).join(' ')}`.toLowerCase(); if(!hay.includes(q)) return false; }
    return true;
  });
  if(!q) return achados;         // sem busca, a ordem de sempre
  /* O indice entra no criterio para o empate ficar estavel: dois lotes
     com a mesma relevancia saem na ordem em que ja estavam. */
  return achados
    .map((p, i) => ({ p, i, r: _relevancia(p, q) }))
    .sort((a, b) => a.r - b.r || a.i - b.i)
    .map(x => x.p);
}

document.addEventListener('click', e => {
  const t = e.target.closest('#visaoTabs [data-visao]');
  if(t) setVisao(t.dataset.visao);
});

function salvarExpandidos(){ localStorage.setItem('consulta_desm_expandidos', JSON.stringify([..._expandidos])); }

/* ── Um lote por vez ────────────────────────────────────────────────────
   Abrir um lote poe ele em FOCO: a lista passa a mostrar so ele, aberto, e
   o cabecalho ganha "Voltar a lista". E o mesmo jeito da Detalhada, que ele
   pediu para trazer - e resolve o que incomodava aqui: com dois ou tres
   abertos, a tela virava uma coluna de detalhes e achar o proximo lote
   exigia rolar por cima deles.
   O foco NAO fica guardado: recarregar a tela volta para a lista. Ele e um
   jeito de olhar, nao uma preferencia. */
let _foco = null;

function entrarNoFoco(chave){
  _foco = chave;
  _expandidos.clear();
  _expandidos.add(chave);
  salvarExpandidos();
  renderTable();
  // a tela sobe junto: o lote em foco e a primeira coisa a ver
  const w = $('tableWrap');
  if(w) w.scrollTop = 0;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function sairDoFoco(){
  _foco = null;
  _expandidos.clear();
  salvarExpandidos();
  renderTable();
}

/* ── Recolher todos ─────────────────────────────────────────────────────
   Com meia duzia de lotes abertos, a lista vira uma coluna de detalhes e
   achar o proximo lote exige fechar um por um. O botao so existe quando ha
   algo aberto - um botao que nao faz nada em 99% das visitas e ruido. */
/* A tabela vai ate o fim da janela, com um respiro. Medir a posicao real
   e melhor que descontar um numero fixo do 100vh: o cabecalho muda de
   altura entre o computador, o tablet e o celular, e quando a busca ou as
   pilulas quebram de linha. */
function ajustarAlturaTabela(){
  for(const id of ['tableWrap', 'wrapClientes']){
    const w = $(id);
    if(!w || w.classList.contains('hidden')) continue;
    const topo = w.getBoundingClientRect().top;
    /* O <main> tem respiro embaixo; sem desconta-lo a tabela encosta no fim
       da janela e a PAGINA passa a rolar 24 px - o que, numa tela que ja
       rola por dentro da tabela, e rolagem em cima de rolagem. */
    const main = w.closest('main');
    const folga = main ? (parseFloat(getComputedStyle(main).paddingBottom) || 0) : 0;
    let alvo = Math.max(240, Math.round(window.innerHeight - topo - folga - 6));
    w.style.maxHeight = alvo + 'px';
    /* Segunda passada: o card em volta tem bordas e respiros proprios, e
       somados eles ainda deixavam a pagina rolar uns pixels. Em vez de
       adivinhar cada um, mede-se a sobra e tira-se dela. */
    const sobra = document.documentElement.scrollHeight - window.innerHeight;
    if(sobra > 0 && alvo - sobra >= 240) w.style.maxHeight = (alvo - sobra) + 'px';
  }
}
window.addEventListener('resize', ajustarAlturaTabela);

/* ── O que ainda NAO foi desmembrado ────────────────────────────────────
   A tela nasce do arquivo de desmembramentos, que so tem o que ja foi
   feito. Mas o Chris precisa ver o contrario: o lote que ja tem cliente
   destino e ainda espera o robo. Essas linhas sao montadas a partir dos
   PEDIDOS, com a mesma chave que a DISPO usa para marcar - assim uma
   linha nunca aparece dos dois lados. */
function _chaveLinhaDesm(order, item){
  const meio = String(item.num || '').trim()
            || String(item.gci || '').trim()
            || String(item.codigo || '').trim();
  return `${order.id}||${meio}||${item.cor}`;
}
function _jaTemMarca(desm, num, order, item){
  const marcas = (desm || {})[`lote:${String(num)}`];
  if(!marcas) return false;
  const v = String(marcas[_chaveLinhaDesm(order, item)] || '').toLowerCase();
  return v === 'desmembrado' || v === 'finalizado';
}

/* Devolve, por Nº de lote, as linhas de pedido que ainda nao foram
   digitadas. Cancelado fica de fora: ele nao vai ser digitado. */
function linhasAindaNaoFeitas(pedidos, desm){
  const porLote = new Map();
  for(const pedido of (Array.isArray(pedidos) ? pedidos : [])){
    if(pedido.archived) continue;
    if(canonicalStatus(pedido.status) === 'Cancelado') continue;
    for(const item of (pedido.items || [])){
      const num = String(item.num || '').trim();
      if(!num) continue;                       // sem Nº nao da para casar
      if(_jaTemMarca(desm, num, pedido, item)) continue;
      const qtde = Number(item.totalUnits || 0)
                || (item.grade || []).reduce((t, g) => t + Number(g.qty || 0), 0);
      const lista = porLote.get(num) || [];
      lista.push({
        lineKey: _chaveLinhaDesm(pedido, item),
        gci: String(item.gci || '').trim(),
        codigo: String(item.codigo || '').trim(),
        cor: item.cor || '',
        prevFat: item.prevFaturamento || '',
        produto: item.produto || '—',
        cliente: pedido.clienteNome
          ? `${pedido.clienteCodigo} — ${pedido.clienteNome}`
          : (pedido.clienteCodigo || '—'),
        prazo: pedido.prazo || '—',
        campanha: (pedido.campanha || '').replace(/\s*\bOLY\b\s*/gi, '').trim() || '—',
        qtde,
        situacao: 'a-fazer',
        orderStatus: pedido.status || '—',
        orderId: pedido.id,
        updatedAt: pedido.updatedAt || pedido.createdAt || null,
      });
      porLote.set(num, lista);
    }
  }
  return porLote;
}

function chipSituacao(sit){
  if(sit==='total')   return `<span class="chip chip-fin" style="font-size:11px"><i class="fa-solid fa-circle-check" style="font-size:9px"></i> Total</span>`;
  if(sit==='parcial') return `<span class="chip chip-parc" style="font-size:11px"><i class="fa-solid fa-circle-half-stroke" style="font-size:9px"></i> Parcial</span>`;
  return `<span class="chip chip-pend" style="font-size:11px"><i class="fa-solid fa-clock" style="font-size:9px"></i> Pendente</span>`;
}
function chipOrderStatus(s){
  const cs=canonicalStatus(s);
  if(cs==='Aprovado')  return `<span class="chip chip-fin" style="font-size:10px">Aprovado</span>`;
  if(cs==='Cancelado') return `<span class="chip" style="background:#fee2e2;color:#b91c1c;font-size:10px">Cancelado</span>`;
  return `<span class="chip chip-pend" style="font-size:10px">Pendente</span>`;
}
function chipDesmSit(s){
  const v = (s||'').toLowerCase();
  /* "a-fazer" e a linha que TEM pedido e ainda nao tem marca nenhuma: ela
     nao vem do arquivo de desmembramentos, e montada aqui a partir do
     pedido (ver linhasAindaNaoFeitas). */
  if(v === 'a-fazer')
    return `<span class="chip" style="background:#FEF3C7;color:#92400E;font-size:10px">A desmembrar</span>`;
  return (v === 'finalizado' || v === 'desmembrado')
    ? `<span class="chip chip-fin" style="font-size:10px">${v === 'desmembrado' ? 'Desmembrado' : 'Finalizado'}</span>`
    : `<span class="chip chip-pend" style="font-size:10px">Pendente</span>`;
}

function renderTable(){
  $('loadingState').classList.add('hidden');
  const produtos=filtrarProdutos();
  $('pillPendente').textContent  = produtos.filter(p=>p.situacao==='pendente').length;
  $('pillFinalizado').textContent = produtos.filter(p=>p.situacao==='total').length;
  $('pillTotal').textContent     = produtos.length;
  /* Em foco a contagem perde o sentido ("1 produto" nao diz nada), e no
     lugar dela vai o aviso de que a lista esta recortada. */
  /* O UNICO "Voltar a lista" da tela mora aqui, ao lado do aviso do
     recorte: o foco e uma propriedade da LISTA, e a saida pertence ao
     lugar onde o recorte e anunciado. Havia um segundo na barra de
     ferramentas; saiu em 25/11/2026, a pedido dele. */
  $('tableCount').innerHTML = _foco
    ? `<span style="color:#DC2626;font-weight:800">mostrando só este lote</span>
       <button type="button" onclick="sairDoFoco()" class="btn-voltar-lista"
         style="margin-left:9px;border:1px solid;border-radius:999px;
                padding:4px 13px;font-size:11.5px;cursor:pointer">
         ← Voltar à lista</button>`
    : `${produtos.length} produto${produtos.length!==1?'s':''}`;
  /* Em foco as pilulas contariam so o lote aberto ("0 pendentes · 1 lote"),
     o que nao diz nada sobre a lista - elas somem e voltam ao sair. */
  $('pillsResumo').classList.toggle('hidden', produtos.length===0 || !!_foco);

  if(!produtos.length){ $('tableWrap').classList.add('hidden'); $('emptyState').classList.remove('hidden'); return; }
  $('emptyState').classList.add('hidden');
  $('tableWrap').classList.remove('hidden');

  const tbody=$('tableBody');
  tbody.innerHTML='';

  produtos.forEach(p=>{
    const isOpen=_expandidos.has(p.chave);
    const isSel=_selecionados.has(p.chave);
    const saldoDispoTxt=p.saldoDispo!==null?p.saldoDispo:'—';
    const saldoRestTxt=p.saldoRestante!==null?p.saldoRestante:'—';
    /* Lote antigo já saiu da DISPO: o traço é a verdade, mas sem explicação
       parece dado faltando. A dica diz o que houve. */
    const dicaSemSaldo=p.saldoDispo===null
      ? ' title="Este lote não está mais na DISPO de hoje — por isso não há saldo a mostrar."' : '';
    const saldoRestColor=p.saldoRestante===0?'var(--danger)':p.saldoRestante!==null&&p.saldoRestante<12?'var(--warning)':'var(--text)';

    const trMain=document.createElement('tr');
    trMain.className=`tr-main${isOpen?' open':''}`;
    trMain.dataset.chave=p.chave;
    /* Os tres numeros de pares numa frase so. Quando o lote ja saiu da
       DISPO nao ha saldo a mostrar, e antes isso eram duas colunas de
       tracos - 252 px de largura dizendo nada. */
    const faltam = p.lojas.filter(l => l.situacao === 'a-fazer').length;
    const paresTxt = p.totalDesmembrado > 0
      ? `<b style="font-size:14px;font-weight:900;color:var(--brand)">${p.totalDesmembrado}</b>`
        + (p.saldoDispo !== null
            ? ` <span class="cel-fraca">de ${p.saldoDispo}`
              + (p.saldoRestante > 0 ? ` · sobram ${p.saldoRestante}` : '') + '</span>'
            : ' <span class="cel-fraca">desmembrados</span>')
      : '<span class="cel-fraca">nada desmembrado ainda</span>';

    trMain.innerHTML=`
      <td onclick="event.stopPropagation()" style="padding:0 8px">
        <input type="checkbox" class="chk-produto" data-chave="${safeHtml(p.chave)}" ${isSel?'checked':''} style="cursor:pointer;width:15px;height:15px">
      </td>
      <td class="tabular-nums cel-forte">${safeHtml(p.num)}</td>
      <td class="tabular-nums" style="font-weight:800;color:var(--brand)">${safeHtml(p.gci)}</td>
      <td>
        <span class="cel-forte">${safeHtml(p.produto)}</span>
        <span class="cel-fraca"> · ${safeHtml(p.cor)} · ${safeHtml(p.codigo)}</span></td>
      <td class="tabular-nums cel-fraca" style="white-space:nowrap">${safeHtml(formatDateUTC(p.prevFat))}</td>
      <td${dicaSemSaldo} class="tabular-nums">${paresTxt}</td>
      <td>${chipSituacao(p.situacao)}${faltam ? `<span class="chip"
          title="${faltam} destino(s) com cliente definido que ainda não foram digitados no EBM"
          style="background:#FEF3C7;color:#92400E;font-size:10px;margin-left:5px">faltam ${faltam}</span>` : ''}</td>
      <td style="text-align:right">
        <button class="det-abrir${isOpen?' open':''}" data-chave="${safeHtml(p.chave)}"
          title="${isOpen ? 'Fechar os ' : 'Ver os '}${p.lojas.length} destino(s)">
          <i class="fa-solid fa-chevron-${isOpen?'up':'down'}"></i>${p.lojas.length}</button></td>`;

    const trExp=document.createElement('tr');
    trExp.className='tr-expand';
    trExp.style.display=isOpen?'':'none';
    trExp.innerHTML=`<td colspan="8">
      <div class="tr-expand-inner">
        <div style="font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">Lojas que receberam ou esperam</div>
        <div style="overflow-x:auto"><table class="sub-table">
          <thead><tr><th>Cliente</th><th>Prazo</th><th>Campanha</th><th style="text-align:right">Qtde</th><th>Status pedido</th><th>Sit. desm.</th></tr></thead>
          <tbody>${p.lojas.map(l=>`<tr>
            <td style="font-weight:700;color:var(--text)">${safeHtml(l.cliente)}</td>
            <td style="color:var(--muted);white-space:nowrap;font-size:11px">${safeHtml(l.prazo)}</td>
            <td style="color:var(--muted);font-size:11px">${safeHtml(l.campanha)}</td>
            <td style="text-align:right;font-weight:800;color:var(--text)">${l.qtde||0}</td>
            <td>${chipOrderStatus(l.orderStatus)}</td>
            <td>${chipDesmSit(l.situacao)}</td>
          </tr>`).join('')}</tbody>
        </table></div>
      </div></td>`;

    tbody.appendChild(trMain);
    tbody.appendChild(trExp);

    trMain.querySelector('.chk-produto').addEventListener('change', e=>{
      const chave=e.target.dataset.chave;
      if(e.target.checked){_selecionados.add(chave);}else{_selecionados.delete(chave);}
      atualizarBotaoExportar();
      const total=document.querySelectorAll('.chk-produto').length;
      const sel=document.querySelectorAll('.chk-produto:checked').length;
      if($('chkAll')){ $('chkAll').indeterminate=sel>0&&sel<total; $('chkAll').checked=sel===total; }
    });

    trMain.querySelector('.det-abrir').addEventListener('click', e=>{
      e.stopPropagation();
      const chave=e.currentTarget.dataset.chave;
      // abrir = entrar no foco (so este lote na tela); clicar de novo volta
      if(_foco === chave) sairDoFoco(); else entrarNoFoco(chave);
    });

    trMain.addEventListener('click', e=>{ if(e.target.closest('.det-abrir,.chk-produto')) return; trMain.querySelector('.det-abrir').click(); });
  });

  atualizarBotaoRecolher();
  requestAnimationFrame(ajustarAlturaTabela);

  if($('chkAll')){
    const newChkAll = $('chkAll').cloneNode(true);
    $('chkAll').parentNode.replaceChild(newChkAll, $('chkAll'));
    newChkAll.addEventListener('change', e=>{
      document.querySelectorAll('.chk-produto').forEach(chk=>{
        chk.checked=e.target.checked;
        if(e.target.checked){_selecionados.add(chk.dataset.chave);}else{_selecionados.delete(chk.dataset.chave);}
      });
      atualizarBotaoExportar();
    });
  }
}

function exportarSelecionados(){
  if(!_selecionados.size){ showToast('Nenhum produto selecionado.','info'); return; }
  const produtos=_allProdutos.filter(p=>_selecionados.has(p.chave));
  const rows=[['Nº','GCI','Produto','Código','Cor','Prev. Fat.','Saldo DISPO','Desmembrado','Saldo restante','Situação','Cliente','Prazo','Campanha','Qtde loja','Status pedido','Sit. desm.']];
  for(const p of produtos){
    if(!p.lojas.length){
      rows.push([p.num,p.gci,p.produto,p.codigo,p.cor,formatDateUTC(p.prevFat),p.saldoDispo??'—',p.totalDesmembrado,p.saldoRestante??'—',p.situacao,'','','','','','']);
    } else {
      p.lojas.forEach((l,i)=>{
        rows.push([i===0?p.num:'',i===0?p.gci:'',i===0?p.produto:'',i===0?p.codigo:'',i===0?p.cor:'',i===0?formatDateUTC(p.prevFat):'',i===0?(p.saldoDispo??'—'):'',i===0?p.totalDesmembrado:'',i===0?(p.saldoRestante??'—'):'',i===0?p.situacao:'',l.cliente,l.prazo,l.campanha,l.qtde,canonicalStatus(l.orderStatus),l.situacao]);
      });
    }
  }
  const ws=XLSX.utils.aoa_to_sheet(rows);
  ws['!cols']=[6,10,20,12,10,10,12,12,14,10,24,16,14,8,14,12].map(w=>({wch:w}));
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Desmembramentos');
  const now=new Date();
  XLSX.writeFile(wb,`desmembramentos_${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}.xlsx`);
  showToast(`${produtos.length} produto(s) exportado(s)!`,'success');
}
