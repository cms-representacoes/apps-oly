<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Prévia · zoom com cores nos aparelhos</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800&display=swap" rel="stylesheet">
<style>
  body{margin:0;padding:18px;background:#E8EBF1;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#0F172A}
  h1{margin:0 0 4px;font-size:18px}
  p{margin:0 0 14px;font-size:13px;color:#6B7280}
  .linha{display:flex;gap:26px;align-items:flex-start;flex-wrap:wrap}
  figure{margin:0}
  figcaption{font-size:12px;font-weight:800;margin-bottom:6px}
  .tela{overflow:hidden;border-radius:18px;border:7px solid #111;background:#111;box-shadow:0 10px 30px rgba(0,0,0,.2)}
  iframe{border:0;transform-origin:0 0;display:block}
</style></head><body>
<h1>Zoom com as cores do produto</h1>
<p>Cada tela é interativa: clique nas miniaturas ou nas setas para trocar de cor.</p>
<div class="linha">
  <figure><figcaption>Celular · 390×844</figcaption><div class="tela" data-w="390" data-h="844" data-e=".7"></div></figure>
  <figure><figcaption>Tablet em pé · 820×1180</figcaption><div class="tela" data-w="820" data-h="1180" data-e=".5"></div></figure>
  <figure><figcaption>Computador · 1366×768</figcaption><div class="tela" data-w="1366" data-h="768" data-e=".55"></div></figure>
</div>
<script>
document.querySelectorAll('.tela').forEach(t => {
  const w = +t.dataset.w, h = +t.dataset.h, e = +t.dataset.e;
  t.style.width = w * e + 'px'; t.style.height = h * e + 'px';
  const f = document.createElement('iframe');
  f.src = 'preview-zoom-cores.html'; f.width = w; f.height = h; f.style.transform = 'scale(' + e + ')';
  t.appendChild(f);
});
</script></body></html>
