<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prévia · zoom com cores · CMS PASS</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --marca:#2c39e2; --marca-claro:#5B69E8; --marca-escuro:#1B27B0;
    --tinta:#0F172A; --texto:#1E293B; --fraco:#6B7280; --tenue:#94A3B8;
    --linha:#E5E7EB; --papel:#E8EBF1; --carta:#fff;
    --pronta:#0E6B47; --pronta-fundo:#DEEFE7; --repasse:#2C39E2; --repasse-fundo:#E6E8FC; --plano:#7A2FBF; --plano-fundo:#F1E7FB;
  }
  *{ box-sizing:border-box; }
  [hidden]{ display:none !important; }
  html,body{ margin:0; height:100%; }
  body{ font-family:'Plus Jakarta Sans', system-ui, sans-serif; background:#8b93a1; color:var(--texto); }
  button{ font:inherit; cursor:pointer; }
  .num{ font-variant-numeric:tabular-nums; }

  .fundo{ position:fixed; inset:0; background:rgba(15,23,42,.45); backdrop-filter:blur(4px);
    display:flex; align-items:center; justify-content:center; padding:8px; }
  .caixa{ position:relative; display:flex; gap:14px; padding:12px; width:min(1240px,100%); height:min(96vh,860px);
    background:#fff; border-radius:22px; overflow:hidden; box-shadow:0 24px 60px rgba(15,23,42,.35); }

  /* palco: foto grande entre as setas */
  .palco{ flex:1 1 auto; min-width:0; display:flex; align-items:center; justify-content:center; gap:12px; container-type:size; }
  .foto{ position:relative; flex:none; overflow:hidden; background:#fff; width:calc(100cqw - 104px); height:100cqh; }
  .foto img{ position:absolute; left:0; top:0; max-width:none; }
  .foto img.carregando{ visibility:hidden; }
  .seta{ flex:none; width:40px; height:40px; border-radius:999px; display:inline-flex; align-items:center; justify-content:center;
    background:#F1F5F9; color:var(--tinta); border:1px solid var(--linha); font-size:16px; }
  .seta:hover{ background:#E2E8F0; }

  /* painel */
  .painel{ flex:none; width:260px; min-height:0; display:flex; flex-direction:column; gap:12px; padding:14px;
    background:#F8FAFC; border:1px solid #EEF2F6; border-radius:16px; }
  .cab{ display:flex; align-items:flex-start; gap:8px; }
  .cab > div{ flex:1; min-width:0; }
  .nome{ font-size:15px; font-weight:800; color:var(--tinta); line-height:1.25; }
  .pdv{ font-size:20px; font-weight:800; color:var(--marca); letter-spacing:-.01em; }
  .fechar{ flex:none; width:34px; height:34px; border-radius:999px; border:1px solid var(--linha); background:#fff; color:var(--tinta); }
  .artcor{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-size:12px; font-weight:700; color:#334155; }
  .artcor .muted{ color:var(--fraco); font-weight:600; }
  .chip{ display:inline-flex; align-items:center; gap:5px; border-radius:999px; padding:3px 9px; font-size:11px; font-weight:800;
    background:#fff; border:1px solid var(--linha); color:var(--tinta); white-space:nowrap; }
  .chip .pt{ width:8px; height:8px; border-radius:50%; background:var(--marca); }
  .origens{ display:flex; flex-wrap:wrap; gap:5px; }
  .o{ border:1px solid; background:#fff; }
  .o-est{ color:var(--pronta); background:var(--pronta-fundo); border-color:color-mix(in srgb,var(--pronta) 28%,transparent); }
  .o-rep{ color:var(--repasse); background:var(--repasse-fundo); border-color:color-mix(in srgb,var(--repasse) 28%,transparent); }
  .o-pro{ color:var(--plano); background:var(--plano-fundo); border-color:color-mix(in srgb,var(--plano) 30%,transparent); }
  .rotulo{ font-size:10px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--fraco); }
  .minis{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; overflow-y:auto; min-height:0; padding:2px; align-content:start; }
  .mini{ width:100%; aspect-ratio:1; border-radius:10px; background:#fff; border:2px solid #E5E7EB; padding:0; overflow:hidden; }
  .mini img{ width:100%; height:100%; object-fit:contain; display:block; }
  .mini.on{ border-color:var(--marca); box-shadow:0 0 0 2px color-mix(in srgb,var(--marca) 20%,transparent); }
  .acoes{ margin-top:auto; display:flex; align-items:center; gap:8px; }
  .acao{ flex:1; height:40px; border-radius:999px; border:0; color:#fff; font-size:13px; font-weight:800;
    background:linear-gradient(145deg,var(--marca-claro),var(--marca) 55%,var(--marca-escuro));
    box-shadow:0 6px 14px -6px color-mix(in srgb,var(--marca) 70%,transparent); }
  .fav{ flex:none; width:40px; height:40px; border-radius:12px; border:0; background:#EEF1F6; color:var(--tinta); font-size:16px; }
  .fav.on{ color:#E0245E; }
  .nav-mob{ display:none; }

  /* ── celular e tablet em pé: uma coluna ── */
  @media (max-width:899.98px), (orientation:portrait){
    .caixa{ flex-direction:column; height:auto; max-height:100%; overflow-y:auto; padding:14px; gap:10px; }
    .painel{ display:contents; }
    .cab{ order:1; }
    .nome{ font-size:17px; }
    .pdv{ font-size:22px; }
    .artcor{ order:2; margin-top:-4px; }
    .origens{ order:3; }
    .palco{ order:4; flex:none; height:min(78vw,58vh); }
    .rotulo{ display:none; }
    .minis{ order:5; display:flex; overflow-x:auto; overflow-y:hidden; gap:8px; }
    .mini{ flex:none; width:64px; }
    .acoes{ order:6; margin-top:2px; }
    .acao{ flex:1 1 auto; }
  }
  /* ── celular: setas junto dos botões, foto na largura toda ── */
  @media (max-width:639.98px){
    .fundo{ padding:6px; }
    .caixa{ padding:12px; gap:8px; border-radius:18px; }
    .nome{ font-size:14.5px; }
    .pdv{ font-size:18px; }
    .palco{ height:min(86vw,52vh); gap:0; }
    .palco .seta{ display:none; }
    .foto{ width:100cqw; }
    .mini{ width:52px; border-radius:9px; }
    .nav-mob{ display:flex; align-items:center; gap:4px; flex:none; }
    .nav-mob .seta{ width:34px; height:34px; font-size:14px; }
    .nav-mob .pos{ min-width:30px; text-align:center; font-size:11px; font-weight:800; color:var(--fraco); }
    .acao{ height:38px; font-size:12.5px; }
    .fav{ width:38px; height:38px; }
  }
  body.limpo .troca{ display:none; }
</style>
</head>
<body>
<div class="fundo">
  <div class="caixa" role="dialog" aria-modal="true" aria-label="Foto ampliada">
    <div class="palco">
      <button class="seta" data-nav="-1" aria-label="Cor anterior">←</button>
      <div class="foto"><img id="img" alt=""></div>
      <button class="seta" data-nav="1" aria-label="Próxima cor">→</button>
    </div>
    <div class="painel">
      <div class="cab">
        <div>
          <div class="nome" id="nome">—</div>
          <div class="pdv num" id="pdv">—</div>
        </div>
        <button class="fechar" aria-label="Fechar">✕</button>
      </div>
      <div class="artcor"><span><span class="muted">Art.</span> <span id="art" class="num">—</span></span>
        <span class="chip"><span class="pt"></span><span id="cor">—</span></span></div>
      <div class="origens" id="origens"></div>
      <div class="rotulo">Cores · <span id="pos" class="num">—</span></div>
      <div class="minis" id="minis"></div>
      <div class="acoes">
        <div class="nav-mob">
          <button class="seta" data-nav="-1" aria-label="Cor anterior">←</button>
          <span class="pos num" id="posMob">—</span>
          <button class="seta" data-nav="1" aria-label="Próxima cor">→</button>
        </div>
        <button class="fav" id="fav" aria-label="Marcar">♡</button>
        <button class="acao">Ver detalhes</button>
      </div>
    </div>
  </div>
</div>
<script>
const CORES = [{"nome":"NUVEM","artigo":"43342471","cor":"ALGMLT","pdv":399.99,"foto":"../Catalogo/43342471_ALGMLT.jpg","pronta":0,"repasse":0,"meta":"Nov"},{"nome":"NUVEM","artigo":"43342471","cor":"ARTPTO","pdv":399.99,"foto":"../Catalogo/43342471_ARTPTO.jpg","pronta":0,"repasse":0,"meta":"Out"},{"nome":"NUVEM","artigo":"43342471","cor":"AZCLBR","pdv":399.99,"foto":"../Catalogo/43342471_AZCLBR.jpg","pronta":0,"repasse":0,"meta":"Nov"},{"nome":"NUVEM","artigo":"43342471","cor":"LUNCHB","pdv":399.99,"foto":"../Catalogo/43342471_LUNCHB.jpg","pronta":7012,"repasse":0,"meta":"Out"},{"nome":"NUVEM","artigo":"43342471","cor":"PRETO","pdv":399.99,"foto":"../Catalogo/43342471_PRETO.jpg","pronta":0,"repasse":300,"meta":"Nov"},{"nome":"NUVEM","artigo":"43342471","cor":"PTO_PT","pdv":399.99,"foto":"../Catalogo/43342471_PTO_PT.jpg","pronta":0,"repasse":264,"meta":"Nov"},{"nome":"NUVEM","artigo":"43342471","cor":"RYLMHO","pdv":399.99,"foto":"../Catalogo/43342471_RYLMHO.jpg","pronta":1924,"repasse":0,"meta":"Out"}];
const nf = n => Number(n || 0).toLocaleString('pt-BR');
const brl = v => 'R$ ' + Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits:2, maximumFractionDigits:2 });
let atual = Math.max(0, CORES.findIndex(c => c.pronta || c.repasse));
const img = document.getElementById('img');

document.getElementById('minis').innerHTML = CORES.map((c, i) =>
  `<button class="mini" data-i="${i}" title="${c.cor}" aria-label="Ver cor ${c.cor}"><img src="${c.foto}" alt=""></button>`).join('');

function pintar(){
  const c = CORES[atual];
  document.getElementById('nome').textContent = c.nome;
  document.getElementById('pdv').textContent = brl(c.pdv);
  document.getElementById('art').textContent = c.artigo;
  document.getElementById('cor').textContent = c.cor.replace(/_/g, '/');
  const pos = `${atual + 1}/${CORES.length}`;
  document.getElementById('pos').textContent = pos;
  document.getElementById('posMob').textContent = pos;
  document.getElementById('origens').innerHTML = [
    c.pronta ? `<span class="chip o o-est num">Estoque · ${nf(c.pronta)} un</span>` : '',
    c.repasse ? `<span class="chip o o-rep num">Repasse · ${nf(c.repasse)} un</span>` : '',
    c.meta ? `<span class="chip o o-pro">Produção · ${c.meta}</span>` : ''
  ].join('');
  document.querySelectorAll('.mini').forEach((m, i) => m.classList.toggle('on', i === atual));
  img.classList.add('carregando');
  img.src = c.foto;
}

// Amplia a foto pelo contorno do produto (o que não é branco), cortando só o
// branco em volta — o mesmo do Catálogo Digital.
const contornos = new Map();
function contorno(im){
  if (contornos.has(im.src)) return contornos.get(im.src);
  let r = { x0:0, y0:0, x1:1, y1:1 };
  try{
    const N = 160, cv = document.createElement('canvas'); cv.width = cv.height = N;
    const g = cv.getContext('2d', { willReadFrequently:true }); g.drawImage(im, 0, 0, N, N);
    const d = g.getImageData(0, 0, N, N).data; let x0 = N, y0 = N, x1 = -1, y1 = -1;
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++){ const i = (y*N+x)*4;
      if (d[i] < 240 || d[i+1] < 240 || d[i+2] < 240){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; } }
    if (x1 >= 0) r = { x0:x0/N, y0:y0/N, x1:(x1+1)/N, y1:(y1+1)/N };
  }catch(_){}
  contornos.set(im.src, r); return r;
}
function enquadra(){
  const m = img.parentElement, W = m.clientWidth, H = m.clientHeight;
  if (!img.complete || !img.naturalWidth || !W || !H) return;
  const prop = img.naturalHeight / img.naturalWidth, b = contorno(img), bw = b.x1 - b.x0, bh = (b.y1 - b.y0) * prop;
  const larg = Math.max(Math.min(W, H / prop), Math.min(W * .88 / bw, H * .92 / bh));
  img.style.width = larg + 'px'; img.style.height = larg * prop + 'px';
  img.style.left = (W/2 - (b.x0 + bw/2) * larg) + 'px';
  img.style.top = (H/2 - (b.y0 + (b.y1 - b.y0)/2) * larg * prop) + 'px';
  img.classList.remove('carregando');
}
img.addEventListener('load', enquadra);
new ResizeObserver(enquadra).observe(img.parentElement);

document.addEventListener('click', e => {
  const n = e.target.closest('[data-nav]');
  if (n){ atual = (atual + Number(n.dataset.nav) + CORES.length) % CORES.length; return pintar(); }
  const mi = e.target.closest('.mini');
  if (mi){ atual = Number(mi.dataset.i); return pintar(); }
  const f = e.target.closest('#fav');
  if (f){ f.classList.toggle('on'); f.textContent = f.classList.contains('on') ? '♥' : '♡'; }
});
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft'){ atual = (atual + (e.key === 'ArrowRight' ? 1 : -1) + CORES.length) % CORES.length; pintar(); }
});
pintar();
</script>
</body>
</html>
