<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prévia · Barra de metas na vitrine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
/* paleta da vitrine, para a barra nascer com a cara dela */
:root{
  --barra:#F1F2EF; --papel:#E9EBE7; --carta:#FFFFFF;
  --tinta:#16181A; --texto:#3A3F45; --fraco:#6D737A; --tenue:#9AA0A6;
  --linha:#E2E4E0; --linha-forte:#CDD0CA;
  --pronta:#0E6B47;  --pronta-fundo:#DEEFE7;
  --repasse:#2C39E2; --repasse-fundo:#E6E8FC;
  --plano:#7A2FBF;   --plano-fundo:#F1E7FB;
  --marca:#2c39e2; --marca-claro:#5B69E8; --marca-escuro:#1B27B0;
  --ok:#0E6B47; --ok-fundo:#DEEFE7;
  --risco:#B42318; --risco-fundo:#FDE7E4;
  --quase:#9A6B00; --quase-fundo:#FBF0D6;
  --sombra:0 1px 2px rgba(22,24,26,.06), 0 10px 30px rgba(22,24,26,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --barra:#15171A; --papel:#1C1F23; --carta:#202428;
    --tinta:#F2F4F2; --texto:#C8CDD2; --fraco:#949BA3; --tenue:#767D85;
    --linha:#2C3137; --linha-forte:#3A4047;
    --pronta:#4ADE9B; --pronta-fundo:rgba(74,222,155,.13);
    --repasse:#8C96FF; --repasse-fundo:rgba(140,150,255,.14);
    --plano:#C79BF0; --plano-fundo:rgba(199,155,240,.14);
    --marca:#5B69E8; --marca-claro:#8C96FF; --marca-escuro:#2C39E2;
    --ok:#4ADE9B; --ok-fundo:rgba(74,222,155,.13);
    --risco:#FF8A7A; --risco-fundo:rgba(255,138,122,.13);
    --quase:#F2C35C; --quase-fundo:rgba(242,195,92,.13);
    --sombra:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --barra:#15171A; --papel:#1C1F23; --carta:#202428;
  --tinta:#F2F4F2; --texto:#C8CDD2; --fraco:#949BA3; --tenue:#767D85;
  --linha:#2C3137; --linha-forte:#3A4047;
  --pronta:#4ADE9B; --pronta-fundo:rgba(74,222,155,.13);
  --repasse:#8C96FF; --repasse-fundo:rgba(140,150,255,.14);
  --plano:#C79BF0; --plano-fundo:rgba(199,155,240,.14);
  --marca:#5B69E8; --marca-claro:#8C96FF; --marca-escuro:#2C39E2;
  --ok:#4ADE9B; --ok-fundo:rgba(74,222,155,.13);
  --risco:#FF8A7A; --risco-fundo:rgba(255,138,122,.13);
  --quase:#F2C35C; --quase-fundo:rgba(242,195,92,.13);
  --sombra:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--barra);color:var(--texto);
  font-family:Inter,system-ui,-apple-system,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}

/* ── faixa da prévia ───────────────────────────────────────────── */
.pv{position:sticky;top:0;z-index:60;background:#0E6B47;color:#fff;padding:9px 16px;
  display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:12.5px}
.pv b{font-weight:800}
.pv span{opacity:.86}
.pv .sp{flex:1}
.pv button{border:1px solid rgba(255,255,255,.42);background:rgba(255,255,255,.14);color:#fff;
  border-radius:999px;padding:4px 12px;font:700 11.5px Inter,sans-serif;cursor:pointer}

/* ── cabeçalho simulado da vitrine ─────────────────────────────── */
.cab{background:var(--carta);border-bottom:1px solid var(--linha);padding:10px 16px}
.cab-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{width:30px;height:30px;border-radius:9px;background:var(--marca);color:#fff;
  display:grid;place-items:center;font:800 11px Inter,sans-serif;flex:none}
.busca{flex:1;min-width:160px;height:34px;border:1px solid var(--linha);border-radius:999px;
  background:var(--papel);display:flex;align-items:center;gap:8px;padding:0 13px;color:var(--tenue);font-size:13px}
.orig{display:flex;gap:5px;flex-wrap:wrap}
.orig button{border:1px solid var(--linha);background:var(--carta);color:var(--texto);border-radius:999px;
  padding:5px 12px;font:600 12.5px Inter,sans-serif;cursor:pointer}
.orig button.on{background:var(--marca);border-color:var(--marca);color:#fff;font-weight:700}
.cab .ic{width:34px;height:34px;border-radius:999px;border:1px solid var(--linha);background:var(--carta);
  display:grid;place-items:center;color:var(--texto);cursor:pointer}

/* ── A BARRA DE METAS ──────────────────────────────────────────── */
.mt{background:var(--carta);border-bottom:1px solid var(--linha)}
.mt-in{max-width:1180px;margin:0 auto;padding:0 16px}

/* linha de cima: sempre visível, mesmo recolhida */
.mt-topo{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 0}
.mt-tit{display:flex;align-items:center;gap:7px;font:800 11px Inter,sans-serif;color:var(--tinta);
  text-transform:uppercase;letter-spacing:.09em}
.mt-tit i{color:var(--marca)}
.mt-sel{display:flex;align-items:center;gap:6px}
.mt-sel select{border:1px solid var(--linha);background:var(--papel);color:var(--tinta);
  border-radius:999px;padding:4px 10px;font:700 12px Inter,sans-serif;cursor:pointer}
/* o resumo do mês, que continua à vista com a barra fechada */
.mt-resumo{display:flex;align-items:center;gap:9px;margin-left:auto;font-size:12.5px;flex-wrap:wrap}
.mt-resumo .cx{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;
  background:var(--papel);font-weight:700;color:var(--tinta)}
.mt-resumo .cx small{font-weight:600;color:var(--fraco);font-size:11px}
.mt-fechar{width:28px;height:28px;border-radius:999px;border:1px solid var(--linha);background:var(--carta);
  color:var(--fraco);display:grid;place-items:center;cursor:pointer;flex:none}
.mt-fechar i{transition:transform .18s ease}
.mt.fechada .mt-corpo{display:none}
.mt.fechada .mt-fechar i{transform:rotate(180deg)}

.mt-corpo{padding-bottom:13px}

/* categorias */
.mt-cats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.cat{border:1px solid var(--linha);border-radius:14px;background:var(--carta);padding:10px 11px;
  cursor:pointer;text-align:left;font-family:inherit;position:relative;overflow:hidden}
.cat:hover{border-color:var(--linha-forte)}
.cat.on{border-color:var(--marca);box-shadow:0 0 0 1px var(--marca) inset}
.cat .nm{display:flex;align-items:center;gap:6px;font:700 12px Inter,sans-serif;color:var(--tinta)}
.cat .nm i{font-size:11px;color:var(--fraco)}
.cat .pc{display:block;font:800 21px Inter,sans-serif;margin-top:3px;letter-spacing:-.02em;line-height:1.1}
.cat .ba{display:block;height:5px;border-radius:999px;background:var(--papel);overflow:hidden;margin-top:6px}
.cat .ba i{display:block;height:5px;border-radius:999px}
.cat .pe{display:flex;justify-content:space-between;gap:6px;margin-top:6px;font-size:11px;color:var(--fraco);line-height:1.3}
.cat .pe b{color:var(--tinta);font-weight:700}
.cat.ok .pc{color:var(--ok)}       .cat.ok .ba i{background:var(--ok)}
.cat.quase .pc{color:var(--quase)} .cat.quase .ba i{background:var(--quase)}
.cat.risco .pc{color:var(--risco)} .cat.risco .ba i{background:var(--risco)}

/* faixas de calçado */
.mt-fx{margin-top:12px;border-top:1px dashed var(--linha);padding-top:11px}
.mt-fx-tit{display:flex;align-items:center;gap:8px;font:700 11px Inter,sans-serif;color:var(--fraco);
  text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px}
.mt-fx-tit span{font-weight:600;text-transform:none;letter-spacing:0;color:var(--tenue);font-size:11px}
.fxs{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 18px}
.fx{display:grid;grid-template-columns:118px 1fr auto;align-items:center;gap:9px;
  border:0;background:none;padding:5px 6px;border-radius:10px;cursor:pointer;font-family:inherit;text-align:left}
.fx:hover{background:var(--papel)}
.fx.on{background:var(--repasse-fundo)}
.fx .nm{display:block;font:700 12px Inter,sans-serif;color:var(--tinta);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fx .ba{display:block;height:7px;border-radius:999px;background:var(--papel);overflow:hidden;position:relative}
.fx .ba i{position:absolute;left:0;top:0;height:100%;border-radius:999px}
.fx .ba .real{background:var(--pronta)}
.fx .ba .pot{background:var(--repasse);opacity:.45}
.fx .dir{display:flex;align-items:center;gap:8px;white-space:nowrap}
.fx .pc{font:800 12.5px Inter,sans-serif;min-width:44px;text-align:right}
.fx.ok .pc{color:var(--ok)} .fx.quase .pc{color:var(--quase)} .fx.risco .pc{color:var(--risco)}
.fx .tem{font-size:11px;font-weight:700;color:var(--repasse);background:var(--repasse-fundo);
  border-radius:999px;padding:2px 8px}
.fx .tem.vazio{color:var(--tenue);background:var(--papel)}

/* legenda */
.mt-leg{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:11px;color:var(--tenue)}
.mt-leg b{display:inline-block;width:9px;height:9px;border-radius:3px;vertical-align:-1px;margin-right:4px}

/* ── grade de cards, só para dar contexto ──────────────────────── */
.grade{max-width:1180px;margin:0 auto;padding:16px;display:grid;
  grid-template-columns:repeat(auto-fill,minmax(188px,1fr));gap:12px}
.card{background:var(--carta);border:1px solid var(--linha);border-radius:16px;overflow:hidden}
.card .img{aspect-ratio:1;background:var(--papel);display:grid;place-items:center;color:var(--linha-forte);font-size:26px}
.card .tx{padding:9px 11px 12px}
.card .nm{font:700 13px Inter,sans-serif;color:var(--tinta)}
.card .sb{font-size:11.5px;color:var(--fraco);margin-top:2px}
.card .pr{font:800 14px Inter,sans-serif;color:var(--marca);margin-top:6px}
.card .selo{display:inline-block;margin-top:7px;font:700 10px Inter,sans-serif;padding:2px 8px;border-radius:999px}
.selo.rep{background:var(--repasse-fundo);color:var(--repasse)}
.selo.est{background:var(--pronta-fundo);color:var(--pronta)}
.grade .aviso{grid-column:1/-1;text-align:center;color:var(--fraco);font-size:13px;padding:10px}

@media (max-width:900px){
  .mt-cats{grid-template-columns:repeat(3,1fr)}
  .fxs{grid-template-columns:1fr}
}
@media (max-width:560px){
  /* Aberta, a barra tomava a tela inteira no celular: as categorias viram
     uma tira que desliza e cada quadro encolhe para o essencial. */
  .mt-cats{display:flex;gap:7px;overflow-x:auto;scroll-snap-type:x mandatory;
    padding-bottom:3px;margin:0 -16px;padding-left:16px;padding-right:16px}
  .mt-cats::-webkit-scrollbar{display:none}
  .cat{flex:0 0 136px;scroll-snap-align:start;padding:9px 10px}
  .cat .pc{font-size:17px}
  .cat .pe{flex-direction:column;gap:1px;font-size:10.5px}
  .mt-resumo{width:100%;margin-left:0;order:3}
  .mt-topo{padding:8px 0}
  .fx{grid-template-columns:92px 1fr auto;gap:7px;padding:4px}
  .fx .nm{font-size:11px}
  .fx .pc{min-width:38px;font-size:12px}
  .mt-leg{font-size:10px;gap:9px}
}
</style>
</head>
<body>

<div class="pv">
  <b>Prévia · barra de metas na vitrine</b>
  <span>dados reais de outubro · nada aqui filtra de verdade</span>
  <span class="sp"></span>
  <button type="button" onclick="trocarTema()"><i class="fa-solid fa-circle-half-stroke"></i> Tema</button>
</div>

<!-- cabeçalho simulado -->
<div class="cab">
  <div class="cab-in">
    <div class="logo">CMS</div>
    <div class="busca"><i class="fa-solid fa-magnifying-glass"></i> Buscar produto, artigo ou cor</div>
    <div class="orig">
      <button class="on">Tudo</button><button>Estoque</button><button>Repasse</button><button>Produção</button>
    </div>
    <div class="ic"><i class="fa-solid fa-sliders"></i></div>
    <div class="ic"><i class="fa-solid fa-bag-shopping"></i></div>
  </div>
</div>

<!-- ══════════ A BARRA ══════════ -->
<div class="mt" id="mt">
  <div class="mt-in">
    <div class="mt-topo">
      <div class="mt-tit"><i class="fa-solid fa-bullseye"></i> Metas</div>
      <div class="mt-sel">
        <select id="selMes" onchange="pintar()"></select>
        <select id="selPrep" onchange="pintar()"></select>
      </div>
      <div class="mt-resumo" id="resumo"></div>
      <button class="mt-fechar" id="btFechar" title="Recolher" onclick="fechar()">
        <i class="fa-solid fa-chevron-up"></i></button>
    </div>

    <div class="mt-corpo" id="corpo">
      <div class="mt-cats" id="cats"></div>

      <div class="mt-fx">
        <div class="mt-fx-tit">Calçados por faixa <span id="fxSub"></span></div>
        <div class="fxs" id="fxs"></div>
      </div>

      <div class="mt-leg">
        <span><b style="background:var(--pronta)"></b>já faturado</span>
        <span><b style="background:var(--repasse);opacity:.45"></b>em carteira</span>
        <span><b style="background:var(--papel)"></b>falta vender</span>
        <span>· o número à direita é o que a vitrine tem desta faixa agora</span>
      </div>
    </div>
  </div>
</div>

<!-- grade simulada -->
<div class="grade" id="grade"></div>

<script src="./preview-metas-dados.js"></script>
<script>
const nf = n => Number(n || 0).toLocaleString('pt-BR');
const MESES = ['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];
const rotMes = m => MESES[+m.slice(5,7) - 1] + '/' + m.slice(2,4);
const ICONE = { calcados:'fa-shoe-prints', chinelos:'fa-sun', vestuario:'fa-shirt',
                acessorios:'fa-bag-shopping', meias:'fa-socks' };
let SEL = { cat:'', fx:'' };

function trocarTema(){
  const r = document.documentElement;
  const escuro = r.getAttribute('data-theme') === 'dark'
    || (!r.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
  r.setAttribute('data-theme', escuro ? 'light' : 'dark');
}
function fechar(){
  document.getElementById('mt').classList.toggle('fechada');
  const f = document.getElementById('mt').classList.contains('fechada');
  document.getElementById('btFechar').title = f ? 'Mostrar as metas' : 'Recolher';
}

/* Quanto já está garantido: o que faturou mais o que está em carteira. É
   essa a conta que o vendedor usa para saber se ainda precisa correr. */
const pos = g => (g.real || 0) + (g.pot || 0);
const pc  = g => g.meta ? Math.round(100 * pos(g) / g.meta) : null;
const falta = g => Math.max(0, (g.meta || 0) - pos(g));
function estado(g, tem){
  if(!g.meta) return 'ok';
  if(falta(g) === 0) return 'ok';
  return tem >= falta(g) ? 'quase' : 'risco';
}

function montarSeletores(){
  const hoje = new Date();
  const atual = hoje.getFullYear() + '-' + String(hoje.getMonth() + 1).padStart(2, '0');
  const mes = document.getElementById('selMes');
  mes.innerHTML = METAS_PREV.meses.map(m =>
    `<option value="${m.mes}" ${m.mes === atual ? 'selected' : ''}>${rotMes(m.mes)}</option>`).join('');
  if(!mes.value) mes.value = METAS_PREV.meses[METAS_PREV.meses.length - 1].mes;

  const prep = document.getElementById('selPrep');
  const p0 = METAS_PREV.meses.find(m => m.mes === mes.value) || METAS_PREV.meses[0];
  const lista = Object.entries(p0.prepostos)
    .map(([cod, v]) => ({ cod, nome: v.nome }))
    .sort((a, b) => a.cod === 'TODOS' ? -1 : b.cod === 'TODOS' ? 1 : a.nome.localeCompare(b.nome, 'pt-BR'));
  prep.innerHTML = lista.map(x =>
    `<option value="${x.cod}">${x.cod === 'TODOS' ? 'Todos os prepostos' : primeiroNome(x.nome)}</option>`).join('');
}
const primeiroNome = n => String(n).split(' ').slice(0, 2).map(
  s => s.charAt(0) + s.slice(1).toLowerCase()).join(' ');

function pintar(){
  const mes = document.getElementById('selMes').value;
  const cod = document.getElementById('selPrep').value;
  const m = METAS_PREV.meses.find(x => x.mes === mes);
  const p = m && m.prepostos[cod];
  if(!p) return;

  // ── resumo que fica à vista com a barra fechada ──
  let meta = 0, feito = 0;
  for(const g of Object.values(p.cat)){ meta += g.meta; feito += pos(g); }
  const pcGeral = meta ? Math.round(100 * feito / meta) : 0;
  const faltaGeral = Math.max(0, meta - feito);
  document.getElementById('resumo').innerHTML =
    `<span class="cx" style="color:${pcGeral >= 100 ? 'var(--ok)' : 'var(--tinta)'}">${pcGeral}% <small>da meta</small></span>` +
    (faltaGeral ? `<span class="cx">${nf(faltaGeral)} <small>pares a vender</small></span>` : '') +
    `<span class="cx" style="color:var(--repasse)">${nf(ofertaTotal())} <small>na vitrine</small></span>`;

  // ── categorias ──
  const ordem = ['calcados','chinelos','vestuario','acessorios','meias'];
  document.getElementById('cats').innerHTML = ordem.map(c => {
    const g = p.cat[c] || { meta:0, real:0, pot:0 };
    const of = METAS_PREV.oferta[c] || { estoque:0, repasse:0 };
    const tem = of.estoque + of.repasse;
    const e = estado(g, tem);
    const v = pc(g);
    return `<button class="cat ${e} ${SEL.cat === c ? 'on' : ''}" onclick="escolher('cat','${c}')">
      <span class="nm"><i class="fa-solid ${ICONE[c]}"></i> ${METAS_PREV.rotulos[c]}</span>
      <span class="pc">${v === null ? '—' : v + '%'}</span>
      <span class="ba"><i style="width:${Math.min(100, v || 0)}%"></i></span>
      <span class="pe">
        <span>${falta(g) ? 'faltam <b>' + nf(falta(g)) + '</b>' : '<b>meta coberta</b>'}</span>
        <span>${tem ? nf(tem) + ' na vitrine' : 'sem oferta'}</span>
      </span>
    </button>`;
  }).join('');

  // ── faixas de calçado ──
  const fx = p.fx || {};
  const linhas = Object.entries(fx).sort((a, b) => falta(b[1]) - falta(a[1]) || b[1].meta - a[1].meta);
  document.getElementById('fxSub').textContent =
    `· ${linhas.length} faixas · ordenadas pelo que falta vender`;
  document.getElementById('fxs').innerHTML = linhas.map(([nome, g]) => {
    const of = METAS_PREV.ofertaFaixa[nome] || { estoque:0, repasse:0 };
    const tem = of.estoque + of.repasse;
    const e = estado(g, tem);
    const v = pc(g) || 0;
    const wReal = g.meta ? Math.min(100, 100 * (g.real || 0) / g.meta) : 0;
    const wPot  = g.meta ? Math.min(100 - wReal, 100 * (g.pot || 0) / g.meta) : 0;
    return `<button class="fx ${e} ${SEL.fx === nome ? 'on' : ''}" onclick="escolher('fx','${nome}')"
        title="${nome} · meta ${nf(g.meta)} · faturado ${nf(g.real)} · carteira ${nf(g.pot)}">
      <span class="nm">${nome}</span>
      <span class="ba"><i class="real" style="width:${wReal}%"></i>
        <i class="pot" style="left:${wReal}%;width:${wPot}%"></i></span>
      <span class="dir">
        <span class="pc">${v}%</span>
        <span class="tem ${tem ? '' : 'vazio'}">${tem ? nf(tem) : '—'}</span>
      </span>
    </button>`;
  }).join('');

  pintarGrade();
}

function ofertaTotal(){
  let t = 0;
  for(const o of Object.values(METAS_PREV.oferta)) t += o.estoque + o.repasse;
  return t;
}

/* Na vitrine de verdade, isto liga o filtro. Aqui só mostra o efeito. */
function escolher(tipo, v){
  if(tipo === 'cat'){ SEL.cat = SEL.cat === v ? '' : v; SEL.fx = ''; }
  else { SEL.fx = SEL.fx === v ? '' : v; SEL.cat = ''; }
  pintar();
}

const PRODUTOS = [
  { nm:'CHALLENGER 6', cor:'PTO/CH', fx:'CONF_MASC', cat:'calcados', pr:'R$ 249,99', origem:'rep' },
  { nm:'NUVEM', cor:'RYLMHO', fx:'CONF_FEM', cat:'calcados', pr:'R$ 229,99', origem:'rep' },
  { nm:'CORRE 5', cor:'PTO/PT', fx:'CORRE', cat:'calcados', pr:'R$ 349,99', origem:'est' },

];
function pintarGrade(){
  const lista = PRODUTOS.filter(x =>
    (!SEL.cat || x.cat === SEL.cat) && (!SEL.fx || x.fx === SEL.fx));
  const cab = (SEL.cat || SEL.fx)
    ? `<div class="aviso">a vitrine abaixo filtrada por <b>${SEL.fx || METAS_PREV.rotulos[SEL.cat]}</b>
        — clique de novo no quadro para tirar o filtro</div>` : '';
  document.getElementById('grade').innerHTML = cab + (lista.length ? lista.map(x => `
    <div class="card">
      <div class="img"><i class="fa-regular fa-image"></i></div>
      <div class="tx">
        <div class="nm">${x.nm}</div>
        <div class="sb">${x.cor} · ${x.fx}</div>
        <div class="pr">${x.pr}</div>
        <span class="selo ${x.origem}">${x.origem === 'rep' ? 'Repasse' : 'Estoque'}</span>
      </div>
    </div>`).join('')
    : `<div class="aviso">Nenhum produto desta faixa na amostra da prévia.</div>`);
}

montarSeletores();
pintar();
