  body::before{ -webkit-mask-size:340px 340px; mask-size:340px 340px; }
}
body{
  background:transparent; color:var(--texto);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
.mono,.cel,.q{ font-variant-numeric:tabular-nums }
button{ font:inherit }

/* ── cabeçalho ── */
.topo{
  position:sticky; top:0; z-index:20; background:var(--barra);
  border-bottom:1px solid var(--linha-forte);
  padding:calc(11px + env(safe-area-inset-top)) 14px 11px;
  display:flex; align-items:center; gap:11px;
}
.selo{
  width:36px; height:36px; border-radius:10px; flex:none;
  display:flex; align-items:center; justify-content:center;
  font-size:10px; font-weight:800; color:#fff; letter-spacing:.02em;
  background:linear-gradient(145deg,#a970ff 0%,#8b5cf6 48%,#7439e0 100%);
  box-shadow:0 4px 12px rgba(124,58,237,.35), inset 0 1px 0 rgba(255,255,255,.3);
}
.tit{ flex:1; min-width:0 }
.tit b{ display:block; font-size:14.5px; font-weight:800; color:var(--tinta);
  letter-spacing:-.015em; line-height:1.2 }
.tit span{ display:block; font-size:11px; font-weight:600; color:var(--fraco) }

/* ── faixa de abertura ── */
.intro{ max-width:960px; margin:0 auto; padding:14px 14px 0 }
.intro h1{ margin:0 0 3px; font-size:17px; font-weight:800; letter-spacing:-.02em;
  color:var(--tinta) }
.intro p{ margin:0; font-size:12.5px; color:var(--fraco) }

/* ── grade ── */
.grade{ max-width:960px; margin:0 auto; padding:12px 14px 0;
  display:grid; grid-template-columns:1fr; gap:10px }
/* A folga do rodapé fixo é posta pelo JS, com a altura que ele realmente
   tem: no CSS ela virava uma regra que a definição de .tira sobrescrevia, e
   catorze miniaturas ficavam escondidas atrás da barra de Enviar. */
@media(min-width:700px){ .grade{ grid-template-columns:1fr 1fr; gap:12px } }
@media(min-width:1000px){ .grade{ grid-template-columns:1fr 1fr 1fr } }
/* Numa coluna so, a foto quadrada tomava meia tela e empurrava o produto
   seguinte para fora. O card tem que caber quase inteiro de uma vez. */
@media(max-width:699px){ .foto{ aspect-ratio:auto; height:190px } }

.card{ background:var(--carta); border:1px solid var(--linha); border-radius:18px;
  overflow:hidden; display:flex; flex-direction:column; box-shadow:var(--sombra);
  transition:border-color .14s, box-shadow .14s, transform .14s }
.card:hover{ border-color:var(--linha-forte); box-shadow:var(--sombra-alta);
  transform:translateY(-2px) }
.card.quero{ border-color:color-mix(in srgb,var(--pronta) 45%,transparent) }
.foto{ position:relative; background:var(--carta); aspect-ratio:1/1;
  display:flex; align-items:center; justify-content:center; overflow:hidden }
.foto img{ width:100%; height:100%; object-fit:contain; transition:transform .25s ease }
@media (hover:hover){ .card .foto:hover img{ transform:scale(1.04) } }
.foto{ cursor:zoom-in }
.corpo{ padding:10px 12px 12px; border-top:1px solid var(--linha); flex:1;
  display:flex; flex-direction:column }
.nm{ font-size:12.5px; font-weight:800; color:var(--tinta); line-height:1.25;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  overflow:hidden; overflow-wrap:anywhere }
.sb{ font-size:10.5px; font-weight:600; color:var(--tenue); margin-top:1px }
.pdv{ margin-top:6px; font-size:15px; font-weight:800; color:var(--marca) }

.origem{ margin-top:9px; border-top:1px dashed var(--linha); padding-top:8px }
.origem:first-of-type{ border-top:0; padding-top:0 }
.rot{ display:inline-flex; align-items:center; gap:5px; margin:0 0 5px;
  font-size:10px; font-weight:800; letter-spacing:.04em; text-transform:uppercase }
.rot.est{ color:var(--pronta) } .rot.rep{ color:var(--repasse) } .rot.pro{ color:var(--plano) }
.celulas{ display:flex; flex-wrap:wrap; gap:5px }
.cel{ border:1px solid var(--linha); border-radius:6px; padding:4px 0; width:40px;
  text-align:center; background:var(--carta) }
.cel .t{ display:block; font-size:9.5px; font-weight:700; color:var(--fraco); line-height:1 }
.cel .q{ display:block; font-size:13px; font-weight:800; color:var(--tinta);
  margin-top:2px; line-height:1 }
.celulas.est .cel{ border-color:color-mix(in srgb,var(--pronta) 34%,transparent);
  background:color-mix(in srgb,var(--pronta) 7%,var(--carta)) }
.celulas.est .cel .t,.celulas.est .cel .q{ color:var(--pronta) }
.celulas.rep .cel{ border-color:color-mix(in srgb,var(--repasse) 34%,transparent);
  background:color-mix(in srgb,var(--repasse) 7%,var(--carta)) }
.celulas.rep .cel .t,.celulas.rep .cel .q{ color:var(--repasse) }
.lote{ border:1px solid var(--linha); border-radius:9px; padding:7px 9px; margin-bottom:6px }
.lote:last-child{ margin-bottom:0 }
.lote-l1{ display:flex; align-items:baseline; justify-content:space-between; gap:8px }
.lote .n{ font-size:10.5px; font-weight:700; color:var(--repasse) }
.lote .s{ font-size:11.5px; font-weight:700; color:var(--tinta) }
.lote .d{ font-size:10px; color:var(--fraco); margin-top:1px }
.lote .celulas{ margin-top:6px }
.meses{ display:flex; flex-wrap:wrap; gap:5px }
.mes{ border:1px solid color-mix(in srgb,var(--plano) 30%,transparent);
  background:color-mix(in srgb,var(--plano) 7%,var(--carta));
  border-radius:999px; padding:3px 9px; font-size:10.5px; font-weight:700;
  color:var(--plano) }
.mes b{ font-weight:800 }

.quero-bar{ margin-top:auto; padding-top:10px; display:flex; align-items:flex-start; gap:8px }
/* A cor conta em que passo o cliente está: apagado enquanto falta a
   quantidade, azul pedindo o toque, verde quando já está no carrinho. */
.btn-quero{ flex:1; border:1px solid transparent; border-radius:9px; padding:9px 8px;
  font-size:12px; font-weight:800; cursor:pointer; color:#fff;
  display:flex; align-items:center; justify-content:center; gap:6px;
  background:linear-gradient(145deg,var(--marca-claro),var(--marca) 55%,var(--marca-escuro));
  box-shadow:0 3px 10px color-mix(in srgb,var(--marca) 30%,transparent),
             inset 0 1px 0 rgba(255,255,255,.26) }
.btn-quero:hover:not(:disabled){ filter:brightness(1.06) }
.card.quero .btn-quero{
  background:linear-gradient(145deg,#34C77B 0%,#128A4F 55%,#0A5C35 100%);
  box-shadow:0 3px 10px rgba(18,138,79,.32), inset 0 1px 0 rgba(255,255,255,.26) }
/* Sem quantidade não há o que adicionar: o botão fica de fora até ter número. */
.btn-quero:disabled{ background:var(--carta); color:var(--tenue);
  border-color:var(--linha-forte); border-style:dashed; box-shadow:none;
  cursor:not-allowed }
.qtd{ width:74px; flex:none }
.qtd input{ width:100%; border:1px solid var(--linha); border-radius:9px; padding:8px 6px;
  text-align:center; font:inherit; font-size:12.5px; font-weight:800; color:var(--tinta);
  background:var(--carta); -moz-appearance:textfield }
.qtd input::-webkit-outer-spin-button,.qtd input::-webkit-inner-spin-button{
  -webkit-appearance:none; margin:0 }
.qtd input:focus{ outline:2px solid var(--marca); outline-offset:-1px }
.qtd em{ display:block; font-size:9px; font-style:normal; color:var(--tenue);
  text-align:center; margin-top:2px }

/* ── rodapé ── */
.pe{ position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--barra);
  border-top:1px solid var(--linha-forte);
  padding:11px 14px calc(11px + env(safe-area-inset-bottom));
  display:flex; align-items:center; gap:11px }
.pe .cont{ flex:1; font-size:12px; font-weight:700; color:var(--fraco) }
.pe .cont b{ color:var(--tinta) }
/* Laranja, e não a cor da marca: enviar é a única saída da página, e precisa
   se destacar dos botões verdes dos cards. */
.enviar{ flex:none; border:0; border-radius:999px; padding:11px 20px; color:#fff;
  font-size:13px; font-weight:800; cursor:pointer;
  background:linear-gradient(145deg,#FDBA74 0%,#F97316 48%,#C2410C 100%);
  box-shadow:0 4px 14px rgba(249,115,22,.42), inset 0 1px 0 rgba(255,255,255,.3) }
.enviar:disabled{ opacity:.45; cursor:not-allowed; box-shadow:none }
/* Vermelho, como todo PDF do projeto: a cor ja diz o que sai antes de ler. */
.pdf{ flex:none; display:inline-flex; align-items:center; gap:6px; cursor:pointer;
  border:0; color:#fff; border-radius:999px; padding:11px 16px;
  font-size:12px; font-weight:800;
  background:linear-gradient(145deg,#F2557A 0%,#D6294B 55%,#96122E 100%);
  box-shadow:0 4px 12px rgba(214,41,75,.35), inset 0 1px 0 rgba(255,255,255,.26) }
.pdf:hover{ filter:brightness(1.06) }
.pdf[hidden]{ display:none }
.pdf:disabled{ opacity:.6; cursor:progress }

/* Aviso de envio: a mesma caixa do resto do projeto, num arquivo que não tem
   o modal de lá. */
.cx-bg{ position:fixed; inset:0; z-index:60; background:rgba(16,18,20,.55);
  backdrop-filter:blur(2px); display:flex; align-items:center; justify-content:center;
  padding:18px }
.cx-bg[hidden]{ display:none }
.cx{ background:var(--carta); border:1px solid var(--linha); border-radius:16px;
  width:100%; max-width:360px; padding:22px 20px 0; text-align:center;
  box-shadow:0 24px 64px rgba(0,0,0,.22) }
.cx-ico{ width:46px; height:46px; border-radius:50%; margin:0 auto 12px;
  display:flex; align-items:center; justify-content:center;
  background:var(--pronta-fundo); color:var(--pronta) }
.cx h3{ margin:0 0 5px; font-size:16px; font-weight:800; color:var(--tinta) }
.cx p{ margin:0 0 4px; font-size:12.5px; color:var(--fraco); line-height:1.5 }
.cx-pe{ display:flex; gap:8px; margin:18px -20px 0; padding:13px 20px;
  border-top:1px solid var(--linha) }
.cx-pe > *{ flex:1; border-radius:9px; padding:9px; font:inherit; font-size:12px;
  font-weight:800; cursor:pointer }
.cx-nao{ border:1px solid var(--linha-forte); background:var(--carta); color:var(--texto) }
.cx-sim{ border:0; color:#fff;
  background:linear-gradient(145deg,var(--marca-claro),var(--marca) 55%,var(--marca-escuro)) }
.cx-sim:disabled{ opacity:.6; cursor:progress }

/* Já enviado: a seleção continua na tela até o link expirar, e a faixa diz
   quando foi. Fechar a página no "Recebemos!" deixava o cliente sem conferir
   o que tinha pedido. */
.enviado{ display:flex; align-items:center; gap:7px; margin:6px 0 0;
  font-size:12px; font-weight:700; color:var(--pronta) }
.enviado svg{ flex:none }

/* ── tiras de sugestão ──
   Produtos que este cliente já comprou e ainda estão disponíveis, e as meias
   e mochilas que fecham o pedido. O vendedor monta as duas ao gerar o link —
   esta página não tem (nem deve ter) acesso à carteira da casa. */
.tira{ max-width:960px; margin:0 auto; padding:12px 14px 0 }
.tira[hidden]{ display:none }
.tira-cab{ display:flex; align-items:baseline; gap:9px; margin-bottom:7px }
.tira-cab h2{ margin:0; font-size:11px; font-weight:800; letter-spacing:.09em;
  text-transform:uppercase; color:var(--tinta) }
.tira-cab span{ font-size:11.5px; color:var(--fraco) }
.rolo{ display:flex; gap:9px; overflow-x:auto; padding:2px 2px 4px;
  scroll-snap-type:x proximate; -webkit-overflow-scrolling:touch }
.rolo::-webkit-scrollbar{ height:0 }
.mini{ flex:0 0 124px; scroll-snap-align:start; background:var(--carta);
  border:1px solid var(--linha); border-radius:12px; overflow:hidden;
  transition:border-color .14s, box-shadow .14s, transform .14s }
.mini:hover{ border-color:var(--linha-forte); box-shadow:var(--sombra); transform:translateY(-2px) }
.mini .f{ height:84px; background:var(--carta); display:flex; align-items:center;
  justify-content:center; overflow:hidden; position:relative; cursor:zoom-in }
.mini .f img{ width:100%; height:100%; object-fit:contain; transition:transform .25s ease }
@media (hover:hover){ .mini:hover .f img{ transform:scale(1.05) } }
.mini .c{ padding:7px 9px 9px; border-top:1px solid var(--linha);
  display:flex; flex-direction:column; gap:4px }
.mini .n{ font-size:10.5px; font-weight:800; color:var(--tinta); line-height:1.25;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  overflow:hidden; min-height:26px; overflow-wrap:anywhere }
.mini .l{ display:flex; align-items:baseline; justify-content:space-between; gap:6px }
.mini .co{ font-size:9.5px; font-weight:600; color:var(--tenue); min-width:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.mini .p{ font-size:10.5px; font-weight:800; color:var(--marca); white-space:nowrap }
.mini .add-lin{ display:flex; gap:5px }
.mini .add-lin input{ width:42px; border:1px solid var(--linha); border-radius:7px;
  padding:4px 3px; font-size:11.5px; font-weight:800; text-align:center;
  color:var(--tinta); background:var(--carta); font-family:inherit; min-width:0;
  -moz-appearance:textfield }
.mini .add-lin input::-webkit-outer-spin-button,
.mini .add-lin input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0 }
.mini .add-lin button{ flex:1; border:1px solid var(--linha); background:var(--carta);
  color:var(--fraco); border-radius:7px; padding:4px 2px; font-size:10.5px;
  font-weight:800; cursor:pointer; font-family:inherit;
  transition:border-color .14s,color .14s,background .14s }
.mini .add-lin button:hover:not(:disabled){ border-color:var(--marca); color:var(--marca) }
.mini .add-lin button:disabled{ opacity:.5; cursor:default }
.mini.quero{ border-color:color-mix(in srgb,var(--pronta) 50%,transparent) }
.mini.quero .add-lin button{ border-color:var(--pronta); color:var(--pronta);
  background:var(--pronta-fundo) }
/* o produto da seleção que ele já comprou antes */
.ja{ display:inline-flex; align-items:center; gap:5px; margin-top:7px; font-size:10px;
  font-weight:800; letter-spacing:.03em; text-transform:uppercase; color:var(--plano);
  background:var(--plano-fundo); border-radius:999px; padding:3px 9px; align-self:flex-start }

/* ── foto ampliada ──
   A miniatura não deixa ver a entressola nem o acabamento, e é por aí que o
   lojista decide. A foto grande entra só quando pedida. */
.zoom{ position:fixed; inset:0; z-index:70; background:rgba(16,18,20,.82);
  backdrop-filter:blur(3px); display:flex; align-items:center; justify-content:center;
  padding:12px; animation:zEntra .18s ease }
@keyframes zEntra{ from{ opacity:0 } to{ opacity:1 } }
.z-caixa{ background:var(--carta); border-radius:18px; overflow:hidden; width:100%;
  max-width:760px; max-height:94vh; display:flex; flex-direction:column;
  box-shadow:0 24px 60px -20px rgba(0,0,0,.5) }
/* o palco tem altura própria, descontando o rodapé: sem isso a foto fica com
   o tamanho natural e passa por cima do nome */
.z-palco{ position:relative; background:var(--carta); flex:none; overflow:hidden;
  height:max(200px, calc(94vh - 170px)) }
.z-palco img{ position:absolute; inset:0; width:100%; height:100%;
  object-fit:contain; display:block }
.z-seta{ position:absolute; top:50%; transform:translateY(-50%); width:38px; height:38px;
  border-radius:50%; border:1px solid var(--linha); background:rgba(255,255,255,.92);
  color:var(--tinta); font-size:17px; cursor:pointer; display:flex; align-items:center;
  justify-content:center; box-shadow:0 2px 10px rgba(22,24,26,.14); z-index:2 }
.z-seta:hover{ background:#fff; border-color:var(--linha-forte) }
.z-seta.ant{ left:10px } .z-seta.pro{ right:10px }
.z-fecha{ position:absolute; top:10px; right:10px; width:34px; height:34px; border-radius:50%;
  border:1px solid var(--linha); background:rgba(255,255,255,.92); color:var(--tinta);
  font-size:15px; cursor:pointer; z-index:3 }
.z-pe{ padding:12px 16px 14px; border-top:1px solid var(--linha); display:flex;
  flex-direction:column; align-items:stretch; gap:8px; flex:none; background:var(--carta) }
.z-cab{ display:flex; align-items:flex-end; gap:12px }
.z-pe .nm{ font-size:15px; -webkit-line-clamp:2 }
.z-pe .sb{ font-size:11px; font-weight:600; color:var(--tenue); margin-top:2px }
.z-pe .pdv{ margin-left:auto; font-size:17px; font-weight:800; color:var(--marca);
  white-space:nowrap }
.z-conta{ font-size:11px; color:var(--fraco); margin-top:4px }
.z-add{ display:flex; gap:8px; align-items:center }
.z-add input{ width:74px; border:1px solid var(--linha); border-radius:9px; padding:8px;
  font-size:14px; font-weight:800; text-align:center; color:var(--tinta);
  background:var(--carta); font-family:inherit; -moz-appearance:textfield }
.z-add input::-webkit-outer-spin-button,
.z-add input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0 }
.z-add button{ border:1px solid var(--linha); background:var(--carta); color:var(--texto);
  border-radius:9px; padding:9px 18px; font-size:13px; font-weight:800; cursor:pointer;
  font-family:inherit }
.z-add button:hover:not(:disabled){ border-color:var(--marca); color:var(--marca) }
.z-add button:disabled{ opacity:.5; cursor:default }
.z-add .un{ font-size:11.5px; color:var(--fraco) }

/* ── estados ── */
.estado{ max-width:520px; margin:70px auto; padding:28px 22px; text-align:center;
  background:var(--carta); border:1px solid var(--linha); border-radius:16px }
.estado h2{ margin:0 0 7px; font-size:19px; font-weight:800; color:var(--tinta) }
.estado p{ margin:0; font-size:13.5px; color:var(--fraco); line-height:1.55 }
.estado .ico{ width:52px; height:52px; border-radius:50%; margin:0 auto 14px;
  display:flex; align-items:center; justify-content:center;
  background:var(--papel); color:var(--fraco) }
.girando{ width:26px; height:26px; border:3px solid var(--linha);
  border-top-color:var(--marca); border-radius:50%; margin:0 auto 14px;
  animation:gira .8s linear infinite }
@keyframes gira{ to{ transform:rotate(360deg) } }
[hidden]{ display:none !important }
@media (prefers-reduced-motion:reduce){ *{ animation:none !important; transition:none !important } }
</style>
</head>
<body>

<header class="topo" id="topo" hidden>
  <span class="selo">CMS</span>
  <span class="tit"><b>CMS - Representações</b><span id="tMarca">—</span></span>

</header>

<div id="carregando" class="estado">
  <div class="girando"></div>
  <h2>Abrindo a seleção</h2>
  <p>Um instante.</p>
</div>

<div id="erro" class="estado" hidden>
  <span class="ico">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
  </span>
  <h2 id="erroTit">Link não encontrado</h2>
  <p id="erroTxt">Peça um novo ao seu representante.</p>
</div>

<div id="conteudo" hidden>
  <div class="intro">
    <h1 id="iTit">Separamos alguns produtos para você</h1>
    <p id="iEnviado" hidden>—</p>
  </div>
  <main class="grade" id="grade"></main>
  <section class="tira" id="tiraExtras" hidden></section>
  <section class="tira" id="tiraJa" hidden></section>
</div>

<div class="zoom" id="zoom" hidden>
  <div class="z-caixa" role="dialog" aria-modal="true" aria-label="Foto ampliada">
    <div class="z-palco">
      <button type="button" class="z-fecha" id="zFecha" aria-label="Fechar">&#10005;</button>
      <button type="button" class="z-seta ant" id="zAnt" aria-label="Anterior">&#8249;</button>
      <img id="zImg" alt="">
      <button type="button" class="z-seta pro" id="zPro" aria-label="Pr&oacute;xima">&#8250;</button>
    </div>
    <div class="z-pe">
      <div class="z-cab">
        <div>
          <div class="nm" id="zNome">&#8212;</div>
          <div class="sb" id="zSub">&#8212;</div>
          <div class="z-conta" id="zConta"></div>
        </div>
        <div class="pdv" id="zPdv"></div>
      </div>
      <div class="z-add" id="zAdd"></div>

</div>

<footer class="pe" id="pe" hidden>
  <span class="cont" id="peCont">—</span>
  <button class="pdf" id="pePdf" hidden>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
      <path d="M14 2v6h6"/><path d="M12 18v-6M9 15l3 3 3-3"/></svg>
    <span>PDF</span></button>
  <button class="enviar" id="peEnviar" disabled>Enviar</button>

<div class="cx-bg" id="cxPdf" hidden>
  <div class="cx" role="dialog" aria-modal="true" aria-labelledby="cxTit">
    <span class="cx-ico">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 6 9 17l-5-5"/></svg></span>
    <h3 id="cxTit">Pedido enviado</h3>
    <p id="cxTxt">Quer guardar uma cópia em PDF?</p>
    <div class="cx-pe">
      <button class="cx-nao" id="cxNao">Agora não</button>
      <button class="cx-sim" id="cxSim">Salvar PDF</button>
    </div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   Página do cliente: só leitura da seleção que o vendedor montou, mais o
   que ele quer de volta. Não tem login e não conhece a base — tudo o que
   aparece aqui veio dentro do link.
   ═══════════════════════════════════════════════════════════════════════ */
const WORKER_URL = 'https://repasse-worker-cms.marcosrep-cms.workers.dev';
const IMG = '../Catalogo/';
const $ = id => document.getElementById(id);
const esc = t => String(t == null ? '' : t).replace(/[&<>"']/g,
  c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const nf = n => Number(n || 0).toLocaleString('pt-BR');
const brl = v => 'R$ ' + Number(v || 0).toFixed(2).replace('.', ',');
const norm = v => String(v == null ? '' : v).normalize('NFD')
  .replace(/[̀-ͯ]/g, '').trim().toUpperCase();
const corArquivo = c => norm(c).replace(/[\/\-]+/g, '_').replace(/_+/g, '_')
  .replace(/^_|_$/g, '');
const foto = p => IMG + (p.imagem || (p.artigo + '_' + corArquivo(p.cor))) + '.jpg';

const CODIGO = new URLSearchParams(location.search).get('link') || '';
const MARCAS = { oly:'Olympikus', ua:'Under Armour' };
const ESCOLHA = new Map();   // no carrinho: artigo|cor -> { pares }
const RASCUNHO = new Map();  // digitado mas ainda não confirmado
let LINK = null;

const chave = p => p.artigo + '|' + p.cor;

/* O link traz tudo em `produtos`, separado pelo campo `tira`:
     sem tira  → o que o vendedor escolheu para este cliente
     'ja'      → ele já comprou e ainda está disponível
     'extra'   → meias e mochilas para fechar o pedido
   Vem assim porque quem monta é o vendedor, na vitrine: esta página é
   pública e não pode ler a carteira da casa para descobrir o histórico. */
const SELECAO = () => (LINK.produtos || []).filter(p => !p.tira);
const DA_TIRA = t => (LINK.produtos || []).filter(p => p.tira === t);
const achar = k => (LINK.produtos || []).find(p => chave(p) === k);

function mostrarErro(titulo, texto){
  $('carregando').hidden = true;
  $('erroTit').textContent = titulo;
  $('erroTxt').textContent = texto;
  $('erro').hidden = false;
}

// O cliente vê produto, preço e nada mais: de onde a peça sai — estoque, lote
// de repasse ou mês de produção — é decisão do vendedor depois da resposta, e
// mostrar isso aqui só levantaria pergunta que ele não tem como responder.
function cardHtml(p){
  const k = chave(p);
  const noCarrinho = ESCOLHA.has(k);
  const pares = noCarrinho ? (ESCOLHA.get(k).pares || '') : (RASCUNHO.get(k) || '');
  const cor = String(p.cor || '').replace(/_/g, '/');
  const podeAdicionar = Number(pares) > 0;

  return `<article class="card${noCarrinho ? ' quero' : ''}" data-k="${esc(k)}">
    <div class="foto"><img src="${esc(foto(p))}" alt="${esc(p.descricao || '')}"
      loading="lazy" onerror="this.style.visibility='hidden'"></div>
    <div class="corpo">
      <span class="nm">${esc(p.descricao || p.artigo)}</span>
      <span class="sb">${esc(p.artigo)} · ${esc(cor)}</span>
      <span class="pdv">${p.pdv ? brl(p.pdv) : ''}</span>
      ${p.jaComprou ? '<span class="ja">você já comprou este</span>' : ''}
      <div class="quero-bar">
        <label class="qtd"><input type="number" inputmode="numeric" min="0"
          placeholder="0" value="${pares}" data-pares="${esc(k)}"
          aria-label="Quantos pares de ${esc(p.descricao || p.artigo)}">
          <em>pares</em></label>
        <button class="btn-quero" data-quero="${esc(k)}"
          ${podeAdicionar || noCarrinho ? '' : 'disabled'}>
          ${noCarrinho ? `<svg width="14" height="14" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2.4" stroke-linecap="round"
              stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>No carrinho`
            : 'Adicionar no carrinho'}</button>
      </div>
    </div>
  </article>`;
}

/* A miniatura repete a regra do card: digitar destrava o botão, o toque é
   que põe no carrinho. Mudar isso aqui faria a mesma tela ter duas regras. */
function miniHtml(p){
  const k = chave(p);
  const noCarrinho = ESCOLHA.has(k);
  const pares = noCarrinho ? (ESCOLHA.get(k).pares || '') : (RASCUNHO.get(k) || '');
  const cor = String(p.cor || '').replace(/_/g, '/');
  const nome = p.descricao || p.artigo;
  return `<div class="mini${noCarrinho ? ' quero' : ''}" data-k="${esc(k)}">
    <span class="f"><img src="${esc(foto(p))}" alt="" loading="lazy"
      data-zoom="${esc(k)}" onerror="this.style.visibility='hidden'"></span>
    <span class="c">
      <span class="n">${esc(nome)}</span>
      <span class="l"><span class="co">${esc(cor)}</span>
        ${p.pdv ? `<span class="p">${esc(brl(p.pdv))}</span>` : ''}</span>
      <span class="add-lin">
        <input type="number" inputmode="numeric" min="0" placeholder="0"
          value="${esc(pares)}" data-pares="${esc(k)}"
          aria-label="Quantos pares de ${esc(nome)}">
        <button data-quero="${esc(k)}"${
          Number(pares) > 0 || noCarrinho ? '' : ' disabled'}>${
          noCarrinho ? 'no carrinho' : '+ pedir'}</button>
      </span>
    </span>
  </div>`;
}

function pintarTira(id, titulo, diz, itens){
  const el = $(id);
  el.hidden = !itens.length;
  if(el.hidden) return;
  el.innerHTML = `<div class="tira-cab"><h2>${esc(titulo)}</h2>` +
    `<span>${esc(diz)}</span></div>` +
    `<div class="rolo">${itens.map(miniHtml).join('')}</div>`;
}

function pintar(){
  $('grade').innerHTML = SELECAO().map(cardHtml).join('');
  const extras = DA_TIRA('extra'), ja = DA_TIRA('ja');
  pintarTira('tiraExtras', 'Para completar o pedido',
             'meias e acessórios disponíveis', extras);
  pintarTira('tiraJa', 'Você já comprou',
             `${ja.length} disponíve${ja.length === 1 ? 'l' : 'is'} agora`, ja);
  folgaDoRodape();
  if(!$('zoom').hidden) pintarZoom();
  pintarRodape();
}

/* O rodapé é fixo e cobre o fim da página. A folga vai no último bloco que
   sobrou — e vale a altura medida, porque no celular ele quebra em duas
   linhas e cresce. */
function folgaDoRodape(){
  const blocos = [$('grade'), $('tiraExtras'), $('tiraJa')];
  for(const b of blocos) b.style.paddingBottom = '';
  const visiveis = blocos.filter(b => b && !b.hidden);
  if(!visiveis.length) return;
  const pe = $('pe');
  const alt = (pe && !pe.hidden) ? pe.getBoundingClientRect().height : 0;
  visiveis[visiveis.length - 1].style.paddingBottom = Math.round(alt + 28) + 'px';
}
// o rodapé muda de altura quando entra o botão de PDF ou a tela gira
addEventListener('resize', folgaDoRodape);

function pintarRodape(){
  const n = ESCOLHA.size;
  const pares = [...ESCOLHA.values()].reduce((a, e) => a + (Number(e.pares) || 0), 0);
  $('peCont').innerHTML = n
    ? `<b>${nf(n)}</b> ${n === 1 ? 'produto' : 'produtos'} no carrinho` +
      (pares ? ` · <b>${nf(pares)}</b> pares` : '')
    : 'Coloque a quantidade do que interessa';
  $('peEnviar').disabled = !n;
  folgaDoRodape();
}

/* ── foto ampliada ──────────────────────────────────────────────
   As setas andam dentro da própria fila: quem abriu uma meia continua entre
   meias, quem abriu o histórico continua no histórico. */
const ZOOM = { fila: [], i: 0 };

function filaDe(k){
  const p = achar(k);
  if(!p) return [];
  return p.tira ? DA_TIRA(p.tira) : SELECAO();
}

function abrirZoom(k){
  ZOOM.fila = filaDe(k);
  ZOOM.i = Math.max(0, ZOOM.fila.findIndex(x => chave(x) === k));
  $('zoom').hidden = false;
  document.body.style.overflow = 'hidden';
  pintarZoom();
}
function fecharZoom(){
  $('zoom').hidden = true;
  document.body.style.overflow = '';
}
function andarZoom(d){
  if(!ZOOM.fila.length) return;
  ZOOM.i = (ZOOM.i + d + ZOOM.fila.length) % ZOOM.fila.length;
  pintarZoom();
}
function pintarZoom(){
  const p = ZOOM.fila[ZOOM.i];
  if(!p) return fecharZoom();
  const k = chave(p);
  const img = $('zImg');
  img.style.visibility = '';
  img.src = foto(p);
  img.alt = p.descricao || p.artigo;
  img.onerror = () => { img.style.visibility = 'hidden'; };
  $('zNome').textContent = p.descricao || p.artigo;
  $('zSub').textContent = `${p.artigo} · ${String(p.cor || '').replace(/_/g, '/')}`;
  $('zPdv').textContent = p.pdv ? brl(p.pdv) : '';
  $('zConta').textContent = ZOOM.fila.length > 1 ? `${ZOOM.i + 1} de ${ZOOM.fila.length}` : '';
  const um = ZOOM.fila.length < 2;
  $('zAnt').hidden = um;
  $('zPro').hidden = um;
  // quem ampliou para decidir tem de poder pedir sem fechar a janela
  const noCarrinho = ESCOLHA.has(k);
  const pares = noCarrinho ? (ESCOLHA.get(k).pares || '') : (RASCUNHO.get(k) || '');
  $('zAdd').innerHTML = `
    <input type="number" inputmode="numeric" min="0" placeholder="0"
      value="${esc(pares)}" data-pares="${esc(k)}" aria-label="Quantos pares">
    <button data-quero="${esc(k)}"${Number(pares) > 0 || noCarrinho ? '' : ' disabled'}>${
      noCarrinho ? 'No carrinho' : 'Adicionar no carrinho'}</button>
    <span class="un">pares</span>`;
}

// O card inteiro não é botão: o cliente precisa poder rolar e ler sem colocar
// nada no carrinho por engano.
document.addEventListener('click', e => {
  const img = e.target.closest('img[data-zoom]');
  if(img){ e.preventDefault(); return abrirZoom(img.dataset.zoom); }
  const z = $('zoom');
  if(z.hidden) return;
  if(e.target.closest('#zAnt')) return andarZoom(-1);
  if(e.target.closest('#zPro')) return andarZoom(1);
  if(e.target.closest('[data-quero]')) return;        // o botão tem dono
  if(e.target.closest('#zFecha') || !e.target.closest('.z-caixa')) fecharZoom();
});
addEventListener('keydown', e => {
  if($('zoom').hidden) return;
  if(e.key === 'Escape') fecharZoom();
  if(e.key === 'ArrowLeft') andarZoom(-1);
  if(e.key === 'ArrowRight') andarZoom(1);
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-quero]');
  if(!b || b.disabled) return;
  const k = b.dataset.quero;
  if(ESCOLHA.has(k)){
    // Sai do carrinho, mas o número digitado fica: tirar por engano não pode
    // custar a digitação de novo.
    RASCUNHO.set(k, ESCOLHA.get(k).pares);
    ESCOLHA.delete(k);
  }else{
    ESCOLHA.set(k, { pares: RASCUNHO.get(k) || '' });
  }
  pintar();
});
// Digitar não põe no carrinho — só destrava o botão. Quem decide é o toque.
document.addEventListener('input', e => {
  const i = e.target.closest('[data-pares]');
  if(!i) return;
  const k = i.dataset.pares;
  const n = Number(i.value) || 0;
  RASCUNHO.set(k, i.value);
  if(ESCOLHA.has(k)){
    if(n > 0) ESCOLHA.get(k).pares = i.value;
    else ESCOLHA.delete(k);      // zerou: sai do carrinho
  }
  // o mesmo produto pode estar no card, na tira e na janela ao mesmo tempo
  for(const el of document.querySelectorAll(`[data-k="${CSS.escape(k)}"]`)){
    el.classList.toggle('quero', ESCOLHA.has(k));
  }
  for(const btn of document.querySelectorAll(`[data-quero="${CSS.escape(k)}"]`)){
    btn.disabled = !(n > 0) && !ESCOLHA.has(k);
    if(!ESCOLHA.has(k)){
      btn.textContent = btn.closest('.mini') ? '+ pedir'
        : btn.closest('#zAdd') ? 'Adicionar no carrinho' : 'Adicionar no carrinho';
    }
  }
  for(const campo of document.querySelectorAll(`[data-pares="${CSS.escape(k)}"]`)){
    if(campo !== i) campo.value = i.value;
  }
  pintarRodape();
});

// Enviado não fecha a página: a seleção fica de pé até o link expirar, para o
// cliente conferir o que pediu e mudar de ideia enquanto o prazo corre.
let ENVIADO_EM = null;

function marcarEnviado(quando){
  ENVIADO_EM = quando;
  const d = new Date(quando);
  const p2 = n => String(n).padStart(2, '0');
  $('iEnviado').className = 'enviado';
  $('iEnviado').innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none"
      stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 6 9 17l-5-5"/></svg>
    Enviado em ${p2(d.getDate())}/${p2(d.getMonth() + 1)}/${d.getFullYear()} às
    ${p2(d.getHours())}:${p2(d.getMinutes())} — dá para ajustar e enviar de novo.`;
  $('iEnviado').hidden = false;
  $('pePdf').hidden = false;
  $('peEnviar').textContent = 'Enviar de novo';
  pintarRodape();
}

$('peEnviar').onclick = async () => {
  const btn = $('peEnviar');
  const antes = btn.textContent;
  btn.disabled = true; btn.textContent = 'Enviando…';
  const itens = LINK.produtos
    .filter(p => ESCOLHA.has(chave(p)))
    .map(p => ({
      artigo:p.artigo, cor:p.cor, descricao:p.descricao,
      pares: Number(ESCOLHA.get(chave(p)).pares) || 0,
      origens: p.origens || []
    }));
  try{
    const r = await fetch(WORKER_URL, { method:'PATCH',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ action:'salvarResposta', codigo:CODIGO,
                             data:{ resposta:{ itens } } }) });
    const j = await r.json();
    if(!j || !j.success){
      if(j && j.erro === 'expirado')
        return mostrarErro('Link expirado', 'Peça um novo ao seu representante.');
      throw new Error((j && j.erro) || 'falhou');
    }
    marcarEnviado(Date.now());
    $('cxTxt').innerHTML = `<b>${nf(itens.length)}</b> ` +
      `${itens.length === 1 ? 'produto' : 'produtos'} · ` +
      `<b>${nf(itens.reduce((a, i) => a + i.pares, 0))}</b> pares.<br>` +
      'Quer guardar uma cópia em PDF?';
    $('cxPdf').hidden = false;
  }catch(_){
    alert('Não deu para enviar agora. Tente de novo em alguns instantes.');
  }finally{
    btn.disabled = false;
    if(btn.textContent === 'Enviando…') btn.textContent = antes;
  }
};

$('cxNao').onclick = () => { $('cxPdf').hidden = true; };
$('cxSim').onclick = async () => {
  const b = $('cxSim');
  b.disabled = true; b.textContent = 'Gerando…';
  await gerarPdf();
  b.disabled = false; b.textContent = 'Salvar PDF';
  $('cxPdf').hidden = true;
};
$('pePdf').onclick = async () => {
  const b = $('pePdf');
  b.disabled = true;
  await gerarPdf();
  b.disabled = false;
};
$('cxPdf').onclick = e => { if(e.target.id === 'cxPdf') $('cxPdf').hidden = true; };

// ── comprovante em PDF ─────────────────────────────────────────────────
// O mesmo que está na tela, com a hora do envio: é o comprovante do cliente,
// não um catálogo. Sem preço total, porque a negociação ainda vai acontecer.
async function gerarPdf(){
  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit:'pt', format:'a4', orientation:'portrait', compress:true });
    const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
    const M = 34, L = W - M * 2;
    const marca = LINK.marca === 'ua' ? [229,33,37] : [44,57,226];
    const C = { marca, texto:[22,24,26], fraco:[109,115,122], linha:[226,228,224],
                papel:[233,235,231], branco:[255,255,255] };
    const cor = c => doc.setTextColor(c[0], c[1], c[2]);
    const fill = c => doc.setFillColor(c[0], c[1], c[2]);
    const traco = c => doc.setDrawColor(c[0], c[1], c[2]);
    const p2 = n => String(n).padStart(2, '0');
    const d = new Date(ENVIADO_EM || Date.now());
    const quando = `${p2(d.getDate())}/${p2(d.getMonth() + 1)}/${d.getFullYear()} ` +
                   `${p2(d.getHours())}:${p2(d.getMinutes())}`;
    const corta = (t, n) => { t = String(t == null ? '' : t);
      return t.length > n ? t.slice(0, n - 1) + '…' : t; };
    // Cortar por numero de letras invadia a coluna vizinha: razao social longa
    // escrevia por cima de "REPRESENTANTE". Aqui o corte e pela largura real.
    const cabeEm = (t, larg) => {
      t = String(t == null ? '' : t);
      if(doc.getTextWidth(t) <= larg) return t;
      while(t.length > 1 && doc.getTextWidth(t + '…') > larg) t = t.slice(0, -1);
      return t + '…';
    };

    const escolhidos = LINK.produtos.filter(p => ESCOLHA.has(chave(p)));
    let pag = 0, y = 0;

    function cabecalho(){
      pag++;
      fill(C.marca); doc.rect(0, 0, W, 4, 'F');
      let t = 34;
      fill(C.marca); doc.roundedRect(M, t, 42, 42, 8, 8, 'F');
      cor(C.branco); doc.setFont('helvetica', 'bold'); doc.setFontSize(13);
      doc.text('CMS', M + 21, t + 26, { align:'center' });
      cor(C.texto); doc.setFont('helvetica', 'bold'); doc.setFontSize(14);
      doc.text('CMS - Representações', M + 52, t + 15);
      cor(C.fraco); doc.setFont('helvetica', 'normal'); doc.setFontSize(9);
      doc.text(MARCAS[LINK.marca] || '', M + 52, t + 29);
      cor(C.texto); doc.setFont('helvetica', 'bold'); doc.setFontSize(12);
      doc.text('SEU PEDIDO', W - M, t + 15, { align:'right' });
      cor(C.fraco); doc.setFont('helvetica', 'normal'); doc.setFontSize(9);
      doc.text(`Enviado em ${quando}`, W - M, t + 29, { align:'right' });
      return t + 62;
    }

    function dados(yi){
      const h = 46;
      fill(C.papel); doc.roundedRect(M, yi, L, h, 7, 7, 'F');
      // O cliente leva codigo e nome, e por isso ocupa metade: razao social
      // nao cabe num terco sem virar reticencias.
      const campos = [
        ['CLIENTE', `${LINK.cliente}${LINK.clienteNome ? ' · ' + LINK.clienteNome : ''}`, .5],
        ['REPRESENTANTE', LINK.vendedorNome || 'CMS', .25],
        ['PRODUTOS', `${nf(escolhidos.length)} · ${nf(escolhidos.reduce((a, p) =>
          a + (Number(ESCOLHA.get(chave(p)).pares) || 0), 0))} pares`, .25]
      ];
      let cx = M;
      for(const [rot, val, frac] of campos){
        const colW = L * frac;
        cor(C.fraco); doc.setFont('helvetica', 'bold'); doc.setFontSize(6.5);
        doc.text(rot, cx + 12, yi + 17);
        cor(C.texto); doc.setFont('helvetica', 'bold'); doc.setFontSize(9.5);
        doc.text(cabeEm(val, colW - 22), cx + 12, yi + 31);
        cx += colW;
      }
      return yi + h + 16;
    }

    async function linha(p, yi){
      const alt = 62;
      traco(C.linha); doc.setLineWidth(.5); doc.line(M, yi, M + L, yi);
      const img = 48, ix = M, iy = yi + 7;
      fill(C.branco); doc.roundedRect(ix, iy, img, img, 5, 5, 'F');
      traco(C.linha); doc.roundedRect(ix, iy, img, img, 5, 5, 'S');
      const dataUrl = await comoDataUrl(foto(p));
      if(dataUrl) doc.addImage(dataUrl, 'JPEG', ix + 2, iy + 2, img - 4, img - 4, undefined, 'FAST');

      const tx = ix + img + 12;
      cor(C.texto); doc.setFont('helvetica', 'bold'); doc.setFontSize(10.5);
      doc.text(corta(p.descricao || p.artigo, 44), tx, yi + 22);
      cor(C.fraco); doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5);
      doc.text(`${p.artigo} · ${String(p.cor || '').replace(/_/g, '/')}`, tx, yi + 35);
      if(p.pdv){
        cor(C.marca); doc.setFont('helvetica', 'bold'); doc.setFontSize(10);
        doc.text(brl(p.pdv), tx, yi + 49);
      }
      const pares = Number(ESCOLHA.get(chave(p)).pares) || 0;
      cor(C.fraco); doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5);
      doc.text('QUANTIDADE', M + L, yi + 24, { align:'right' });
      cor(C.texto); doc.setFont('helvetica', 'bold'); doc.setFontSize(15);
      doc.text(`${nf(pares)} pares`, M + L, yi + 43, { align:'right' });
      return yi + alt;
    }

    function rodape(){
      traco(C.linha); doc.setLineWidth(.5); doc.line(M, H - 34, W - M, H - 34);
      cor(C.fraco); doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5);
      doc.text('Isto é o que você selecionou, não um pedido fechado. ' +
        'Seu representante confirma disponibilidade, grade e prazo.', M, H - 21);
      doc.text('pág. ' + pag, W - M, H - 21, { align:'right' });
    }

    y = cabecalho();
    y = dados(y);
    cor(C.fraco); doc.setFont('helvetica', 'bold'); doc.setFontSize(7);
    doc.text('PRODUTOS SELECIONADOS', M, y);
    y += 8;
    for(const p of escolhidos){
      if(y + 62 > H - 56){ rodape(); doc.addPage(); y = cabecalho(); }
      y = await linha(p, y);
    }
    rodape();

    const nome = (LINK.clienteNome || LINK.cliente || 'cliente')
      .normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 30);
    doc.save(`selecao_${nome}_${d.getFullYear()}${p2(d.getMonth() + 1)}${p2(d.getDate())}` +
      `_${p2(d.getHours())}${p2(d.getMinutes())}.pdf`);
  }catch(e){
    console.error(e);
    alert('Não deu para gerar o PDF agora. Tente de novo.');
  }
}

// Mesma origem, então o canvas não fica manchado e o PDF consegue ler de volta.
function comoDataUrl(src){
  return new Promise(resolve => {
    let pronto = false;
    const fim = v => { if(!pronto){ pronto = true; clearTimeout(t); resolve(v); } };
    const t = setTimeout(() => fim(null), 6000);
    try{
      const img = new Image();
      img.onload = () => {
        try{
          const c = document.createElement('canvas');
          c.width = img.naturalWidth; c.height = img.naturalHeight;
          const ctx = c.getContext('2d');
          ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
          ctx.drawImage(img, 0, 0);
          fim(c.toDataURL('image/jpeg', 0.82));
        }catch(_){ fim(null); }
      };
      img.onerror = () => fim(null);
      img.src = src;
    }catch(_){ fim(null); }
  });
}

(async function abrir(){
  if(!CODIGO) return mostrarErro('Link inválido', 'O endereço está incompleto.');
  try{
    const r = await fetch(WORKER_URL, { method:'PATCH',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ action:'getLink', codigo:CODIGO }) });
    const j = await r.json();
    if(!j || !j.success)
      return mostrarErro('Link não encontrado', 'Confira o endereço ou peça um novo.');
    if(j.expirado)
      return mostrarErro('Link expirado', 'Peça um novo ao seu representante — ' +
        'as disponibilidades mudam todo dia.');
    LINK = j.link;
    if(!Array.isArray(LINK.produtos) || !LINK.produtos.length)
      return mostrarErro('Seleção vazia', 'Este link não tem produto nenhum.');

    document.body.dataset.marca = LINK.marca === 'ua' ? 'ua' : 'oly';
    $('tMarca').textContent = MARCAS[LINK.marca] || '';
    // Já respondeu antes: volta com o que marcou, para poder ajustar, reemitir
    // o comprovante ou mandar de novo.
    if(LINK.resposta && Array.isArray(LINK.resposta.itens)){
      for(const it of LINK.resposta.itens)
        ESCOLHA.set(it.artigo + '|' + it.cor, { pares:it.pares || '' });
    }
    $('carregando').hidden = true;
    $('topo').hidden = false;
    $('conteudo').hidden = false;
    $('pe').hidden = false;
    pintar();
    if(LINK.respondidoEm) marcarEnviado(LINK.respondidoEm);
  }catch(e){
    mostrarErro('Não deu para abrir', 'Verifique a conexão e tente de novo.');
  }
})();
</script>
