<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#2c39e2">
<meta property="og:type" content="website">
<meta property="og:title" content="Seleção CMS Representações">
<meta property="og:description" content="Produtos separados para você">
<title>Seleção · CMS Representações</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --barra:#F1F2EF; --papel:#E9EBE7; --carta:#FFFFFF;
  --tinta:#16181A; --texto:#3A3F45; --fraco:#6D737A; --tenue:#9AA0A6;
  --linha:#E2E4E0; --linha-forte:#CDD0CA;
  --pronta:#0E6B47;  --pronta-fundo:#DEEFE7;
  --repasse:#2C39E2; --repasse-fundo:#E6E8FC;
  --plano:#7A2FBF;   --plano-fundo:#F1E7FB;
  --marca:#2c39e2; --marca-claro:#5B69E8; --marca-escuro:#1B27B0;
}
body[data-marca="ua"]{ --marca:#e52125; --marca-claro:#F2494C; --marca-escuro:#A81215; }
*,*::before,*::after{ box-sizing:border-box }
html,body{ margin:0; padding:0 }
body{
  background:var(--papel); color:var(--texto);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
.mono,.cel,.q{ font-variant-numeric:tabular-nums }
button{ font:inherit }

/* ── cabeçalho ── */
.topo{
  position:sticky; top:0; z-index:20; background:var(--barra);
  border-bottom:1px solid var(--linha-forte);
  padding:calc(11px + env(safe-area-inset-top)) 14px 11px;
  display:flex; align-items:center; gap:11px;
}
.selo{
  width:36px; height:36px; border-radius:10px; flex:none;
  display:flex; align-items:center; justify-content:center;
  font-size:10px; font-weight:800; color:#fff; letter-spacing:.02em;
  background:linear-gradient(145deg,#a970ff 0%,#8b5cf6 48%,#7439e0 100%);
  box-shadow:0 4px 12px rgba(124,58,237,.35), inset 0 1px 0 rgba(255,255,255,.3);
}
.tit{ flex:1; min-width:0 }
.tit b{ display:block; font-size:14.5px; font-weight:800; color:var(--tinta);
  letter-spacing:-.015em; line-height:1.2 }
.tit span{ display:block; font-size:11px; font-weight:600; color:var(--fraco) }
.prazo{ flex:none; border-radius:999px; padding:4px 10px; font-size:10.5px;
  font-weight:800; background:var(--carta); border:1px solid var(--linha-forte);
  color:var(--fraco); white-space:nowrap }
.prazo.perto{ border-color:#E0A106; background:rgba(251,191,36,.16); color:#A45B06 }

/* ── faixa de abertura ── */
.intro{ max-width:960px; margin:0 auto; padding:14px 14px 0 }
.intro h1{ margin:0 0 3px; font-size:17px; font-weight:800; letter-spacing:-.02em;
  color:var(--tinta) }
.intro p{ margin:0; font-size:12.5px; color:var(--fraco) }

/* ── grade ── */
.grade{ max-width:960px; margin:0 auto; padding:12px 14px 120px;
  display:grid; grid-template-columns:1fr; gap:10px }
@media(min-width:700px){ .grade{ grid-template-columns:1fr 1fr; gap:12px } }
@media(min-width:1000px){ .grade{ grid-template-columns:1fr 1fr 1fr } }
/* Numa coluna so, a foto quadrada tomava meia tela e empurrava o produto
   seguinte para fora. O card tem que caber quase inteiro de uma vez. */
@media(max-width:699px){ .foto{ aspect-ratio:auto; height:190px } }

.card{ background:var(--carta); border:1px solid var(--linha); border-radius:14px;
  overflow:hidden; display:flex; flex-direction:column }
.card.quero{ border-color:var(--marca);
  box-shadow:0 0 0 2px color-mix(in srgb,var(--marca) 18%,transparent) }
.foto{ position:relative; background:var(--carta); aspect-ratio:1/1;
  display:flex; align-items:center; justify-content:center; overflow:hidden }
.foto img{ width:100%; height:100%; object-fit:contain }
.corpo{ padding:10px 12px 12px; border-top:1px solid var(--linha); flex:1;
  display:flex; flex-direction:column }
.nm{ font-size:13px; font-weight:800; color:var(--tinta); line-height:1.25 }
.sb{ font-size:10.5px; font-weight:600; color:var(--tenue); margin-top:1px }
.pdv{ margin-top:6px; font-size:15px; font-weight:800; color:var(--marca) }

.origem{ margin-top:9px; border-top:1px dashed var(--linha); padding-top:8px }
.origem:first-of-type{ border-top:0; padding-top:0 }
.rot{ display:inline-flex; align-items:center; gap:5px; margin:0 0 5px;
  font-size:10px; font-weight:800; letter-spacing:.04em; text-transform:uppercase }
.rot.est{ color:var(--pronta) } .rot.rep{ color:var(--repasse) } .rot.pro{ color:var(--plano) }
.celulas{ display:flex; flex-wrap:wrap; gap:5px }
.cel{ border:1px solid var(--linha); border-radius:6px; padding:4px 0; width:40px;
  text-align:center; background:var(--carta) }
.cel .t{ display:block; font-size:9.5px; font-weight:700; color:var(--fraco); line-height:1 }
.cel .q{ display:block; font-size:13px; font-weight:800; color:var(--tinta);
  margin-top:2px; line-height:1 }
.celulas.est .cel{ border-color:color-mix(in srgb,var(--pronta) 34%,transparent);
  background:color-mix(in srgb,var(--pronta) 7%,var(--carta)) }
.celulas.est .cel .t,.celulas.est .cel .q{ color:var(--pronta) }
.celulas.rep .cel{ border-color:color-mix(in srgb,var(--repasse) 34%,transparent);
  background:color-mix(in srgb,var(--repasse) 7%,var(--carta)) }
.celulas.rep .cel .t,.celulas.rep .cel .q{ color:var(--repasse) }
.lote{ border:1px solid var(--linha); border-radius:9px; padding:7px 9px; margin-bottom:6px }
.lote:last-child{ margin-bottom:0 }
.lote-l1{ display:flex; align-items:baseline; justify-content:space-between; gap:8px }
.lote .n{ font-size:10.5px; font-weight:700; color:var(--repasse) }
.lote .s{ font-size:11.5px; font-weight:700; color:var(--tinta) }
.lote .d{ font-size:10px; color:var(--fraco); margin-top:1px }
.lote .celulas{ margin-top:6px }
.meses{ display:flex; flex-wrap:wrap; gap:5px }
.mes{ border:1px solid color-mix(in srgb,var(--plano) 30%,transparent);
  background:color-mix(in srgb,var(--plano) 7%,var(--carta));
  border-radius:999px; padding:3px 9px; font-size:10.5px; font-weight:700;
  color:var(--plano) }
.mes b{ font-weight:800 }

.quero-bar{ margin-top:auto; padding-top:10px; display:flex; align-items:center; gap:8px }
.btn-quero{ flex:1; border:1px solid var(--linha-forte); background:var(--carta);
  color:var(--texto); border-radius:9px; padding:8px; font-size:12px; font-weight:800;
  cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px }
.btn-quero:hover{ border-color:var(--marca); color:var(--marca) }
.card.quero .btn-quero{ border-color:transparent; color:#fff;
  background:linear-gradient(145deg,var(--marca-claro),var(--marca) 55%,var(--marca-escuro)) }
.qtd{ width:74px; flex:none }
.qtd input{ width:100%; border:1px solid var(--linha); border-radius:9px; padding:8px 6px;
  text-align:center; font:inherit; font-size:12.5px; font-weight:800; color:var(--tinta);
  background:var(--carta); -moz-appearance:textfield }
.qtd input::-webkit-outer-spin-button,.qtd input::-webkit-inner-spin-button{
  -webkit-appearance:none; margin:0 }
.qtd input:focus{ outline:2px solid var(--marca); outline-offset:-1px }
.qtd em{ display:block; font-size:9px; font-style:normal; color:var(--tenue);
  text-align:center; margin-top:2px }

/* ── rodapé ── */
.pe{ position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--barra);
  border-top:1px solid var(--linha-forte);
  padding:11px 14px calc(11px + env(safe-area-inset-bottom));
  display:flex; align-items:center; gap:11px }
.pe .cont{ flex:1; font-size:12px; font-weight:700; color:var(--fraco) }
.pe .cont b{ color:var(--tinta) }
.enviar{ flex:none; border:0; border-radius:999px; padding:11px 20px; color:#fff;
  font-size:13px; font-weight:800; cursor:pointer;
  background:linear-gradient(145deg,var(--marca-claro),var(--marca) 55%,var(--marca-escuro));
  box-shadow:0 4px 14px color-mix(in srgb,var(--marca) 34%,transparent),
             inset 0 1px 0 rgba(255,255,255,.26) }
.enviar:disabled{ opacity:.45; cursor:not-allowed; box-shadow:none }

/* ── estados ── */
.estado{ max-width:520px; margin:70px auto; padding:28px 22px; text-align:center;
  background:var(--carta); border:1px solid var(--linha); border-radius:16px }
.estado h2{ margin:0 0 7px; font-size:19px; font-weight:800; color:var(--tinta) }
.estado p{ margin:0; font-size:13.5px; color:var(--fraco); line-height:1.55 }
.estado .ico{ width:52px; height:52px; border-radius:50%; margin:0 auto 14px;
  display:flex; align-items:center; justify-content:center;
  background:var(--papel); color:var(--fraco) }
.girando{ width:26px; height:26px; border:3px solid var(--linha);
  border-top-color:var(--marca); border-radius:50%; margin:0 auto 14px;
  animation:gira .8s linear infinite }
@keyframes gira{ to{ transform:rotate(360deg) } }
[hidden]{ display:none !important }
@media (prefers-reduced-motion:reduce){ *{ animation:none !important; transition:none !important } }
</style>
</head>
<body>

<header class="topo" id="topo" hidden>
  <span class="selo">CMS</span>
  <span class="tit"><b id="tMarca">—</b><span id="tVend">—</span></span>
  <span class="prazo" id="tPrazo" hidden>—</span>
</header>

<div id="carregando" class="estado">
  <div class="girando"></div>
  <h2>Abrindo a seleção</h2>
  <p>Um instante.</p>
</div>

<div id="erro" class="estado" hidden>
  <span class="ico">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
  </span>
  <h2 id="erroTit">Link não encontrado</h2>
  <p id="erroTxt">Peça um novo ao seu representante.</p>
</div>

<div id="conteudo" hidden>
  <div class="intro">
    <h1 id="iTit">Separamos alguns produtos para você</h1>
    <p id="iSub">—</p>
  </div>
  <main class="grade" id="grade"></main>
</div>

<footer class="pe" id="pe" hidden>
  <span class="cont" id="peCont">—</span>
  <button class="enviar" id="peEnviar" disabled>Enviar</button>
</footer>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   Página do cliente: só leitura da seleção que o vendedor montou, mais o
   que ele quer de volta. Não tem login e não conhece a base — tudo o que
   aparece aqui veio dentro do link.
   ═══════════════════════════════════════════════════════════════════════ */
const WORKER_URL = 'https://repasse-worker-cms.marcosrep-cms.workers.dev';
const IMG = '../Catalogo/';
const $ = id => document.getElementById(id);
const esc = t => String(t == null ? '' : t).replace(/[&<>"']/g,
  c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const nf = n => Number(n || 0).toLocaleString('pt-BR');
const brl = v => 'R$ ' + Number(v || 0).toFixed(2).replace('.', ',');
const norm = v => String(v == null ? '' : v).normalize('NFD')
  .replace(/[̀-ͯ]/g, '').trim().toUpperCase();
const corArquivo = c => norm(c).replace(/[\/\-]+/g, '_').replace(/_+/g, '_')
  .replace(/^_|_$/g, '');
const foto = p => IMG + (p.imagem || (p.artigo + '_' + corArquivo(p.cor))) + '.jpg';

const CODIGO = new URLSearchParams(location.search).get('link') || '';
const MARCAS = { oly:'Olympikus', ua:'Under Armour' };
const ESCOLHA = new Map();   // artigo|cor -> { pares }
let LINK = null;

const chave = p => p.artigo + '|' + p.cor;

function mostrarErro(titulo, texto){
  $('carregando').hidden = true;
  $('erroTit').textContent = titulo;
  $('erroTxt').textContent = texto;
  $('erro').hidden = false;
}

// Quanto falta, em palavra de gente: "expira hoje" alarma mais que "em 6h".
function textoPrazo(ms){
  const h = Math.floor(ms / 36e5);
  if(h < 1)  return 'expira em menos de 1 hora';
  if(h < 24) return `expira em ${h} ${h === 1 ? 'hora' : 'horas'}`;
  const d = Math.floor(h / 24);
  return `expira em ${d} ${d === 1 ? 'dia' : 'dias'}`;
}

function cardHtml(p){
  const k = chave(p);
  const marcado = ESCOLHA.has(k);
  const pares = marcado ? (ESCOLHA.get(k).pares || '') : '';
  const cor = String(p.cor || '').replace(/_/g, '/');

  let origens = '';
  if(p.estoque){
    const g = Object.entries(p.estoque.grade || {}).filter(([, q]) => Number(q) > 0);
    origens += `<div class="origem"><p class="rot est">Pronta entrega ·
      ${nf(p.estoque.total)} pares</p>
      ${g.length ? `<div class="celulas est">${g.map(([t, q]) =>
        `<span class="cel"><span class="t">${esc(t)}</span>
         <span class="q">${nf(q)}</span></span>`).join('')}</div>` : ''}</div>`;
  }
  if(p.repasse){
    origens += `<div class="origem"><p class="rot rep">Repasse ·
      ${nf(p.repasse.total)} pares</p>` +
      p.repasse.lotes.map(l => {
        const g = Object.entries(l.grade || {}).filter(([, q]) => Number(q) > 0);
        return `<div class="lote">
          <div class="lote-l1"><span class="n">Entrega ${esc(l.num)}</span>
            <span class="s">${nf(l.saldo)} pares</span></div>
          <div class="d">fat. ${esc(l.data || '—')}</div>
          ${g.length ? `<div class="celulas rep">${g.map(([t, q]) =>
            `<span class="cel"><span class="t">${esc(t)}</span>
             <span class="q">${nf(q)}</span></span>`).join('')}</div>` : ''}
        </div>`;
      }).join('') + '</div>';
  }
  if(p.producao){
    origens += `<div class="origem"><p class="rot pro">Produção</p>
      <div class="meses">${p.producao.quinzenas.map(q =>
        `<span class="mes">${esc(q.rot)} · <b>${nf(q.v)}</b></span>`).join('')}</div></div>`;
  }

  return `<article class="card${marcado ? ' quero' : ''}" data-k="${esc(k)}">
    <div class="foto"><img src="${esc(foto(p))}" alt="${esc(p.descricao || '')}"
      loading="lazy" onerror="this.style.visibility='hidden'"></div>
    <div class="corpo">
      <span class="nm">${esc(p.descricao || p.artigo)}</span>
      <span class="sb">${esc(p.artigo)} · ${esc(cor)}</span>
      <span class="pdv">${p.pdv ? brl(p.pdv) : ''}</span>
      ${origens}
      <div class="quero-bar">
        <button class="btn-quero" data-quero="${esc(k)}">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 6 9 17l-5-5"/></svg>
          ${marcado ? 'Quero' : 'Tenho interesse'}</button>
        <label class="qtd"><input type="number" inputmode="numeric" min="0"
          placeholder="0" value="${pares}" data-pares="${esc(k)}"
          aria-label="Quantos pares de ${esc(p.descricao || p.artigo)}">
          <em>pares</em></label>
      </div>
    </div>
  </article>`;
}

function pintar(){
  $('grade').innerHTML = LINK.produtos.map(cardHtml).join('');
  pintarRodape();
}

function pintarRodape(){
  const n = ESCOLHA.size;
  const pares = [...ESCOLHA.values()].reduce((a, e) => a + (Number(e.pares) || 0), 0);
  $('peCont').innerHTML = n
    ? `<b>${nf(n)}</b> ${n === 1 ? 'produto marcado' : 'produtos marcados'}` +
      (pares ? ` · <b>${nf(pares)}</b> pares` : '')
    : 'Marque o que interessa';
  $('peEnviar').disabled = !n;
}

// O card inteiro não é botão: o cliente precisa poder rolar e ler sem marcar
// nada por engano.
$('grade').addEventListener('click', e => {
  const b = e.target.closest('[data-quero]');
  if(!b) return;
  const k = b.dataset.quero;
  ESCOLHA.has(k) ? ESCOLHA.delete(k) : ESCOLHA.set(k, { pares:'' });
  pintar();
});
$('grade').addEventListener('input', e => {
  const i = e.target.closest('[data-pares]');
  if(!i) return;
  const k = i.dataset.pares;
  // Digitar a quantidade já marca: quem escreve "12" está dizendo que quer.
  if(!ESCOLHA.has(k)) ESCOLHA.set(k, { pares:'' });
  ESCOLHA.get(k).pares = i.value;
  const card = i.closest('.card');
  if(card) card.classList.add('quero');
  pintarRodape();
});

$('peEnviar').onclick = async () => {
  const btn = $('peEnviar');
  const antes = btn.textContent;
  btn.disabled = true; btn.textContent = 'Enviando…';
  const itens = LINK.produtos
    .filter(p => ESCOLHA.has(chave(p)))
    .map(p => ({
      artigo:p.artigo, cor:p.cor, descricao:p.descricao,
      pares: Number(ESCOLHA.get(chave(p)).pares) || 0,
      origens: p.origens || []
    }));
  try{
    const r = await fetch(WORKER_URL, { method:'PATCH',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ action:'salvarResposta', codigo:CODIGO,
                             data:{ resposta:{ itens } } }) });
    const j = await r.json();
    if(!j || !j.success){
      if(j && j.erro === 'expirado')
        return mostrarErro('Link expirado', 'Peça um novo ao seu representante.');
      throw new Error((j && j.erro) || 'falhou');
    }
    $('conteudo').hidden = true; $('pe').hidden = true;
    $('erro').hidden = false;
    $('erroTit').textContent = 'Recebemos!';
    $('erroTxt').textContent = `Seu representante já foi avisado dos ` +
      `${itens.length} ${itens.length === 1 ? 'produto' : 'produtos'} que você marcou.`;
  }catch(_){
    btn.disabled = false; btn.textContent = antes;
    alert('Não deu para enviar agora. Tente de novo em alguns instantes.');
  }
};

(async function abrir(){
  if(!CODIGO) return mostrarErro('Link inválido', 'O endereço está incompleto.');
  try{
    const r = await fetch(WORKER_URL, { method:'PATCH',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ action:'getLink', codigo:CODIGO }) });
    const j = await r.json();
    if(!j || !j.success)
      return mostrarErro('Link não encontrado', 'Confira o endereço ou peça um novo.');
    if(j.expirado)
      return mostrarErro('Link expirado', 'Peça um novo ao seu representante — ' +
        'as disponibilidades mudam todo dia.');
    LINK = j.link;
    if(!Array.isArray(LINK.produtos) || !LINK.produtos.length)
      return mostrarErro('Seleção vazia', 'Este link não tem produto nenhum.');

    document.body.dataset.marca = LINK.marca === 'ua' ? 'ua' : 'oly';
    $('tMarca').textContent = MARCAS[LINK.marca] || 'CMS Representações';
    $('tVend').textContent = LINK.vendedorNome
      ? `Seleção de ${LINK.vendedorNome}` : 'CMS Representações';
    const resta = Number(LINK.expiraEm || 0) - Date.now();
    if(resta > 0){
      $('tPrazo').textContent = textoPrazo(resta);
      $('tPrazo').hidden = false;
      $('tPrazo').classList.toggle('perto', resta < 24 * 36e5);
    }
    $('iSub').textContent = `${nf(LINK.produtos.length)} ` +
      `${LINK.produtos.length === 1 ? 'produto' : 'produtos'} · marque o que interessa ` +
      'e diga quantos pares.';
    // Já respondeu antes: volta com o que marcou, para poder ajustar.
    if(LINK.resposta && Array.isArray(LINK.resposta.itens)){
      for(const it of LINK.resposta.itens)
        ESCOLHA.set(it.artigo + '|' + it.cor, { pares:it.pares || '' });
    }
    $('carregando').hidden = true;
    $('topo').hidden = false;
    $('conteudo').hidden = false;
    $('pe').hidden = false;
    pintar();
  }catch(e){
    mostrarErro('Não deu para abrir', 'Verifique a conexão e tente de novo.');
  }
})();
</script>
</body>
</html>
