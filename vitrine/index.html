// A foto vem do mesmo domínio, então o canvas não fica manchado e o PDF
// consegue lê-la de volta.
function fotoDataUrl(o){
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      try{
        const c = document.createElement('canvas');
        c.width = img.naturalWidth; c.height = img.naturalHeight;
        c.getContext('2d').drawImage(img, 0, 0);
        resolve({ url:c.toDataURL('image/jpeg', 0.82), w:img.naturalWidth, h:img.naturalHeight });
      }catch(_){ resolve(null); }
    };
    img.onerror = () => resolve(null);
    img.src = foto(o);
  });
}

function ocupado(btn, texto){
  btn.disabled = true;
  btn._txt = btn.querySelector('span').textContent;
  btn.querySelector('span').textContent = texto;
}
function liberado(btn){
  btn.disabled = false;
  if(btn._txt) btn.querySelector('span').textContent = btn._txt;
}

async function gerarCatalogoPdf(){
  const itens = marcadosVisiveis();
  if(!itens.length) return;
  const btn = $('btnSelPdf');
  ocupado(btn, 'Gerando…');
  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation:'portrait', unit:'pt', format:'a4', compress:true });
    const pageW = doc.internal.pageSize.getWidth();
    const pageH = doc.internal.pageSize.getHeight();
    const hex = h => (String(h).replace('#','').match(/.{2}/g) || ['0','0','0'])
      .map(x => parseInt(x, 16));
    const M = MARCAS[MARCA];
    const C = { marca:hex(M.marca), texto:[15,23,42], fraco:[100,116,139],
                linha:[226,232,240], fundo:[248,250,252], branco:[255,255,255],
                est:hex('#0E6B47'), rep:hex(M.marca), pro:hex('#7A2FBF') };
    const cor = (c, t='text') => t === 'fill' ? doc.setFillColor(c[0],c[1],c[2])
      : t === 'draw' ? doc.setDrawColor(c[0],c[1],c[2]) : doc.setTextColor(c[0],c[1],c[2]);

    const d = new Date(), p2 = n => String(n).padStart(2,'0');
    const dataStr = `${p2(d.getDate())}/${p2(d.getMonth()+1)}/${d.getFullYear()}`;
    const margem = 32, larg = pageW - margem*2, alturaCab = 58;

    function cabecalho(){
      cor(C.marca,'fill'); doc.rect(0, 0, pageW, alturaCab, 'F');
      doc.setTextColor(255,255,255);
      doc.setFont('helvetica','bold'); doc.setFontSize(14);
      doc.text('Catálogo ' + M.nome, margem, 26);
      doc.setFont('helvetica','normal'); doc.setFontSize(8.5);
      doc.setTextColor(215, 220, 255);
      doc.text('CMS Representações', margem, 42);
      doc.setFontSize(9);
      doc.text(dataStr, pageW - margem, 26, { align:'right' });
    }
    function rodape(n){
      cor(C.linha,'draw'); doc.setLineWidth(0.4);
      doc.line(margem, pageH-28, pageW-margem, pageH-28);
      cor(C.fraco); doc.setFont('helvetica','normal'); doc.setFontSize(7);
      doc.text('CMS Representações · ' + M.nome, margem, pageH-16);
      doc.text('pág. ' + n, pageW-margem, pageH-16, { align:'right' });
    }

    // Quatro por página: mesmo com as três origens o conteúdo mede cerca de
    // 90pt, e em três sobrava metade do card vazio.
    const POR_PAG = 4, topo = alturaCab + 18, base = pageH - 40, vaoCard = 12;
    const altCard = (base - topo - vaoCard*(POR_PAG-1)) / POR_PAG;
    const FOTO = 88, PADX = 14, PADY = 12;

    // Uma faixa por origem, com o dado que só ela tem.
    // As mesmas caixinhas da tela: tamanho em cima, quantidade embaixo, na cor
    // da origem. Em texto corrido ("34:41 35:66") ninguem confere grade.
    const CEL_W = 26, CEL_H = 20, CEL_GAP = 3;
    function desenharGrade(g, x, y, w, c){
      const tam = Object.entries(g || {}).filter(([, q]) => Number(q) > 0);
      if(!tam.length) return y;
      const porLinha = Math.max(1, Math.floor((w + CEL_GAP) / (CEL_W + CEL_GAP)));
      const mostra = tam.slice(0, porLinha);
      let cx = x;
      for(const [t, q] of mostra){
        cor(c,'draw'); doc.setLineWidth(0.5);
        doc.setFillColor(255, 255, 255);
        doc.roundedRect(cx, y, CEL_W, CEL_H, 3, 3, 'FD');
        cor(c); doc.setFont('helvetica','bold'); doc.setFontSize(6);
        doc.text(String(t), cx + CEL_W/2, y + 7.5, { align:'center' });
        cor(C.texto); doc.setFont('helvetica','bold'); doc.setFontSize(8);
        doc.text(String(q), cx + CEL_W/2, y + 16, { align:'center' });
        cx += CEL_W + CEL_GAP;
      }
      // Se algum tamanho nao coube, o card precisa dizer — senao a grade
      // impressa parece completa e nao e.
      const sobra = tam.length - mostra.length;
      if(sobra){
        cor(C.fraco); doc.setFont('helvetica','bold'); doc.setFontSize(7);
        doc.text('+' + sobra, cx + 2, y + 13);
      }
      return y + CEL_H + 11;
    }

    function faixaOrigem(o, x, y, w){
      const linhas = [];
      if(o.pronta) linhas.push({ c:C.est, rot:'ESTOQUE',
        val:nf(o.pronta.total) + ' un', grade:o.pronta.grade });
      if(o.repasse) for(const l of o.repasse.lotes) linhas.push({ c:C.rep, rot:'REPASSE',
        val:nf(l.saldo) + ' un', grade:l.grade,
        det:`Nº ${l.num}${l.gci ? ' · GCI ' + l.gci : ''} · fat. ${l.data || '—'}` });
      if(o.meta) linhas.push({ c:C.pro, rot:'PRODUÇÃO',
        val:nf(o.meta.quinzenas[0].v) + ' un',
        det:o.meta.quinzenas.map(q => q.rot + ' ' + nf(q.v)).join('  ·  ') });

      let ly = y;
      for(const l of linhas.slice(0, 3)){
        cor(l.c,'fill'); doc.roundedRect(x, ly-6, 3, 12, 1.5, 1.5, 'F');
        cor(l.c); doc.setFont('helvetica','bold'); doc.setFontSize(7);
        doc.text(l.rot, x+8, ly);
        const wr = doc.getTextWidth(l.rot);
        cor(C.texto); doc.setFont('helvetica','bold'); doc.setFontSize(8.5);
        doc.text(l.val, x+8+wr+8, ly);
        const wv = doc.getTextWidth(l.val);
        if(l.det){
          cor(C.fraco); doc.setFont('helvetica','normal'); doc.setFontSize(7);
          doc.text(doc.splitTextToSize(l.det, w - (8+wr+8+wv+8)).slice(0,1),
                   x+8+wr+8+wv+8, ly);
        }
        ly += 6;
        ly = desenharGrade(l.grade, x+8, ly, w-8, l.c);
        if(!l.grade || !Object.keys(l.grade).length) ly += 9;
      }
      return ly;
    }

    async function card(o, y){
      cor(C.linha,'draw'); doc.setLineWidth(0.5); cor(C.branco,'fill');
      doc.roundedRect(margem, y, larg, altCard, 7, 7, 'FD');
      // Alinhada ao topo: centralizada, ela descia enquanto o texto ficava em
      // cima, e as duas metades do card pareciam de produtos diferentes.
      const ix = margem + PADX, iy = y + PADY;
      cor(C.branco,'fill'); cor(C.linha,'draw');
      doc.roundedRect(ix, iy, FOTO, FOTO, 5, 5, 'FD');
      const im = await fotoDataUrl(o);
      if(im){
        const pad = 4, box = FOTO - pad*2;
        let w = box, h = box;
        if(im.w && im.h){ const r = im.w/im.h; if(r > 1) h = box/r; else w = box*r; }
        doc.addImage(im.url, 'JPEG', ix+pad+(box-w)/2, iy+pad+(box-h)/2, w, h, undefined, 'FAST');
      }else{
        cor(C.linha); doc.setFont('helvetica','normal'); doc.setFontSize(7);
        doc.text('sem imagem', ix+FOTO/2, iy+FOTO/2, { align:'center' });
      }

      const tx = ix + FOTO + 16, tw = margem + larg - PADX - tx;
      let ty = y + PADY + 6;
      cor(C.texto); doc.setFont('helvetica','bold'); doc.setFontSize(12);
      doc.text(doc.splitTextToSize(String(o.nome || o.artigo), tw).slice(0,1), tx, ty);
      ty += 13;
      cor(C.fraco); doc.setFont('helvetica','normal'); doc.setFontSize(8);
      doc.text(`${o.artigo}  ·  ${o.cor}`, tx, ty);
      ty += 14;

      cor(C.marca); doc.setFont('helvetica','bold'); doc.setFontSize(13);
      doc.text(o.pdv ? brl(o.pdv) : '—', tx, ty);
      const wp = doc.getTextWidth(o.pdv ? brl(o.pdv) : '—');
      // A campanha muda o custo: ao lado do preço é onde ela é lida.
      if(o.campanhas.length){
        const c = o.campanhas[0];
        cor(C.fraco); doc.setFont('helvetica','normal'); doc.setFontSize(7.5);
        doc.text(`${c.codigoTabela || ''}${c.mkp ? ' · MKP ' + c.mkp : ''}` +
                 `${c.custo ? ' · custo ' + brl(c.custo) : ''}`, tx + wp + 10, ty);
      }
      ty += 15;
      faixaOrigem(o, tx, ty, tw);
    }

    let pag = 0;
    for(let i = 0; i < itens.length; i += POR_PAG){
      if(pag) doc.addPage();
      pag++; cabecalho();
      const bloco = itens.slice(i, i + POR_PAG);
      for(let j = 0; j < bloco.length; j++){
        await card(bloco[j], topo + j*(altCard + vaoCard));
      }
      rodape(pag);
    }
    doc.save(`catalogo_${MARCA}_${d.getFullYear()}${p2(d.getMonth()+1)}${p2(d.getDate())}` +
      `_${p2(d.getHours())}${p2(d.getMinutes())}.pdf`);
  }catch(e){
    console.error(e);
    alert('Não foi possível gerar o PDF. Tente de novo.');
  }finally{ liberado(btn); }
}

// A planilha do catálogo é lista, não pedido: uma linha por origem, para o
// mesmo produto poder aparecer três vezes com dados diferentes.
function gerarCatalogoXlsx(){
  const itens = marcadosVisiveis();
  if(!itens.length) return;
  const cab = ['Marca','Artigo','Descrição','Cor','Categoria','Gênero','PDV',
               'Campanha','MKP','Custo','Origem','Quando','Quantidade',
               'Nº','GCI','Grade'];
  const linhas = [cab];
  const base = o => {
    const c = o.campanhas[0] || {};
    return [MARCAS[o.marca].nome, o.artigo, o.nome, String(o.cor).replace(/_/g,'/'),
            o.categoria, o.genero, o.pdv || '',
            c.codigoTabela || '', c.mkp || '', c.custo || ''];
  };
  const gradeTxt = g => Object.entries(g || {}).map(([t,q]) => t + ':' + q).join(' ');
  for(const o of itens){
    if(o.pronta) linhas.push([...base(o), 'Estoque', 'Agora', o.pronta.total,
                              '', '', gradeTxt(o.pronta.grade)]);
    if(o.repasse) for(const l of o.repasse.lotes)
      linhas.push([...base(o), 'Repasse', l.data || '', l.saldo, l.num, l.gci,
                   gradeTxt(l.grade)]);
    if(o.meta) for(const q of o.meta.quinzenas)
      linhas.push([...base(o), 'Produção', q.rot, q.v, '', '', '']);
  }
  const ws = XLSX.utils.aoa_to_sheet(linhas);
  ws['!cols'] = cab.map((c, i) => ({ wch: i === 2 ? 28 : i === 15 ? 30 : 12 }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Catálogo');
  const d = new Date(), p2 = n => String(n).padStart(2,'0');
  XLSX.writeFile(wb, `catalogo_${MARCA}_${d.getFullYear()}${p2(d.getMonth()+1)}${p2(d.getDate())}` +
    `_${p2(d.getHours())}${p2(d.getMinutes())}.xlsx`);
}

// "Z24 - 63/91 D" vira prazo médio 77 em 2 parcelas — a planilha quer os
// números, não o rótulo. Mesma conta do app de disponibilidades.
function partesPrazo(p){
  if(!p) return { medio:'', parcelas:'' };
  if(/A\s*VISTA/i.test(p)) return { medio:0, parcelas:1 };
  const m = p.match(/-\s*([0-9/]+)\s*D\b/i);
  if(!m) return { medio:'', parcelas:'' };
  const dias = m[1].split('/').map(Number).filter(n => !isNaN(n));
  if(!dias.length) return { medio:'', parcelas:'' };
  return { medio:Math.round(dias.reduce((a, b) => a + b, 0) / dias.length),
           parcelas:dias.length };
}

function exportarXlsx(){
  const cliente = $f('scCliente').value.trim();
  const prazo   = $f('scPrazo').value.trim();
  const faltou  = [];
  if(!cliente) faltou.push($f('scCliente'));
  if(!prazo)   faltou.push($f('scPrazo'));
  [$f('scCliente'), $f('scPrazo')].forEach(el => el.classList.remove('erro'));
  if(faltou.length){
    faltou.forEach(el => el.classList.add('erro'));
    faltou[0].scrollIntoView({ block:'center', behavior:'smooth' });
    faltou[0].focus();
    return;
  }

  // A data agora e por item: cobrar so a do rodape deixaria linhas sem data
  // passarem batido para a planilha.
  const semData = [...STATE.sacola.values()]
    .filter(it => it.origem !== 'repasse' && totalUnidades(it) > 0 && !it.dataDesejada);
  if(semData.length){
    alert(`${semData.length === 1 ? 'Um item está' : semData.length + ' itens estão'}` +
      ' sem data desejada. Defina no chip do card ou use o campo de data do pedido.');
    const alvo = $('scCorpo').querySelector('.sc-data:not(.ok)');
    if(alvo) alvo.scrollIntoView({ block:'center', behavior:'smooth' });
    return;
  }

  const idx = Object.fromEntries(XLS_COLS.map((c, i) => [c, i]));
  const aoa = [XLS_COLS.slice()];
  const foraDoLayout = new Set();

  for(const it of STATE.sacola.values()){
    if(it.origem === 'repasse') continue;
    const total = totalUnidades(it);
    if(!total) continue;                     // sem tamanho marcado não vira linha
    const l = new Array(XLS_COLS.length).fill('');
    l[idx['Nº']] = 1;
    l[idx['Comissionista']] = (SESSAO && SESSAO.codigo) || '';
    l[idx['Cliente']] = cliente;
    const pz = partesPrazo(prazo);
    l[idx['Condição de Pagamento']] = prazo;
    l[idx['Prazo Médio']] = pz.medio;
    l[idx['Número de Parcelas']] = pz.parcelas;
    // A planilha leva só o código da campanha, não o rótulo inteiro.
    l[idx['Campanha']] = ($f('scCampanha').value.split(/\s/)[0] || '');
    if(it.dataDesejada){
      const br = dataBR(it.dataDesejada);
      l[idx['Data Desejada']] = br;
      l[idx['Data de Faturamento']] = br;
    }
    l[idx['Tabela de Preço']] = TABELA_PRECO[MARCA] || '';
    l[idx['Artigo']] = it.artigo;
    l[idx['Descrição']] = it.nome;
    // No sistema a cor vai com barra; aqui ela é guardada como veio da base.
    l[idx['Cor']] = String(it.corCodigo || it.cor || '').replace(/_/g, '/');
    for(const [tam, q] of Object.entries(it.gradePedido)){
      // Um tamanho que não existe como coluna não pode sumir calado: some do
      // arquivo e o pedido sai menor do que o vendedor montou.
      if(idx[tam] === undefined){ foraDoLayout.add(tam); continue; }
      l[idx[tam]] = q;
    }
    l[idx['Total']] = total;
    aoa.push(l);
  }

  if(aoa.length <= 1){ alert('Nenhum item do estoque tem quantidade definida.'); return; }
  if(foraDoLayout.size){
    alert('Estes tamanhos não existem no layout da planilha e ficaram de fora: ' +
          [...foraDoLayout].join(', ') + '.\nConfira antes de importar.');
  }

  const ws = XLSX.utils.aoa_to_sheet(aoa);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Pedido');
  const d = new Date(), p2 = n => String(n).padStart(2, '0');
  XLSX.writeFile(wb, `pedido_${MARCA}_${d.getFullYear()}${p2(d.getMonth()+1)}${p2(d.getDate())}` +
    `_${p2(d.getHours())}${p2(d.getMinutes())}.xlsx`);
}

// Duplicar existe para o mesmo produto ir em duas datas — ou dois pedidos —
// sem que um sobrescreva o outro. A cópia nasce sem data, para não herdar em
// silêncio a data da linha de origem.
let _copia = 0;
function duplicarItem(k){
  const it = STATE.sacola.get(k);
  if(!it) return;
  const copia = { ...it, key: `${it.key}#${++_copia}${Date.now().toString(36)}`,
                  dataDesejada: '' };
  if(it.gradePedido) copia.gradePedido = { ...it.gradePedido };
  if(it.gradeDisp)   copia.gradeDisp   = { ...it.gradeDisp };
  if(it.grade)       copia.grade       = { ...it.grade };
  // Entra logo abaixo do original, não no fim: a comparação entre os dois é
  // o motivo de existir a cópia.
  const arr = [...STATE.sacola.entries()];
  arr.splice(arr.findIndex(([kk]) => kk === k) + 1, 0, [copia.key, copia]);
  STATE.sacola = new Map(arr);
  salvarSacola();
  pintarSacola();
}

// Redesenhar tudo aqui apagaria o campo sob o cursor, então só os números
// mudam de lugar. Add e remove seguem redesenhando: ali não há nada digitando.
function atualizarNumeros(){
  for(const it of STATE.sacola.values()){
    const bloco = $('scCorpo').querySelector(`[data-k="${CSS.escape(it.key)}"]`);
    if(!bloco) continue;
    const un = totalUnidades(it);
    const alvo = bloco.querySelector('[data-un]');
    if(alvo) alvo.innerHTML = `<b>${nf(un)}</b> un selecionada${un === 1 ? '' : 's'}`;
    const q = bloco.querySelector('[data-qtd]');
    if(q){
      const teto = Math.floor(Number(it.saldo || 0) / Math.max(1, Number(it.packSize || 1)));
      q.textContent = nf(it.amount);
      const bs = bloco.querySelectorAll('.passo button');
      if(bs[0]) bs[0].disabled = it.amount <= 0;
      if(bs[1]) bs[1].disabled = it.amount >= teto;
    }
  }
  pintarRodapeSacola();
}

// Estoque: uma quantidade por tamanho, limitada ao que existe daquele tamanho.
function mudarTamanho(k, tam, valor){
  const it = STATE.sacola.get(k); if(!it) return;
  const teto = Number(it.gradeDisp[tam] || 0);
  const q = Math.max(0, Math.min(teto, Math.floor(Number(valor) || 0)));
  if(q) it.gradePedido[tam] = q; else delete it.gradePedido[tam];
  salvarSacola(); atualizarNumeros();
}
// Repasse: a grade é fechada, então o que se escolhe é quantas caixas.
function mudarCaixas(k, delta){
  const it = STATE.sacola.get(k); if(!it) return;
  const teto = Math.floor(Number(it.saldo || 0) / Math.max(1, Number(it.packSize || 1)));
  it.amount = Math.max(0, Math.min(teto, Number(it.amount || 0) + delta));
  salvarSacola(); atualizarNumeros();
}

function editarGrade(k){
  const it = STATE.sacola.get(k);

function montarGradeDe(item){
  _gradeItem = item;
  const prod = item.origem === 'producao';
  $('mgRot').className = 'rot ' + (prod ? 'r-plano' : 'r-pronta');
  $('mgRot').innerHTML = prod
    ? `${svgIcone('c-plano')}Produção · ${esc(item.mes)} · ${nf(item.teto)} un`
    : `${svgIcone('c-pronta')}Estoque · ${nf(Object.values(item.gradeDisp)
        .reduce((a, b) => a + b, 0))} un`;
  $('mgTam').className = 'sc-tam' + (prod ? ' t-pro' : '');
  $('mgTam').innerHTML = Object.keys(item.gradeDisp)
    .filter(t => Number(item.gradeDisp[t]) > 0)
    .map(t => `<label><span class="t">${esc(t)}</span>
      <input type="number" inputmode="numeric" min="0" max="${item.gradeDisp[t]}"
        placeholder="0" data-t="${esc(t)}" aria-label="Tamanho ${esc(t)}">
      ${prod ? '' : `<span class="d">${nf(item.gradeDisp[t])}</span>`}</label>`).join('');
  conferirTeto();
}

// Produção não tem quebra por tamanho na base: o vendedor distribui como
// quiser, desde que a soma não passe do que está planejado pro mês.
function conferirTeto(){
  const t = $('mgTeto');
  if(!_gradeItem || _gradeItem.origem !== 'producao'){ t.textContent = ''; return; }
  let soma = 0;
  for(const i of $('mgTam').querySelectorAll('input')) soma += Math.max(0, Number(i.value) || 0);
  const estourou = soma > _gradeItem.teto;
  t.className = 'mg-teto' + (estourou ? ' estourou' : '');
  t.textContent = estourou
    ? `${nf(soma)} un — passa do planejado para ${_gradeItem.mes} (${nf(_gradeItem.teto)} un)`
    : `${nf(soma)} de ${nf(_gradeItem.teto)} un planejadas para ${_gradeItem.mes}`;
  $('mgAgora').disabled = estourou;
}
$('mgTam').addEventListener('input', conferirTeto);
$('mgMesesOps').addEventListener('click', e => {
  const b = e.target.closest('[data-q]');
  if(!b || !_gradeProd) return;
  for(const x of $('mgMesesOps').children) x.classList.toggle('on', x === b);
  montarGradeDe(itemProducao(_gradeProd, _gradeProd.meta.quinzenas[Number(b.dataset.q)]));
});

  $('modalGrade').hidden = true;
  _gradeItem = null; _gradeProd = null; _gradeEdit = false;
  $('mgAgora').disabled = false;

}
function confirmarGrade(comQuantidade){
  if(!_gradeItem) return;
  if(comQuantidade){
    // Editando, a grade é substituída: zerar um tamanho precisa apagá-lo, e
    // um merge deixaria o valor antigo de pé.
    if(_gradeEdit) _gradeItem.gradePedido = {};
    for(const i of $('mgTam').querySelectorAll('input')){
      const teto = Number(_gradeItem.gradeDisp[i.dataset.t] || 0);
      const q = Math.max(0, Math.min(teto, Math.floor(Number(i.value) || 0)));
      if(q) _gradeItem.gradePedido[i.dataset.t] = q;
    }
  }
  if(_gradeEdit){ salvarSacola(); pintarSacola(); }
  else porNaSacola(_gradeItem);
  fecharGrade();
}

             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="9" y="9" width="12" height="12" rx="2"/>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        Duplicar</button>
    </div>`;

  if(it.origem === 'repasse'){
    const teto = Math.floor(Number(it.saldo || 0) / Math.max(1, Number(it.packSize || 1)));
    return `<div class="sc-item" data-k="${esc(it.key)}">${cab}
      <div class="sc-cx">
        <span class="passo">
          <button data-cx="${esc(it.key)}" data-d="-1" ${it.amount <= 0 ? 'disabled' : ''}>−</button>
          <span data-qtd>${nf(it.amount)}</span>
          <button data-cx="${esc(it.key)}" data-d="1" ${it.amount >= teto ? 'disabled' : ''}>+</button>
        </span>
        <span class="info"><b>${nf(it.packSize)}</b> pares
          <br>fat. ${esc(it.prevFaturamento || '—')}</span>
      </div></div>`;
  }

  // Só os tamanhos escolhidos: a lista inteira virava uma parede de zeros e
  // escondia a grade de verdade. Para mexer no resto, o chip reabre a grade
  // cheia. A ordem vem de gradeDisp, que é a ordem canônica dos tamanhos.
  const prod = it.origem === 'producao';
  const tams = Object.keys(it.gradeDisp).filter(t => Number(it.gradePedido[t]) > 0);
  const grade = tams.length
    ? `<div class="sc-tam${prod ? ' t-pro' : ''}">${tams.map(t => `<label>
        <span class="t">${esc(t)}</span>
        <input type="number" inputmode="numeric" min="0" max="${it.gradeDisp[t]}"
          value="${it.gradePedido[t]}" placeholder="0"
          data-tam="${esc(it.key)}" data-t="${esc(t)}" aria-label="Tamanho ${esc(t)}">
        ${prod ? '' : `<span class="d">${nf(it.gradeDisp[t])}</span>`}</label>`).join('')}</div>`
    // Entrou pelo "preencher depois": sem isto o item ficaria mudo no card.
    : `<button class="sc-semgrade" data-editar="${esc(it.key)}">
        ${svgIcone(prod ? 'c-plano' : 'c-pronta', 12)}Definir a grade</button>`;

  return `<div class="sc-item" data-k="${esc(it.key)}">${cab}
    ${grade}
    <div class="sc-cx"><span class="info" data-un><b>${nf(un)}</b> un selecionada${un === 1 ? '' : 's'}</span></div>
  </div>`;
}

function pintarRodapeSacola(){
  const itens = [...STATE.sacola.values()];
  // Estoque e produção terminam na mesma planilha do EBM, então dividem a aba.
  const est = itens.filter(i => i.origem !== 'repasse');
  const rep = itens.filter(i => i.origem === 'repasse');
  const unEst = est.reduce((a, i) => a + totalUnidades(i), 0);
  const unRep = rep.reduce((a, i) => a + totalUnidades(i), 0);

  // O total dos dois lados fica no topo, fora das abas.
  $('scGeral').hidden = !(est.length && rep.length);
  $('scGeral').innerHTML =
    `<span><i class="i-est"></i>Estoque <b>${nf(unEst)} un</b></span>` +
    `<span><i class="i-rep"></i>Repasse <b>${nf(unRep)} un</b></span>`;

  const naEst = STATE.aba === 'estoque';
  // Cliente e prazo alimentam a planilha: fora da aba de estoque eles não
  // querem dizer nada, e era isso que confundia.
  $('scPe').innerHTML = naEst
    ? (est.length ? `<div class="sc-resumo"><span>Total do estoque</span>
          <b>${nf(unEst)} un</b></div>
        <button class="acao forte" id="scXlsx" ${unEst ? '' : 'disabled'}>
          Gerar planilha do EBM</button>` : '')
    : (rep.length ? `<div class="sc-resumo"><span>Total do repasse</span>
          <b>${nf(unRep)} un</b></div>
        <button class="acao depois" disabled
          title="Próxima etapa: enviar direto daqui">Enviar repasse · em breve</button>` : '');
}

function trocarAba(qual){
  STATE.aba = qual;
  pintarSacola();
  $('scCorpo').scrollTop = 0;
}
$('scPe').addEventListener('click', e => {
  if(e.target.closest('#scXlsx')) exportarXlsx();
});

function pintarSacola(){
  const itens = [...STATE.sacola.values()];
  const est = itens.filter(i => i.origem !== 'repasse');
  const rep = itens.filter(i => i.origem === 'repasse');
  $('fabSacola').hidden = !itens.length || !$('sacola').hidden || marcadosVisiveis().length > 0;
  document.body.classList.toggle('com-sacola', itens.length > 0);
  $('fabSacolaN').textContent = nf(itens.length);
  $('scLimpar').hidden = !itens.length;

  if(!itens.length){
    $('scGeral').hidden = true;
    $('scAbas').hidden = true;
    $('scCorpo').innerHTML = `<div class="sc-vazia"><h3>Sacola vazia</h3>
      <p>Abra um produto e adicione o estoque ou uma entrega de repasse.
      Produção não entra: ela é plano de fabricação, não pedido.</p></div>`;
    $('scPe').innerHTML = '';
    return;
  }

  // Com uma origem só, aba é ruído: some e a sacola volta a ser uma lista.
  const duas = est.length > 0 && rep.length > 0;
  if(!duas) STATE.aba = rep.length && !est.length ? 'repasse' : 'estoque';
  $('scAbas').hidden = !duas;
  if(duas){
    $('scAbas').innerHTML = [
      ['estoque', 'a-est', 'Planilha', est.length],
      ['repasse', 'a-rep', 'Repasse', rep.length]
    ].map(([id, cls, rot, n]) => {
      const on = STATE.aba === id;
      return `<button class="${cls}${on ? ' on' : ''}" role="tab" aria-selected="${on}"
        data-aba="${id}">${rot}<span class="n">${n}</span></button>`;
    }).join('');
  }

  const lista = STATE.aba === 'repasse' ? rep : est;
  const ajuda = '';
  $('scCorpo').innerHTML =
    `<section class="sc-sec">${ajuda ? `<p class="sc-sec-sub">${ajuda}</p>` : ''}` +
    lista.map(itemHtml).join('') + '</section>';
  // O formulário é do estoque: vive dentro da aba dele e rola com os itens.
  if(STATE.aba === 'estoque' && est.length) $('scCorpo').appendChild(FORM_PEDIDO);

  pintarRodapeSacola();
}

// Um ouvinte por container, como no painel de filtros.
$('scAbas').addEventListener('click', e => {
  const b = e.target.closest('[data-aba]');
  if(b) trocarAba(b.dataset.aba);
});
$('scCorpo').addEventListener('click', e => {
  const t = e.target.closest('[data-tirar]');
  if(t) return tirarDaSacola(t.dataset.tirar);
  const c = e.target.closest('[data-cx]');
  if(c) return mudarCaixas(c.dataset.cx, Number(c.dataset.d));
  const d = e.target.closest('[data-dup]');
  if(d) return duplicarItem(d.dataset.dup);
  const ed = e.target.closest('[data-editar]');
  if(ed) return editarGrade(ed.dataset.editar);
});
$('scCorpo').addEventListener('change', e => {
  const i = e.target.closest('[data-tam]');
  if(i) return mudarTamanho(i.dataset.tam, i.dataset.t, i.value);
  const dt = e.target.closest('[data-data]');
  if(dt) mudarData(dt.dataset.data, dt.value);
});

function abrirZoom(i){
  const o = STATE.filtrados[i];
  if(!o) return;
  $('zoomImg').src = foto(o);
  $('zoomImg').alt = o.nome;
  $('zoomLegenda').textContent = `${o.nome || o.artigo} · ${o.artigo} · ${o.cor}`;
  $('zoom').hidden = false;
}
function fecharZoom(){ $('zoom').hidden = true; }
$('zoom').onclick = fecharZoom;

// Marcar não filtra a vitrine: o vendedor vai juntando produtos enquanto
// navega e só depois decide o que fazer com eles.
function alternarMarcado(k){
  STATE.marcados.has(k) ? STATE.marcados.delete(k) : STATE.marcados.add(k);
  const b = $('grade').querySelector(`.cf[onclick*="${k}"]`);
  if(b){
    b.classList.toggle('on', STATE.marcados.has(k));
    b.setAttribute('aria-pressed', String(STATE.marcados.has(k)));
  }
  pintarSelecao();
}
function limparMarcados(){
  STATE.marcados.clear();
  for(const b of $('grade').querySelectorAll('.cf.on')){
    b.classList.remove('on'); b.setAttribute('aria-pressed','false');
  }
  pintarSelecao();
}

// Todos os marcados da marca ativa, na ordem da vitrine — o filtro em que o
// vendedor estava quando marcou nao muda o que ele escolheu levar.
function marcadosVisiveis(){
  return STATE.produtos.filter(o => daMarca(o) && STATE.marcados.has(o.k));
}

function pintarSelecao(){
  const n = marcadosVisiveis().length;
  $('selBarra').hidden = n === 0;
  $('selN').textContent = nf(n);
  document.body.classList.toggle('com-selecao', n > 0);
  // A sacola sai de cena enquanto há seleção: são dois fluxos diferentes e
  // eles disputariam o mesmo canto.
  pintarSacola();
}
$('modal').onclick = e => { if(e.target.id === 'modal') fecharModal(); };
document.addEventListener('keydown', e => {
  if(e.key !== 'Escape') return;
  if(!$('confirma').hidden) fecharConfirma();
  else if(!$('modalGrade').hidden) fecharGrade();
  else if(!$('zoom').hidden) fecharZoom();
  else if(!$('modal').hidden) fecharModal();
  else if(!$('sacola').hidden) fecharSacola();
  else if(!$('painel').hidden) fecharPainel();
});

/* ── marca ──────────────────────────────────────────────────────── */
function pintarMarca(){
  const m = MARCAS[MARCA];
  const r = document.documentElement.style;
  r.setProperty('--marca', m.marca);
  r.setProperty('--marca-claro', m.claro);
  r.setProperty('--marca-escuro', m.escuro);
  document.title = m.nome + ' · Vitrine CMS';
  const outro = MARCAS[MARCA === 'oly' ? 'ua' : 'oly'];
  const b = $('btnMarca');
  b.title = 'Trocar para ' + outro.nome;
  b.setAttribute('aria-label', m.nome + ' — trocar para ' + outro.nome);
  b.innerHTML = `<img src="${esc(m.logo)}" alt="${esc(m.nome)}">
    <span class="troca" aria-hidden="true"><svg width="8" height="8" viewBox="0 0 24 24"
      fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"
      stroke-linejoin="round"><path d="M8 4 4 8l4 4"/><path d="M4 8h15"/>
      <path d="m16 20 4-4-4-4"/><path d="M20 16H5"/></svg></span>`;
  b.onclick = () => escolherMarca(MARCA === 'oly' ? 'ua' : 'oly');
  montarFormulario();
}
function escolherMarca(id){
  if(id === MARCA || !MARCAS[id]) return;
  MARCA = id;
  if(!STATE.produtos.some(o => o.marca === id && temOrigem(o, STATE.origem))) STATE.origem = 'tudo';
  STATE.categoria = '';
  for(const g of GRUPOS) STATE.sel[g.id].clear();
  STATE.marcados.clear();
  carregarSacola();
  history.replaceState(null, '', '?marca=' + id);
  pintarMarca();
  aplicar();
}

/* ── busca ──────────────────────────────────────────────────────── */
const _busca = $('busca'), _campo = $('campoBusca'), _x = $('limpaBusca');

function abrirBusca(){
  _busca.classList.add('aberta');
  $('btnBusca').setAttribute('aria-expanded', 'true');
  _campo.focus();
}
// So fecha vazia: colapsar com texto dentro esconderia o filtro que está ativo.
function fecharBusca(){
  if(_campo.value) return;
  _busca.classList.remove('aberta');
  $('btnBusca').setAttribute('aria-expanded', 'false');
}
function limparBusca(){
  _campo.value = ''; STATE.busca = ''; _x.hidden = true;
  clearTimeout(tBusca); aplicar();
}

// Redesenhar mil e duzentos cards a cada tecla trava no celular: só a última
// tecla vale. Limpar não espera.
let tBusca = null;
_campo.addEventListener('input', e => {
  STATE.busca = e.target.value;
  _x.hidden = !e.target.value;
  clearTimeout(tBusca);
  tBusca = setTimeout(aplicar, 130);
});

// A vírgula é o único jeito de descobrir a busca múltipla, então ela fica no
// texto do campo mesmo na tela estreita — o que sai é a parte adivinhável.
const _estreito = matchMedia('(max-width:620px)');
function ajustarDica(){
  _campo.placeholder = _estreito.matches
    ? 'Até 3, separados por vírgula'
    : 'Produto, artigo ou cor — até 3, separados por vírgula';
}
_estreito.addEventListener('change', ajustarDica);
ajustarDica();

$('btnBusca').addEventListener('click', () => {
  if(_busca.classList.contains('aberta') && !_campo.value) fecharBusca();
  else abrirBusca();
});
// Chegar no campo pelo teclado abre a busca: sem isso o Tab levaria a um
// campo de largura zero.
_campo.addEventListener('focus', abrirBusca);
_campo.addEventListener('blur', () => setTimeout(fecharBusca, 160));

// Esc apaga o que está escrito; com o campo já vazio, fecha.
_campo.addEventListener('keydown', e => {
  if(e.key !== 'Escape') return;
  e.preventDefault();
  if(_campo.value){ limparBusca(); _campo.focus(); }
  else { _campo.blur(); fecharBusca(); }
});
_x.addEventListener('click', () => { limparBusca(); _campo.focus(); });

if(!SESSAO){
  barrar('Entre pelo Portal',
         'Esta vitrine usa o mesmo login dos outros aplicativos.', true);
}else if(SO_ESTES.length && !SO_ESTES.includes(String(SESSAO.nome || '').toUpperCase())){
  barrar('Ainda em desenvolvimento',
         'A vitrine única está sendo montada e por enquanto só o acesso CMS entra. ' +
         'Use o Repasses e o Disponibilidades normalmente.', true);
}else{
  pintarMarca();
  carregarSacola();
  pintarSacola();
  carregar();
}
</script>
